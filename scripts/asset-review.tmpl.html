<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asset Review — Pre-primary &amp; Primary</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#272c36; --fg:#e8eaf0; --dim:#9aa3b2;
    --ok:#3ecf8e; --no:#ef5f6b; --warn:#f0b429; --accent:#6c8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 'Segoe UI',system-ui,sans-serif;padding-bottom:80px}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 20px}
  h1{font-size:18px;font-weight:700;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  select,input[type=search],button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
  input[type=search]{cursor:text;min-width:190px}
  button:hover{border-color:var(--accent)}
  .tally{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--dim);flex-wrap:wrap}
  .tally b{color:var(--fg)}
  main{padding:20px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
    margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;transition:border-color .15s}
  .card.ok{border-color:var(--ok)} .card.no{border-color:var(--no);opacity:.62}
  .shot{height:158px;background:
      linear-gradient(45deg,#1d212a 25%,transparent 25%,transparent 75%,#1d212a 75%),
      linear-gradient(45deg,#1d212a 25%,#14171d 25%,#14171d 75%,#1d212a 75%);
    background-size:18px 18px;background-position:0 0,9px 9px;
    display:flex;align-items:center;justify-content:center;position:relative}
  .shot img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .shot canvas{width:100%;height:100%;display:block}
  .load3d{background:var(--accent);color:#0b0d12;border:0;border-radius:8px;padding:8px 14px;font-weight:700}
  .meta{padding:9px 11px;font-size:12px;border-top:1px solid var(--line)}
  .fname{font-weight:600;font-size:12.5px;word-break:break-all;margin-bottom:4px}
  .facts{color:var(--dim);display:flex;gap:9px;flex-wrap:wrap;font-size:11.5px}
  .chips{margin-top:7px;display:flex;gap:4px;flex-wrap:wrap}
  .chip{background:#232833;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:10.5px;color:#c3cad8}
  .chip.orphan{background:#3a2f12;border-color:#6b5316;color:var(--warn)}
  .acts{display:flex;border-top:1px solid var(--line);margin-top:auto}
  .acts button{flex:1;border:0;border-radius:0;background:transparent;padding:9px;font-size:12px;font-weight:600}
  .acts button:first-child{border-right:1px solid var(--line)}
  .acts .y:hover,.acts .y.on{background:var(--ok);color:#06251a}
  .acts .n:hover,.acts .n.on{background:var(--no);color:#2a0409}
  .missing{background:#241317;border:1px solid #5d2730;border-radius:10px;padding:11px 13px;margin-bottom:9px}
  .missing b{color:var(--no)}
  footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.97);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding:11px 20px;display:flex;gap:10px;align-items:center;z-index:20}
  .note{color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>Asset Review — new Pre-primary &amp; Primary</h1>
  <div class="sub" id="sub"></div>
  <div class="bar">
    <select id="fCat"><option value="">All categories</option></select>
    <select id="fStatus">
      <option value="">All statuses</option>
      <option value="todo">Not yet decided</option>
      <option value="ok">Approved</option>
      <option value="no">Rejected</option>
      <option value="orphan">Not used by new content</option>
      <option value="used">Used by an activity</option>
    </select>
    <input type="search" id="fText" placeholder="filter by name or activity…">
    <button id="approveVisible">Approve all visible</button>
    <button id="reset">Clear decisions</button>
    <div class="tally" id="tally"></div>
  </div>
</header>

<main>
  <div id="missingWrap"></div>
  <div id="out"></div>
</main>

<footer>
  <button id="copy">Copy decisions as JSON</button>
  <button id="copyRejects">Copy reject list</button>
  <span class="note" id="footNote">"Unused here" means no pp-/pri- activity references it — an older activity still might.</span>
</footer>

<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>

<script>
const DATA = /*__MANIFEST__*/null;
const KEY  = 'assetReviewDecisions';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const kb = (n) => n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';

document.getElementById('sub').textContent =
  DATA.items.length + ' assets across ' + DATA.games.length + ' activities · generated ' +
  new Date(DATA.generated).toLocaleString();

/* ---- missing assets: referenced in code, absent on disk ---- */
if (DATA.missing.length) {
  document.getElementById('missingWrap').innerHTML =
    '<h2>Referenced but missing — ' + DATA.missing.length + '</h2>' +
    DATA.missing.map(function (m) {
      return '<div class="missing"><b>' + m.name + '</b> — expected by ' +
        m.used.map(function (u) { return '<span class="chip">' + u + '</span>'; }).join(' ') + '</div>';
    }).join('');
}

/* ---- filters ---- */
const cats = [...new Set(DATA.items.map(i => i.cat))].sort();
document.getElementById('fCat').innerHTML =
  '<option value="">All categories</option>' + cats.map(c => '<option>' + c + '</option>').join('');

function visible() {
  const c = fCat.value, s = fStatus.value, q = fText.value.trim().toLowerCase();
  return DATA.items.filter(i => {
    if (c && i.cat !== c) return false;
    const st = state[i.path];
    if (s === 'todo'   && st) return false;
    if (s === 'ok'     && st !== 'ok') return false;
    if (s === 'no'     && st !== 'no') return false;
    if (s === 'orphan' && i.used.length) return false;
    if (s === 'used'   && !i.used.length) return false;
    if (q && !(i.name.toLowerCase().includes(q) || i.used.join(' ').toLowerCase().includes(q))) return false;
    return true;
  });
}

function render() {
  const list = visible();
  const byCat = {};
  list.forEach(i => { (byCat[i.cat] = byCat[i.cat] || []).push(i); });
  out.innerHTML = Object.keys(byCat).sort().map(c =>
    '<h2>' + c + ' — ' + byCat[c].length + '</h2>' +
    '<div class="grid">' + byCat[c].map(card).join('') + '</div>').join('')
    || '<p class="note" style="margin-top:20px">Nothing matches that filter.</p>';
  tally();
}

function card(i) {
  const st = state[i.path] || '';
  const shot = i.is3d
    ? '<button class="load3d" data-model="' + i.path + '">Load 3D &#9656;</button>'
    : '<img loading="lazy" src="' + i.path + '" alt="" ' +
      'onload="var f=this.closest(\'.card\').querySelector(\'.dims\');if(f)f.textContent=this.naturalWidth+\'&times;\'+this.naturalHeight" ' +
      'onerror="this.outerHTML=\'<div class=&quot;note&quot;>failed to load</div>\'">';
  return '<div class="card ' + st + '" data-p="' + i.path + '">' +
    '<div class="shot">' + shot + '</div>' +
    '<div class="meta">' +
      '<div class="fname">' + i.name + '</div>' +
      '<div class="facts"><span>' + kb(i.bytes) + '</span><span class="dims">' + (i.is3d ? '3D model' : '') + '</span></div>' +
      '<div class="chips">' + (i.used.length
        ? i.used.map(u => '<span class="chip">' + u + '</span>').join('')
        : '<span class="chip orphan">not referenced by any pp-/pri- activity</span>') + '</div>' +
    '</div>' +
    '<div class="acts">' +
      '<button class="y ' + (st === 'ok' ? 'on' : '') + '" data-set="ok">Keep</button>' +
      '<button class="n ' + (st === 'no' ? 'on' : '') + '" data-set="no">Replace</button>' +
    '</div></div>';
}

function tally() {
  const ok = Object.values(state).filter(v => v === 'ok').length;
  const no = Object.values(state).filter(v => v === 'no').length;
  const orph = DATA.items.filter(i => !i.used.length).length;
  document.getElementById('tally').innerHTML =
    '<span><b>' + ok + '</b> keep</span><span><b>' + no + '</b> replace</span>' +
    '<span><b>' + (DATA.items.length - ok - no) + '</b> undecided</span>' +
    '<span><b>' + orph + '</b> unused here</span><span><b>' + DATA.missing.length + '</b> missing</span>';
}

/* ---- interactions ---- */
out.addEventListener('click', function (e) {
  const setBtn = e.target.closest('[data-set]');
  if (setBtn) {
    const p = setBtn.closest('.card').dataset.p;
    if (state[p] === setBtn.dataset.set) delete state[p]; else state[p] = setBtn.dataset.set;
    save(); render(); return;
  }
  const m = e.target.closest('[data-model]');
  if (m) { const host = m.parentElement; host.innerHTML = ''; show3D(host, m.dataset.model); }
});

['fCat','fStatus','fText'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

document.getElementById('approveVisible').onclick = function () {
  visible().forEach(i => { state[i.path] = 'ok'; }); save(); render();
};
document.getElementById('reset').onclick = function () {
  if (confirm('Clear every decision on this page?')) { state = {}; save(); render(); }
};
const flash = (msg) => {
  footNote.textContent = msg;
  setTimeout(() => { footNote.textContent = '"Unused here" means no pp-/pri- activity references it — an older activity still might.'; }, 2200);
};
document.getElementById('copy').onclick = function () {
  navigator.clipboard.writeText(JSON.stringify(state, null, 2)).then(() => flash('Decisions copied.'));
};
document.getElementById('copyRejects').onclick = function () {
  const r = Object.entries(state).filter(([, v]) => v === 'no').map(([k]) => k);
  navigator.clipboard.writeText(r.join('\n')).then(() => flash(r.length + ' rejects copied.'));
};

/* ---- lazy three.js viewer, one model at a time ---- */
async function show3D(host, src) {
  host.innerHTML = '<div class="note">loading…</div>';
  try {
    const THREE = await import('three');
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
    const w = host.clientWidth, h = host.clientHeight;
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(45, w / h, 0.01, 1000);
    const rnd = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    rnd.setSize(w, h); rnd.setPixelRatio(Math.min(2, devicePixelRatio));
    host.innerHTML = ''; host.appendChild(rnd.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 2.2));
    const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(3, 6, 4); scene.add(dl);
    const gltf = await new GLTFLoader().loadAsync(src);
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const size = box.getSize(new THREE.Vector3()).length();
    const ctr = box.getCenter(new THREE.Vector3());
    gltf.scene.position.sub(ctr);
    cam.position.set(0, size * 0.12, size * 0.85);
    cam.near = size / 100; cam.far = size * 12; cam.updateProjectionMatrix();
    scene.add(gltf.scene);
    const ctl = new OrbitControls(cam, rnd.domElement);
    ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = 1.6;
    let tris = 0;
    gltf.scene.traverse(o => {
      if (o.isMesh && o.geometry) {
        tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
      }
    });
    const f = host.closest('.card').querySelector('.dims');
    if (f) f.textContent = Math.round(tris).toLocaleString() + ' tris';
    (function loop() { requestAnimationFrame(loop); ctl.update(); rnd.render(scene, cam); })();
  } catch (err) {
    host.innerHTML = '<div class="note">3D failed: ' + err.message + '</div>';
  }
}

render();
</script>
</body>
</html>
