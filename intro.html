<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome — Auticare</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{
            --gold:#FFD700;--deep-gold:#B8860B;--saffron:#FF6B00;
            --crimson:#DC143C;--ivory:#FFFFF0;--night:#04060D;
            --cyan:#00E5FF;
        }
        body{margin:0;overflow:hidden;background:var(--night);
             font-family:"Cormorant Garamond",serif;cursor:none;}
        body.interactive-mode{cursor:none;}
        #canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
        #physicsCanvas{position:absolute;top:0;left:0;width:100%;height:100%;
                       z-index:50;pointer-events:none;}

        /* ===== Scissors cursor ===== */
        .scissors-cursor{
            position:fixed;width:52px;height:52px;pointer-events:none;
            z-index:9999;transform:translate(-50%,-50%);
            filter:drop-shadow(0 0 10px rgba(255,215,0,.9));
        }
        .scissors-cursor.hovering{
            animation:scissorSnip .2s ease-in-out infinite;
            filter:drop-shadow(0 0 20px rgba(255,100,0,1));
        }
        @keyframes scissorSnip{
            0%,100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1.12);}
            50%    {transform:translate(-50%,-50%) rotate(14deg)  scale(1.2);}
        }

        /* ===== Kerala Map ===== */
        .kerala-container{
            position:absolute;top:50%;left:50%;
            transform:translate(-50%,-50%);width:44%;max-width:500px;
            z-index:60;opacity:0;display:none;
        }
        .kerala-container.show{
            display:block;
            animation:keralaReveal 1.5s cubic-bezier(.16,1,.3,1) forwards;
        }
        .kerala-container.hide{animation:keralaFadeOut 1.2s ease forwards;}
        @keyframes keralaReveal{
            0%  {opacity:0;transform:translate(-50%,-50%) scale(.4) rotateY(25deg);filter:brightness(3) blur(18px);}
            60% {opacity:1;filter:brightness(1.6) blur(2px);}
            100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotateY(0);filter:brightness(1) blur(0);}
        }
        @keyframes keralaFadeOut{
            to{opacity:0;transform:translate(-50%,-50%) scale(1.15);filter:blur(14px);}
        }
        .kerala-svg{width:100%;height:auto;
            filter:drop-shadow(0 0 40px rgba(0,255,120,.9)) drop-shadow(0 0 80px rgba(0,180,80,.5));}
        .halo-ring{position:absolute;top:50%;left:50%;border-radius:50%;
                   transform:translate(-50%,-50%);opacity:0;}
        .halo-ring.animate{animation:haloExpand 3.5s ease-out infinite;}
        .halo-ring:nth-child(1){animation-delay:0s;   border:3px solid rgba(255,215,0,.7);}
        .halo-ring:nth-child(2){animation-delay:.7s;  border:2px solid rgba(0,255,150,.5);}
        .halo-ring:nth-child(3){animation-delay:1.4s; border:2px solid rgba(255,107,0,.5);}
        .halo-ring:nth-child(4){animation-delay:2.1s; border:1px solid rgba(255,255,255,.3);}
        @keyframes haloExpand{
            0%  {width:240px;height:240px;opacity:.9;}
            100%{width:900px;height:900px;opacity:0;}
        }

        /* ===== Cinematic Texts ===== */
        .cinematic-text{
            position:absolute;top:50%;left:50%;
            transform:translate(-50%,-50%) scale(.85);
            text-align:center;z-index:100;opacity:0;pointer-events:none;
            white-space:nowrap;
        }
        .cinematic-text .ti{
            position:relative;display:inline-block;
        }



        /* font variants */
        .t-hero  {font-family:"Cinzel Decorative",serif;font-size:72px;font-weight:900;
                  letter-spacing:6px;color:var(--gold);}
        .t-large {font-family:"Cinzel Decorative",serif;font-size:54px;font-weight:700;
                  letter-spacing:4px;color:var(--ivory);}
        .t-italic{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:62px;
                  font-weight:300;letter-spacing:8px;color:rgba(255,250,220,.95);}
        /* FIX: "That Is" — now uses Rajdhani explicitly */
        .t-caps  {font-family:"Rajdhani",sans-serif;font-size:40px;font-weight:400;
                  letter-spacing:16px;text-transform:uppercase;color:rgba(255,255,255,.88);}
        .t-giant {font-family:"Cinzel Decorative",serif;font-size:118px;font-weight:900;
                  color:var(--gold);letter-spacing:2px;}

        /* entry / exit animations */
        .anim-enter{animation:cinematicIn 1.7s cubic-bezier(.16,1,.3,1) forwards;}
        .anim-exit {animation:cinematicOut  1s cubic-bezier(.55,0,1,.45) forwards;}
        @keyframes cinematicIn{
            0%  {opacity:0;transform:translate(-50%,-50%) scale(.55) translateY(35px);filter:blur(22px);}
            40% {opacity:1;filter:blur(2px);}
            70% {transform:translate(-50%,-50%) scale(1.04) translateY(-5px);filter:blur(0);}
            100%{opacity:1;transform:translate(-50%,-50%) scale(1) translateY(0);filter:blur(0);}
        }
        @keyframes cinematicOut{
            0%  {opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0);}
            100%{opacity:0;transform:translate(-50%,-50%) scale(1.22) translateY(-22px);filter:blur(14px);}
        }
        .anim-wipe{animation:lineWipe 1.7s cubic-bezier(.16,1,.3,1) forwards !important;}
        @keyframes lineWipe{
            0%  {opacity:0;clip-path:inset(0 50% 0 50%);transform:translate(-50%,-50%) scaleX(.5);}
            50% {opacity:1;clip-path:inset(0 8% 0 8%);}
            100%{opacity:1;clip-path:inset(0 0% 0 0%);transform:translate(-50%,-50%) scaleX(1);}
        }

        /* ===== Logo ===== */
        .logo-container{
            position:absolute;top:50%;left:50%;
            transform:translate(-50%,-50%) scale(.6);
            opacity:0;z-index:100;text-align:center;
            transition:opacity 1.6s ease,transform 2.2s cubic-bezier(.16,1,.3,1);
        }
        .logo-container.reveal{opacity:1;transform:translate(-50%,-50%) scale(1);}
        .logo-box{
            display:flex;flex-direction:column;align-items:center;
            gap:12px;
            background:#FFFFFF;
            border:1.5px solid rgba(0,229,255,.35);
            border-radius:20px;
            padding:30px 40px 26px;
            box-shadow:0 0 40px rgba(0,200,255,.25),0 0 80px rgba(0,100,200,.15),
                        inset 0 0 30px rgba(0,180,255,.06);
        }
        .logo-img{width:200px;height:auto;display:block;
            filter:drop-shadow(0 0 18px rgba(0,229,255,.7)) drop-shadow(0 0 40px rgba(0,150,255,.4));}
        .logo-tagline{
            font-family:"Rajdhani",sans-serif;font-size:12px;
            letter-spacing:5px;color:rgba(0,229,255,.55);text-transform:uppercase;
        }

        /* ===== Instruction text — drops down from above ===== */
        .instruction-text{
            position:absolute;top:61%;left:50%;
            transform:translateX(-50%) translateY(-40px);
            font-family:"Rajdhani",sans-serif;font-size:26px;
            font-weight:500;letter-spacing:6px;text-transform:uppercase;
            color:rgba(255,255,255,.9);z-index:45;opacity:0;pointer-events:none;
            text-shadow:0 0 18px rgba(255,215,0,.8),0 0 36px rgba(255,130,0,.5);
            transition: none;
        }
        .instruction-text.show{
            animation: instructDrop 0.7s cubic-bezier(.16,1,.3,1) forwards,
                       instructPulse 2.5s ease-in-out 0.7s infinite;
        }
        @keyframes instructDrop{
            0%  { opacity:0; transform:translateX(-50%) translateY(-60px); }
            100%{ opacity:.8; transform:translateX(-50%) translateY(0px); }
        }
        @keyframes instructPulse{
            0%,100%{ opacity:.6; transform:translateX(-50%) scale(1);     }
            50%    { opacity:1;  transform:translateX(-50%) scale(1.04);  }
        }

        /* ===== Start Button — rounded rectangle, blue ===== */
        #startButton{
            position:absolute;bottom:72px;left:50%;
            transform:translateX(-50%);
            padding:18px 64px;
            font-family:"Rajdhani",sans-serif;font-size:22px;
            font-weight:700;letter-spacing:6px;text-transform:uppercase;
            color:#ffffff;
            background:linear-gradient(135deg,#0066FF 0%,#00B4FF 50%,#0066FF 100%);
            border:1.5px solid rgba(0,200,255,.4);
            border-radius:12px;
            cursor:pointer;opacity:0;z-index:200;pointer-events:none;
            box-shadow:0 6px 32px rgba(0,130,255,.55);
            transition:all .3s ease;
            display:flex;align-items:center;justify-content:center;
            text-align:center;
        }
        #startButton.show{opacity:1;pointer-events:all;animation:btnGlow 2s ease-in-out infinite;}
        #startButton:hover{transform:translateX(-50%) scale(1.06);box-shadow:0 10px 50px rgba(0,160,255,.85);}
        @keyframes btnGlow{
            0%,100%{box-shadow:0 6px 32px rgba(0,130,255,.55);}
            50%    {box-shadow:0 8px 60px rgba(0,180,255,.9),0 0 90px rgba(0,80,255,.35);}
        }

        /* ===== Vignette + light streak ===== */
        #vignette{
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.88) 100%);
            pointer-events:none;z-index:5;
        }
        .streak{
            position:fixed;left:-100%;width:100%;height:2px;
            background:linear-gradient(90deg,transparent,rgba(255,215,0,.65),transparent);
            z-index:4;pointer-events:none;opacity:0;
        }
        .streak.fire{animation:streakFly .85s ease-out forwards;}
        @keyframes streakFly{0%{left:-100%;opacity:1;}100%{left:210%;opacity:0;}}
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<canvas id="physicsCanvas"></canvas>
<div id="vignette"></div>
<div class="streak" id="streak"></div>

<!-- Scissors cursor -->
<svg class="scissors-cursor" id="scissorsCursor" viewBox="0 0 56 56">
    <defs>
        <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   style="stop-color:#FFE566"/>
            <stop offset="50%"  style="stop-color:#FFA500"/>
            <stop offset="100%" style="stop-color:#FFD700"/>
        </linearGradient>
    </defs>
    <path d="M16 24 Q30 22 46 14 L42 18 Q28 25 18 28 Z"     fill="url(#gg)" stroke="#FF6B00" stroke-width=".8"/>
    <path d="M16 32 Q30 34 46 42 L42 38 Q28 31 18 28 Z"     fill="url(#gg)" stroke="#FF6B00" stroke-width=".8"/>
    <circle cx="11" cy="21" r="8" fill="none" stroke="url(#gg)" stroke-width="2.5"/>
    <circle cx="11" cy="35" r="8" fill="none" stroke="url(#gg)" stroke-width="2.5"/>
    <circle cx="19" cy="28" r="3"  fill="#FFD700"/>
    <circle cx="11" cy="21" r="4"  fill="rgba(0,0,0,.3)"/>
    <circle cx="11" cy="35" r="4"  fill="rgba(0,0,0,.3)"/>
</svg>

<div class="instruction-text" id="instructionText">✦ Click the Ribbon to Inaugurate ✦</div>

<div class="kerala-container" id="keralaContainer">
    <div class="halo-ring"></div><div class="halo-ring"></div>
    <div class="halo-ring"></div><div class="halo-ring"></div>
    <img src="Kerala-map-en.svg" class="kerala-svg" alt="Kerala Map">
</div>

<div id="welcomeText" class="cinematic-text"><span class="ti t-hero">Welcome to Kerala</span></div>
<div id="realityText" class="cinematic-text"><span class="ti t-italic">Stepping into a New Reality</span></div>
<div id="text1" class="cinematic-text"><span class="ti t-large">Experience the New Vision</span></div>
<div id="text2" class="cinematic-text"><span class="ti t-caps">THAT IS</span></div>
<div id="text3" class="cinematic-text"><span class="ti t-giant">BIGGER</span></div>
<div id="text4" class="cinematic-text"><span class="ti t-giant">BRIGHTER</span></div>

<button id="startButton">✦ &nbsp; Get Started &nbsp; ✦</button>

<script>
// ================================================================
//  CANVAS
// ================================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d",{alpha:false});
const physicsCanvas = document.getElementById("physicsCanvas");
const physicsCtx = physicsCanvas.getContext("2d",{alpha:true});
function resizeCanvases(){
    canvas.width=physicsCanvas.width=window.innerWidth;
    canvas.height=physicsCanvas.height=window.innerHeight;
}
resizeCanvases();

const scissorsCursor = document.getElementById("scissorsCursor");
const instructionText = document.getElementById("instructionText");
const keralaContainer = document.getElementById("keralaContainer");
const startButton = document.getElementById("startButton");

// ================================================================
//  BACKGROUND — stars + Kerala lamp sparks
// ================================================================
class Star{
    constructor(){this.reset(true);}
    reset(){
        this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height;
        this.size=.3+Math.random()*1.4; this.opacity=.1+Math.random()*.5;
        this.twinkle=Math.random()*Math.PI*2; this.twinkleSpeed=.015+Math.random()*.025;
        this.color=["#ffffff","#ffe8a0","#a0d8ff","#ffd700"][Math.floor(Math.random()*4)];
    }
    update(){this.twinkle+=this.twinkleSpeed;}
    draw(){
        const a=this.opacity*(.5+Math.sin(this.twinkle)*.5);
        ctx.save();ctx.globalAlpha=a;ctx.fillStyle=this.color;
        ctx.shadowBlur=6;ctx.shadowColor=this.color;
        ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore();
    }
}
class LampSpark{
    constructor(){this.reset();}
    reset(){
        this.x=Math.random()*canvas.width; this.y=canvas.height+20;
        this.vx=(Math.random()-.5)*.4; this.vy=-.4-Math.random()*.8;
        this.life=1; this.decay=.003+Math.random()*.004;
        this.size=1+Math.random()*2.5; this.hue=28+Math.random()*28;
    }
    update(){
        this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;
        this.vx+=(Math.random()-.5)*.05;
        if(this.life<=0)this.reset();
    }
    draw(){
        ctx.save();ctx.globalAlpha=this.life*.5;
        ctx.fillStyle=`hsl(${this.hue},100%,70%)`;
        ctx.shadowBlur=10;ctx.shadowColor=`hsl(${this.hue},100%,70%)`;
        ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore();
    }
}
const stars=Array.from({length:600},()=>new Star());
const sparks=Array.from({length:80},()=>new LampSpark());
function animateBg(){
    requestAnimationFrame(animateBg);
    ctx.fillStyle="rgba(4,6,13,.15)";ctx.fillRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{s.update();s.draw();});
    sparks.forEach(s=>{s.update();s.draw();});
}
animateBg();

// ================================================================
//  PHYSICS OBJECTS
// ================================================================
const physicsObjects=[];
let animatingPhysics=false;
const ropeSegments=[];
const ropeConstraints=[];
let ropeCreated=false,ribbonCut=false,isHoveringRibbon=false;

class RopeSegment{
    constructor(x,y,fixed=false){
        this.x=x;this.y=y;this.oldX=x;this.oldY=y;this.fixed=fixed;
    }
    update(){
        if(this.fixed)return;
        const vx=(this.x-this.oldX)*.999,vy=(this.y-this.oldY)*.999;
        this.oldX=this.x;this.oldY=this.y;
        this.x+=vx;this.y+=vy+.18;
        if(this.x<20)this.x=20;
        if(this.x>physicsCanvas.width-20)this.x=physicsCanvas.width-20;
    }
}
class RopeConstraint{
    constructor(p1,p2,len){this.p1=p1;this.p2=p2;this.length=len;this.active=true;}
    solve(){
        if(!this.active)return;
        const dx=this.p2.x-this.p1.x,dy=this.p2.y-this.p1.y;
        const dist=Math.sqrt(dx*dx+dy*dy)||.001;
        const diff=(this.length-dist)/dist*.5;
        const ox=dx*diff,oy=dy*diff;
        if(!this.p1.fixed){this.p1.x-=ox;this.p1.y-=oy;}
        if(!this.p2.fixed){this.p2.x+=ox;this.p2.y+=oy;}
    }
}

// Confetti — life-based so ALL pieces fall and fade regardless of screen position
class Confetti{
    constructor(x,y,burst){
        this.x=x;this.y=y;
        if(burst){
            const side=Math.floor(Math.random()*4);
            if(side===0){this.x=Math.random()*physicsCanvas.width;this.y=-10;}
            else if(side===1){this.x=physicsCanvas.width+10;this.y=Math.random()*physicsCanvas.height;}
            else if(side===2){this.x=Math.random()*physicsCanvas.width;this.y=physicsCanvas.height+10;}
            else{this.x=-10;this.y=Math.random()*physicsCanvas.height;}
            const cx=physicsCanvas.width/2,cy=physicsCanvas.height/2;
            const angle=Math.atan2(cy-this.y,cx-this.x)+(Math.random()-.5)*.9;
            const sp=9+Math.random()*14;
            this.vx=Math.cos(angle)*sp;this.vy=Math.sin(angle)*sp;
        }else{
            const angle=Math.random()*Math.PI*2,sp=4+Math.random()*18;
            this.vx=Math.cos(angle)*sp;this.vy=Math.sin(angle)*sp-6;
        }
        this.rotation=Math.random()*Math.PI*2;
        this.angularVelocity=(Math.random()-.5)*.3;
        this.w=6+Math.random()*10;this.h=4+Math.random()*6;
        this.color=["#FF6B00","#FFD700","#FF1744","#00E676","#2979FF",
                    "#FF4081","#EEFF41","#18FFFF","#FF9100","#F50057"][Math.floor(Math.random()*10)];
        this.gravity=0.32;
        // life timer: starts at 1, fades to 0 over ~3-5 seconds
        this.life=1;
        this.decay=0.004+Math.random()*0.004; // slow decay so they fall fully first
        this.opacity=1;
    }
    update(){
        // Always apply gravity so pieces fall continuously
        this.vx*=.984;
        this.vy+=this.gravity;
        this.x+=this.vx;
        this.y+=this.vy;
        this.rotation+=this.angularVelocity;
        // Decay life gradually — pieces fade out over time regardless of position
        this.life-=this.decay;
        this.opacity=Math.max(0, this.life);
    }
    draw(){
        if(this.opacity<=0)return;
        physicsCtx.save();physicsCtx.globalAlpha=this.opacity;
        physicsCtx.translate(this.x,this.y);physicsCtx.rotate(this.rotation);
        physicsCtx.fillStyle=this.color;
        physicsCtx.fillRect(-this.w/2,-this.h/2,this.w,this.h);
        physicsCtx.restore();
    }
}

// Knot sparks
class KnotSpark{
    constructor(x,y){
        this.x=x;this.y=y;
        const angle=Math.random()*Math.PI*2,sp=3+Math.random()*13;
        this.vx=Math.cos(angle)*sp;this.vy=Math.sin(angle)*sp;
        this.life=1;this.decay=.025+Math.random()*.04;
        this.size=2+Math.random()*5;this.gravity=.2;
        this.color=["#FFD700","#FF6B00","#FF1744","#FFFFFF","#FFE066"][Math.floor(Math.random()*5)];
    }
    update(){
        this.vx*=.94;this.vy+=this.gravity;
        this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;
    }
    draw(){
        physicsCtx.save();physicsCtx.globalAlpha=this.life;
        physicsCtx.fillStyle=this.color;physicsCtx.shadowBlur=14;physicsCtx.shadowColor=this.color;
        physicsCtx.beginPath();physicsCtx.arc(this.x,this.y,this.size*this.life,0,Math.PI*2);
        physicsCtx.fill();physicsCtx.restore();
    }
}

// Ribbon piece
class RibbonPiece{
    constructor(x,y,vx,vy){
        this.x=x;this.y=y;this.vx=vx;this.vy=vy;
        this.w=40+Math.random()*80;this.h=22;
        this.rotation=Math.random()*Math.PI*2;
        this.angularVelocity=(Math.random()-.5)*.15;
        this.gravity=.4;this.opacity=1;
    }
    update(){
        this.vx*=.97;this.vy+=this.gravity;
        this.x+=this.vx;this.y+=this.vy;
        this.rotation+=this.angularVelocity;
        if(this.y>physicsCanvas.height+60)this.opacity-=.03;
    }
    draw(){
        physicsCtx.save();physicsCtx.globalAlpha=this.opacity;
        physicsCtx.translate(this.x,this.y);physicsCtx.rotate(this.rotation);
        const g=physicsCtx.createLinearGradient(-this.w/2,0,this.w/2,0);
        g.addColorStop(0,"#cc0000");g.addColorStop(.3,"#ff4757");
        g.addColorStop(.7,"#ff8c8c");g.addColorStop(1,"#cc0000");
        physicsCtx.fillStyle=g;physicsCtx.shadowBlur=20;physicsCtx.shadowColor="rgba(255,60,60,.9)";
        physicsCtx.fillRect(-this.w/2,-this.h/2,this.w,this.h);physicsCtx.restore();
    }
}

// ================================================================
//  ROPE CREATION + DRAWING
// ================================================================
function createRibbon(){
    ropeSegments.length=0;ropeConstraints.length=0;
    const cx=physicsCanvas.width/2,cy=physicsCanvas.height/2-40;
    const ropeLen=Math.min(520,physicsCanvas.width*.48);
    const N=38,segLen=ropeLen/N;
    const startX=cx-ropeLen/2;
    for(let i=0;i<=N;i++){
        const x=startX+i*segLen,y=cy+Math.sin(i*.25)*4;
        ropeSegments.push(new RopeSegment(x,y,i===0||i===N));
    }
    for(let i=0;i<ropeSegments.length-1;i++){
        ropeConstraints.push(new RopeConstraint(ropeSegments[i],ropeSegments[i+1],segLen));
    }
    ropeCreated=true;
}

function drawRope(){
    if(ropeSegments.length<2)return;
    physicsCtx.save();
    // Main ribbon band
    physicsCtx.shadowBlur=28;physicsCtx.shadowColor="rgba(255,60,60,.85)";
    physicsCtx.lineWidth=24;physicsCtx.lineCap="round";physicsCtx.lineJoin="round";
    const g=physicsCtx.createLinearGradient(
        ropeSegments[0].x,ropeSegments[0].y,
        ropeSegments[ropeSegments.length-1].x,ropeSegments[ropeSegments.length-1].y);
    g.addColorStop(0,"#cc0000");g.addColorStop(.25,"#ff4757");
    g.addColorStop(.5,"#ff8787");g.addColorStop(.75,"#ff4757");g.addColorStop(1,"#cc0000");
    physicsCtx.strokeStyle=g;
    physicsCtx.beginPath();physicsCtx.moveTo(ropeSegments[0].x,ropeSegments[0].y);
    for(let i=1;i<ropeSegments.length;i++){
        const s=ropeSegments[i],p=ropeSegments[i-1];
        physicsCtx.quadraticCurveTo(p.x,p.y,(s.x+p.x)/2,(s.y+p.y)/2);
    }
    physicsCtx.stroke();
    // Sheen
    physicsCtx.lineWidth=7;physicsCtx.shadowBlur=0;
    physicsCtx.strokeStyle="rgba(255,200,200,.3)";
    physicsCtx.beginPath();physicsCtx.moveTo(ropeSegments[0].x,ropeSegments[0].y-5);
    for(let i=1;i<ropeSegments.length;i++){
        const s=ropeSegments[i],p=ropeSegments[i-1];
        physicsCtx.quadraticCurveTo(p.x,p.y-5,(s.x+p.x)/2,(s.y+p.y)/2-5);
    }
    physicsCtx.stroke();
    // Anchors
    ropeSegments.forEach(seg=>{
        if(seg.fixed&&!ribbonCut){
            physicsCtx.shadowBlur=22;physicsCtx.shadowColor="rgba(255,215,0,1)";
            physicsCtx.fillStyle="#FFD700";physicsCtx.beginPath();
            physicsCtx.arc(seg.x,seg.y,16,0,Math.PI*2);physicsCtx.fill();
            physicsCtx.strokeStyle="#FF6B00";physicsCtx.lineWidth=3;physicsCtx.stroke();
        }
    });
    // KNOT at center
    if(!ribbonCut){
        const ki=Math.floor(ropeSegments.length/2);
        const k=ropeSegments[ki];
        // outer glow ring
        physicsCtx.shadowBlur=38;physicsCtx.shadowColor="#FFD700";
        physicsCtx.strokeStyle="rgba(255,215,0,.75)";physicsCtx.lineWidth=3.5;
        physicsCtx.beginPath();physicsCtx.arc(k.x,k.y,27,0,Math.PI*2);physicsCtx.stroke();
        // knot loop body (overlapping arcs to mimic a tied knot)
        physicsCtx.lineWidth=22;physicsCtx.strokeStyle="#cc0000";
        physicsCtx.shadowBlur=14;physicsCtx.shadowColor="rgba(180,0,0,.9)";
        physicsCtx.beginPath();physicsCtx.arc(k.x,k.y,18,.3,Math.PI*1.7);physicsCtx.stroke();
        physicsCtx.lineWidth=22;physicsCtx.strokeStyle="#ff4757";physicsCtx.shadowBlur=10;
        physicsCtx.beginPath();physicsCtx.arc(k.x,k.y,18,Math.PI*1.2,Math.PI*.3,false);physicsCtx.stroke();
        // gold jewel centre
        const rg=physicsCtx.createRadialGradient(k.x-4,k.y-4,2,k.x,k.y,13);
        rg.addColorStop(0,"#FFFFFF");rg.addColorStop(.3,"#FFD700");rg.addColorStop(1,"#FF6B00");
        physicsCtx.fillStyle=rg;physicsCtx.shadowBlur=22;physicsCtx.shadowColor="#FFD700";
        physicsCtx.beginPath();physicsCtx.arc(k.x,k.y,11,0,Math.PI*2);physicsCtx.fill();
        // hover pulse
        if(isHoveringRibbon){
            const t=Date.now()/600;const r=28+Math.sin(t)*8;
            physicsCtx.shadowBlur=28;physicsCtx.shadowColor="#FFD700";
            physicsCtx.strokeStyle=`rgba(255,215,0,${.45+.55*Math.sin(t)})`;
            physicsCtx.lineWidth=2.5;
            physicsCtx.beginPath();physicsCtx.arc(k.x,k.y,r,0,Math.PI*2);physicsCtx.stroke();
        }
    }
    physicsCtx.restore();
}

// ================================================================
//  PHYSICS LOOP
// ================================================================
function animatePhysics(){
    physicsCtx.clearRect(0,0,physicsCanvas.width,physicsCanvas.height);
    if(ropeCreated){
        for(let i=0;i<20;i++){
            ropeSegments.forEach(s=>s.update());
            ropeConstraints.forEach(c=>c.solve());
        }
        if(ropeSegments.some(s=>s.y<physicsCanvas.height+200)||!ribbonCut)drawRope();
    }
    if(animatingPhysics){
        for(let i=physicsObjects.length-1;i>=0;i--){
            physicsObjects[i].update();
            physicsObjects[i].draw();
            // Remove when fully faded (opacity/life at 0)
            if((physicsObjects[i].opacity!==undefined && physicsObjects[i].opacity<=0)||
               (physicsObjects[i].life!==undefined && physicsObjects[i].life<=0)){
                physicsObjects.splice(i,1);
            }
        }
        if(!physicsObjects.length)animatingPhysics=false;
    }
    requestAnimationFrame(animatePhysics);
}
animatePhysics();

// ================================================================
//  ROPE INTERACTION
// ================================================================
function findClosestRopePoint(x,y){
    let min=Infinity,idx=-1;
    for(let i=2;i<ropeSegments.length-2;i++){
        const s=ropeSegments[i],d=Math.hypot(s.x-x,s.y-y);
        if(d<min){min=d;idx=i;}
    }
    return min<58?idx:-1;
}
function checkRopeHover(x,y){
    if(ribbonCut||!ropeCreated)return null;
    const idx=findClosestRopePoint(x,y);
    if(idx===-1)return null;
    return{x:ropeSegments[idx].x,y:ropeSegments[idx].y,idx};
}
function cutRibbon(hx,hy){
    const ci=findClosestRopePoint(hx,hy);
    if(ci===-1)return false;
    const cs=ropeSegments[ci];
    for(let i=ci-4;i<=ci+3;i++){
        if(i>=0&&i<ropeConstraints.length)ropeConstraints[i].active=false;
    }
    ropeSegments.forEach(s=>{s.fixed=false;});
    for(let i=0;i<=ci;i++){ropeSegments[i].vy=-.5+Math.random()*.3;}
    // Ribbon pieces
    for(let i=0;i<12;i++){
        physicsObjects.push(new RibbonPiece(
            cs.x+(Math.random()-.5)*40,cs.y+(Math.random()-.5)*20,
            (Math.random()-.5)*14,-3-Math.random()*8));
    }
    // Knot sparks
    for(let i=0;i<70;i++)physicsObjects.push(new KnotSpark(cs.x,cs.y));
    // All-direction confetti
    for(let i=0;i<320;i++)physicsObjects.push(new Confetti(cs.x,cs.y,true));
    // Burst from cut
    for(let i=0;i<120;i++)physicsObjects.push(new Confetti(cs.x,cs.y,false));
    animatingPhysics=true;
    // Light streak
    const streak=document.getElementById("streak");
    streak.style.top=cs.y+"px";
    streak.classList.add("fire");
    setTimeout(()=>streak.classList.remove("fire"),900);
    return true;
}

// ================================================================
//  POINTER
// ================================================================
function getXY(e){
    const r=physicsCanvas.getBoundingClientRect();
    const cx=(e.clientX??e.touches?.[0]?.clientX??0)-r.left;
    const cy=(e.clientY??e.touches?.[0]?.clientY??0)-r.top;
    return{x:cx*(physicsCanvas.width/r.width),y:cy*(physicsCanvas.height/r.height)};
}
document.addEventListener("mousemove",e=>{
    scissorsCursor.style.left=e.clientX+"px";
    scissorsCursor.style.top =e.clientY+"px";
    if(ribbonCut){scissorsCursor.classList.remove("hovering");return;}
    const{x,y}=getXY(e);
    const hit=checkRopeHover(x,y);
    if(hit){scissorsCursor.classList.add("hovering");isHoveringRibbon=true;}
    else   {scissorsCursor.classList.remove("hovering");isHoveringRibbon=false;}
});
function handleClick(e){
    if(ribbonCut)return;
    e.preventDefault();
    const{x,y}=getXY(e);
    const hit=checkRopeHover(x,y);
    if(hit){
        ribbonCut=true;isHoveringRibbon=false;
        scissorsCursor.classList.remove("hovering");
        if(cutRibbon(hit.x,hit.y))setTimeout(continueSequence,2400);
    }
}
document.addEventListener("click",handleClick);
document.addEventListener("touchstart",e=>{
    scissorsCursor.style.left=(e.touches[0]?.clientX??0)+"px";
    scissorsCursor.style.top =(e.touches[0]?.clientY??0)+"px";
    handleClick(e);
},{passive:false});

// ================================================================
//  CINEMATIC TEXT — clean, no halo effect
// ================================================================
function showText(el, delay, exitDelay, animClass="anim-enter"){
    setTimeout(()=>{
        el.classList.add(animClass);
        setTimeout(()=>{
            el.classList.remove(animClass);
            el.classList.add("anim-exit");
            setTimeout(()=>{
                el.classList.remove("anim-exit");
                el.style.opacity = "0";
            }, 1000);
        }, exitDelay || 2200);
    }, delay);
}

function continueSequence(){
    document.body.classList.remove("interactive-mode");
    instructionText.classList.remove("show");
    // Hard-coded audio playback
    const introAudio = new Audio('../assets/Audio/intro.mp3');
    introAudio.volume = 0.6;
    introAudio.play().catch(e => console.log('Audio play failed:', e));
    // Kerala map - clear confetti
    setTimeout(()=>{
        physicsObjects = physicsObjects.filter(obj => !(obj instanceof Confetti));
        keralaContainer.classList.add("show");
        document.querySelectorAll(".halo-ring").forEach(r=>r.classList.add("animate"));
    },500);
    setTimeout(()=>keralaContainer.classList.add("hide"),4800);

    let t=5600;
    showText(document.getElementById("welcomeText"),t,2400,"anim-wipe"); t+=3400;
    showText(document.getElementById("realityText"),t,2600);             t+=3400;
    showText(document.getElementById("text1"),       t,2600);             t+=3400;
    showText(document.getElementById("text2"),       t,2000);             t+=2800;
    showText(document.getElementById("text3"),       t,2200);             t+=3000;
    showText(document.getElementById("text4"),       t,2200);             t+=3000;

    // Logo reveal
    setTimeout(()=>{
        const logo=document.getElementById("logo");
        logo.classList.add("reveal");
    },t); t+=2200;

    setTimeout(()=>startButton.classList.add("show"),t);

    // Audio post-cut
    if(window._postCutAudio)window._postCutAudio();
}

// ================================================================
//  AUDIO — place your music file URL below
// ================================================================
function initAudio(){
    const MUSIC_URL = "";   // ← paste your audio file URL here

    if(!MUSIC_URL) return;

    const audio = new Audio(MUSIC_URL);
    audio.loop   = true;
    audio.volume = 0;

    audio.play().then(()=>{
        const fi = setInterval(()=>{
            if(audio.volume < 0.6) audio.volume = Math.min(audio.volume + 0.01, 0.6);
            else clearInterval(fi);
        }, 100);
    }).catch(()=>{});

    window._postCutAudio = ()=>{};
}

let audioStarted = false;
function startAudioOnce(){
    if(!audioStarted){ audioStarted = true; initAudio(); }
}
document.addEventListener("click",     startAudioOnce, {once:true});
document.addEventListener("touchstart",startAudioOnce, {once:true});

// ================================================================
//  INIT
// ================================================================
function startSequence(){
    createRibbon();
    setTimeout(()=>{
        scissorsCursor.style.opacity="1";
        instructionText.classList.add("show");
        document.body.classList.add("interactive-mode");
    },600);
}
setTimeout(startSequence,400);

startButton.addEventListener("click",()=>{window.location.href="index.html";});

window.addEventListener("resize",()=>{
    resizeCanvases();
    if(!ribbonCut)createRibbon();
});
</script>
