directories:
  output: release
  buildResources: build
appId: com.yourname.interactive-wall-games
productName: Auticare Blueroom Interactive
win:
  target: nsis
  icon: assets/icon.ico
mac:
  target: dmg
  icon: assets/icon.icns
linux:
  target: AppImage
  icon: assets/icon.png
files:
  - filter:
      - main.js
      - index.html
      - FreeCanvas.html
      - solar-system.html
      - games/**/*
      - js/**/*
      - assets/**/*
      - package.json
electronVersion: 28.3.3
