<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Big / Small / Green</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito','Segoe UI',sans-serif;
  background:linear-gradient(160deg,#FFF8E1 0%,#FFF3CD 50%,#FFEAA7 100%)}

/* TOP zone: title + score — no interaction */
.top-zone{position:fixed;top:0;left:0;right:0;height:46vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;pointer-events:none;z-index:2}
.scene-title{font-size:clamp(22px,3.8vw,42px);font-weight:900;color:#4A235A;
  text-shadow:0 2px 8px rgba(255,255,255,.5);text-align:center}
.score-badge{background:rgba(255,255,255,.55);backdrop-filter:blur(6px);
  border:2px solid rgba(255,255,255,.7);border-radius:16px;
  padding:8px 22px;font-weight:900;font-size:clamp(18px,2.8vw,30px);color:#1B5E20}
.status-label{font-size:clamp(13px,1.8vw,19px);font-weight:700;color:#5D4037;text-align:center;
  background:rgba(255,255,255,.4);border-radius:12px;padding:5px 16px}

/* BOTTOM zone: all interactive */
.bottom-zone{position:fixed;top:46vh;left:0;right:0;bottom:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:space-around;
  padding:10px 14px 18px}

.prompt-label{font-size:clamp(16px,2.5vw,28px);font-weight:900;color:#4A235A;
  text-align:center;text-shadow:0 1px 6px rgba(255,255,255,.6)}

/* Objects row */
.objects-row{display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(14px,3vw,44px)}
.obj-card{border-radius:20px;border:3px solid rgba(255,255,255,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:8px;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  transition:transform .2s,box-shadow .2s,opacity .35s;
  -webkit-user-select:none;user-select:none;
  background:rgba(255,255,255,.55);backdrop-filter:blur(4px)}
.obj-card:active{transform:scale(.92)}
.obj-card.selected{outline:4px solid #9B7FDB;transform:translateY(-10px) scale(1.08);
  box-shadow:0 14px 32px rgba(155,127,219,.4)}
.obj-card.matched{opacity:.3;pointer-events:none;transform:scale(.88)}
.obj-emoji{line-height:1;display:block;text-align:center}
.obj-label{font-size:clamp(10px,1.5vw,14px);font-weight:700;color:#4A235A;
  text-align:center;margin-top:4px}

/* Drop zones */
.zones-row{display:flex;justify-content:center;gap:clamp(10px,2vw,36px);flex-wrap:wrap}
.zone-card{border-radius:20px;border:3px dashed rgba(0,0,0,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 12px;cursor:pointer;
  min-width:clamp(88px,15vw,154px);min-height:clamp(66px,9.5vh,100px);
  transition:transform .2s;-webkit-user-select:none;user-select:none}
.zone-card:active{transform:scale(.96)}
.zone-card.correct-flash{animation:zFlash .5s ease}
@keyframes zFlash{0%,100%{transform:scale(1)}40%{transform:scale(1.12);box-shadow:0 0 28px rgba(76,175,80,.5)}}
.zone-card.wrong-flash{animation:zWrong .4s ease}
@keyframes zWrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.zone-icon{font-size:clamp(24px,4.2vw,46px);margin-bottom:4px}
.zone-label{font-size:clamp(13px,1.8vw,20px);font-weight:900;color:#fff;text-align:center}

/* Language helpers (injected by pre-primary-common) */
</style>
</head>
<body>

<!-- TOP: display only -->
<div class="top-zone">
  <div class="scene-title">
    <span class="pp-en">🌿 Big · Small · Green</span>
    <span class="pp-ml">🌿 വലുത് · ചെറുത് · പച്ച</span>
  </div>
  <div class="score-badge">⭐ <span id="scoreNum">0</span></div>
  <div class="status-label" id="statusLabel">
    <span class="pp-en">Tap an object, then tap its zone!</span>
    <span class="pp-ml">വസ്തു തൊടൂ, പിന്നെ സോൺ തൊടൂ!</span>
  </div>
</div>

<!-- BOTTOM: interactive -->
<div class="bottom-zone">
  <div class="prompt-label" id="promptLabel">Which is BIG?</div>
  <div class="objects-row" id="objectsRow"></div>
  <div class="zones-row"   id="zonesRow"></div>
</div>

<script src="../js/audio-manager.js"></script>
<script src="../js/pre-primary-common.js"></script>
<script>
/* ── Large item pool — draw randomly without repeating ────────── */
const ITEM_POOL = {
  BIG: [
    {emoji:'🐘',size:80,en:'Elephant',  ml:'ആന'},
    {emoji:'🦖',size:80,en:'T-Rex',     ml:'ദിനോസർ'},
    {emoji:'🐋',size:86,en:'Whale',     ml:'തിമിംഗലം'},
    {emoji:'🦁',size:74,en:'Lion',      ml:'സിംഹം'},
    {emoji:'🐻',size:74,en:'Bear',      ml:'കരടി'},
    {emoji:'🦒',size:78,en:'Giraffe',   ml:'ജിറാഫ്'},
    {emoji:'🐊',size:76,en:'Crocodile', ml:'മുതല'},
    {emoji:'🦏',size:80,en:'Rhino',     ml:'കണ്ടാമൃഗം'},
    {emoji:'🦛',size:78,en:'Hippo',     ml:'ഹിപ്പോ'},
    {emoji:'🐃',size:76,en:'Buffalo',   ml:'പോത്ത്'},
  ],
  SMALL: [
    {emoji:'🐭',size:46,en:'Mouse',      ml:'എലി'},
    {emoji:'🐝',size:42,en:'Bee',        ml:'തേനീച്ച'},
    {emoji:'🐞',size:40,en:'Ladybug',    ml:'ലേഡിബഗ്'},
    {emoji:'🐜',size:38,en:'Ant',        ml:'ഉറുമ്പ്'},
    {emoji:'🦋',size:44,en:'Butterfly',  ml:'ചിത്രശലഭം'},
    {emoji:'🐛',size:42,en:'Caterpillar',ml:'ഇലക്കൊമ്പൻ'},
    {emoji:'🦗',size:42,en:'Cricket',    ml:'ഞൊണ്ടൻ'},
    {emoji:'🐌',size:40,en:'Snail',      ml:'ഒച്ച്'},
    {emoji:'🐡',size:44,en:'Pufferfish', ml:'മീൻ'},
    {emoji:'🐦',size:44,en:'Bird',       ml:'കിളി'},
  ],
  GREEN: [
    {emoji:'🐸',size:58,en:'Frog',    ml:'തവള'},
    {emoji:'🌳',size:76,en:'Tree',    ml:'മരം'},
    {emoji:'🌿',size:46,en:'Leaf',    ml:'ഇല'},
    {emoji:'🥦',size:52,en:'Broccoli',ml:'ബ്രൊക്കോളി'},
    {emoji:'🐢',size:56,en:'Turtle',  ml:'ആമ'},
    {emoji:'🌵',size:60,en:'Cactus',  ml:'കള്ളിമുൾ'},
    {emoji:'🥬',size:52,en:'Lettuce', ml:'ഇലക്കറി'},
    {emoji:'🍃',size:46,en:'Herbs',   ml:'ഇലകൾ'},
    {emoji:'🫒',size:46,en:'Olive',   ml:'ഒലിവ്'},
    {emoji:'🥒',size:52,en:'Cucumber',ml:'വെള്ളരി'},
  ]
};

const ZONES = [
  {key:'BIG',   icon:'🐘',labelEn:'BIG',   labelMl:'വലുത്',  bg:'#FF8A65',border:'#FF5722'},
  {key:'SMALL', icon:'🐭',labelEn:'SMALL', labelMl:'ചെറുത്', bg:'#64B5F6',border:'#1565C0'},
  {key:'GREEN', icon:'🌿',labelEn:'GREEN', labelMl:'പച്ച',   bg:'#81C784',border:'#2E7D32'},
];

const PROMPTS_EN = [
  'Which is BIG?','Which is SMALL?','Which is GREEN?',
  'Sort them all!','Find the BIG one!','Spot the small one!','Find the green!'
];
const PROMPTS_ML = [
  'ഏതാണ് വലുത്?','ഏതാണ് ചെറുത്?','ഏതാണ് പച്ച?',
  'എല്ലാം തരംതിരിക്കൂ!','വലിയത് കണ്ടെത്തൂ!','ചെറിയത് കണ്ടെത്തൂ!','പച്ചയേത്?'
];

/* ── Shuffled pools (no-repeat within a cycle) ───────────────── */
function shuffle(arr) {
  const a=[...arr];
  for (let i=a.length-1;i>0;i--) { const j=~~(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

const pools = {};
const cursors = {};
function initPools() {
  ['BIG','SMALL','GREEN'].forEach(cat => {
    pools[cat]   = shuffle(ITEM_POOL[cat]);
    cursors[cat] = 0;
  });
}

function nextItem(cat) {
  if (cursors[cat] >= pools[cat].length) {
    pools[cat]   = shuffle(ITEM_POOL[cat]);
    cursors[cat] = 0;
  }
  return pools[cat][cursors[cat]++];
}

let lastPromptIdx = -1;
function pickPrompt() {
  let idx;
  do { idx=~~(Math.random()*PROMPTS_EN.length); } while(idx===lastPromptIdx);
  lastPromptIdx = idx;
  return {en: PROMPTS_EN[idx], ml: PROMPTS_ML[idx]};
}

/* ── State ───────────────────────────────────────────────────── */
let score    = 0;
let selected = null;
let isMl     = false;
let currentPrompt = {en:'Which is BIG?', ml:'ഏതാണ് വലുത്?'};

PP.init();
document.body.insertAdjacentHTML('beforeend', PP.toolbarHTML());
PP.initLangToggle(ml => {
  isMl = ml;
  updatePromptLabel();
});

initPools();

/* ── Build a new round ───────────────────────────────────────── */
function buildRound() {
  const big   = {...nextItem('BIG'),   answer:'BIG'};
  const small = {...nextItem('SMALL'), answer:'SMALL'};
  const green = {...nextItem('GREEN'), answer:'GREEN'};
  const objects = shuffle([big, small, green]);

  currentPrompt = pickPrompt();
  updatePromptLabel();

  const objRow  = document.getElementById('objectsRow');
  const zoneRow = document.getElementById('zonesRow');
  objRow.innerHTML = ''; zoneRow.innerHTML = '';
  selected = null;

  objects.forEach((obj, i) => {
    const card = document.createElement('div');
    card.className = 'obj-card';
    card.dataset.answer = obj.answer;
    card.dataset.idx    = i;
    card.innerHTML = `
      <span class="obj-emoji" style="font-size:${obj.size}px">${obj.emoji}</span>
      <span class="obj-label">
        <span class="pp-en">${obj.en}</span>
        <span class="pp-ml">${obj.ml}</span>
      </span>`;
    PP.bindTouch(card, () => selectObj(card));
    objRow.appendChild(card);
  });

  ZONES.forEach(z => {
    const zcard = document.createElement('div');
    zcard.className = 'zone-card';
    zcard.dataset.key = z.key;
    zcard.style.background  = z.bg;
    zcard.style.borderColor = z.border;
    zcard.innerHTML = `
      <span class="zone-icon">${z.icon}</span>
      <span class="zone-label">
        <span class="pp-en">${z.labelEn}</span>
        <span class="pp-ml">${z.labelMl}</span>
      </span>`;
    PP.bindTouch(zcard, () => dropOnZone(zcard));
    zoneRow.appendChild(zcard);
  });
}

function updatePromptLabel() {
  document.getElementById('promptLabel').textContent =
    isMl ? currentPrompt.ml : currentPrompt.en;
}

function selectObj(card) {
  if (card.classList.contains('matched')) return;
  if (selected) selected.classList.remove('selected');
  if (selected === card) { selected=null; return; }
  selected = card;
  card.classList.add('selected');
}

function dropOnZone(zcard) {
  if (!selected) return;
  const isCorrect = selected.dataset.answer === zcard.dataset.key;
  if (isCorrect) {
    selected.classList.remove('selected');
    selected.classList.add('matched');
    zcard.classList.add('correct-flash');
    setTimeout(() => zcard.classList.remove('correct-flash'), 550);
    score++;
    document.getElementById('scoreNum').textContent = score;
    selected = null;
    const matched = document.querySelectorAll('.obj-card.matched').length;
    if (matched === 3) {
      // All 3 matched — brief pause then new round immediately
      setTimeout(buildRound, 700);
    }
  } else {
    zcard.classList.add('wrong-flash');
    setTimeout(() => zcard.classList.remove('wrong-flash'), 450);
  }
}

buildRound();
</script>
</body>
</html>
