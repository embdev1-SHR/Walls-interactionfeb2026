<!DOCTYPE html>
<!--
================================================================================
  Big Small Green - Pangappara Blueroom
================================================================================
  Rebuilt as the SORTER asked for: one object at a time comes up the queue and
  goes into big, small, or green.

  Each object carries exactly one true answer, deliberately. A big green ball
  would have two, and a child who picked the "wrong" right answer would be
  told they were wrong - which teaches nothing except that the wall is unfair.
  The green items are all mid-sized and the sized items are all non-green.

  Audio on every object, as asked: panel 1 names it aloud.

  Three panels. Each child runs their own rounds and nobody waits for anyone
  else to finish; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Big Small Green</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fbfdf4,#f2f8e4 70%,#e8f0d6);user-select:none;touch-action:none}
  .row{display:flex;gap:.7vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(11px,2vh,22px);color:#5b6f2b;text-align:center;flex-shrink:0}
  /* Cards are square and sized from the PANEL, never the viewport: a panel is
     a third of the wall at three players, and viewport units overflow it. */
  .tile{flex:0 0 auto;aspect-ratio:1;width:clamp(40px,8.4vh,88px);
    border-radius:14px;background:#fff;border:3px solid #d2e0b6;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 10px rgba(40,50,70,.13);
    display:grid;place-items:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(18px,3.6vh,42px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(7px,1.2vh,12px);color:#26313b;line-height:1.25}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.22;pointer-events:none}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .big{width:clamp(56px,13vh,132px)}
  .bins{display:flex;gap:.7vw;width:100%;flex-shrink:0}
  .bin{flex:1;min-width:0;border-radius:16px;border:5px dashed #cbd9ac;
    background:rgba(255,255,255,.65);padding:7px 3px;cursor:pointer;text-align:center;
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(10px,1.8vh,20px);color:#4a5a26;transition:border-color .16s,transform .16s}
  .bin:active{transform:scale(.98)}
  .bin.good{border-color:#3fae7c;border-style:solid}
  .bin.bad{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .obj{font-size:clamp(40px,9vh,100px);line-height:1;flex-shrink:0}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* one true answer each: green items are mid-sized, sized items are not green */
var OBJ=[
 {em:'\ud83d\udc18',ml:'\u0d06\u0d28',bin:'big'},
 {em:'\ud83d\udc1c',ml:'\u0d09\u0d31\u0d41\u0d2e\u0d4d\u0d2a\u0d4d',bin:'small'},
 {em:'\ud83c\udf3f',ml:'\u0d07\u0d32',bin:'green'},
 {em:'\ud83d\udc0b',ml:'\u0d24\u0d3f\u0d2e\u0d3f\u0d02\u0d17\u0d32\u0d02',bin:'big'},
 {em:'\ud83d\udc1d',ml:'\u0d24\u0d47\u0d28\u0d40\u0d1a\u0d4d\u0d1a',bin:'small'},
 {em:'\ud83e\udd92',ml:'\u0d1c\u0d3f\u0d31\u0d3e\u0d2b',bin:'big'},
 {em:'\ud83d\udc1e',ml:'\u0d32\u0d47\u0d21\u0d3f\u0d2c\u0d17\u0d4d',bin:'small'},
 {em:'\ud83e\udd66',ml:'\u0d2c\u0d4d\u0d30\u0d4a\u0d15\u0d4d\u0d15\u0d4b\u0d33\u0d3f',bin:'green'},
 {em:'\ud83e\udd52',ml:'\u0d15\u0d4d\u0d2f\u0d42\u0d15\u0d4d\u0d15\u0d02\u0d2c\u0d7c',bin:'green'}
];
var BINS=[{k:'big',ml:'\u0d35\u0d32\u0d41\u0d24\u0d4d'},{k:'small',ml:'\u0d1a\u0d46\u0d31\u0d41\u0d24\u0d4d'},{k:'green',ml:'\u0d2a\u0d1a\u0d4d\u0d1a'}];

TRIUP.start({
  title:{en:'Big, Small, Green',ml:'\u0d35\u0d32\u0d41\u0d24\u0d4d, \u0d1a\u0d46\u0d31\u0d41\u0d24\u0d4d, \u0d2a\u0d1a\u0d4d\u0d1a'},
  hint:{en:'Put it where it belongs',ml:'\u0d36\u0d30\u0d3f\u0d2f\u0d3e\u0d2f \u0d38\u0d4d\u0d25\u0d32\u0d24\u0d4d\u0d24\u0d4d \u0d07\u0d1f\u0d42'},
  build:function(p, body, api){
    var st=api.state(p);
    var obj=document.createElement('div'); obj.className='obj';
    var lead=document.createElement('div'); lead.className='leadml';
    var bins=document.createElement('div'); bins.className='bins';
    body.appendChild(obj); body.appendChild(lead); body.appendChild(bins);
    BINS.forEach(function(b){
      var d=document.createElement('div'); d.className='bin'; d.dataset.k=b.k;
      d.textContent=b.ml;
      WALL.bindTouch(d,function(){ drop(d,b.k); });
      bins.appendChild(d);
    });

    function next(){
      if(!st.queue.length) return api.win(p,{
        title:{en:'All sorted!',ml:'\u0d0e\u0d32\u0d4d\u0d32\u0d3e\u0d02 \u0d24\u0d30\u0d02\u0d24\u0d3f\u0d30\u0d3f\u0d1a\u0d4d\u0d1a\u0d41!'},onAgain:start});
      st.cur=st.queue.shift();
      obj.textContent=st.cur.em;
      lead.textContent=st.cur.ml;
      api.pill(p,'sorted',st.done+' / '+OBJ.length);
      if(p===0&&WALL.voiceOn()) WALL.say(st.cur.ml);
    }
    function drop(d,k){
      if(!st.cur) return;
      if(k===st.cur.bin){
        d.classList.add('good'); setTimeout(function(){d.classList.remove('good');},450);
        st.done++; WALL.tone(440+st.done*60,.16,'sine',.12); st.cur=null; next();
      } else { d.classList.add('bad'); setTimeout(function(){d.classList.remove('bad');},460); WALL.sfx.nudge(); }
    }
    function start(){ st.done=0; st.queue=sh(OBJ); next(); }
    start();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
