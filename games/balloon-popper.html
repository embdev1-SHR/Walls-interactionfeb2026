<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Alphabet Sky Pop!</title>
<style>
:root {
  --pink: #ff007f;
  --yellow: #fff000;
  --blue: #00e5ff;
  --purple: #9d00ff;
  --sky: #4face6;
  --green: #00ff88;
}

/* Reset — but DON'T block touch-action on everything.
   We'll set it selectively so toolbar stays tappable. */
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }

body {
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
    background: linear-gradient(170deg, #5bc8f5 0%, #74ebd5 100%);
    /* Allow touch on body — children override as needed */
    touch-action: none;
}

/* Canvas fills left area, touch-action none for full pointer capture */
#gameCanvas {
    display: block;
    cursor: crosshair;
    position: relative;
    z-index: 5;
    touch-action: none;
}

/* UI top — stays above canvas, no pointer events so touches pass through to canvas */
.ui-top {
    position: absolute; top: 20px; left: 0;
    right: 150px;
    pointer-events: none; z-index: 10;
    display: flex; justify-content: center; gap: 15px;
}
.stat-item {
    background: white; padding: 10px 25px; border-radius: 50px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.1); border: 4px solid var(--pink);
    text-align: center;
}
.stat-label { font-size: 12px; font-weight: 900; color: #444; text-transform: uppercase; }
.stat-value { font-size: 32px; font-weight: 900; color: var(--pink); }

/* Pop Effects */
.floating-letter {
    position: absolute; pointer-events: none; font-weight: 900; font-size: 52px;
    z-index: 50; text-shadow: 3px 3px 0 white;
    animation: bouncePop 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
}
@keyframes bouncePop {
    0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
    50%  { opacity: 1; transform: scale(1.4) rotate(10deg); }
    100% { opacity: 0; transform: scale(1) translateY(-120px); }
}

/* Screens */
.screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(255,255,255,0.92), rgba(79,172,230,0.82));
    backdrop-filter: blur(10px); z-index: 100; text-align: center; padding: 20px;
    /* Screens need touch-action auto so buttons work */
    touch-action: auto;
}
.screen h1 {
    font-size: 62px; color: var(--pink); line-height: 1;
    text-shadow: 4px 4px 0px white, 8px 8px 20px rgba(0,0,0,0.15);
    margin-bottom: 20px;
}
.btn {
    padding: 20px 60px; font-size: 30px; font-weight: 900;
    background: var(--green); color: #004400; border: none;
    border-radius: 100px; cursor: pointer; border-bottom: 8px solid #009955;
    transition: transform 0.1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(4px); border-bottom-width: 4px; }

.modes { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
.m-btn {
    padding: 12px 22px; background: white; border: 3px solid var(--sky);
    border-radius: 20px; color: var(--sky); cursor: pointer; font-weight: bold; font-size: 17px;
    transition: all 0.15s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}
.m-btn.active { background: var(--pink); border-color: white; color: white; transform: scale(1.1); }

#subModes { display: none; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
#subModes.show { display: flex; }
.s-btn {
    padding: 10px 18px; background: white; border: 3px solid var(--purple);
    border-radius: 16px; color: var(--purple); cursor: pointer; font-weight: bold; font-size: 14px;
    transition: all 0.15s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}
.s-btn.active { background: var(--purple); border-color: white; color: white; transform: scale(1.08); }

.cloud {
    position: absolute; background: white; border-radius: 100px; opacity: 0.55; z-index: 1;
    animation: moveClouds linear infinite;
    pointer-events: none;
}
@keyframes moveClouds { from { transform: translateX(-260px); } to { transform: translateX(calc(100vw + 260px)); } }

/* ── FLOATING TOOLBAR PILL ── */
#toolbar {
    position: fixed;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 66px;
    z-index: 30;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;

    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(18px) saturate(1.9);
    -webkit-backdrop-filter: blur(18px) saturate(1.9);
    border: 3px solid rgba(255,255,255,0.6);
    border-radius: 38px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.65);
    padding: 16px 0;

    /* CRITICAL: allow normal touch interaction on toolbar */
    touch-action: auto;
}

#backBtn {
    width: 46px; height: 46px;
    background: white;
    border: 4px solid var(--pink);
    border-radius: 50%;
    box-shadow: 0 5px 0 rgba(255,0,127,0.28);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: transform 0.12s, box-shadow 0.12s;
    color: var(--pink);
    font-weight: 900;
    line-height: 1;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}
#backBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(255,0,127,0.28); }

.tb-divider {
    width: 38px; height: 3px;
    background: rgba(255,255,255,0.5);
    border-radius: 4px;
    pointer-events: none;
}

.toolbar-label {
    font-size: 9px; font-weight: 900;
    color: white; text-transform: uppercase;
    letter-spacing: 0.08em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    text-align: center;
    pointer-events: none;
}

.slider-wrap {
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    /* pan-y so the vertical range slider gets native drag */
    touch-action: pan-y;
}
.speed-emoji { font-size: 17px; line-height: 1; pointer-events: none; }

#speedSlider {
    writing-mode: vertical-lr;
    direction: rtl;
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    width: 30px;
    height: 120px;
    cursor: pointer;
    accent-color: var(--pink);
    background: transparent;
    border: none; outline: none;
    /* pan-y enables vertical touch drag on the range input */
    touch-action: pan-y;
}
#speedSlider::-webkit-slider-runnable-track {
    width: 8px;
    background: rgba(255,255,255,0.55);
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.75);
}
#speedSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px; height: 24px;
    background: var(--pink);
    border-radius: 50%;
    border: 4px solid white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22);
    margin-left: -10px;
}
#speedSlider::-moz-range-thumb {
    width: 24px; height: 24px;
    background: var(--pink);
    border-radius: 50%;
    border: 4px solid white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22);
    cursor: pointer;
}
#speedSlider::-moz-range-track {
    background: rgba(255,255,255,0.55);
    border-radius: 10px;
}

#speedBadge {
    width: 40px; height: 40px;
    background: white;
    border: 4px solid var(--blue);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900;
    color: var(--sky);
    box-shadow: 0 4px 0 rgba(0,200,255,0.22);
    pointer-events: none;
}

/* ── Speech bubble ── */
.speech-bubble {
    position: absolute;
    background: white;
    border: 4px solid var(--pink);
    border-radius: 18px;
    padding: 7px 14px;
    pointer-events: none;
    z-index: 60;
    white-space: nowrap;
    box-shadow: 0 5px 0 rgba(0,0,0,0.08);
    animation: bubblePop 1.1s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    text-align: center;
}
.bubble-letter {
    font-size: 30px; font-weight: 900; display: block; line-height: 1.15;
}
.bubble-pronun {
    font-size: 13px; font-weight: 700; display: block; color: #666; line-height: 1.2;
    font-style: italic;
}
.speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -13px; left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: inherit;
}
@keyframes bubblePop {
    0%   { transform: scale(0);                     opacity: 0; }
    20%  { transform: scale(1.2);                   opacity: 1; }
    70%  { transform: scale(1) translateY(-20px);   opacity: 1; }
    100% { transform: scale(0.8) translateY(-70px); opacity: 0; }
}

/* Touch ripple indicator per finger */
.touch-ripple {
    position: absolute;
    pointer-events: none;
    z-index: 8;
    border-radius: 50%;
    width: 30px; height: 30px;
    margin-left: -15px; margin-top: -15px;
    border: 3px solid rgba(255,255,255,0.7);
    animation: rippleOut 0.4s ease-out forwards;
}
@keyframes rippleOut {
    0%   { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen" class="screen">
    <h1>SKY POP! 🎈</h1>
    <div class="modes">
        <button class="m-btn active" onclick="setMode('english',this)">🔤 ABC English</button>
        <button class="m-btn"        onclick="setMode('malayalam',this)">🌸 മലയാളം</button>
    </div>
    <div id="subModes">
        <button class="s-btn active" onclick="setSubMode('both',this)">🌟 All</button>
        <button class="s-btn"        onclick="setSubMode('vowels',this)">🔵 Vowels (സ്വരം)</button>
        <button class="s-btn"        onclick="setSubMode('consonants',this)">🟣 Consonants (വ്യഞ്ജനം)</button>
    </div>
    <button class="btn" onclick="initGame()">▶ START!</button>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameOverScreen" class="screen" style="display:none">
    <h1>🌟 GREAT JOB! 🌟</h1>
    <p id="finalScoreMsg" style="font-size:38px;color:#333;font-weight:900;margin-bottom:20px;"></p>
    <button class="btn" onclick="location.reload()">🔄 PLAY AGAIN</button>
</div>

<!-- CLOUDS -->
<div class="cloud" style="width:160px;height:55px;top:8%;animation-duration:28s;"></div>
<div class="cloud" style="width:220px;height:75px;top:32%;animation-duration:42s;animation-delay:-7s;"></div>
<div class="cloud" style="width:130px;height:45px;top:62%;animation-duration:32s;animation-delay:-18s;"></div>
<div class="cloud" style="width:180px;height:60px;top:80%;animation-duration:37s;animation-delay:-3s;"></div>

<!-- HUD -->
<div class="ui-top">
    <div class="stat-item">
        <div class="stat-label">POPS</div>
        <div id="scoreDisplay" class="stat-value">0</div>
    </div>
    <div class="stat-item">
        <div class="stat-label">TIME</div>
        <div id="timerDisplay" class="stat-value">60</div>
    </div>
</div>

<!-- FLOATING TOOLBAR PILL -->
<div id="toolbar">
    <button id="backBtn" onclick="goBack()" title="Back to Menu">&#8592;</button>
    <div class="tb-divider"></div>
    <div class="toolbar-label">SPEED</div>
    <div class="slider-wrap">
        <span class="speed-emoji">🚀</span>
        <input type="range" id="speedSlider" min="1" max="5" value="2" step="1" oninput="updateSpeed(this.value)">
        <span class="speed-emoji">🐢</span>
    </div>
    <div id="speedBadge">x2</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreDisplay');
const timerEl = document.getElementById('timerDisplay');

const TOOLBAR_W = 150;

let width, height;
let score = 0, timeLeft = 60;
let gameActive = false;
let currentMode    = 'english';
let currentSubMode = 'both';
let balloons  = [];
let particles = [];
let speedMultiplier = 2;

// Per-touch trails keyed by touch identifier
const touchTrails = new Map(); // id -> [{x,y}, ...]

// ── Letter data ───────────────────────────────────────────────────
const english = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(c => ({ ch: c, pr: null }));

const mlVowels = [
    { ch:"അ", pr:"a" },  { ch:"ആ", pr:"aa" }, { ch:"ഇ", pr:"i" },
    { ch:"ഈ", pr:"ee" }, { ch:"ഉ", pr:"u" },  { ch:"ഊ", pr:"oo" },
    { ch:"ഋ", pr:"ri" }, { ch:"എ", pr:"e" },  { ch:"ഏ", pr:"ae" },
    { ch:"ഐ", pr:"ai" }, { ch:"ഒ", pr:"o" },  { ch:"ഓ", pr:"oh" },
    { ch:"ഔ", pr:"au" },
];

const mlConsonants = [
    { ch:"ക",  pr:"ka"   }, { ch:"ഖ",  pr:"kha"  }, { ch:"ഗ",  pr:"ga"   },
    { ch:"ഘ",  pr:"gha"  }, { ch:"ങ",  pr:"nga"  }, { ch:"ച",  pr:"cha"  },
    { ch:"ഛ",  pr:"chha" }, { ch:"ജ",  pr:"ja"   }, { ch:"ഝ",  pr:"jha"  },
    { ch:"ഞ",  pr:"nya"  }, { ch:"ട",  pr:"ta"   }, { ch:"ഠ",  pr:"tha"  },
    { ch:"ഡ",  pr:"da"   }, { ch:"ഢ",  pr:"dha"  }, { ch:"ണ",  pr:"na"   },
    { ch:"ത",  pr:"tha"  }, { ch:"ഥ",  pr:"thha" }, { ch:"ദ",  pr:"dha"  },
    { ch:"ധ",  pr:"dhha" }, { ch:"ന",  pr:"na"   }, { ch:"പ",  pr:"pa"   },
    { ch:"ഫ",  pr:"pha"  }, { ch:"ബ",  pr:"ba"   }, { ch:"ഭ",  pr:"bha"  },
    { ch:"മ",  pr:"ma"   }, { ch:"യ",  pr:"ya"   }, { ch:"ര",  pr:"ra"   },
    { ch:"റ",  pr:"rra"  }, { ch:"ല",  pr:"la"   }, { ch:"ള",  pr:"lla"  },
    { ch:"ഴ",  pr:"zha"  }, { ch:"വ",  pr:"va"   }, { ch:"ശ",  pr:"sha"  },
    { ch:"ഷ",  pr:"shha" }, { ch:"സ",  pr:"sa"   }, { ch:"ഹ",  pr:"ha"   },
];

const vowelSet    = new Set(mlVowels.map(v => v.ch));
const kidColors   = ['#FF007F','#00C6FF','#FFEF00','#00FF88','#FF9100','#9D00FF','#FF4D4D'];
const vowelColors = ['#00C6FF','#4facff','#00E5FF','#38b2ff'];
const consColors  = ['#FF007F','#FF9100','#9D00FF','#FF4D4D'];

// ── Audio feedback (no background music — pure pop/boing sounds) ──
const AC = new (window.AudioContext || window.webkitAudioContext)();

// A bright, cheerful "boing" pop — two layered oscillators + noise burst
function playPop(freq = 440, happy = true) {
    if (!AC) return;
    const now = AC.currentTime;

    // --- Pitched "boing" tone ---
    const osc  = AC.createOscillator();
    const gain = AC.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * 1.5, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.6, now + 0.22);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    osc.connect(gain); gain.connect(AC.destination);
    osc.start(now); osc.stop(now + 0.3);

    // --- Upper harmonic sparkle ---
    const osc2  = AC.createOscillator();
    const gain2 = AC.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 3.2, now);
    osc2.frequency.exponentialRampToValueAtTime(freq * 1.8, now + 0.15);
    gain2.gain.setValueAtTime(0.12, now);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc2.connect(gain2); gain2.connect(AC.destination);
    osc2.start(now); osc2.stop(now + 0.2);

    // --- Noise burst (satisfying "puff") ---
    const bufLen = AC.sampleRate * 0.06;
    const buf    = AC.createBuffer(1, bufLen, AC.sampleRate);
    const data   = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen);
    const noise   = AC.createBufferSource();
    const nGain   = AC.createGain();
    const nFilter = AC.createBiquadFilter();
    noise.buffer  = buf;
    nFilter.type  = 'bandpass';
    nFilter.frequency.value = happy ? 800 : 300;
    nFilter.Q.value = 1.5;
    nGain.gain.setValueAtTime(0.25, now);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(AC.destination);
    noise.start(now); noise.stop(now + 0.08);
}

// A fun sparkly jingle for gifts 🎁
function playGiftSound() {
    const notes = [523, 659, 784, 1047]; // C5 E5 G5 C6
    notes.forEach((freq, i) => {
        setTimeout(() => playPop(freq, true), i * 80);
    });
}

// Soft "whoosh" for back button
function playBackSound() {
    if (!AC) return;
    const now = AC.currentTime;
    const osc = AC.createOscillator();
    const g   = AC.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.25);
    g.gain.setValueAtTime(0.15, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(g); g.connect(AC.destination);
    osc.start(now); osc.stop(now + 0.28);
}



// ── Resize ────────────────────────────────────────────────────────
function resize() {
    width  = window.innerWidth - TOOLBAR_W;
    height = window.innerHeight;
    canvas.width  = width;
    canvas.height = height;
    canvas.style.width  = width + 'px';
    canvas.style.height = height + 'px';
}
window.addEventListener('resize', resize);
resize();

// ── Mode selectors ────────────────────────────────────────────────
function setMode(m, btn) {
    currentMode = m;
    document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('subModes').classList.toggle('show', m === 'malayalam');
}

function setSubMode(s, btn) {
    currentSubMode = s;
    document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function updateSpeed(val) {
    speedMultiplier = parseInt(val);
    document.getElementById('speedBadge').innerText = 'x' + val;
}

function goBack() {
    AC.resume().then(() => {
        playBackSound();
        setTimeout(() => { location.href = '../index.html'; }, 280);
    });
}

// Global back — works the same way as other games in the suite
const globalBack = document.getElementById('global-back');
if (globalBack) {
    globalBack.addEventListener('click', function() {
        location.href = '../index.html';
    });
    globalBack.addEventListener('touchstart', function(e) {
        e.preventDefault();
        location.href = '../index.html';
    }, { passive: false });
}

// ── Letter pool ───────────────────────────────────────────────────
function getPool() {
    if (currentMode === 'english') return english;
    if (currentSubMode === 'vowels')     return mlVowels;
    if (currentSubMode === 'consonants') return mlConsonants;
    return [...mlVowels, ...mlConsonants];
}

// ── Balloon ───────────────────────────────────────────────────────
class Balloon {
    constructor() {
        this.radius = 46 + Math.random() * 16;
        this.x  = Math.random() * (width - 120) + 60;
        this.y  = height + 110;
        this.vx = (Math.random() - 0.5) * 1.4;
        const base = 1.1 + Math.random() * 1.4;
        this.vy = -(base * (speedMultiplier * 0.65 + 0.2));
        const pool = getPool();
        this.obj    = pool[Math.floor(Math.random() * pool.length)];
        this.isBomb = Math.random() < 0.1;
        this.popped = false;
        this.wobble = Math.random() * 10;

        if (this.isBomb) {
            this.color = '#FFD700';
        } else if (currentMode === 'malayalam') {
            const isV    = vowelSet.has(this.obj.ch);
            const palette = isV ? vowelColors : consColors;
            this.color   = palette[Math.floor(Math.random() * palette.length)];
        } else {
            this.color = kidColors[Math.floor(Math.random() * kidColors.length)];
        }
    }
    update() {
        this.y += this.vy;
        this.x += this.vx + Math.sin(this.wobble) * 0.45;
        this.wobble += 0.05;
        return this.y < -160 || this.popped;
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.shadowColor   = 'rgba(0,0,0,0.14)';
        ctx.shadowBlur    = 14;
        ctx.shadowOffsetY = 7;

        ctx.beginPath();
        ctx.fillStyle   = this.color;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth   = 5;
        ctx.ellipse(0, 0, this.radius * 0.88, this.radius, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.shadowColor = 'transparent';

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.ellipse(-this.radius*0.27, -this.radius*0.3, 8, 13, Math.PI/4, 0, Math.PI*2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.arc(0, this.radius + 3, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(0, this.radius + 8);
        ctx.lineTo(0, this.radius + 24);
        ctx.stroke();

        ctx.fillStyle    = 'white';
        const fs         = this.radius * (currentMode === 'malayalam' ? 0.68 : 0.78);
        ctx.font         = `bold ${fs}px 'Comic Sans MS', cursive`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.isBomb ? '🎁' : this.obj.ch, 0, 0);
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.vx = (Math.random()-0.5)*16;
        this.vy = (Math.random()-0.5)*16;
        this.alpha = 1;
        this.r = 4 + Math.random()*4;
    }
    update() { this.x+=this.vx; this.y+=this.vy; this.vy+=0.15; this.alpha-=0.022; }
    draw() {
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    }
}

// ── DOM pop effects ───────────────────────────────────────────────
function spawnFloatingText(x, y, text, color) {
    const el = document.createElement('div');
    el.className   = 'floating-letter';
    el.style.left  = x + 'px';
    el.style.top   = y + 'px';
    el.style.color = color;
    el.innerText   = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 750);
}

function spawnRipple(x, y, color) {
    const el = document.createElement('div');
    el.className          = 'touch-ripple';
    el.style.left         = x + 'px';
    el.style.top          = y + 'px';
    el.style.borderColor  = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 400);
}

function spawnSpeechBubble(x, y, obj, color, mode) {
    const el = document.createElement('div');
    el.className         = 'speech-bubble';
    el.style.borderColor = color;
    el.style.color       = color;
    const bx = Math.min(x - 38, width - 150);
    el.style.left = Math.max(5, bx) + 'px';
    el.style.top  = (y - 100) + 'px';

    const ls = document.createElement('span');
    ls.className = 'bubble-letter';
    ls.innerText = obj.ch;
    el.appendChild(ls);

    if (mode === 'malayalam' && obj.pr) {
        const ps = document.createElement('span');
        ps.className = 'bubble-pronun';
        ps.innerText = '/ ' + obj.pr + ' /';
        el.appendChild(ps);
    }

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1150);
}

// ── Pop logic for a single point ─────────────────────────────────
function popAt(x, y) {
    balloons.forEach(b => {
        if (!b.popped && Math.hypot(b.x - x, b.y - y) < b.radius) {
            b.popped = true;

            if (b.isBomb) {
                AC.resume();
                playGiftSound();
                spawnFloatingText(b.x, b.y, "🎁 WOW!", "#FF9100");
            } else {
                score++;
                scoreEl.innerText = score;
                // Pitch rises slightly with score for escalating joy
                const pitchBase = 300 + (score % 12) * 40;
                AC.resume().then(() => playPop(pitchBase, true));
                spawnFloatingText(b.x, b.y, b.obj.ch, b.color);
                spawnSpeechBubble(b.x, b.y - 20, b.obj, b.color, currentMode);
            }

            spawnRipple(b.x, b.y, b.color);
            for (let i = 0; i < 18; i++) particles.push(new Particle(b.x, b.y, b.color));
        }
    });
}

// ── Game init ─────────────────────────────────────────────────────
function initGame() {
    AC.resume(); // unlock audio on first user gesture
    document.getElementById('startScreen').style.display = 'none';
    gameActive = true;

    setInterval(() => {
        if (!gameActive) return;
        balloons.push(new Balloon());
        if (Math.random() > 0.42) balloons.push(new Balloon());
    }, 360);

    setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        timerEl.innerText = timeLeft;
        if (timeLeft <= 0) endGame();
    }, 1000);

    loop();
}

function endGame() {
    gameActive = false;
    document.getElementById('gameOverScreen').style.display = 'flex';
    document.getElementById('finalScoreMsg').innerText = score + " Pops! 🎉";
}

// ── Render loop ───────────────────────────────────────────────────
function loop() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, width, height);

    // Draw all active touch trails
    touchTrails.forEach((trail, id) => {
        if (trail.length < 2) return;
        const colorOffset = id % kidColors.length;
        for (let i = 1; i < trail.length; i++) {
            ctx.beginPath();
            ctx.strokeStyle = kidColors[(i + colorOffset) % kidColors.length];
            ctx.lineWidth   = 14 * (i / trail.length);
            ctx.lineCap     = 'round';
            ctx.moveTo(trail[i-1].x, trail[i-1].y);
            ctx.lineTo(trail[i].x,   trail[i].y);
            ctx.stroke();
        }
    });

    balloons  = balloons.filter(b  => { const d = b.update(); b.draw(); return !d; });
    particles = particles.filter(p => { p.update(); p.draw(); return p.alpha > 0; });

    requestAnimationFrame(loop);
}

// ── Multi-touch input ─────────────────────────────────────────────

// Mouse (single pointer fallback)
canvas.addEventListener('mousemove', e => {
    if (!gameActive) return;
    const id = 'mouse';
    if (!touchTrails.has(id)) touchTrails.set(id, []);
    const trail = touchTrails.get(id);
    trail.push({ x: e.clientX, y: e.clientY });
    if (trail.length > 14) trail.shift();
    popAt(e.clientX, e.clientY);
});
canvas.addEventListener('mouseleave', () => touchTrails.delete('mouse'));

// Multi-touch on canvas — handle ALL simultaneous fingers
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        touchTrails.set(t.identifier, [{ x: t.clientX, y: t.clientY }]);
        popAt(t.clientX, t.clientY);
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!gameActive) return;
    for (const t of e.changedTouches) {
        if (!touchTrails.has(t.identifier)) touchTrails.set(t.identifier, []);
        const trail = touchTrails.get(t.identifier);
        trail.push({ x: t.clientX, y: t.clientY });
        if (trail.length > 14) trail.shift();
        popAt(t.clientX, t.clientY);
    }
}, { passive: false });

canvas.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
        touchTrails.delete(t.identifier);
    }
});

canvas.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) {
        touchTrails.delete(t.identifier);
    }
});
</script>
