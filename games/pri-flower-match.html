<!DOCTYPE html>
<!--
================================================================================
  Flower Matching - Pangappara Blueroom
================================================================================
  Memory pairs, one board per panel, with each panel's touches its own.

  Face DOWN here, unlike Animals and Their Young which stays face up: there
  the lesson is a relationship, here the flowers are already known and what
  is trained is holding a position in mind.

  Laid out on a fixed 4-column grid rather than wrapping, because wrapping is
  what overflowed the panel before.

  Three panels. Each child runs their own rounds and nobody waits for anyone
  else to finish; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flower Matching</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fdf7fb,#f8ecf3 70%,#f0dfea);user-select:none;touch-action:none}
  .row{display:flex;gap:.7vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(11px,2vh,22px);color:#8d2f52;text-align:center;flex-shrink:0}
  /* Cards are square and sized from the PANEL, never the viewport: a panel is
     a third of the wall at three players, and viewport units overflow it. */
  .tile{flex:0 0 auto;aspect-ratio:1;width:clamp(40px,8.4vh,88px);
    border-radius:14px;background:#fff;border:3px solid #e6cddc;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 10px rgba(40,50,70,.13);
    display:grid;place-items:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(18px,3.6vh,42px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(7px,1.2vh,12px);color:#26313b;line-height:1.25}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.22;pointer-events:none}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .big{width:clamp(56px,13vh,132px)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5vw;width:100%;
    flex:1;min-height:0;align-content:center}
  .tile.card{width:100%;height:auto}
  .back{position:absolute;inset:0;display:grid;place-items:center;z-index:3;
    background:linear-gradient(135deg,#f6d9e4,#ead0f0);font-size:clamp(16px,3.4vh,38px)}
  .tile:not(.down) .back{display:none}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/flower-data.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var REJECTED=['jamanti','lotus'];
var FLOWERS=Object.keys(FLOWER_DATA.all).filter(function(k){return REJECTED.indexOf(k)===-1;})
  .map(function(k){return FLOWER_DATA.all[k];});
var PAIRS=4;

TRIUP.start({
  title:{en:'Flower Matching',ml:'\u0d2a\u0d42\u0d15\u0d4d\u0d15\u0d7e \u0d1c\u0d4b\u0d21\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d15'},
  hint:{en:'Find the matching flowers',ml:'\u0d12\u0d30\u0d47 \u0d2a\u0d42\u0d15\u0d4d\u0d15\u0d7e \u0d15\u0d23\u0d4d\u0d1f\u0d46\u0d24\u0d4d\u0d24\u0d42'},
  build:function(p, body, api){
    var st=api.state(p);
    var grid=document.createElement('div'); grid.className='grid';
    body.appendChild(grid);

    function deal(){
      st.first=null; st.joined=0; st.busy=false;
      api.pill(p,'pairs','0 / '+PAIRS);
      grid.innerHTML='';
      var chosen=sh(FLOWERS).slice(0,PAIRS);
      sh(chosen.concat(chosen)).forEach(function(f){
        var t=document.createElement('div'); t.className='tile card down';
        t.innerHTML='<img src="'+f.art.img+'" alt=""><div class="cap">'+f.label.ml+'</div>'+
                    '<div class="back">'+String.fromCodePoint(0x1F33F)+'</div>';
        WALL.bindTouch(t,function(){ flip(t,f); });
        grid.appendChild(t);
      });
    }
    function flip(t,f){
      if(st.busy||!t.classList.contains('down'))return;
      t.classList.remove('down'); WALL.sfx.tap();
      if(p===0&&WALL.voiceOn()) WALL.say(f.label.ml);
      if(!st.first){ st.first={t:t,f:f}; return; }
      if(st.first.t===t) return;
      if(st.first.f.id===f.id){
        t.classList.add('ok'); st.first.t.classList.add('ok');
        st.first=null; st.joined++;
        api.pill(p,'pairs',st.joined+' / '+PAIRS);
        WALL.tone(440+st.joined*60,.16,'sine',.12);
        if(st.joined===PAIRS) api.win(p,{
          title:{en:'Every flower found its pair!',ml:'\u0d0e\u0d32\u0d4d\u0d32\u0d3e \u0d2a\u0d42\u0d15\u0d4d\u0d15\u0d33\u0d41\u0d02 \u0d1c\u0d4b\u0d21\u0d3f\u0d2f\u0d3e\u0d2f\u0d3f!'},onAgain:deal});
      } else {
        st.busy=true; var a=st.first.t; st.first=null; WALL.sfx.nudge();
        setTimeout(function(){ a.classList.add('down'); t.classList.add('down'); st.busy=false; },900);
      }
    }
    deal();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
