<!DOCTYPE html>
<!--
════════════════════════════════════════════════════════════════════════════
  ANIMALS AND THEIR YOUNG — Pangappara Blueroom, Pre-primary
════════════════════════════════════════════════════════════════════════════
  Four mothers along the top, their four young shuffled below. Tap a mother,
  then tap her young. A joined pair lights and locks.

  PAIRING, which nothing else in the set does. Every other activity asks for
  one answer out of several; this asks the child to hold a relationship —
  this one belongs WITH that one — and it is a relationship in both
  directions, so either card can be tapped first.

  Cards stay face up on purpose. Turning them over would make it a memory
  game, and memory is not what is being taught here; knowing that a calf
  goes with a cow is.

  ART: kid-goat and duckling were rejected at asset review, so goat and duck
  are out of the pool. Six pairs remain, four per round.
════════════════════════════════════════════════════════════════════════════
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Animals and Their Young</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    user-select:none;touch-action:none}

  #ask{position:absolute;top:0;left:0;right:0;height:18%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.4vh;pointer-events:none;text-align:center;padding:0 4vw}
  #askEn{font-weight:800;font-size:clamp(15px,2.8vw,28px);color:#2a3a46}
  #askMl{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(17px,3.2vw,32px);color:#1d6b63}
  #tally{font-weight:800;font-size:clamp(11px,1.6vw,17px);color:#6b8089;letter-spacing:.05em}

  .row{position:absolute;left:0;right:0;display:flex;gap:1.4vw;
    justify-content:center;align-items:center;padding:0 2.5vw}
  #mums{top:20%;height:37%}
  #kids{top:59%;height:37%}

  /* Square on review: a tall rectangle cropped the animal photos badly, since
     object-fit:cover trims the sides of a landscape picture. A square card
     keeps the animal recognisable, which is the whole point of the round. */
  .card{position:relative;flex:0 0 auto;aspect-ratio:1;
    height:min(100%,22vw);width:auto;
    border-radius:18px;overflow:hidden;background:#fff;border:5px solid #cfdde2;
    cursor:pointer;box-shadow:0 5px 14px rgba(30,60,70,.16);
    transition:transform .15s,border-color .15s,box-shadow .15s,opacity .3s}
  .card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .card .cap{position:absolute;left:0;right:0;bottom:0;padding:3px 5px 4px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.8) 72%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(9px,1.5vw,16px);color:#22343d;line-height:1.35}
  .card:active{transform:scale(.96)}
  .card.picked{border-color:#f0872f;box-shadow:0 0 0 5px rgba(240,135,47,.3);transform:translateY(-6px)}
  .card.joined{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3);
    cursor:default;animation:join .42s cubic-bezier(.3,1.5,.5,1)}
  @keyframes join{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:none}}
  .card.wrong{animation:wob .44s ease-in-out}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
                 60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  #done{position:absolute;inset:0;z-index:90;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:2vh;padding:6vw;text-align:center;
    background:rgba(255,255,255,.95);backdrop-filter:blur(6px)}
  #done.show{display:flex}
  #done h2{font-size:clamp(22px,4.6vw,44px);color:#2a9d6b;font-weight:800}
  #done .ml{font-family:'Noto Sans Malayalam',sans-serif;font-size:clamp(14px,2.6vw,24px);color:#4a6a62}
  #again{border:0;border-radius:16px;background:#1d6b63;color:#fff;font-weight:800;
    font-size:clamp(14px,2.4vw,22px);padding:13px 38px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="ask">
  <div id="askEn">Match each animal to its baby</div>
  <div id="askMl">ഓരോ മൃഗത്തെയും അതിന്റെ കുഞ്ഞിനോട് ചേർക്കൂ</div>
  <div id="tally"></div>
</div>
<div class="row" id="mums"></div>
<div class="row" id="kids"></div>

<div id="done">
  <h2>Every baby found its mother!</h2>
  <div class="ml">എല്ലാ കുഞ്ഞുങ്ങളും അമ്മയെ കണ്ടെത്തി!</div>
  <button id="again">↺ വീണ്ടും</button>
</div>

<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/animal-data.js"></script>
<script src="../js/guide.js"></script>

<script>
WALL_BACKDROP.set('meadow');

/* kid-goat and duckling were rejected at asset review, so goat and duck
   leave the pool rather than appear with a stand-in photograph. */
var REJECTED = ['goat', 'duck'];
var PAIRS = Object.keys(ANIMALS.young)
  .filter(function (k) { return REJECTED.indexOf(k) === -1 && ANIMALS.all[k]; })
  .map(function (k) { return { id: k, mum: ANIMALS.all[k], kid: ANIMALS.young[k] }; });

var PER = 4;
var mumsEl = document.getElementById('mums');
var kidsEl = document.getElementById('kids');
var round = [], picked = null, joined = 0;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

WALL.init();
WALL.toolbar({
  lang: true, voice: true, size: true, height: true,
  reset: function () { start(); },
  heightTarget: '#kids'
});

function makeCard(item, side, id) {
  var d = document.createElement('div');
  d.className = 'card';
  d.dataset.pair = id;
  d.dataset.side = side;
  d.innerHTML = '<img src="' + item.img + '" alt="">' +
                '<div class="cap">' + item.ml + '</div>';
  WALL.bindTouch(d, function () { tap(d, item); });
  return d;
}

function deal() {
  picked = null; joined = 0;
  round = shuffle(PAIRS).slice(0, PER);
  mumsEl.innerHTML = ''; kidsEl.innerHTML = '';
  shuffle(round).forEach(function (p) { mumsEl.appendChild(makeCard(p.mum, 'mum', p.id)); });
  shuffle(round).forEach(function (p) { kidsEl.appendChild(makeCard(p.kid, 'kid', p.id)); });
  tally();
}

function tally() {
  document.getElementById('tally').textContent = joined + ' / ' + PER;
}

function tap(el, item) {
  if (el.classList.contains('joined')) return;
  if (WALL.voiceOn()) WALL.say(item.ml);

  if (!picked) { picked = el; el.classList.add('picked'); WALL.sfx.tap(); return; }

  /* Tapping the same card again, or another on the same row, just moves the
     selection. Only a card from the OTHER row can complete a pair. */
  if (picked === el || picked.dataset.side === el.dataset.side) {
    picked.classList.remove('picked');
    picked = el; el.classList.add('picked'); WALL.sfx.tap();
    return;
  }

  if (picked.dataset.pair === el.dataset.pair) {
    picked.classList.remove('picked');
    picked.classList.add('joined');
    el.classList.add('joined');
    picked = null;
    joined++; tally();
    WALL.tone(440 + joined * 60, 0.16, 'sine', 0.12);
    WALL.burstAt(el);
    if (joined === PER) finish();
  } else {
    /* never punish: both cards shake, the selection clears, try again */
    var a = picked;
    a.classList.remove('picked');
    a.classList.add('wrong'); el.classList.add('wrong');
    setTimeout(function () { a.classList.remove('wrong'); el.classList.remove('wrong'); }, 460);
    picked = null;
    WALL.sfx.nudge();
  }
}

function finish() {
  if (window.GUIDE) GUIDE.cheer({ en:'Wonderful!', ml:'അതിമനോഹരം!' });
  setTimeout(function () {
    document.getElementById('done').classList.add('show');
    WALL.celebrate();
    if (WALL.voiceOn()) WALL.say('എല്ലാ കുഞ്ഞുങ്ങളും അമ്മയെ കണ്ടെത്തി!');
  }, 700);
}

function start() {
  document.getElementById('done').classList.remove('show');
  if (window.GUIDE) { GUIDE.mount(); GUIDE.say({ en:'Find each baby animal!', ml:'ഓരോ കുഞ്ഞിനെയും കണ്ടെത്തൂ!' }); }
  deal();
}

WALL.bindTouch(document.getElementById('again'), start);
start();
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
