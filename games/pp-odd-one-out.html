<!DOCTYPE html>
<!--
════════════════════════════════════════════════════════════════════════════
  ODD ONE OUT — Pangappara Blueroom, Pre-primary
════════════════════════════════════════════════════════════════════════════
  Four animals. Three belong together and one does not. Tap the stranger.

  REASONING BY EXCLUSION, which nothing else here asks for. Every other
  activity names the thing wanted and the child finds it. This one names
  nothing: the child has to work out what the three have in common before
  they can see which is the fourth. That is a harder and more general
  skill than recognition, and it is the one the September set had no
  room for at all.

  Two groupings, alternating, so the rule being applied changes:
    · three farm animals and one wild one
    · three wild animals and one farm one
  Alternating matters. If the answer were always the wild one a child
  learns "pick the lion", not "find the stranger".

  After a correct tap കുട്ടു says WHY, which is where the learning is:
  seeing the odd one is the question, naming the rule is the answer.

  ART: turtle was rejected at asset review and is excluded.
════════════════════════════════════════════════════════════════════════════
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Odd One Out</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    user-select:none;touch-action:none}

  #ask{position:absolute;top:0;left:0;right:0;height:22%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.4vh;pointer-events:none;text-align:center;padding:0 4vw}
  #askEn{font-weight:800;font-size:clamp(16px,3vw,30px);color:#3a2f46}
  #askMl{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(18px,3.4vw,34px);color:#7a3f8f}
  #tally{font-weight:800;font-size:clamp(11px,1.6vw,17px);color:#8a7d95;letter-spacing:.05em}

  #board{position:absolute;top:24%;left:0;right:0;bottom:3vh;
    display:flex;gap:1.6vw;justify-content:center;align-items:center;padding:0 2.5vw}
  .card{position:relative;flex:0 0 auto;aspect-ratio:1;
    height:min(100%,22vw);width:auto;
    border-radius:20px;overflow:hidden;background:#fff;border:5px solid #d8cfe2;
    cursor:pointer;box-shadow:0 6px 16px rgba(60,40,70,.16);
    transition:transform .15s,border-color .15s,box-shadow .15s}
  .card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .card .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 6px 5px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.8) 72%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(10px,1.6vw,18px);color:#2e2438;line-height:1.35}
  .card:active{transform:scale(.97)}
  .card.right{border-color:#3fae7c;box-shadow:0 0 0 6px rgba(63,174,124,.32);
    animation:yes .45s cubic-bezier(.3,1.5,.5,1)}
  @keyframes yes{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:none}}
  .card.dim{opacity:.4}
  .card.wrong{animation:wob .44s ease-in-out;border-color:#e0a83c}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
                 60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  #why{position:absolute;left:0;right:0;bottom:3vh;z-index:40;display:none;
    justify-content:center;pointer-events:none}
  #why.show{display:flex}
  #why div{background:rgba(255,255,255,.96);border:4px solid #3fae7c;border-radius:18px;
    padding:10px 26px;font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(13px,2.4vw,24px);color:#1f6b4a;box-shadow:0 8px 22px rgba(30,80,60,.2)}

  #done{position:absolute;inset:0;z-index:90;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:2vh;padding:6vw;text-align:center;
    background:rgba(255,255,255,.95);backdrop-filter:blur(6px)}
  #done.show{display:flex}
  #done h2{font-size:clamp(22px,4.6vw,44px);color:#7a3f8f;font-weight:800}
  #done .ml{font-family:'Noto Sans Malayalam',sans-serif;font-size:clamp(14px,2.6vw,24px);color:#5a4a64}
  #again{border:0;border-radius:16px;background:#7a3f8f;color:#fff;font-weight:800;
    font-size:clamp(14px,2.4vw,22px);padding:13px 38px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="ask">
  <div id="askEn">Which one does not belong?</div>
  <div id="askMl">വ്യത്യസ്തമായത് ഏത്?</div>
  <div id="tally"></div>
</div>
<div id="board"></div>
<div id="why"><div id="whyText"></div></div>

<div id="done">
  <h2>You spotted them all!</h2>
  <div class="ml">എല്ലാം കണ്ടെത്തി!</div>
  <button id="again">↺ വീണ്ടും</button>
</div>

<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/animal-data.js"></script>
<script src="../js/guide.js"></script>

<script>
WALL_BACKDROP.set('sky');

var REJECTED = ['turtle'];
function pool(list) {
  return list.filter(function (id) {
    return REJECTED.indexOf(id) === -1 && ANIMALS.all[id] && ANIMALS.all[id].img;
  });
}
var FARM = pool(ANIMALS.DOMESTIC);
var WILD = pool(ANIMALS.WILD);

var ROUNDS = 6;
var board = document.getElementById('board');
var n = 0, locked = false;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

WALL.init();
WALL.toolbar({
  lang: true, voice: true, size: true, height: true,
  reset: function () { start(); },
  heightTarget: '#board'
});

function deal() {
  locked = false;
  document.getElementById('why').classList.remove('show');
  board.innerHTML = '';
  if (n >= ROUNDS) return finish();

  /* Alternate which group supplies the stranger, so the child cannot win by
     always choosing the wild animal. */
  var oddIsWild = (n % 2 === 0);
  var many = oddIsWild ? FARM : WILD;
  var few  = oddIsWild ? WILD : FARM;

  var three = shuffle(many).slice(0, 3);
  var odd   = shuffle(few)[0];
  var why = oddIsWild
    ? { en: 'The others live on the farm', ml: 'മറ്റുള്ളവ വീട്ടുമൃഗങ്ങളാണ്' }
    : { en: 'The others live in the forest', ml: 'മറ്റുള്ളവ കാട്ടുമൃഗങ്ങളാണ്' };

  shuffle(three.concat([odd])).forEach(function (id) {
    var a = ANIMALS.all[id];
    var d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<img src="' + a.img + '" alt=""><div class="cap">' + a.ml + '</div>';
    WALL.bindTouch(d, function () { tap(d, id === odd, a, why); });
    board.appendChild(d);
  });

  document.getElementById('tally').textContent = (n + 1) + ' / ' + ROUNDS;
  if (window.GUIDE) GUIDE.say({ en:'Which one does not belong?', ml:'വ്യത്യസ്തമായത് ഏത്?' });
}

function tap(el, correct, animal, why) {
  if (locked) return;
  if (!correct) {
    /* never punish */
    el.classList.add('wrong');
    setTimeout(function () { el.classList.remove('wrong'); }, 460);
    WALL.sfx.nudge();
    return;
  }
  locked = true;
  el.classList.add('right');
  board.querySelectorAll('.card').forEach(function (c) { if (c !== el) c.classList.add('dim'); });
  WALL.sfx.correct();
  WALL.burstAt(el);

  /* The reason is the lesson. Seeing the odd one is only the question. */
  document.getElementById('whyText').textContent = WALL.t(why);
  document.getElementById('why').classList.add('show');
  if (WALL.voiceOn()) WALL.say(why.ml);
  if (window.GUIDE) GUIDE.cheer({ en:'Yes! Well done!', ml:'കൊള്ളാം! നന്നായി!' });

  n++;
  setTimeout(deal, 2000);
}

function finish() {
  document.getElementById('done').classList.add('show');
  WALL.celebrate();
  if (WALL.voiceOn()) WALL.say('എല്ലാം കണ്ടെത്തി!');
}

function start() {
  document.getElementById('done').classList.remove('show');
  n = 0;
  if (window.GUIDE) { GUIDE.mount(); GUIDE.say({ en:'Find the one that is different!', ml:'വ്യത്യസ്തമായത് കണ്ടെത്തൂ!' }); }
  deal();
}

WALL.bindTouch(document.getElementById('again'), start);
start();
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
