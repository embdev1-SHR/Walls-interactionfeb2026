<!DOCTYPE html>
<!--
================================================================================
  Daily Living - Pangappara Blueroom, Secondary
================================================================================
  Content from the tuition app's daily-living set, with a different shape as
  asked: this is SEQUENCING, not the card board it uses there.

  Washing hands is five steps in one order, and doing them out of order does
  not wash your hands. That is the lesson, and only an ordering mechanic can
  carry it - a four-choice quiz about soap cannot.

  Three panels. Each learner works independently and gets their own card in
  their own panel; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Daily Living</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fff8fb,#fdeef5 70%,#f7e0ec);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #eccfdd;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:flex;align-items:center;justify-content:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.25;pointer-events:none}
  .tile.sel{border-color:#f0872f;box-shadow:0 0 0 4px rgba(240,135,47,.3);transform:translateY(-4px)}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .wide{width:clamp(58px,12vh,120px);height:clamp(44px,9vh,92px)}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#8d2f52;text-align:center;flex-shrink:0}
  .steps{display:flex;gap:.7vw;width:100%;justify-content:center;flex-wrap:wrap}
  .slot{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px);border:3px dashed #e0bdd0;
    border-radius:14px;background:rgba(255,255,255,.6);display:flex;align-items:center;
    justify-content:center;font-weight:900;color:#a8517a;font-size:clamp(13px,2.4vh,24px);
    cursor:pointer;overflow:hidden;position:relative}
  .slot.filled{border-style:solid;border-color:#3fae7c}
  .slot img{width:100%;height:100%;object-fit:cover}
  .slot.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var W='../assets/new/images/habits/';

/* Three routines rather than one, each a real photograph of the real object.
   The previous version showed five near-identical handwashing frames and it
   was not obvious what it was even about - so each routine now opens with a
   titled picture of the thing being done, and the steps use the distinct
   item photographs rather than frames from one sequence. */
var ROUTINES=[
 { key:'wash', ml:'\u0d15\u0d48 \u0d15\u0d34\u0d41\u0d15\u0d3e\u0d02', en:'Washing hands',
   cover:W+'wash-hands.jpg',
   steps:[
    {img:W+'mug-of-water.webp', ml:'\u0d35\u0d46\u0d33\u0d4d\u0d33\u0d02 \u0d0e\u0d1f\u0d41\u0d15\u0d4d\u0d15\u0d41\u0d15'},
    {img:W+'soap.webp',         ml:'\u0d38\u0d4b\u0d2a\u0d4d\u0d2a\u0d4d \u0d07\u0d1f\u0d41\u0d15'},
    {img:W+'handwash-3.webp',   ml:'\u0d28\u0d28\u0d4d\u0d28\u0d3e\u0d2f\u0d3f \u0d24\u0d47\u0d2f\u0d4d\u0d15\u0d4d\u0d15\u0d41\u0d15'},
    {img:W+'towel.webp',        ml:'\u0d24\u0d41\u0d35\u0d7c\u0d24\u0d4d\u0d24\u0d3f \u0d09\u0d23\u0d15\u0d4d\u0d15\u0d41\u0d15'}]},
 { key:'teeth', ml:'\u0d2a\u0d32\u0d4d\u0d32\u0d4d \u0d24\u0d47\u0d2f\u0d4d\u0d15\u0d4d\u0d15\u0d3e\u0d02', en:'Brushing teeth',
   cover:W+'brush.jpg',
   steps:[
    {img:W+'mug-of-water.webp', ml:'\u0d35\u0d46\u0d33\u0d4d\u0d33\u0d02 \u0d0e\u0d1f\u0d41\u0d15\u0d4d\u0d15\u0d41\u0d15'},
    {img:W+'toothbrush.webp',   ml:'\u0d2c\u0d4d\u0d30\u0d37\u0d4d \u0d0e\u0d1f\u0d41\u0d15\u0d4d\u0d15\u0d41\u0d15'},
    {img:W+'handwash-3.webp',   ml:'\u0d28\u0d28\u0d4d\u0d28\u0d3e\u0d2f\u0d3f \u0d24\u0d47\u0d2f\u0d4d\u0d15\u0d4d\u0d15\u0d41\u0d15'},
    {img:W+'towel.webp',        ml:'\u0d2e\u0d41\u0d16\u0d02 \u0d24\u0d41\u0d1f\u0d2f\u0d4d\u0d15\u0d4d\u0d15\u0d41\u0d15'}]},
 { key:'groom', ml:'\u0d35\u0d43\u0d24\u0d4d\u0d24\u0d3f\u0d2f\u0d3e\u0d15\u0d3e\u0d02', en:'Getting ready',
   cover:W+'bath.jpg',
   steps:[
    {img:W+'soap.webp',          ml:'\u0d15\u0d41\u0d33\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d15'},
    {img:W+'towel.webp',         ml:'\u0d24\u0d41\u0d35\u0d7c\u0d24\u0d4d\u0d24\u0d3f \u0d09\u0d23\u0d15\u0d4d\u0d15\u0d41\u0d15'},
    {img:W+'comb.webp',          ml:'\u0d2e\u0d41\u0d1f\u0d3f \u0d1a\u0d40\u0d15\u0d4d\u0d15\u0d41\u0d15'},
    {img:W+'nail-clippers.webp', ml:'\u0d28\u0d16\u0d02 \u0d2e\u0d41\u0d31\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d15'}]}
];

TRIUP.start({
  title:{en:'Daily Living',ml:'\u0d26\u0d48\u0d28\u0d02\u0d26\u0d3f\u0d28 \u0d1c\u0d40\u0d35\u0d3f\u0d24\u0d02'},
  hint:{en:'Put the steps in order',ml:'\u0d15\u0d4d\u0d30\u0d2e\u0d24\u0d4d\u0d24\u0d3f\u0d32\u0d3e\u0d15\u0d4d\u0d15\u0d42'},
  build:function(p, body, api){
    var st=api.state(p); st.filled=0; st.held=null;
    var cover=document.createElement('img');
    cover.style.cssText='width:clamp(54px,11vh,116px);height:clamp(54px,11vh,116px);'+
      'object-fit:cover;border-radius:14px;border:3px solid #eccfdd;flex-shrink:0';
    var lead=document.createElement('div'); lead.className='leadml';
    var slots=document.createElement('div'); slots.className='steps';
    var rack=document.createElement('div'); rack.className='row';
    body.appendChild(cover); body.appendChild(lead); body.appendChild(slots); body.appendChild(rack);

    function deal(){
      st.filled=0; st.held=null;
      st.r = ROUTINES[Math.floor(Math.random()*ROUTINES.length)];
      var WASH = st.r.steps;
      cover.src = st.r.cover;
      lead.textContent = st.r.ml;
      if (p===0 && WALL.voiceOn()) WALL.say(st.r.ml);
      api.pill(p,'step','0 / '+WASH.length);
      slots.innerHTML=''; rack.innerHTML='';
      WASH.forEach(function(_,i){
        var s=document.createElement('div'); s.className='slot'; s.dataset.i=i;
        s.textContent=(i+1);
        WALL.bindTouch(s,function(){ place(s); });
        slots.appendChild(s);
      });
      sh(WASH.map(function(w,i){return {w:w,i:i};})).forEach(function(o){
        var t=document.createElement('div'); t.className='tile sq'; t.dataset.i=o.i;
        t.innerHTML='<img src="'+o.w.img+'" alt=""><div class="cap">'+o.w.ml+'</div>';
        WALL.bindTouch(t,function(){
          if(t.classList.contains('gone'))return;
          if(st.held) st.held.classList.remove('sel');
          st.held=(st.held===t)?null:t;
          if(st.held){ st.held.classList.add('sel'); WALL.sfx.tap(); }
        });
        rack.appendChild(t);
      });
    }
    function place(s){
      if(!st.held||s.classList.contains('filled'))return;
      if(s.dataset.i===st.held.dataset.i){
        s.classList.add('filled');
        s.innerHTML=st.held.innerHTML;
        st.held.classList.add('gone'); st.held.classList.remove('sel'); st.held=null;
        st.filled++; api.pill(p,'step',st.filled+' / '+st.r.steps.length);
        WALL.tone(440+st.filled*60,.16,'sine',.12);
        if(st.filled===st.r.steps.length)
          api.win(p,{title:{en:'All done!',ml:'\u0d0e\u0d32\u0d4d\u0d32\u0d3e\u0d02 \u0d15\u0d34\u0d3f\u0d1e\u0d4d\u0d1e\u0d41!'},onAgain:deal});
      } else { s.classList.add('no'); setTimeout(function(){s.classList.remove('no');},460); WALL.sfx.nudge(); }
    }
    deal();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
