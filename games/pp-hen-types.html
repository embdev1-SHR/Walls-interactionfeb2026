<!DOCTYPE html>
<!--
================================================================================
  Kinds of Hen - Pangappara Blueroom
================================================================================
  FINE DISCRIMINATION. Every card is poultry. The child is asked for one
  particular kind, so the differences are small and within a category rather
  than between categories - harder than telling a hen from an elephant, and
  the step up from the sorting boards.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kinds of Hen</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    user-select:none;touch-action:none}

</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/animal-data.js"></script>
<script src="../js/guide.js"></script>
<script src="../js/play-kit.js"></script>
<script>
var IMG = '../assets/new/images/animals/';
var BIRDS = [
  { id:'hen', en:'Hen', ml:'\u0d15\u0d4b\u0d34\u0d3f', img:IMG+'hen.jpg' },
  { id:'colourful', en:'Colourful hen', ml:'\u0d35\u0d7c\u0d23\u0d4d\u0d23\u0d15\u0d4d\u0d15\u0d4b\u0d34\u0d3f', img:IMG+'colourful-hen.jpg' },
  { id:'rooster', en:'Rooster', ml:'\u0d2a\u0d42\u0d35\u0d7b\u0d15\u0d4b\u0d34\u0d3f', img:IMG+'rooster.jpg' },
  { id:'chick', en:'Chick', ml:'\u0d15\u0d4b\u0d34\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d1e\u0d4d\u0d1e\u0d4d', img:IMG+'chick.jpg' }
];
var ROUNDS = 6, n = 0, locked = false;
var pk = PLAYKIT.page({ accent:'#a8552b', backdrop:'meadow', onAgain:function(){ n=0; deal(); } });

function deal(){
  locked = false; pk.note(null); pk.hideFinish(); pk.board.innerHTML = '';
  if (n >= ROUNDS) return pk.finish({ en:'You know your hens!', ml:'\u0d15\u0d4b\u0d34\u0d3f\u0d15\u0d33\u0d46 \u0d28\u0d28\u0d4d\u0d28\u0d3e\u0d2f\u0d3f \u0d05\u0d31\u0d3f\u0d2f\u0d3e\u0d02!' });
  var want = PLAYKIT.shuffle(BIRDS)[0];
  pk.ask({ en:'Find the ' + want.en, ml:want.ml + ' \u0d15\u0d23\u0d4d\u0d1f\u0d46\u0d24\u0d4d\u0d24\u0d42' });
  pk.tally((n+1) + ' / ' + ROUNDS);
  PLAYKIT.shuffle(BIRDS).forEach(function(b){
    pk.board.appendChild(pk.card(b, function(el){
      if (locked) return;
      if (b.id === want.id) { locked = true; pk.right(el); pk.climb(n+1); pk.cheer(); n++; setTimeout(deal, 1300); }
      else pk.wrong(el);
    }));
  });
  pk.fit();
  pk.say({ en:'Find the ' + want.en, ml:want.ml + ' \u0d15\u0d23\u0d4d\u0d1f\u0d46\u0d24\u0d4d\u0d24\u0d42' });
}
deal();
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
