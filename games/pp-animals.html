<!DOCTYPE html>
<!--
================================================================================
  Meet the Animals - Pangappara Blueroom
================================================================================
  EXPLORE, with no fail state at all. Every tap is correct: the animal calls,
  says its name, and shows a card. There is no score and no round.

  That is deliberate and it is the only board like it. A child who is
  anxious, new, or having a bad morning needs somewhere on the wall where
  nothing can go wrong, and a teacher needs a place to introduce vocabulary
  before any of it is tested. The original build had several of these; the
  September set had none.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Meet the Animals</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    user-select:none;touch-action:none}

</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/animal-data.js"></script>
<script src="../js/guide.js"></script>
<script src="../js/play-kit.js"></script>
<script>
var SET = ANIMALS.DOMESTIC.concat(ANIMALS.WILD)
  .filter(function(id){ return ANIMALS.all[id] && ANIMALS.all[id].img; });
var seen = {};
var pk = PLAYKIT.page({ accent:'#1d6b63', backdrop:'meadow', onAgain:draw });

function draw(){
  seen = {}; pk.hideFinish(); pk.board.innerHTML = '';
  pk.ask({ en:'Tap any animal to meet it', ml:'\u0d0f\u0d24\u0d4d \u0d2e\u0d43\u0d17\u0d24\u0d4d\u0d24\u0d46\u0d2f\u0d41\u0d02 \u0d24\u0d4a\u0d1f\u0d4d\u0d1f\u0d41 \u0d28\u0d4b\u0d15\u0d4d\u0d15\u0d42' });
  pk.tally('');
  SET.forEach(function(id){
    var a = ANIMALS.all[id];
    pk.board.appendChild(pk.card({ img:a.img, ml:a.ml }, function(el){
      el.classList.add('pk-right');
      setTimeout(function(){ el.classList.remove('pk-right'); }, 900);
      ANIMALS.playSound(id);
      setTimeout(function(){ if (WALL.voiceOn()) WALL.say(a.ml); }, 700);
      pk.note({ en:a.en, ml:a.ml });
      seen[id] = 1;
      pk.tally(Object.keys(seen).length + ' / ' + SET.length);
    }));
  });
  pk.fit();
  pk.say({ en:'Lets meet the animals!', ml:'\u0d28\u0d2e\u0d41\u0d15\u0d4d\u0d15\u0d4d \u0d2e\u0d43\u0d17\u0d19\u0d4d\u0d19\u0d33\u0d46 \u0d2a\u0d30\u0d3f\u0d1a\u0d2f\u0d2a\u0d4d\u0d2a\u0d46\u0d1f\u0d3e\u0d02!' });
}
draw();
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
