<!DOCTYPE html>
<!--
================================================================================
  Who Wears This Hat - Pangappara Blueroom, Vocational
================================================================================
  Was Birthday Cap Matching. Generalised as asked: everyone who wears a hat
  for work, not just at a party, and the drawn hats from js/job-icons.js
  instead of emoji.

  Reversed from Job Hats on purpose. There a worker is shown and the hat is
  chosen; here the HAT is shown and the worker is chosen. Same fact, asked
  from the other end, which is how you tell a child has learnt the pairing
  rather than one direction of it.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Who Wears This Hat</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fffaf2,#fdf0e0 70%,#f7e4cf);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#a8552b;text-align:center;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #e6cfae;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:grid;place-items:center;padding:6px;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.22;pointer-events:none}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .who{display:grid;place-items:center;width:clamp(56px,11vh,116px);height:clamp(56px,11vh,116px);
    border-radius:16px;background:#fff;border:4px solid #e6cfae;flex-shrink:0;
    box-shadow:0 6px 15px rgba(90,60,30,.16)}
  .who img{width:82%;height:82%;object-fit:contain}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/jobs-data.js"></script>
<script src="../js/job-icons.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var POOL = JOBS_DATA.withHat().filter(function(j){ return JOB_ICONS.has(j.id); });
var ROUNDS = 6;

TRIUP.start({
  title:{en:'Who Wears This Hat?',ml:'\u0d08 \u0d24\u0d4a\u0d2a\u0d4d\u0d2a\u0d3f \u0d06\u0d30\u0d41\u0d1f\u0d47\u0d24\u0d4d?'},
  hint:{en:'Find who wears it',ml:'\u0d07\u0d24\u0d4d \u0d06\u0d30\u0d41\u0d1f\u0d47\u0d24\u0d46\u0d28\u0d4d\u0d28\u0d4d \u0d15\u0d23\u0d4d\u0d1f\u0d46\u0d24\u0d4d\u0d24\u0d42'},
  build:function(p, body, api){
    var st=api.state(p); st.score=0; st.queue=sh(POOL).slice(0,ROUNDS);
    api.pill(p,'score','0 / '+ROUNDS);
    var hat=document.createElement('div'); hat.className='who';
    var lead=document.createElement('div'); lead.className='leadml';
    lead.textContent='\u0d08 \u0d24\u0d4a\u0d2a\u0d4d\u0d2a\u0d3f \u0d06\u0d30\u0d41\u0d1f\u0d47\u0d24\u0d4d?';
    var grid=document.createElement('div'); grid.className='row';
    body.appendChild(hat); body.appendChild(lead); body.appendChild(grid);

    function round(){
      if(!st.queue.length) return api.win(p,{
        title:{en:'You know every hat!',ml:'\u0d0e\u0d32\u0d4d\u0d32\u0d3e \u0d24\u0d4a\u0d2a\u0d4d\u0d2a\u0d3f\u0d15\u0d33\u0d41\u0d02 \u0d05\u0d31\u0d3f\u0d2f\u0d3e\u0d02!'},
        onAgain:function(){ st.queue=sh(POOL).slice(0,ROUNDS); st.score=0; api.pill(p,'score','0 / '+ROUNDS); round(); }});
      var job=st.queue.shift();
      hat.innerHTML='<img src="'+JOB_ICONS.dataUri(job.id)+'" alt="">';
      var wrong=sh(POOL.filter(function(j){return j.id!==job.id;})).slice(0,3);
      grid.innerHTML='';
      sh([job].concat(wrong)).forEach(function(j){
        var t=document.createElement('div'); t.className='tile sq';
        t.innerHTML='<div class="em">'+j.emoji+'</div><div class="cap">'+j.label.ml+'</div>';
        WALL.bindTouch(t,function(){
          if(j.id===job.id){
            st.score++; api.pill(p,'score',st.score+' / '+ROUNDS);
            t.classList.add('ok'); WALL.tone(440+st.score*60,.16,'sine',.12);
            api.popup(p,{title:job.label,body:job.does,
              close:{en:'Next',ml:'\u0d05\u0d1f\u0d41\u0d24\u0d4d\u0d24\u0d24\u0d4d'},onClose:round});
          } else { t.classList.add('no'); setTimeout(function(){t.classList.remove('no');},460); WALL.sfx.nudge(); }
        });
        grid.appendChild(t);
      });
      if(p===0&&WALL.voiceOn()) WALL.say('\u0d08 \u0d24\u0d4a\u0d2a\u0d4d\u0d2a\u0d3f \u0d06\u0d30\u0d41\u0d1f\u0d47\u0d24\u0d4d?');
    }
    round();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
