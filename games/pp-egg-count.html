<!DOCTYPE html>
<!--
================================================================================
  Count the Eggs - Pangappara Blueroom
================================================================================
  COUNTING TO A TARGET. Kuttu asks for a number of eggs and the child taps
  that many into the basket. The answer is a QUANTITY, not an object, so
  there is nothing to recognise and no picture that gives it away.

  Stopping is the part actually being taught. Tapping a seventh egg when six
  were asked for is the mistake worth making, and it is one a four-choice
  board can never produce - there are always more eggs on the table than
  were asked for.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Count the Eggs</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    user-select:none;touch-action:none}
  .basket{position:absolute;left:50%;top:23%;transform:translateX(-50%);
    font-size:clamp(38px,7vh,84px);line-height:1;z-index:6}
  .eggs{position:absolute;top:36%;left:0;right:0;bottom:3vh;display:flex;
    flex-wrap:wrap;gap:1.6vw;align-content:center;justify-content:center;padding:0 4vw}
  /* An egg is not a circle. Taller than wide, with the wide end at the
     bottom - a border-radius with four different corners rather than 50%. */
  .egg{width:clamp(42px,9.5vh,96px);height:clamp(54px,12vh,122px);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    background:radial-gradient(circle at 36% 30%,#fffdf6,#f0e2c2 70%,#dcc89a);
    border:4px solid #fff;box-shadow:0 5px 13px rgba(120,100,60,.2);cursor:pointer;
    transition:transform .15s,opacity .3s}
  .egg:active{transform:scale(.92)}
  .egg.taken{opacity:.25;pointer-events:none;transform:scale(.8)}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/guide.js"></script>
<script src="../js/play-kit.js"></script>
<script>
var ROUNDS = 5, n = 0, want = 0, got = 0, locked = false;
var pk = PLAYKIT.page({ accent:'#b8862b', backdrop:'meadow', onAgain:function(){ n=0; deal(); } });
pk.board.style.display = 'none';

var basket = document.createElement('div');
basket.className = 'basket'; basket.textContent = '\ud83e\uddfa';
var tray = document.createElement('div'); tray.className = 'eggs';
document.body.appendChild(basket); document.body.appendChild(tray);

var ML = ['\u0d2a\u0d42\u0d1c\u0d4d\u0d2f\u0d02','\u0d12\u0d28\u0d4d\u0d28\u0d4d','\u0d30\u0d23\u0d4d\u0d1f\u0d4d','\u0d2e\u0d42\u0d28\u0d4d\u0d28\u0d4d','\u0d28\u0d3e\u0d32\u0d4d','\u0d05\u0d1e\u0d4d\u0d1a\u0d4d','\u0d06\u0d31\u0d4d'];

function deal(){
  locked = false; pk.note(null); pk.hideFinish();
  if (n >= ROUNDS) return pk.finish({ en:'All counted!', ml:'\u0d0e\u0d32\u0d4d\u0d32\u0d3e\u0d02 \u0d0e\u0d23\u0d4d\u0d23\u0d3f!' });
  want = 2 + Math.floor(Math.random() * 5);
  got = 0; tray.innerHTML = ''; basket.textContent = '\ud83e\uddfa';
  var shown = want + 2 + Math.floor(Math.random() * 3);
  for (var i = 0; i < shown; i++) {
    var e = document.createElement('div');
    e.className = 'egg';
    WALL.bindTouch(e, (function(el){ return function(){ take(el); }; })(e));
    tray.appendChild(e);
  }
  pk.ask({ en:'Put ' + want + ' eggs in the basket', ml:ML[want] + ' \u0d2e\u0d41\u0d1f\u0d4d\u0d1f \u0d15\u0d4a\u0d1f\u0d4d\u0d1f\u0d2f\u0d3f\u0d7d \u0d07\u0d1f\u0d42' });
  pk.tally('0 / ' + want);
  pk.fit();
  pk.say({ en:'Put ' + want + ' eggs in the basket', ml:ML[want] + ' \u0d2e\u0d41\u0d1f\u0d4d\u0d1f \u0d15\u0d4a\u0d1f\u0d4d\u0d1f\u0d2f\u0d3f\u0d7d \u0d07\u0d1f\u0d42' });
}

function take(el){
  if (locked || el.classList.contains('taken')) return;
  if (got === want) {
    el.classList.add('pk-wrong');
    setTimeout(function(){ el.classList.remove('pk-wrong'); }, 460);
    WALL.sfx.nudge();
    pk.note({ en:'That is one too many', ml:'\u0d12\u0d30\u0d46\u0d23\u0d4d\u0d23\u0d02 \u0d15\u0d42\u0d1f\u0d41\u0d24\u0d32\u0d3e\u0d2f\u0d3f' });
    setTimeout(function(){ pk.note(null); }, 1500);
    return;
  }
  el.classList.add('taken');
  got++; pk.climb(got); pk.tally(got + ' / ' + want);
  if (got === want) {
    locked = true;
    pk.note({ en:'Exactly ' + want + '!', ml:ML[want] + ' \u0d24\u0d28\u0d4d\u0d28\u0d46!' });
    pk.cheer(); n++; setTimeout(deal, 1800);
  }
}
deal();
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
