<!DOCTYPE html>
<!--
════════════════════════════════════════════════════════════════════════════
  ROOMS IN A HOUSE — Pangappara Blueroom, Primary
════════════════════════════════════════════════════════════════════════════

  Rebuilt. The previous version was a LEARN.start() config: meet the rooms,
  then tap the one named. Every primary activity ran that same two stages with
  different pictures, which is why they all felt like one another.

  The mechanic here is PLACEMENT, not recognition. One object at a time comes
  up; the child carries it to the room it belongs in. Knowing a bed is a bed is
  not the skill — knowing a bed belongs in the bedroom is, and that is a
  judgement you can get wrong, which is what the old version had no way to ask.

  Three rooms, fifteen objects, drawn from the photographs delivered with the
  daily-living set.

  Kitchen is deliberately absent. The kitchen photograph exists but no kitchen
  objects came with the set, so including it would add a room that can never be
  the answer — a child would learn to never choose it. Better three honest
  rooms than four where one is a decoy.

  Rules it inherits from the brief:
    · nothing interactive above 32% — the child has to reach it
    · a wrong drop never costs anything: the room nudges, the object goes home,
      and it can be tried again at once
    · കുട്ടു names each object aloud in Malayalam and points after two misses

  MALAYALAM: the room and object names below need a native speaker's pass, like
  every other {en,ml} block in this repo. They are gathered at the top so that
  is one place to look.
════════════════════════════════════════════════════════════════════════════
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rooms in a House</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:radial-gradient(circle at 20% 6%,#eef6ff 0%,transparent 55%),
               linear-gradient(165deg,#ffffff,#eef2f8 70%,#e6ecf5);
    user-select:none;touch-action:none;
  }

  /* ── the top band carries information only ─────────────────── */
  #head{position:absolute;top:0;left:0;right:0;height:14%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;
    padding:1vh 4vw 0;pointer-events:none;text-align:center}
  #prompt{font-weight:800;font-size:clamp(18px,3.4vw,34px);color:#243244}
  #promptMl{font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(15px,2.6vw,26px);color:#5a6a80}
  #progress{font-weight:800;font-size:clamp(12px,1.8vw,18px);color:#8091a8;letter-spacing:.06em}

  /* ── the object being carried ──────────────────────────────── */
  /* The object sits low, where a child's hands already are; the rooms are
     above it and are tapped. Reversed from the first build on review. */
  #tray{position:absolute;left:0;right:0;bottom:3vh;height:26%;
    display:flex;align-items:center;justify-content:center}
  .item{
    width:min(20vh,22vw);height:min(20vh,22vw);
    border-radius:20px;background:#fff;border:4px solid #cfd8e6;
    box-shadow:0 8px 20px rgba(30,45,70,.14);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:transform .16s,box-shadow .16s,border-color .16s;
  }
  .item img{width:86%;height:86%;object-fit:contain;pointer-events:none}
  .item.held{cursor:grabbing;transform:scale(1.1);box-shadow:0 16px 34px rgba(30,45,70,.26);
    border-color:#4f8ef0;z-index:60;transition:none}
  .item.home{animation:home .3s ease-out}
  @keyframes home{0%{transform:scale(1.1)}60%{transform:scale(.94)}100%{transform:scale(1)}}

  /* ── rooms: the whole lower half, within reach ─────────────── */
  #rooms{position:absolute;top:15%;left:0;right:0;bottom:32%;
    display:flex;gap:1.6vw;padding:0 2.2vw}
  .room{
    flex:1;min-width:0;position:relative;border-radius:18px;overflow:hidden;
    border:5px solid #d3dcea;background:#fff;
    display:flex;flex-direction:column;justify-content:flex-end;
    transition:border-color .16s,transform .16s;
  }
  .room .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.96}
  .room .cap{position:relative;z-index:2;padding:7px 10px 8px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.82) 70%,transparent)}
  .room .en{font-weight:800;font-size:clamp(12px,1.7vw,19px);color:#243244}
  .room .ml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(11px,1.5vw,17px);color:#4a5a72;line-height:1.45}
  .room{cursor:pointer}
  .room:active{transform:scale(.98)}
  .room.hot{border-color:#4f8ef0;transform:translateY(-6px)}
  .room.good{border-color:#39b87a}
  .room.bad{animation:wob .42s ease-in-out}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
                 60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* filled objects stack along the bottom of their room */
  .filled{position:absolute;left:5px;right:5px;bottom:46px;z-index:3;
    display:flex;flex-wrap:wrap;gap:4px;justify-content:center;pointer-events:none}
  .filled img{width:clamp(22px,3.4vw,42px);height:clamp(22px,3.4vw,42px);object-fit:contain;
    background:rgba(255,255,255,.94);border-radius:8px;padding:2px;
    box-shadow:0 2px 6px rgba(30,45,70,.16);animation:drop .34s ease-out}
  @keyframes drop{from{opacity:0;transform:translateY(-22px) scale(.7)}to{opacity:1;transform:none}}

  /* ── done ──────────────────────────────────────────────────── */
  #done{position:absolute;inset:0;z-index:90;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;
    background:rgba(255,255,255,.95);backdrop-filter:blur(6px);text-align:center;padding:6vw}
  #done.show{display:flex}
  #done h2{font-size:clamp(24px,5vw,50px);color:#2a9d6b;font-weight:800}
  #done .ml{font-family:'Noto Sans Malayalam',sans-serif;font-size:clamp(15px,2.8vw,26px);color:#4a5a72}
  #again{border:0;border-radius:16px;background:#4f8ef0;color:#fff;font-weight:800;
    font-size:clamp(15px,2.6vw,24px);padding:14px 40px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="head">
  <div id="prompt">Where does it go?</div>
  <div id="promptMl">ഇത് എവിടെ വയ്ക്കണം?</div>
  <div id="progress"></div>
</div>

<div id="tray"></div>
<div id="rooms"></div>

<div id="done">
  <h2 id="doneEn">Everything is in its place!</h2>
  <div class="ml" id="doneMl">എല്ലാം അതത് സ്ഥലത്തായി!</div>
  <button id="again">↺ വീണ്ടും</button>
</div>

<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/guide.js"></script>

<script>
WALL_BACKDROP.set('sky');
/* ══════════════════════════════════════════════════════════════
   CONTENT — rooms and what belongs in them.
   Malayalam here needs a native speaker's review.
   ══════════════════════════════════════════════════════════════ */
var IMG = '../assets/new/images/rooms/';
var OBJ = IMG + 'objects/';

var ROOMS = [
  { key:'bedroom',   shot: IMG + 'bedroom.webp',   en:'Bedroom',    ml:'കിടപ്പുമുറി' },
  { key:'classroom', shot: IMG + 'classroom.webp', en:'Classroom',  ml:'ക്ലാസ്‌മുറി' },
  { key:'living',    shot: IMG + 'living.webp',    en:'Living room', ml:'സ്വീകരണമുറി' }
];

var ITEMS = [
  { img:'bed.webp',         room:'bedroom',   en:'Bed',          ml:'കട്ടിൽ' },
  { img:'shoe-rack.webp',   room:'bedroom',   en:'Shoe rack',    ml:'ഷൂ റാക്ക്' },
  { img:'shoe.webp',        room:'bedroom',   en:'Shoe',         ml:'ഷൂ' },
  { img:'clothes-peg.webp', room:'bedroom',   en:'Clothes peg',  ml:'തുണിക്ലിപ്പ്' },
  { img:'glasses.webp',     room:'bedroom',   en:'Spectacles',   ml:'കണ്ണട' },

  { img:'blackboard.webp',  room:'classroom', en:'Blackboard',   ml:'കരിമ്പലക' },
  { img:'books.webp',       room:'classroom', en:'Books',        ml:'പുസ്തകങ്ങൾ' },
  { img:'pencil-box.webp',  room:'classroom', en:'Pencil box',   ml:'പെൻസിൽ പെട്ടി' },
  { img:'pencils.webp',     room:'classroom', en:'Pencils',      ml:'പെൻസിലുകൾ' },
  { img:'duster.webp',      room:'classroom', en:'Duster',       ml:'ഡസ്റ്റർ' },
  { img:'bag.webp',         room:'classroom', en:'School bag',   ml:'സ്കൂൾ ബാഗ്' },

  { img:'table.webp',       room:'living',    en:'Table',        ml:'മേശ' },
  { img:'chair.webp',       room:'living',    en:'Chair',        ml:'കസേര' },
  { img:'bookshelf.webp',   room:'living',    en:'Bookshelf',    ml:'പുസ്തകഷെൽഫ്' },
  { img:'newspaper.webp',   room:'living',    en:'Newspaper',    ml:'പത്രം' }
];

/* ══════════════════════════════════════════════════════════════ */
WALL.init();
/* heightTarget is what the HEIGHT buttons actually move. The rooms already sit
   low; it is the object waiting to be carried that a short child has to reach,
   so that is what staff need to be able to bring down. */
WALL.toolbar({
  lang: true, voice: true, size: true, height: true,
  reset: function () { start(); },
  heightTarget: '#tray'
});

var roomsEl = document.getElementById('rooms');
var trayEl  = document.getElementById('tray');
var queue = [], current = null, placed = 0, misses = 0;

function t(o){ return WALL.t(o); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;} return a; }

function buildRooms(){
  roomsEl.innerHTML = '';
  ROOMS.forEach(function(r){
    var d = document.createElement('div');
    d.className = 'room';
    d.dataset.key = r.key;
    d.innerHTML =
      '<img class="shot" src="' + r.shot + '" alt="">' +
      '<div class="filled"></div>' +
      '<div class="cap"><div class="en">' + r.en + '</div><div class="ml">' + r.ml + '</div></div>';
    roomsEl.appendChild(d);
  });
}

function say(item){
  /* The prompt is the object's name — the question "where does it go?" is
     already on screen and does not need repeating on every turn. */
  if (WALL.voiceOn()) WALL.say(item.ml);
  if (window.GUIDE) GUIDE.say({ en: item.en, ml: item.ml });
}

function nextItem(){
  if (!queue.length) return finish();
  current = queue.shift();
  document.getElementById('progress').textContent =
    (placed + 1) + ' / ' + ITEMS.length;
  trayEl.innerHTML = '';
  var el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = '<img src="' + OBJ + current.img + '" alt="">';
  trayEl.appendChild(el);
  misses = 0;
  say(current);
}

/* ── choosing a room ────────────────────────────────────────────
   Tap, not drag. Dragging asked a child to hold a target in mind
   while crossing half a wall; tapping the room is one decision.   */
function bindRooms(){
  roomsEl.querySelectorAll('.room').forEach(function(d){
    WALL.bindTouch(d, function(){ if (current) drop(d); });
  });
}

function drop(roomEl){
  if (roomEl.dataset.key === current.room) {
    /* right: the object settles into the room and the tone climbs */
    roomEl.classList.add('good');
    setTimeout(function(){ roomEl.classList.remove('good'); }, 600);
    var img = document.createElement('img');
    img.src = OBJ + current.img;
    roomEl.querySelector('.filled').appendChild(img);
    trayEl.innerHTML = '';
    current = null;
    placed++;
    WALL.tone(440 + placed * 60, 0.16, 'sine', 0.12);
    WALL.burstAt(roomEl);
    if (window.GUIDE) GUIDE.cheer({ en:'Yes! Well done!', ml:'കൊള്ളാം! നന്നായി!' });
    setTimeout(nextItem, 700);
  } else {
    /* wrong: nothing is lost. The room says no and the object comes back. */
    roomEl.classList.add('bad');
    setTimeout(function(){ roomEl.classList.remove('bad'); }, 440);
    WALL.sfx.nudge();
    misses++;
    if (misses >= 2 && window.GUIDE) {
      /* after two tries the guide stops asking and starts showing */
      var target = roomsEl.querySelector('[data-key="' + current.room + '"]');
      GUIDE.point(target, { en:'This one!', ml:'ഇതാണ്!' });
      setTimeout(function(){ GUIDE.unpoint(); }, 2200);
    }
  }
}

function finish(){
  trayEl.innerHTML = '';
  document.getElementById('progress').textContent = ITEMS.length + ' / ' + ITEMS.length;
  document.getElementById('done').classList.add('show');
  WALL.celebrate();
  if (WALL.voiceOn()) WALL.say('എല്ലാം അതത് സ്ഥലത്തായി!');
}

function start(){
  document.getElementById('done').classList.remove('show');
  placed = 0;
  queue = shuffle(ITEMS);
  buildRooms();
  bindRooms();
  if (window.GUIDE) { GUIDE.mount(); GUIDE.say({ en:"Let's tidy the house!", ml:'നമുക്ക് വീട് അടുക്കാം!' }); }
  setTimeout(nextItem, 900);
}

WALL.bindTouch(document.getElementById('again'), start);
WALL.onLang(function(){ buildRoomsCaptions(); });
function buildRoomsCaptions(){
  roomsEl.querySelectorAll('.room').forEach(function(d, i){
    var r = ROOMS[i]; if (!r) return;
    d.querySelector('.en').textContent = r.en;
    d.querySelector('.ml').textContent = r.ml;
  });
}

start();
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
