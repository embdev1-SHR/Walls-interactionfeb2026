<!DOCTYPE html>
<!--
================================================================================
  Which Animal Is That - Pangappara Blueroom
================================================================================
  Listening round, one per panel.

  TWO REAL BUGS FIXED. The pool filtered on a sound PATH, which exists whether
  or not a file does, so silent animals were being asked about - and
  assets/new/audio/animals/ is empty, the thirteen farm calls it names were
  never recorded. Only the six with a verified file are used now.

  And the call used to fire from a timer. A browser refuses to play audio no
  touch asked for, so the first sound of a session was blocked however well
  the file loaded. The speaker pad makes hearing it a TAP, which fixes that
  and lets a child replay as often as they need.

  Three panels. Each child runs their own rounds and nobody waits for anyone
  else to finish; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Which Animal Is That</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#f4faff,#e7f2fb 70%,#dbeaf7);user-select:none;touch-action:none}
  .row{display:flex;gap:.7vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(11px,2vh,22px);color:#2f6ea8;text-align:center;flex-shrink:0}
  /* Cards are square and sized from the PANEL, never the viewport: a panel is
     a third of the wall at three players, and viewport units overflow it. */
  .tile{flex:0 0 auto;aspect-ratio:1;width:clamp(40px,8.4vh,88px);
    border-radius:14px;background:#fff;border:3px solid #cfe0ee;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 10px rgba(40,50,70,.13);
    display:grid;place-items:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(18px,3.6vh,42px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(7px,1.2vh,12px);color:#26313b;line-height:1.25}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.22;pointer-events:none}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .big{width:clamp(56px,13vh,132px)}
  .hear{border:0;border-radius:16px;background:#2f6ea8;color:#fff;cursor:pointer;
    padding:7px 24px;font-size:clamp(16px,3vh,32px);line-height:1;flex-shrink:0;
    box-shadow:0 5px 13px rgba(30,70,120,.3)}
  .hear:active{transform:translateY(2px)}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/animal-data.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('sky');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var HAVE_RECORDING=['cow','tiger','elephant','snake','bear','rabbit'];
var POOL=HAVE_RECORDING.filter(function(id){var a=ANIMALS.all[id];return a&&a.img&&a.snd;});
var ROUNDS=6;

TRIUP.start({
  title:{en:'Which Animal Is That?',ml:'\u0d0f\u0d24\u0d4d \u0d2e\u0d43\u0d17\u0d2e\u0d3e\u0d23\u0d4d?'},
  hint:{en:'Tap the speaker, then choose',ml:'\u0d36\u0d2c\u0d4d\u0d26\u0d02 \u0d15\u0d47\u0d1f\u0d4d\u0d1f\u0d4d \u0d24\u0d3f\u0d30\u0d1e\u0d4d\u0d1e\u0d46\u0d1f\u0d41\u0d15\u0d4d\u0d15\u0d42'},
  build:function(p, body, api){
    var st=api.state(p); st.n=0;
    var lead=document.createElement('div'); lead.className='leadml';
    lead.textContent='\u0d08 \u0d36\u0d2c\u0d4d\u0d26\u0d02 \u0d06\u0d30\u0d41\u0d1f\u0d47\u0d24\u0d3e\u0d23\u0d4d?';
    var hear=document.createElement('button'); hear.className='hear';
    hear.textContent=String.fromCodePoint(0x1F50A);
    var grid=document.createElement('div'); grid.className='row';
    body.appendChild(lead); body.appendChild(hear); body.appendChild(grid);
    api.pill(p,'score','0 / '+ROUNDS);
    WALL.bindTouch(hear,function(){ if(st.cur) ANIMALS.playSound(st.cur); });

    function deal(){
      if(st.n>=ROUNDS) return api.win(p,{
        title:{en:'You knew them all!',ml:'\u0d0e\u0d32\u0d4d\u0d32\u0d3e\u0d02 \u0d05\u0d31\u0d3f\u0d2f\u0d3e\u0d2e\u0d3e\u0d2f\u0d3f\u0d30\u0d41\u0d28\u0d4d\u0d28\u0d41!'},
        onAgain:function(){ st.n=0; api.pill(p,'score','0 / '+ROUNDS); deal(); }});
      st.cur=sh(POOL)[0];
      var wrong=sh(POOL.filter(function(k){return k!==st.cur;})).slice(0,Math.min(3,POOL.length-1));
      grid.innerHTML='';
      sh([st.cur].concat(wrong)).forEach(function(id){
        var a=ANIMALS.all[id];
        var t=document.createElement('div'); t.className='tile';
        t.innerHTML='<img src="'+a.img+'" alt=""><div class="cap">'+a.ml+'</div>';
        WALL.bindTouch(t,function(){
          if(id===st.cur){
            t.classList.add('ok'); st.n++;
            api.pill(p,'score',st.n+' / '+ROUNDS);
            WALL.tone(440+st.n*60,.16,'sine',.12);
            api.popup(p,{title:{en:a.en,ml:a.ml},
              close:{en:'Next',ml:'\u0d05\u0d1f\u0d41\u0d24\u0d4d\u0d24\u0d24\u0d4d'},onClose:deal});
          } else { t.classList.add('no'); setTimeout(function(){t.classList.remove('no');},460); WALL.sfx.nudge(); }
        });
        grid.appendChild(t);
      });
      /* attempted, but the pad above is what makes it reliable */
      setTimeout(function(){ ANIMALS.playSound(st.cur); },400);
    }
    deal();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
