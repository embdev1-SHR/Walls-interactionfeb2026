<!DOCTYPE html>
<!--
================================================================================
  Which Is Bigger - Pangappara Blueroom
================================================================================
  Three independent games, as asked - each panel deals its own pair and moves
  on the moment that child answers. Nobody waits for anyone else.

  The SAME object is shown at two sizes rather than two different animals.
  Comparing an ant with an elephant tests which is bigger in real life, which
  is knowledge; comparing one ball with another tests which LOOKS bigger,
  which is the perceptual skill this is for.

  Three panels. Each child runs their own rounds and nobody waits for anyone
  else to finish; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Which Is Bigger</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#f7f5ff,#eeeafb 70%,#e2dcf5);user-select:none;touch-action:none}
  .row{display:flex;gap:.7vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(11px,2vh,22px);color:#5b47a8;text-align:center;flex-shrink:0}
  /* Cards are square and sized from the PANEL, never the viewport: a panel is
     a third of the wall at three players, and viewport units overflow it. */
  .tile{flex:0 0 auto;aspect-ratio:1;width:clamp(40px,8.4vh,88px);
    border-radius:14px;background:#fff;border:3px solid #d2c9ec;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 10px rgba(40,50,70,.13);
    display:grid;place-items:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(18px,3.6vh,42px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(7px,1.2vh,12px);color:#26313b;line-height:1.25}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.22;pointer-events:none}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .big{width:clamp(56px,13vh,132px)}
  .pair{display:flex;gap:1.4vw;align-items:center;justify-content:center;width:100%;flex:1;min-height:0}
  .opt{border-radius:18px;background:#fff;border:4px solid #d2c9ec;cursor:pointer;
    display:grid;place-items:center;box-shadow:0 5px 13px rgba(60,45,120,.14);
    transition:transform .14s,border-color .14s;padding:6px}
  .opt:active{transform:scale(.96)}
  .opt.ok{border-color:#3fae7c;box-shadow:0 0 0 5px rgba(63,174,124,.3)}
  .opt.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .opt .em{line-height:1}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('sky');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var THINGS=['\ud83c\udf4e','\u26bd','\ud83c\udf88','\ud83c\udf1f','\ud83c\udf53','\ud83c\udf4c','\ud83e\uddf8','\ud83c\udf3b'];
var ROUNDS=8;
var ASK=[{k:'big',ml:'\u0d0f\u0d24\u0d3e\u0d23\u0d4d \u0d35\u0d32\u0d41\u0d24\u0d4d?'},
         {k:'small',ml:'\u0d0f\u0d24\u0d3e\u0d23\u0d4d \u0d1a\u0d46\u0d31\u0d41\u0d24\u0d4d?'}];

TRIUP.start({
  title:{en:'Which Is Bigger?',ml:'\u0d0f\u0d24\u0d3e\u0d23\u0d4d \u0d35\u0d32\u0d41\u0d24\u0d4d?'},
  hint:{en:'Choose the right one',ml:'\u0d36\u0d30\u0d3f\u0d2f\u0d3e\u0d2f\u0d24\u0d4d \u0d24\u0d3f\u0d30\u0d1e\u0d4d\u0d1e\u0d46\u0d1f\u0d41\u0d15\u0d4d\u0d15\u0d42'},
  build:function(p, body, api){
    var st=api.state(p); st.n=0;
    var lead=document.createElement('div'); lead.className='leadml';
    var pair=document.createElement('div'); pair.className='pair';
    body.appendChild(lead); body.appendChild(pair);
    api.pill(p,'score','0 / '+ROUNDS);

    function deal(){
      if(st.n>=ROUNDS) return api.win(p,{
        title:{en:'Well done!',ml:'\u0d15\u0d4a\u0d33\u0d4d\u0d33\u0d3e\u0d02!'},
        onAgain:function(){ st.n=0; api.pill(p,'score','0 / '+ROUNDS); deal(); }});
      var em=THINGS[Math.floor(Math.random()*THINGS.length)];
      var ask=ASK[Math.floor(Math.random()*ASK.length)];
      lead.textContent=ask.ml;
      /* same object, two sizes - a perceptual comparison, not a knowledge one */
      var sizes=sh([ {s:1,big:true}, {s:0.45,big:false} ]);
      pair.innerHTML='';
      sizes.forEach(function(o){
        var d=document.createElement('div'); d.className='opt';
        var side=(o.s===1?'clamp(70px,17vh,170px)':'clamp(38px,9vh,88px)');
        d.style.width=side; d.style.height=side;
        d.innerHTML='<div class="em" style="font-size:'+(o.s===1?'clamp(40px,10vh,100px)':'clamp(22px,5vh,52px)')+'">'+em+'</div>';
        WALL.bindTouch(d,function(){
          var right=(ask.k==='big')?o.big:!o.big;
          if(right){
            d.classList.add('ok'); st.n++;
            api.pill(p,'score',st.n+' / '+ROUNDS);
            WALL.tone(440+st.n*60,.16,'sine',.12);
            setTimeout(deal,700);
          } else { d.classList.add('no'); setTimeout(function(){d.classList.remove('no');},460); WALL.sfx.nudge(); }
        });
        pair.appendChild(d);
      });
      if(p===0&&WALL.voiceOn()) WALL.say(ask.ml);
    }
    deal();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
