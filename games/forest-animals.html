<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Forest Animals Showcase</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:'Nunito',sans-serif;
  background:#071a10;color:white;
  -webkit-user-select:none;user-select:none;
}

/* ─── SCENE / PARALLAX ─── */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#071a10}
.forest-bg{position:absolute;width:100%;height:100%;inset:0;display:flex;align-items:flex-end;justify-content:center}
.forest-layer{position:absolute;height:100%;bottom:0;background-size:cover;background-position:center bottom;transition:transform .05s ease-out}
.forest-layer.p1{background-image:url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/217233/forest_1.svg');width:120%}
.forest-layer.p2{background-image:url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/217233/forest_2.svg');width:120%}
.forest-layer.p3{background-image:url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/217233/forest_3.svg');width:120%}
.forest-layer.p4{background-image:url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/217233/forest_4.svg');width:120%}
.forest-layer.p5{background-image:url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/217233/forest_5.svg');width:120%}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd54f;box-shadow:0 0 8px 3px rgba(255,213,79,.5);animation:fly var(--dur) ease-in-out infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}50%{opacity:.3;transform:translate(var(--dx),var(--dy))}75%{opacity:1}100%{opacity:0;transform:translate(0,0)}}
.leaf{position:absolute;font-size:16px;opacity:0;animation:leafDrop var(--dur) linear infinite}
@keyframes leafDrop{0%{transform:translate(0,-20px) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.4}100%{transform:translate(var(--dx),100vh) rotate(720deg);opacity:0}}

/* ─── APP SHELL ─── */
.app{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column}

/* ─── HEADER ─── */
.header{flex-shrink:0;text-align:center;padding:10px 20px 4px}
.header h1{font-family:'Playfair Display',serif;font-size:clamp(16px,2.4vw,24px);font-weight:900;color:#a5d6a7;text-shadow:0 3px 12px rgba(0,0,0,.6)}
.header p{font-size:clamp(9px,1.1vw,12px);color:rgba(255,255,255,.4)}

/* ─── TOOLBAR (RIGHT SIDE) ─── */
.toolbar{
  position:fixed;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:flex-end;
}
.toolbar-left{display:none}
.toolbar-center{display:none}
.toolbar-right{display:flex;flex-direction:column;gap:8px}

.tb-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:8px 14px;
  font-family:'Nunito',sans-serif;font-size:clamp(11px,1.1vw,14px);font-weight:700;
  border-radius:50px;cursor:pointer;transition:all .25s;
  border:2px solid;white-space:nowrap;
  backdrop-filter:blur(12px);
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.tb-btn-back{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.25);
  color:rgba(255,255,255,.9);
}
.tb-btn-back:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45)}

.tb-btn-ml{
  background:rgba(255,183,77,.12);
  border-color:rgba(255,183,77,.4);
  color:#ffcc80;
}
.tb-btn-ml:hover{background:rgba(255,183,77,.22);border-color:rgba(255,183,77,.65)}
.tb-btn-ml.active{background:rgba(255,183,77,.35);border-color:rgba(255,183,77,.85);color:#ffe0b2}

.tb-btn-audio{
  background:rgba(129,199,132,.1);
  border-color:rgba(129,199,132,.3);
  color:#a5d6a7;
  padding:8px 12px;
  min-width:48px;
}
.tb-btn-audio:hover{background:rgba(129,199,132,.2);border-color:rgba(129,199,132,.55)}

/* ─── REGION FILTER TABS ─── */
.filter-bar{
  flex-shrink:0;
  display:flex;align-items:center;gap:6px;
  padding:5px 14px;
  overflow-x:auto;scrollbar-width:none;
  background:rgba(3,18,8,.5);
  border-bottom:1px solid rgba(129,199,132,.1);
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-tab{
  flex-shrink:0;
  padding:3px 12px;font-size:clamp(9px,.85vw,11px);font-weight:700;
  border-radius:50px;cursor:pointer;transition:all .2s;
  border:1.5px solid rgba(129,199,132,.2);
  color:rgba(255,255,255,.5);background:transparent;
}
.filter-tab:hover{border-color:rgba(129,199,132,.4);color:rgba(255,255,255,.8)}
.filter-tab.active{background:rgba(129,199,132,.18);border-color:rgba(129,199,132,.6);color:#a5d6a7}
.filter-label{font-size:10px;color:rgba(255,255,255,.3);white-space:nowrap;flex-shrink:0;padding-right:4px}

/* ─── SCROLL AREA ─── */
.scroll-area{flex:1;min-height:0;position:relative;display:flex;align-items:center;padding:6px 0}
.scroll-track{
  display:flex;gap:12px;justify-content:center;
  overflow-x:auto;overflow-y:hidden;
  padding:0 44px;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  width:100%;
}
.scroll-track::-webkit-scrollbar{display:none}

.arrow-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  width:clamp(30px,3vw,38px);height:clamp(30px,3vw,38px);border-radius:50%;
  background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
  border:2px solid rgba(129,199,132,.35);color:white;font-size:clamp(12px,1.4vw,16px);
  cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;transition:all .3s;
}
.arrow-btn:hover{background:rgba(129,199,132,.2);border-color:rgba(129,199,132,.6)}
.arrow-btn:active{transform:translateY(-50%) scale(.92)}
.arrow-left{left:4px}.arrow-right{right:4px}

/* ─── CARD ─── */
.card{
  flex-shrink:0;
  width:clamp(200px,20vw,250px);
  max-height:clamp(350px,50vh,490px);
  scroll-snap-align:center;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(129,199,132,.2);
  border-radius:16px;
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:border-color .3s,box-shadow .3s;
  position:relative;
}
.card:hover{border-color:rgba(129,199,132,.45);box-shadow:0 4px 20px rgba(0,0,0,.4),0 0 16px rgba(129,199,132,.08)}
.card.indian-native .card-region-badge{display:flex}
.card.hidden{display:none}

/* Region badge */
.card-region-badge{
  display:none;
  position:absolute;top:8px;left:8px;z-index:5;
  align-items:center;gap:4px;
  background:rgba(255,152,0,.15);border:1px solid rgba(255,152,0,.45);
  border-radius:20px;padding:2px 8px;
  font-size:9px;font-weight:700;color:#ffcc80;
}

/* Domestic badge */
.card.domestic .card-region-badge{display:flex;background:rgba(79,195,247,.1);border-color:rgba(79,195,247,.4);color:#80d8ff}

/* ─── MODEL AREA ─── */
.model-area{
  flex-shrink:0;height:clamp(170px,22vh,260px);
  background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;border-bottom:1px solid rgba(129,199,132,.12);
  cursor:grab;touch-action:none;
}
.model-area:active{cursor:grabbing}
model-viewer.animal-viewer{width:100%;height:100%;--poster-color:transparent;background:rgba(0,0,0,.3);touch-action:none;object-fit:contain}
.model-placeholder{perspective:800px;width:130px;height:130px;position:relative;display:flex;align-items:center;justify-content:center}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .05s linear}
.cube-face{position:absolute;width:130px;height:130px;display:flex;align-items:center;justify-content:center;font-size:64px;border:2px solid rgba(129,199,132,.3);background:rgba(15,40,25,.8);backface-visibility:visible}
.cube-face:nth-child(1){transform:rotateY(0deg) translateZ(65px)}
.cube-face:nth-child(2){transform:rotateY(90deg) translateZ(65px)}
.cube-face:nth-child(3){transform:rotateY(180deg) translateZ(65px)}
.cube-face:nth-child(4){transform:rotateY(-90deg) translateZ(65px)}
.cube-face:nth-child(5){transform:rotateX(90deg) translateZ(65px)}
.cube-face:nth-child(6){transform:rotateX(-90deg) translateZ(65px)}
.model-badge{position:absolute;bottom:4px;right:6px;font-size:8px;color:rgba(255,255,255,.3);background:rgba(0,0,0,.4);padding:2px 6px;border-radius:6px}

/* ─── CARD BODY ─── */
.card-body{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0}
.card-body::-webkit-scrollbar{width:3px}
.card-body::-webkit-scrollbar-thumb{background:rgba(129,199,132,.25);border-radius:3px}

.card-top{display:flex;align-items:center;gap:8px;margin-bottom:1px}
.card-emoji{font-size:clamp(22px,2.5vw,28px);filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.card-titles{display:flex;flex-direction:column}
.card-name{font-size:clamp(12px,1.3vw,15px);font-weight:700;color:#a5d6a7;line-height:1.2}
.card-name-ml{font-size:clamp(11px,1.1vw,14px);font-weight:700;color:#a5d6a7;line-height:1.2;display:none}
.card-latin{font-size:clamp(8px,.8vw,10px);font-style:italic;color:rgba(255,255,255,.3)}

.card-desc{font-size:clamp(9px,.9vw,10.5px);color:rgba(255,255,255,.6);line-height:1.45}
.card-desc-ml{font-size:clamp(9px,.9vw,10.5px);color:rgba(255,255,255,.6);line-height:1.5;display:none}

.facts-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.facts-list li{font-size:clamp(9px,.85vw,10.5px);color:rgba(255,255,255,.65);line-height:1.4;padding:2px 0 2px 14px;position:relative}
.facts-list li.ml-fact{color:rgba(255,255,255,.65);display:none}
.facts-list li.en-fact{display:list-item}
.facts-list li::before{content:'';position:absolute;left:1px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:rgba(129,199,132,.5);border:1px solid rgba(129,199,132,.7)}
.facts-list li:nth-child(odd)::before{background:rgba(255,193,7,.5);border-color:rgba(255,193,7,.7)}

.card-sound{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;margin-top:auto;align-self:flex-start;
  background:rgba(129,199,132,.1);border:1px solid rgba(129,199,132,.3);border-radius:14px;color:#a5d6a7;
  font-size:clamp(8px,.9vw,11px);font-weight:600;cursor:pointer;transition:all .3s;flex-shrink:0;
  font-family:'Nunito',sans-serif;
}
.card-sound:hover,.card-sound:active{background:rgba(129,199,132,.22)}
.card-sound.playing{background:rgba(129,199,132,.3);border-color:rgba(129,199,132,.6)}

/* ─── TRANSLATION STATE ─── */
body.malayalam-mode .card-name{display:none}
body.malayalam-mode .card-name-ml{display:block}
body.malayalam-mode .card-desc{display:none}
body.malayalam-mode .card-desc-ml{display:block}
body.malayalam-mode .facts-list li.en-fact{display:none}
body.malayalam-mode .facts-list li.ml-fact{display:list-item}

/* ─── TOUCH RING ─── */
.touch-ring{position:fixed;width:60px;height:60px;border:3px solid rgba(129,199,132,.6);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%) scale(0);animation:ringPop .6s ease forwards}
@keyframes ringPop{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}

/* ─── COUNT BADGE ─── */
.animal-count{font-size:10px;color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:2px 10px;white-space:nowrap}
</style>
</head>
<body>
<audio id="forest-music" preload="auto" loop>
  <source src="../assets/Audio/capaholiczsfx-forest-daytime-446356.mp3" type="audio/mpeg">
</audio>

<!-- PARALLAX SCENE -->
<div class="scene" id="scene">
  <div class="forest-bg" id="forestBg">
    <div class="forest-layer p1" id="layer1"></div>
    <div class="forest-layer p2" id="layer2"></div>
    <div class="forest-layer p3" id="layer3"></div>
    <div class="forest-layer p4" id="layer4"></div>
    <div class="forest-layer p5" id="layer5"></div>
  </div>
</div>

<div class="app">

  <!-- ═══ HEADER ═══ -->
  <div class="header">
    <h1>🌿 Forest Animals Showcase</h1>
    <p>Drag 3D models · Tap for sound</p>
  </div>

  <!-- ═══ FILTER BAR ═══ -->
  <div class="filter-bar">
    <span class="filter-label">Filter:</span>
    <button class="filter-tab active" data-filter="all">All Animals</button>
    <button class="filter-tab" data-filter="indian">🇮🇳 Indian</button>
    <button class="filter-tab" data-filter="domestic">🏡 Domestic</button>
    <button class="filter-tab" data-filter="wild">🌲 Wild</button>
    <span id="countBadge" class="animal-count">21 animals</span>
  </div>

  <!-- ═══ SCROLL AREA ═══ -->
  <div class="scroll-area">
    <button class="arrow-btn arrow-left" id="prevBtn">&#9664;</button>
    <div class="scroll-track" id="scrollTrack"></div>
    <button class="arrow-btn arrow-right" id="nextBtn">&#9654;</button>
  </div>

</div>

<!-- ═══ TOOLBAR (FLOATING RIGHT) ═══ -->
<div class="toolbar">
  <div class="toolbar-right">
    <button class="tb-btn tb-btn-back" id="backBtn">← Back</button>
    <button class="tb-btn tb-btn-ml" id="mlToggle" title="Translate to Malayalam">🔤 ML</button>
    <button class="tb-btn tb-btn-audio" id="audioToggle">🔊</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// ANIMAL DATA — 22 animals (including native Indian ones)

    factsMl:['ജീവിതകാലം 80 പല്ലുകൾ മാറുന്നു','ഒരു മണിക്കൂറിലധികം ശ്വാസം പിടിക്കാൻ കഴിയും','ഉരഗങ്ങളിൽ ഏറ്റവും പഴക്കമുള്ള കുഞ്ഞ് പരിചരണം'],
    soundUrl:'../assets/Audio/animals/alligator.mp3',
    category:'indian-wild', model:'../3dmodels/crocodile.glb'
  },
  {
    name:'Indian Rhinoceros', latin:'Rhinoceros unicornis', emoji:'🦏',

// MODEL PATH HELPER
// ══════════════════════════════════════════════════════
function resolveModelPath(relPath) {
  if (typeof process !== 'undefined' && process.versions && process.versions.electron) {
    var path = require('path');
    var fs = require('fs');
    var appPath = path.dirname(__dirname);
    var normal = path.join(appPath, relPath.replace(/^\.\.\//, ''));
    var unpacked = normal.replace('app.asar', 'app.asar.unpacked');
    if (fs.existsSync(unpacked)) return 'file://' + unpacked.replace(/\\/g, '/');
    if (fs.existsSync(normal)) return 'file://' + normal.replace(/\\/g, '/');
  }
  return relPath;
}

// BUILD CARDS
// ══════════════════════════════════════════════════════
function buildCards() {
  var track = document.getElementById('scrollTrack');
  track.innerHTML = '';

  ANIMALS.forEach(function(animal, idx) {
    var card = document.createElement('div');
    var isIndian = animal.category === 'indian-wild' || animal.category === 'indian-domestic';
    var isDomestic = animal.category === 'indian-domestic';

    card.className = 'card' +
      (isIndian ? ' indian-native' : '') +
      (isDomestic ? ' domestic' : '') +
      ' cat-' + animal.category;

    // Badge label
    var badgeLabel = isIndian ? (isDomestic ? '🏡 Indian Domestic' : '🇮🇳 Indian Wild') : '';

    // Facts HTML
    var factsHtml = '';
    (animal.facts || []).forEach(function(f, i) {
      factsHtml += '<li class="en-fact">' + f + '</li>';
    });
    (animal.factsMl || []).forEach(function(f, i) {
      factsHtml += '<li class="ml-fact">' + f + '</li>';
    });

    // Model HTML
    var modelHtml;
    if (animal.model) {
      var modelSrc = resolveModelPath(animal.model);
      var animAttr = animal.animation ? ' animation-name="' + animal.animation + '"' : '';
      modelHtml =
        '<div class="model-area" data-idx="' + idx + '">' +
          '<model-viewer class="animal-viewer" src="' + modelSrc + '" auto-rotate camera-controls interaction-prompt="none" shadow-intensity="0.8" exposure="1.5" environment-image="neutral" camera-orbit="0deg 75deg 2.5m" tone-mapping="commerce"' + animAttr + '></model-viewer>' +
          '<span class="model-badge">3D MODEL</span>' +
        '</div>';
    } else {
      modelHtml =
        '<div class="model-area" data-idx="' + idx + '">' +
          '<div class="model-placeholder">' +
            '<div class="cube" data-cube="' + idx + '">' +
              '<div class="cube-face">' + animal.emoji + '</div>' +
              '<div class="cube-face">' + animal.emoji + '</div>' +
              '<div class="cube-face">' + animal.emoji + '</div>' +
              '<div class="cube-face">' + animal.emoji + '</div>' +
              '<div class="cube-face">' + animal.emoji + '</div>' +
              '<div class="cube-face">' + animal.emoji + '</div>' +
            '</div>' +
          '</div>' +
          '<span class="model-badge">DRAG TO ROTATE</span>' +
        '</div>';
    }

    card.innerHTML =
      (badgeLabel ? '<div class="card-region-badge">' + badgeLabel + '</div>' : '') +
      modelHtml +
      '<div class="card-body">' +
        '<div class="card-top">' +
          '<span class="card-emoji">' + animal.emoji + '</span>' +
          '<div class="card-titles">' +
            '<div class="card-name">' + animal.name + '</div>' +
            '<div class="card-name-ml">' + (animal.nameMl || animal.name) + '</div>' +
            '<div class="card-latin">' + animal.latin + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-desc">' + animal.desc + '</div>' +
        '<div class="card-desc-ml">' + (animal.descMl || animal.desc) + '</div>' +
        '<ul class="facts-list">' + factsHtml + '</ul>' +
        '<button class="card-sound" data-index="' + idx + '">🔊 Sound</button>' +
      '</div>';

    track.appendChild(card);
  });

  initCubeRotations();
  initAnimationPause();
  applyFilter(currentFilter);
}

// ══════════════════════════════════════════════════════
// ANIMATION PAUSE (keep animations paused & never play)
// ══════════════════════════════════════════════════════
function initAnimationPause() {
  document.querySelectorAll('model-viewer.animal-viewer').forEach(function(viewer) {
    if (viewer.getAttribute('animation-name')) {
      // Wait for model to load
      viewer.addEventListener('load', function() {
        setTimeout(function() {
          if (viewer.animationName && viewer.currentTime !== undefined) {
            viewer.pause();
          }
        }, 100);
      });
      // Also immediately pause on demand
      viewer.addEventListener('play', function(e) {
        if (viewer.animationName === viewer.getAttribute('animation-name')) {
          viewer.pause();
        }
      });
    }
  });
}

function initCubeRotations() {
  document.querySelectorAll('.model-area').forEach(function(area) {
    var cubeEl = area.querySelector('.cube');
    if (!cubeEl) return;
    var rotX = -20, rotY = 0, startX, startY, dragging = false, autoSpin = true;

    (function spin() {
      if (autoSpin) {
        rotY += 0.5;
        cubeEl.style.transform = 'rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
      }
      requestAnimationFrame(spin);
    })();

    area.addEventListener('pointerdown', function(e) {
      dragging = true; autoSpin = false;
      startX = e.clientX; startY = e.clientY;
      area.setPointerCapture(e.pointerId); e.preventDefault();
    });
    area.addEventListener('pointermove', function(e) {
      if (!dragging) return;
      rotY += (e.clientX - startX) * 0.8;
      rotX -= (e.clientY - startY) * 0.8;
      rotX = Math.max(-80, Math.min(80, rotX));
      cubeEl.style.transform = 'rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
      startX = e.clientX; startY = e.clientY; e.preventDefault();
    });
    area.addEventListener('pointerup', function() { dragging = false; setTimeout(function() { autoSpin = true; }, 2000); });
    area.addEventListener('pointercancel', function() { dragging = false; setTimeout(function() { autoSpin = true; }, 2000); });
  });
}

// ══════════════════════════════════════════════════════
// FILTER
// ══════════════════════════════════════════════════════
function applyFilter(filter) {
  currentFilter = filter;
  var cards = document.querySelectorAll('.card');
  var count = 0;
  cards.forEach(function(card) {
    var show = false;
    if (filter === 'all') show = true;
    else if (filter === 'indian') show = card.classList.contains('indian-native');
    else if (filter === 'domestic') show = card.classList.contains('domestic');
    else if (filter === 'wild') show = !card.classList.contains('domestic');
    card.classList.toggle('hidden', !show);
    if (show) count++;
  });
  document.getElementById('countBadge').textContent = count + ' animal' + (count !== 1 ? 's' : '');

  document.querySelectorAll('.filter-tab').forEach(function(tab) {
    tab.classList.toggle('active', tab.dataset.filter === filter);
  });
}

// ══════════════════════════════════════════════════════
// SOUND
// ══════════════════════════════════════════════════════
function playAnimalSound(soundUrl, btn) {
  if (!soundUrl || btn.classList.contains('playing')) return;
  btn.classList.add('playing');
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }

  var audio = new Audio();
  audio.crossOrigin = 'anonymous';
  audio.volume = 0.7;
  audio.src = soundUrl;
  currentAudio = audio;
  var cleanup = function() { btn.classList.remove('playing'); currentAudio = null; };
  audio.onended = cleanup;
  audio.onerror = cleanup;
  audio.play().catch(cleanup);
  setTimeout(cleanup, 20000);
}

// ══════════════════════════════════════════════════════
// SCROLL ARROWS
// ══════════════════════════════════════════════════════
function scrollBy(dir) {
  var track = document.getElementById('scrollTrack');
  var firstCard = track.querySelector('.card:not(.hidden)');
  var cardW = firstCard ? firstCard.offsetWidth + 12 : 262;
  track.scrollBy({ left: dir * cardW, behavior: 'smooth' });
}

// ══════════════════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════════════════
document.getElementById('prevBtn').addEventListener('click', function() { scrollBy(-1); });
document.getElementById('nextBtn').addEventListener('click', function() { scrollBy(1); });

// Malayalam toggle

  isMalayalam = !isMalayalam;
  document.body.classList.toggle('malayalam-mode', isMalayalam);
  this.classList.toggle('active', isMalayalam);
  this.textContent = isMalayalam ? '🔤 English' : '🔤 മലയാളം';
});

// Audio toggle
document.getElementById('audioToggle').addEventListener('click', function() {
  if (musicPlaying) {
    forestMusic.pause(); musicPlaying = false; this.textContent = '🔇';
  } else {
    forestMusic.volume = 0.5;
    forestMusic.play().catch(function(){});
    musicPlaying = true; document.getElementById('audioToggle').textContent = '🔊';
  }
});

// Back button
document.getElementById('backBtn').addEventListener('click', function() {
  forestMusic.pause();
  location.href = '../index.html';
});

// Filter tabs
document.querySelectorAll('.filter-tab').forEach(function(tab) {
  tab.addEventListener('click', function() { applyFilter(this.dataset.filter); });
});

// Sound buttons
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.card-sound');
  if (btn && e.isTrusted) {
    playAnimalSound(ANIMALS[parseInt(btn.dataset.index)].soundUrl, btn);
  }
});
document.addEventListener('touchend', function(e) {
  var btn = e.target.closest('.card-sound');
  if (btn) { e.preventDefault(); e.stopPropagation(); playAnimalSound(ANIMALS[parseInt(btn.dataset.index)].soundUrl, btn); }
}, { passive: false });

// ══════════════════════════════════════════════════════
// PARALLAX LAYERS
// ══════════════════════════════════════════════════════
var layers = [
  document.getElementById('layer1'),
  document.getElementById('layer2'),
  document.getElementById('layer3'),
  document.getElementById('layer4'),
  document.getElementById('layer5')
];
document.addEventListener('mousemove', function(e) {
  if (window.innerWidth > 700) {
    var ax = -(window.innerWidth / 2 - e.pageX) / 25;
    layers.forEach(function(layer, idx) {
      layer.style.transform = 'translateX(' + (ax / (16 - idx)) + 'px)';
    });
  }
});

// ══════════════════════════════════════════════════════
// FIREFLIES & LEAVES
// ══════════════════════════════════════════════════════
var sc = document.getElementById('scene');
for (var i = 0; i < 20; i++) {
  var f = document.createElement('div');
  f.className = 'firefly';
  f.style.left = (Math.random() * 100) + '%';
  f.style.top = (Math.random() * 100) + '%';
  f.style.setProperty('--dur', (3 + Math.random() * 5) + 's');
  f.style.setProperty('--dx', ((Math.random() - .5) * 100) + 'px');
  f.style.setProperty('--dy', ((Math.random() - .5) * 100) + 'px');
  f.style.animationDelay = (Math.random() * 5) + 's';
  sc.appendChild(f);
}
['🍃','🍂','🍁'].forEach(function(emoji) {
  for (var i = 0; i < 3; i++) {
    var l = document.createElement('div');
    l.className = 'leaf'; l.textContent = emoji;
    l.style.left = (Math.random() * 100) + '%';
    l.style.setProperty('--dur', (8 + Math.random() * 6) + 's');
    l.style.setProperty('--dx', ((Math.random() - .5) * 150) + 'px');
    l.style.animationDelay = (Math.random() * 10) + 's';
    sc.appendChild(l);
  }
});

// Touch ring effect
document.addEventListener('touchstart', function(e) {
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    var ring = document.createElement('div');
    ring.className = 'touch-ring';
    ring.style.left = t.clientX + 'px';
    ring.style.top = t.clientY + 'px';
    document.body.appendChild(ring);
    ring.addEventListener('animationend', function() { this.remove(); });
  }
}, { passive: true });
