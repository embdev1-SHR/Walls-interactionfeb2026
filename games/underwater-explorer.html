<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Underwater Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;touch-action:none}

#ocean{position:fixed;inset:0;transition:background 1.8s ease}
.zone-reef   #ocean{background:linear-gradient(180deg,#0095c8 0%,#0077a3 15%,#005a7a 35%,#003d5c 65%,#002a40 100%)}
.zone-open   #ocean{background:linear-gradient(180deg,#003a70 0%,#002550 25%,#001a38 55%,#000e20 100%)}
.zone-deep   #ocean{background:linear-gradient(180deg,#08082a 0%,#050518 25%,#020210 55%,#010108 100%)}

.caustic-layer{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.25;transition:opacity 1.8s;animation:causticShift 12s ease-in-out infinite alternate}
.zone-deep .caustic-layer{opacity:.03}
@keyframes causticShift{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(20deg)}}

#light-rays{position:fixed;top:-10%;left:0;right:0;height:70%;z-index:1;pointer-events:none;transition:opacity 1.8s}
.zone-deep  #light-rays{opacity:.03}
.zone-open  #light-rays{opacity:.14}
.zone-reef  #light-rays{opacity:.30}
.ray{position:absolute;top:0;background:linear-gradient(180deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.04) 50%,transparent 100%);transform-origin:top center;animation:shimmer var(--dur,8s) ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.4;transform:rotate(var(--r,0deg)) scaleX(1)}50%{opacity:.9;transform:rotate(var(--r,0deg)) scaleX(1.5)}}

canvas#bubble-cv{position:fixed;inset:0;z-index:2;pointer-events:none}

#seabed{position:fixed;bottom:0;left:0;right:0;z-index:3;pointer-events:none;overflow:hidden;height:32vh;transition:opacity 1.8s,transform 1.8s}
.zone-reef  #seabed{opacity:1;transform:translateY(0)}
.zone-open  #seabed{opacity:.12;transform:translateY(55%)}
.zone-deep  #seabed{opacity:.02;transform:translateY(85%)}

.kelp{position:fixed;bottom:0;z-index:3;pointer-events:none;transition:opacity 1.8s,transform 1.8s}
.zone-open .kelp{opacity:.15;transform:translateY(35%)}
.zone-deep .kelp{opacity:.01;transform:translateY(65%)}
.kelp-strand{position:absolute;bottom:0;width:18px;border-radius:50% 50% 0 0;animation:kelpSway var(--dur,6s) ease-in-out infinite alternate;transform-origin:bottom center}
@keyframes kelpSway{0%{transform:rotate(-8deg) scaleY(1)}50%{transform:rotate(5deg) scaleY(1.04)}100%{transform:rotate(-6deg) scaleY(.97)}}

.seagrass{position:fixed;bottom:0;z-index:3;pointer-events:none;transition:opacity 1.8s}
.zone-open .seagrass{opacity:.12}
.zone-deep .seagrass{opacity:.01}
.grass-blade{position:absolute;bottom:0;width:4px;border-radius:3px 3px 0 0;animation:grassSway var(--dur,4s) ease-in-out infinite alternate;transform-origin:bottom center}
@keyframes grassSway{0%{transform:rotate(-12deg)}100%{transform:rotate(12deg)}}

#dive-layer{position:fixed;inset:0;z-index:5;transition:transform .9s cubic-bezier(.4,0,.2,1),opacity .7s ease}
.dive-down         #dive-layer{transform:translateY(-120vh);opacity:0}
.dive-up           #dive-layer{transform:translateY(120vh);opacity:0}
.dive-enter-down   #dive-layer{transform:translateY(120vh);opacity:0}
.dive-enter-up     #dive-layer{transform:translateY(-120vh);opacity:0}

#creatures{position:absolute;inset:0}

.creature{
  position:absolute;cursor:pointer;will-change:transform,left,top;
  transition:filter .3s;display:flex;align-items:center;justify-content:center;
}
.creature:hover{filter:brightness(1.25) drop-shadow(0 0 22px rgba(80,200,255,.7))!important}
.creature:active{filter:brightness(.85)!important}
.creature-svg{width:100%;height:100%;display:block;transition:transform .3s}
.creature:hover .creature-svg{transform:scale(1.1)}

.creature-name{
  position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);
  background:rgba(0,20,50,.88);backdrop-filter:blur(8px);
  color:#fff;font-size:11px;font-weight:800;
  padding:3px 12px;border-radius:20px;white-space:nowrap;
  opacity:0;transition:opacity .3s;pointer-events:none;
  border:1px solid rgba(100,200,255,.25);
}
.creature:hover .creature-name{opacity:1}

/* ── Info Panel ── */
#info-panel{position:fixed;inset:0;z-index:200;background:rgba(0,10,28,.92);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center}
#info-panel.open{display:flex}
.info-card{
  background:linear-gradient(145deg,#071e36,#0c2d4d);
  border-radius:24px;max-width:560px;width:92%;overflow:hidden;
  border:2px solid rgba(100,200,255,.18);
  box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 80px rgba(0,100,200,.1);
  animation:infoIn .45s cubic-bezier(.175,.885,.32,1.275);
  max-height:90vh;overflow-y:auto;
}
@keyframes infoIn{from{transform:scale(.7) translateY(50px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.info-svg-wrap{
  width:100%;height:200px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(0,80,150,.3),rgba(0,50,100,.2));
  border-bottom:1px solid rgba(100,200,255,.1);padding:18px;
}
.info-svg-wrap svg{width:160px;height:160px;filter:drop-shadow(0 8px 24px rgba(0,100,200,.4))}
.info-body{padding:22px 26px 26px}
.info-title{font-size:26px;font-weight:900;color:#64d2ff;margin-bottom:2px;text-shadow:0 2px 10px rgba(100,210,255,.25)}
.info-latin{font-size:12px;color:rgba(255,255,255,.35);font-style:italic;margin-bottom:14px}
.info-facts{list-style:none;padding:0}
.info-facts li{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.85);font-size:14px;font-weight:600;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.info-facts li:last-child{border-bottom:none}
.fact-ic{font-size:17px;flex-shrink:0;margin-top:1px}
.info-close-btn{display:block;width:100%;margin-top:18px;padding:13px;background:linear-gradient(135deg,#0077b6,#0096c7);color:white;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .3s,transform .2s;box-shadow:0 4px 16px rgba(0,119,182,.3)}
.info-close-btn:hover{background:linear-gradient(135deg,#0096c7,#00b4d8)}
.info-close-btn:active{transform:scale(.96)}

/* ── RIGHT TOOLBAR ── */
#right-toolbar {
  position: fixed;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(0, 15, 35, 0.82);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(100,200,255,.18);
  border-radius: 28px;
  padding: 14px 10px;
  box-shadow: 0 8px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
}

/* Back button in toolbar */
.tb-back-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0,90,180,.8), rgba(0,55,130,.9));
  border: 1px solid rgba(80,180,255,.3);
  color: rgba(180,230,255,.95);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .25s;
  font-family: 'Nunito', sans-serif;
}
.tb-back-btn:hover { background: linear-gradient(135deg, rgba(0,130,255,.9), rgba(0,75,170,.95)); transform: scale(1.1); box-shadow: 0 4px 18px rgba(0,100,255,.4); }

/* Language button in toolbar */
.tb-lang-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(20,80,140,.7);
  border: 1px solid rgba(100,200,255,.2);
  color: rgba(150,220,255,.9);
  font-size: 9px;
  font-weight: 900;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .25s;
  font-family: 'Nunito', sans-serif;
  text-align: center;
  line-height: 1.2;
  padding: 4px;
}
.tb-lang-btn:hover { background: rgba(0,120,220,.8); transform: scale(1.1); box-shadow: 0 4px 18px rgba(0,100,200,.35); color: #fff; }

/* Divider */
.tb-divider {
  width: 28px;
  height: 1px;
  background: rgba(100,200,255,.15);
  margin: 2px 0;
}

/* Zone buttons */
.tb-zone-btn {
  width: 44px;
  border-radius: 14px;
  background: transparent;
  border: 1px solid rgba(100,200,255,.1);
  color: rgba(255,255,255,.5);
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  padding: 8px 4px;
  transition: all .3s;
  font-family: 'Nunito', sans-serif;
}
.tb-zone-btn:hover { background: rgba(100,200,255,.1); color: rgba(255,255,255,.85); border-color: rgba(100,200,255,.25); }
.tb-zone-btn.active {
  background: rgba(100,210,255,.14);
  border-color: rgba(100,210,255,.4);
  color: #64d2ff;
  box-shadow: 0 0 16px rgba(100,210,255,.15);
}
.tb-zone-emoji { font-size: 18px; line-height: 1; }
.tb-zone-label { font-size: 7.5px; font-weight: 800; text-align: center; line-height: 1.2; letter-spacing: .3px; white-space: nowrap; }

/* Depth indicator within toolbar */
.tb-depth-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.tb-depth-track {
  width: 3px;
  height: 14px;
  background: rgba(255,255,255,.08);
  border-radius: 2px;
  position: relative;
  margin: 0;
}
.tb-depth-track-fill {
  position: absolute;
  top: 0; left: 0; width: 100%;
  border-radius: 2px;
  background: linear-gradient(180deg, #64d2ff, #0077b6);
  transition: height .8s ease;
}

/* Header */
.hdr{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;text-align:center;pointer-events:none}
.hdr h1{font-size:clamp(18px,3.2vw,34px);font-weight:900;color:rgba(255,255,255,.88);text-shadow:0 2px 14px rgba(0,80,180,.4)}
.hdr p{font-size:clamp(11px,1.4vw,14px);font-weight:600;color:rgba(100,210,255,.6);margin-top:1px}

.floating-particle{position:fixed;pointer-events:none;z-index:4;border-radius:50%;background:rgba(180,220,255,.15);animation:pFloat var(--t,10s) linear infinite}
@keyframes pFloat{0%{transform:translateY(0) translateX(0) scale(1);opacity:.2}50%{transform:translateY(calc(var(--dy,-300px)*.5)) translateX(var(--sx,15px)) scale(.8);opacity:.15}100%{transform:translateY(var(--dy,-300px)) translateX(0) scale(.6);opacity:0}}
</style>
</head>
<body class="zone-reef">

<div id="ocean"></div>
<div class="caustic-layer"></div>
<div id="light-rays"></div>
<canvas id="bubble-cv"></canvas>
<div id="kelp-container"></div>
<div id="seagrass-container"></div>

<div id="dive-layer">
  <div id="creatures"></div>
</div>

<div class="hdr">
  <h1 id="main-title">Underwater Explorer</h1>
  <p id="zone-desc">Coral Reef — Tap any creature to learn about it!</p>
</div>

<!-- RIGHT TOOLBAR: Back, Language, Zone switcher + depth indicators -->
<div id="right-toolbar">
  <!-- Back -->
  <button class="tb-back-btn" id="globalBackBtn" title="Back">←</button>
  <!-- Language -->
  <button class="tb-lang-btn" id="lang-btn">മല<br>യാളം</button>

  <div class="tb-divider"></div>

  <!-- Reef -->
  <button class="tb-zone-btn active" data-z="reef">
    <span class="tb-zone-emoji">🏝️</span>
    <span class="tb-zone-label" id="label-reef">Coral<br>Reef</span>
  </button>
  <div class="tb-depth-section">
    <div class="tb-depth-track"><div class="tb-depth-track-fill" id="depth-fill-1" style="height:0%"></div></div>
  </div>
  <!-- Open Ocean -->
  <button class="tb-zone-btn" data-z="open">
    <span class="tb-zone-emoji">🌊</span>
    <span class="tb-zone-label" id="label-open">Open<br>Ocean</span>
  </button>
  <div class="tb-depth-section">
    <div class="tb-depth-track"><div class="tb-depth-track-fill" id="depth-fill-2" style="height:0%"></div></div>
  </div>
  <!-- Deep Sea -->
  <button class="tb-zone-btn" data-z="deep">
    <span class="tb-zone-emoji">🌑</span>
    <span class="tb-zone-label" id="label-deep">Deep<br>Sea</span>
  </button>
</div>

<div id="info-panel">
  <div class="info-card">
    <div class="info-svg-wrap" id="ip-svg"></div>
    <div class="info-body">
      <h2 class="info-title"  id="ip-name"></h2>
      <p  class="info-latin"  id="ip-latin"></p>
      <ul class="info-facts"  id="ip-facts"></ul>
      <button class="info-close-btn" id="ip-close">Got it!</button>
    </div>
  </div>
</div>

           ml:[{i:'🎨',t:'വേഷംമാറ്റത്തിന്റെ പരമ ഗുരു — നിറം, പാറ്റേൺ, ആകൃതി'},{i:'🧠',t:'എല്ലാ അകശേരുക്കളിലും ഏറ്റവും വലിയ മസ്തിഷ്ക-ശരീര അനുപാതം'},{i:'👀',t:'W-ആകൃതിയിലുള്ള കൃഷ്ണമണികൾ'}]}}
};

/* ════════════════════════════════════════════════════
   ENGINE
════════════════════════════════════════════════════ */
var W=window.innerWidth, H=window.innerHeight;
var zone='reef', currentLang='en';
var layer=document.getElementById('creatures');
var alive=[], raf;
var ZONE_ORDER=['reef','open','deep'];
var transitioning=false;

function buildRays(){
  var el=document.getElementById('light-rays');
  for(var i=0;i<9;i++){
    var r=document.createElement('div'); r.className='ray';
    r.style.left=(3+Math.random()*94)+'%';
    r.style.width=(25+Math.random()*90)+'px'; r.style.height='120%';
    r.style.setProperty('--r',(-20+Math.random()*40)+'deg');
    r.style.setProperty('--dur',(5+Math.random()*7)+'s');
    r.style.animationDelay=(Math.random()*8)+'s';
    el.appendChild(r);
  }
}
function buildKelp(){
  var container=document.getElementById('kelp-container');
  for(var i=0;i<12;i++){
    var kelp=document.createElement('div'); kelp.className='kelp';
    kelp.style.left=(2+Math.random()*96)+'%';
    var ns=2+Math.floor(Math.random()*3);
    for(var j=0;j<ns;j++){
      var strand=document.createElement('div'); strand.className='kelp-strand';
      strand.style.height=(80+Math.random()*160)+'px';
      strand.style.left=(j*10-8)+'px';
      strand.style.background='linear-gradient(180deg,#1a6b3c 0%,rgba(10,60,30,.3) 100%)';
      strand.style.setProperty('--dur',(4+Math.random()*5)+'s');
      strand.style.animationDelay=(Math.random()*4)+'s';
      strand.style.opacity=.3+Math.random()*.3;
      kelp.appendChild(strand);
    }
    container.appendChild(kelp);
  }
}
function buildSeagrass(){
  var container=document.getElementById('seagrass-container');
  for(var i=0;i<40;i++){
    var grass=document.createElement('div'); grass.className='seagrass';
    grass.style.left=Math.random()*100+'%';
    var blade=document.createElement('div'); blade.className='grass-blade';
    blade.style.height=(30+Math.random()*70)+'px';
    blade.style.background='linear-gradient(180deg,rgba(20,100,50,.18) 0%,rgba(10,60,30,.05) 100%)';
    blade.style.setProperty('--dur',(3+Math.random()*4)+'s');
    blade.style.animationDelay=(Math.random()*5)+'s';
    grass.appendChild(blade); container.appendChild(grass);
  }
}
function buildParticles(){
  for(var i=0;i<20;i++){
    var p=document.createElement('div'); p.className='floating-particle';
    var sz=3+Math.random()*8; p.style.width=sz+'px'; p.style.height=sz+'px';
    p.style.left=Math.random()*100+'%'; p.style.top=(20+Math.random()*70)+'%';
    p.style.setProperty('--t',(7+Math.random()*10)+'s');
    p.style.setProperty('--dy',(-200-Math.random()*400)+'px');
    p.style.setProperty('--sx',(-20+Math.random()*40)+'px');
    p.style.animationDelay=(Math.random()*10)+'s';
    document.body.appendChild(p);
  }
}

// Bubbles
var bCv=document.getElementById('bubble-cv');
var bCtx=bCv.getContext('2d');
var bubbles=[];
function resizeBubbles(){bCv.width=window.innerWidth;bCv.height=window.innerHeight;}
function addBubble(){
  if(bubbles.length>55)return;
  bubbles.push({x:Math.random()*W,y:H+10,r:1.5+Math.random()*5,v:.4+Math.random()*1.2,w:Math.random()*Math.PI*2,ws:.008+Math.random()*.025,a:.1+Math.random()*.18});
}
function drawBubbles(){
  bCtx.clearRect(0,0,bCv.width,bCv.height);
  bubbles=bubbles.filter(function(b){
    b.y-=b.v; b.w+=b.ws; b.x+=Math.sin(b.w)*.35;
    if(b.y<-15)return false;
    bCtx.beginPath(); bCtx.arc(b.x,b.y,b.r,0,Math.PI*2);
    bCtx.fillStyle='rgba(170,215,255,'+b.a+')'; bCtx.fill();
    bCtx.beginPath(); bCtx.arc(b.x-b.r*.28,b.y-b.r*.28,b.r*.18,0,Math.PI*2);
    bCtx.fillStyle='rgba(255,255,255,'+(b.a+.08)+')'; bCtx.fill();
    return true;
  });
}

function updateLanguage(){
  var t=TRANSLATIONS[currentLang];
  document.getElementById('main-title').textContent=t.title;
  document.getElementById('lang-btn').innerHTML=t.langBtn==='English'?'EN':'മല<br>യാളം';
  document.getElementById('ip-close').textContent=t.closeBtn;
  document.getElementById('zone-desc').textContent=t.zones[zone].desc;
  document.querySelectorAll('.tb-zone-btn').forEach(function(tab){
    tab.querySelector('.tb-zone-label').textContent=t.zones[tab.dataset.z].label;
  });
}
function toggleLanguage(){
  currentLang=currentLang==='en'?'ml':'en';
  updateLanguage(); spawnCreatures();
}

function spawnCreatures(){
  layer.innerHTML=''; alive=[];
  var ids=ZONE_CFG[zone];
  ids.forEach(function(id){
    var d=DATA[id]; if(!d)return;
    var svgMarkup=SVGS[d.svgKey]||'';
    var el=document.createElement('div');
    el.className='creature';
    el.style.width=d.sz+'px'; el.style.height=d.sz+'px';
    var svgWrap=document.createElement('div');
    svgWrap.className='creature-svg'; svgWrap.innerHTML=svgMarkup;
    el.appendChild(svgWrap);
    var lbl=document.createElement('div');
    lbl.className='creature-name'; lbl.textContent=d.name[currentLang];
    el.appendChild(lbl);
    var pad=80, rightPad=100;
    var sx=pad+Math.random()*(W-d.sz-pad-rightPad);
    var sy=pad+Math.random()*(H-d.sz-pad*2-80);
    el.style.left=sx+'px'; el.style.top=sy+'px';
    el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();openInfo(id);});
    layer.appendChild(el);
    alive.push({el:el,x:sx,y:sy,sz:d.sz,spd:d.spd,phaseOffset:Math.random()*Math.PI*2,dp:.7+Math.random()*.3});
  });
}

var globalAngle=0,globalWave=0,globalDir=1,turnTimer=0;
function tick(){
  var mx=W-90,my=H-100;
  globalWave+=0.025; turnTimer++;
  if(turnTimer>180+Math.random()*120){
    globalAngle+=(Math.random()-.5)*.8;
    if(globalAngle>Math.PI/4)globalAngle=Math.PI/4;
    if(globalAngle<-Math.PI/4)globalAngle=-Math.PI/4;
    turnTimer=0;
  }
  var baseVx=Math.cos(globalAngle)*.6*globalDir;
  var baseVy=Math.sin(globalAngle)*.3;
  alive.forEach(function(c){
    var phase=globalWave+c.phaseOffset;
    c.x+=baseVx*c.spd+Math.cos(phase*.5)*.08;
    c.y+=baseVy*c.spd*.5+Math.sin(phase)*.15;
    if(c.x<30){c.x=30;if(globalDir>0){globalDir=-1;globalAngle=Math.PI+(Math.random()-.5)*.5;}}
    if(c.x>mx-c.sz){c.x=mx-c.sz;if(globalDir<0){globalDir=1;globalAngle=(Math.random()-.5)*.5;}}
    if(c.y<85){c.y=85;globalAngle=Math.abs(globalAngle)*.5;}
    if(c.y>my-c.sz){c.y=my-c.sz;globalAngle=-Math.abs(globalAngle)*.5;}
    c.el.style.left=c.x+'px'; c.el.style.top=c.y+'px';
    c.el.style.transform='scaleX('+globalDir+') translateY('+Math.sin(phase)*10+'px)';
    c.el.style.opacity=c.dp;
  });
}

function openInfo(id){
  var d=DATA[id]; if(!d)return;
  document.getElementById('ip-svg').innerHTML=SVGS[d.svgKey]||'';
  document.getElementById('ip-name').textContent=d.name[currentLang];
  document.getElementById('ip-latin').textContent=d.latin;
  var ul=document.getElementById('ip-facts'); ul.innerHTML='';
  d.facts[currentLang].forEach(function(f){
    var li=document.createElement('li');
    var ic=document.createElement('span'); ic.className='fact-ic'; ic.textContent=f.i;
    var tx=document.createElement('span'); tx.textContent=f.t;
    li.appendChild(ic); li.appendChild(tx); ul.appendChild(li);
  });
  document.getElementById('info-panel').classList.add('open');
  playPop();
}
function closeInfo(){document.getElementById('info-panel').classList.remove('open');}
document.getElementById('ip-close').addEventListener('click',closeInfo);
document.getElementById('info-panel').addEventListener('click',function(e){if(e.target===this)closeInfo();});
document.getElementById('lang-btn').addEventListener('click',toggleLanguage);

function switchZone(z){
  if(z===zone||transitioning)return;
  transitioning=true;
  var oldIdx=ZONE_ORDER.indexOf(zone),newIdx=ZONE_ORDER.indexOf(z);
  var deeper=newIdx>oldIdx;
  document.body.classList.add(deeper?'dive-down':'dive-up');
  setTimeout(function(){
    zone=z; globalAngle=0; globalDir=1; turnTimer=0;
    document.body.className='zone-'+z+' '+(deeper?'dive-enter-down':'dive-enter-up');
    document.getElementById('zone-desc').textContent=TRANSLATIONS[currentLang].zones[z].desc;
    document.querySelectorAll('.tb-zone-btn').forEach(function(t){t.classList.toggle('active',t.dataset.z===z);});
    updateDepthFill(z); spawnCreatures();
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      document.body.className='zone-'+z; transitioning=false;
    });});
  },700);
}
function updateDepthFill(z){
  var f1=document.getElementById('depth-fill-1');
  var f2=document.getElementById('depth-fill-2');
  if(z==='reef'){f1.style.height='0%';f2.style.height='0%';}
  else if(z==='open'){f1.style.height='100%';f2.style.height='0%';}
  else{f1.style.height='100%';f2.style.height='100%';}
}
document.querySelectorAll('.tb-zone-btn').forEach(function(b){b.addEventListener('click',function(){switchZone(this.dataset.z);});});
document.getElementById('globalBackBtn').addEventListener('click',function(){
  if(window.history.length>1)history.back();
  else window.location.href='../index.html';
});

function playPop(){
  try{
    var ac=new(window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.frequency.setValueAtTime(380,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(760,ac.currentTime+.12);
    o.type='sine';
    g.gain.setValueAtTime(.1,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);
    o.start();o.stop(ac.currentTime+.25);
  }catch(e){}
}

function loop(){tick();drawBubbles();if(Math.random()<.16)addBubble();raf=requestAnimationFrame(loop);}
window.addEventListener('resize',function(){W=window.innerWidth;H=window.innerHeight;resizeBubbles();});

buildRays(); buildKelp(); buildSeagrass(); buildParticles();
resizeBubbles(); updateLanguage(); spawnCreatures(); loop();
</script>
</body>
</html>
