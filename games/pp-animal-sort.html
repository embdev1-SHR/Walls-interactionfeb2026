<!DOCTYPE html>
<!--
================================================================================
  Farm and Wild Animals - Pangappara Blueroom
================================================================================
  Binary sort, one queue per panel.

  Fifty-fifty every time, so unlike a four-way choice it cannot be narrowed by
  elimination - a child who guesses is wrong half the round, and the tally in
  their own panel header shows it.

  Three panels. Each child runs their own rounds and nobody waits for anyone
  else to finish; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Farm and Wild Animals</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#f4fbf6,#e6f4ec 70%,#daece0);user-select:none;touch-action:none}
  .row{display:flex;gap:.7vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(11px,2vh,22px);color:#2f7d4f;text-align:center;flex-shrink:0}
  /* Cards are square and sized from the PANEL, never the viewport: a panel is
     a third of the wall at three players, and viewport units overflow it. */
  .tile{flex:0 0 auto;aspect-ratio:1;width:clamp(40px,8.4vh,88px);
    border-radius:14px;background:#fff;border:3px solid #c3ddcc;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 10px rgba(40,50,70,.13);
    display:grid;place-items:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(18px,3.6vh,42px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(7px,1.2vh,12px);color:#26313b;line-height:1.25}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.22;pointer-events:none}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .big{width:clamp(56px,13vh,132px)}
  .pens{display:flex;gap:.8vw;width:100%;flex:1;min-height:0;padding-top:.4vh}
  .pen{flex:1;min-width:0;border-radius:16px;border:5px dashed #c3d3c0;
    background:rgba(255,255,255,.6);display:flex;flex-direction:column;
    align-items:center;padding:5px;cursor:pointer;overflow:hidden;
    transition:border-color .16s,transform .16s}
  .pen:active{transform:scale(.99)}
  .pen.good{border-color:#3fae7c;border-style:solid}
  .pen.bad{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .pen h3{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(9px,1.6vh,18px);color:#2f5240;margin-bottom:3px;text-align:center}
  .pen .got{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
  .pen .got span{font-size:clamp(14px,2.6vh,30px)}
  .now{width:clamp(56px,12vh,120px);height:clamp(56px,12vh,120px);border-radius:16px;
    overflow:hidden;border:4px solid #fff;box-shadow:0 6px 15px rgba(40,60,50,.22);flex-shrink:0}
  .now img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/animal-data.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var TOTAL=8;
TRIUP.start({
  title:{en:'Farm and Wild',ml:'\u0d28\u0d3e\u0d1f\u0d4d\u0d1f\u0d3f\u0d32\u0d4b \u0d15\u0d3e\u0d1f\u0d4d\u0d1f\u0d3f\u0d32\u0d4b'},
  hint:{en:'Put each animal in its pen',ml:'\u0d13\u0d30\u0d4b \u0d2e\u0d43\u0d17\u0d24\u0d4d\u0d24\u0d46\u0d2f\u0d41\u0d02 \u0d24\u0d30\u0d02\u0d24\u0d3f\u0d30\u0d3f\u0d15\u0d4d\u0d15\u0d42'},
  build:function(p, body, api){
    var st=api.state(p);
    var now=document.createElement('div'); now.className='now';
    var pens=document.createElement('div'); pens.className='pens';
    pens.innerHTML='<div class="pen" data-k="farm"><h3>\u0d28\u0d3e\u0d1f\u0d4d\u0d1f\u0d41</h3><div class="got"></div></div>'+
                   '<div class="pen" data-k="wild"><h3>\u0d15\u0d3e\u0d1f\u0d4d\u0d1f\u0d41</h3><div class="got"></div></div>';
    body.appendChild(now); body.appendChild(pens);
    pens.querySelectorAll('.pen').forEach(function(pen){
      WALL.bindTouch(pen,function(){ drop(pen); });
    });

    function next(){
      if(!st.queue.length){ now.innerHTML='';
        return api.win(p,{title:{en:'All sorted!',ml:'\u0d0e\u0d32\u0d4d\u0d32\u0d3e\u0d02 \u0d24\u0d30\u0d02\u0d24\u0d3f\u0d30\u0d3f\u0d1a\u0d4d\u0d1a\u0d41!'},onAgain:start}); }
      st.cur=st.queue.shift();
      var a=ANIMALS.all[st.cur.id];
      now.innerHTML='<img src="'+a.img+'" alt="">';
      api.pill(p,'sorted',st.done+' / '+TOTAL);
      if(p===0&&WALL.voiceOn()) WALL.say(a.ml);
    }
    function drop(pen){
      if(!st.cur) return;
      if(pen.dataset.k===st.cur.side){
        pen.classList.add('good'); setTimeout(function(){pen.classList.remove('good');},450);
        var s=document.createElement('span'); s.textContent=ANIMALS.all[st.cur.id].emoji;
        pen.querySelector('.got').appendChild(s);
        st.done++; WALL.tone(440+st.done*60,.16,'sine',.12); st.cur=null; next();
      } else { pen.classList.add('bad'); setTimeout(function(){pen.classList.remove('bad');},460); WALL.sfx.nudge(); }
    }
    function start(){
      st.done=0; st.cur=null;
      pens.querySelectorAll('.got').forEach(function(g){g.innerHTML='';});
      st.queue=sh(sh(ANIMALS.DOMESTIC).slice(0,4).map(function(id){return{id:id,side:'farm'};})
        .concat(sh(ANIMALS.WILD).slice(0,4).map(function(id){return{id:id,side:'wild'};})));
      next();
    }
    start();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
