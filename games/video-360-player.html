<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Tour 360°</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Chewy&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff;
    --offwhite: #f5f8ff;
    --card: rgba(255,255,255,0.85);
    --blue: #4f8cff;
    --sky: #b3d8ff;
    --green: #3ecf7a;
    --orange: #ff8c42;
    --pink: #ff5fa0;
    --yellow: #ffe14d;
    --purple: #a78bfa;
    --text: #1a2340;
    --muted: #8898b0;
    --border: rgba(80,120,255,0.13);
    --radius: 18px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--offwhite);
    color: var(--text);
    overflow: hidden;
    height: 100dvh;
    width: 100dvw;
  }

  /* ─── GLOBE CANVAS ─── */
  #globeCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ─── CONFETTI ─── */
  .confetti-piece {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
  }

  /* ─── FLOATING DECO ─── */
  .deco {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    border-radius: 50%;
    animation: decoFloat linear infinite;
  }
  @keyframes decoFloat {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
  }

  /* ─── WELCOME ─── */
  #welcomeMenu {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.55s ease, visibility 0.55s;
  }
  #welcomeMenu.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .welcome-bubble {
    position: relative;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(28px);
    border: 2.5px solid rgba(255,255,255,0.98);
    border-radius: 34px;
    padding: 48px 52px 44px;
    max-width: 760px;
    width: 92vw;
    box-shadow: 0 10px 70px rgba(80,120,255,0.13), 0 2px 12px rgba(80,120,255,0.07);
    text-align: center;
    animation: floatIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes floatIn {
    from { transform: scale(0.85) translateY(30px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  .globe-emoji {
    font-size: 68px;
    display: block;
    animation: spinBob 3s ease-in-out infinite;
    margin-bottom: 10px;
    filter: drop-shadow(0 8px 20px rgba(80,180,255,0.28));
  }
  @keyframes spinBob {
    0%,100% { transform: translateY(0) rotate(-6deg); }
    50%      { transform: translateY(-12px) rotate(6deg); }
  }

  .welcome-tag {
    font-family: 'Chewy', cursive;
    font-size: 14px;
    letter-spacing: 0.2em;
    color: var(--blue);
    margin-bottom: 8px;
  }

  .welcome-title {
    font-family: 'Chewy', cursive;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 34px;
  }
  .welcome-title .hi { background: linear-gradient(110deg, var(--blue), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .portal-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (min-width: 560px) { .portal-grid { grid-template-columns: repeat(4, 1fr); } }

  .portal-btn {
    padding: 22px 12px 18px;
    background: white;
    border: 2.5px solid transparent;
    border-radius: 22px;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s, border-color 0.2s;
    text-align: center;
    box-shadow: 0 4px 18px rgba(80,120,255,0.08);
    user-select: none;
  }
  .portal-btn:hover { transform: translateY(-7px) scale(1.05); box-shadow: 0 16px 40px rgba(80,120,255,0.18); }
  .portal-btn:active { transform: scale(0.97); }
  .portal-btn:nth-child(1) { border-color: #c5f5dc; } .portal-btn:nth-child(1):hover { border-color: var(--green); }
  .portal-btn:nth-child(2) { border-color: #c0daff; } .portal-btn:nth-child(2):hover { border-color: var(--blue); }
  .portal-btn:nth-child(3) { border-color: #ffd6f5; } .portal-btn:nth-child(3):hover { border-color: var(--pink); }
  .portal-btn:nth-child(4) { border-color: #ffe2cc; } .portal-btn:nth-child(4):hover { border-color: var(--orange); }

  .portal-icon { font-size: 38px; display: block; margin-bottom: 10px; }
  .portal-num  { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
  .portal-name { font-size: 14px; font-weight: 900; color: var(--text); margin-bottom: 3px; }
  .portal-sub  { font-size: 11px; color: var(--muted); font-weight: 600; }

  /* ─── HUD ─── */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: linear-gradient(180deg, rgba(245,248,255,0.97) 0%, transparent 100%);
    pointer-events: none;
  }
  #hud.active { display: flex; }

  .hud-brand { display: flex; align-items: center; gap: 10px; }
  .hud-globe { font-size: 28px; animation: spinBob 3s ease-in-out infinite; display: inline-block; }
  .hud-title { font-family: 'Chewy', cursive; font-size: 22px; color: var(--blue); }
  .hud-badge {
    padding: 7px 18px;
    background: white;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
    box-shadow: 0 2px 14px rgba(80,120,255,0.13);
    border: 2px solid var(--border);
  }

  /* ─── TOOLBAR ─── */
  #toolbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px 20px;
    background: linear-gradient(0deg, rgba(245,248,255,0.98) 50%, transparent 100%);
    gap: 10px;
    flex-wrap: wrap;
  }
  #toolbar.active { display: flex; }
  .tb-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .tool-btn {
    padding: 9px 20px;
    background: white;
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 2px 10px rgba(80,120,255,0.08);
    white-space: nowrap;
  }
  .tool-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 6px 22px rgba(80,120,255,0.18); border-color: var(--blue); color: var(--blue); }
  .tool-btn.exit:hover { border-color: var(--pink); color: var(--pink); }
  .tool-btn:active { transform: scale(0.97); }

  .world-pill {
    padding: 8px 16px;
    background: white;
    border: 2px solid var(--border);
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 2px 8px rgba(80,120,255,0.06);
  }
  .world-pill:hover { transform: translateY(-2px) scale(1.07); }
  #pill-0.active { background: #e6fff3; border-color: var(--green); color: var(--green); }
  #pill-1.active { background: #e8f2ff; border-color: var(--blue); color: var(--blue); }
  #pill-2.active { background: #fff0fa; border-color: var(--pink); color: var(--pink); }
  #pill-3.active { background: #fff5ec; border-color: var(--orange); color: var(--orange); }

  /* ─── LOADER ─── */
  #loader {
    position: fixed; inset: 0; z-index: 80;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(245,248,255,0.85);
    backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  #loader.visible { opacity: 1; pointer-events: all; }
  .loader-globe { font-size: 58px; animation: spinGlobe 1s linear infinite; display: inline-block; }
  @keyframes spinGlobe { to { transform: rotate(360deg); } }
  .loader-text { font-family: 'Chewy', cursive; font-size: 22px; color: var(--blue); }

  /* ─── HOTSPOT PANEL ─── */
  #hotspotPanel {
    position: fixed; top: 50%; left: 20px;
    transform: translateY(-50%);
    z-index: 50; display: none;
    flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  #hotspotPanel.active { display: flex; pointer-events: all; }

  .hs-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px;
    background: rgba(255,255,255,0.92);
    border: 2px solid var(--border);
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 13px; font-weight: 800;
    color: var(--muted);
    transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    min-width: 175px;
    backdrop-filter: blur(14px);
    box-shadow: 0 3px 14px rgba(80,120,255,0.08);
  }
  .hs-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    animation: dotBop 2s ease-in-out infinite;
  }
  @keyframes dotBop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); box-shadow: 0 0 0 4px rgba(80,120,255,0.15); } }
  .hs-btn:hover { transform: translateX(6px) scale(1.04); box-shadow: 0 8px 26px rgba(80,120,255,0.16); border-color: var(--blue); color: var(--text); }
  .hs-btn.active-hs { border-color: var(--blue); background: #eef4ff; color: var(--text); }

  /* ─── INFO CARD ─── */
  #infoCard {
    position: fixed; top: 50%; right: 20px;
    transform: translateY(-50%) translateX(20px);
    width: 268px; z-index: 60;
    background: rgba(255,255,255,0.96);
    border: 2.5px solid var(--border);
    border-radius: 26px; padding: 28px 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 14px 52px rgba(80,120,255,0.14);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  #infoCard.visible { opacity: 1; pointer-events: all; transform: translateY(-50%) translateX(0); }
  .card-emoji { font-size: 38px; display: block; margin-bottom: 10px; }
  .card-tag {
    display: inline-block; padding: 3px 13px;
    border-radius: 50px; font-size: 10px; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 10px; background: #eef4ff; color: var(--blue);
  }
  .card-title { font-family: 'Chewy', cursive; font-size: 23px; margin-bottom: 10px; color: var(--text); }
  .card-desc { font-size: 13px; color: var(--muted); line-height: 1.78; font-weight: 600; }
  .card-close {
    position: absolute; top: 14px; right: 14px;
    background: #f0f4ff; border: none;
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 15px; cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-weight: 900; line-height: 1;
  }
  .card-close:hover { background: #ffe0ea; color: var(--pink); transform: scale(1.15) rotate(12deg); }

  /* ─── FULLSCREEN ─── */
  #fsBtn {
    position: fixed; bottom: 80px; right: 20px; z-index: 50;
    display: none; width: 46px; height: 46px;
    background: white; border: 2px solid var(--border);
    border-radius: 14px; cursor: pointer;
    align-items: center; justify-content: center;
    font-size: 20px;
    transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 3px 14px rgba(80,120,255,0.1);
  }
  #fsBtn.active { display: flex; }
  #fsBtn:hover { border-color: var(--blue); transform: scale(1.12); box-shadow: 0 8px 26px rgba(80,120,255,0.2); }

  /* ─── TOAST ─── */
  #toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: white; border: 2px solid var(--border);
    color: var(--text); padding: 10px 24px;
    border-radius: 50px; font-size: 13px; font-weight: 800;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 4px 22px rgba(80,120,255,0.13);
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Three.js Globe Canvas -->
<canvas id="globeCanvas"></canvas>

<!-- A-Frame (behind UI, above globe) -->
<a-scene vr-mode-ui="enabled: false" embedded style="position:fixed;inset:0;z-index:2;">
  <a-assets>
    <video id="video360" preload="auto" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
  </a-assets>
  <a-videosphere id="sphere" src="#video360" rotation="0 -90 0"></a-videosphere>
  <a-entity id="cameraRig" position="0 1.6 0">
    <a-camera id="mainCamera" fov="75"
      look-controls="touchEnabled: true; mouseEnabled: true; magicWindowTrackingEnabled: true"
      wasd-controls="enabled: false">
    </a-camera>
  </a-entity>
</a-scene>

<!-- Welcome -->
<div id="welcomeMenu">
  <div class="welcome-bubble">
    <span class="globe-emoji">🌍</span>
    <p class="welcome-tag">✨ Virtual World Tour ✨</p>
    <h1 class="welcome-title">Explore the <span class="hi">World</span><br>in 360°!</h1>
    <div class="portal-grid">
      <div class="portal-btn" onclick="loadWorld(0)">
        <span class="portal-icon">🌲</span>
        <div class="portal-num">World 01</div>
        <div class="portal-name">Forest Walk</div>
        <div class="portal-sub">Nature & Trails</div>
      </div>
      <div class="portal-btn" onclick="loadWorld(1)">
        <span class="portal-icon">🏛️</span>
        <div class="portal-num">World 02</div>
        <div class="portal-name">Modern Lobby</div>
        <div class="portal-sub">Architecture</div>
      </div>
      <div class="portal-btn" onclick="loadWorld(2)">
        <span class="portal-icon">💎</span>
        <div class="portal-num">World 03</div>
        <div class="portal-name">LED Cave</div>
        <div class="portal-sub">Underground</div>
      </div>
      <div class="portal-btn" onclick="loadWorld(3)">
        <span class="portal-icon">🌇</span>
        <div class="portal-num">World 04</div>
        <div class="portal-name">Rooftop View</div>
        <div class="portal-sub">City Skyline</div>
      </div>
    </div>
  </div>
</div>

<!-- Loader -->
<div id="loader">
  <span class="loader-globe">🌍</span>
  <div class="loader-text">Teleporting you there…</div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-brand">
    <span class="hud-globe">🌍</span>
    <span class="hud-title">World Tour</span>
  </div>
  <div class="hud-badge" id="worldName">—</div>
</div>

<!-- Fullscreen -->
<button id="fsBtn" onclick="toggleFullscreen()">⛶</button>

<!-- Toolbar -->
<div id="toolbar">
  <div class="tb-group">
    <button class="tool-btn exit" onclick="goBack()">🏠 Home</button>
    <button class="tool-btn" onclick="resetView()">🔄 Reset View</button>
  </div>
  <div class="tb-group" id="worldSwitchers"></div>
</div>

<!-- Hotspots -->
<div id="hotspotPanel"></div>

<!-- Info Card -->
<div id="infoCard">
  <button class="card-close" onclick="closeCard()">✕</button>
  <span class="card-emoji" id="cardEmoji"></span>
  <div class="card-tag" id="cardTag"></div>
  <div class="card-title" id="cardTitle"></div>
  <div class="card-desc" id="cardDesc"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ─── ANIMATED THREE.JS GLOBE ─────────────────────────────────
(function () {
  const canvas = document.getElementById("globeCanvas");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const W = window.innerWidth, H = window.innerHeight;
  const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
  camera.position.z = 4.2;

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  const R = 1.6;
  const globeGroup = new THREE.Group();
  scene.add(globeGroup);

  // Lat lines
  for (let i = 0; i <= 14; i++) {
    const lat = (i / 14) * Math.PI - Math.PI / 2;
    const r = Math.cos(lat) * R;
    const y = Math.sin(lat) * R;
    const pts = [];
    for (let j = 0; j <= 72; j++) {
      const a = (j / 72) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({ color: 0x4f8cff, transparent: true, opacity: 0.13 });
    globeGroup.add(new THREE.Line(geo, mat));
  }

  // Lon lines
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    const pts = [];
    for (let j = 0; j <= 72; j++) {
      const lat = (j / 72) * Math.PI - Math.PI / 2;
      const r = Math.cos(lat) * R;
      const y = Math.sin(lat) * R;
      pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({ color: 0x4f8cff, transparent: true, opacity: 0.1 });
    globeGroup.add(new THREE.Line(geo, mat));
  }

  // Surface dots
  const dotPositions = [];
  for (let i = 0; i < 80; i++) {
    const phi = Math.random() * Math.PI * 2;
    const theta = Math.random() * Math.PI;
    const r = R + 0.02;
    dotPositions.push(r * Math.sin(theta) * Math.cos(phi), r * Math.cos(theta), r * Math.sin(theta) * Math.sin(phi));
  }
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute("position", new THREE.Float32BufferAttribute(dotPositions, 3));
  const dotMat = new THREE.PointsMaterial({ color: 0x4f8cff, size: 0.045, transparent: true, opacity: 0.65 });
  globeGroup.add(new THREE.Points(dotGeo, dotMat));

  // Soft glow sphere
  const glowGeo = new THREE.SphereGeometry(R + 0.05, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x4f8cff, transparent: true, opacity: 0.035, side: THREE.BackSide });
  globeGroup.add(new THREE.Mesh(glowGeo, glowMat));

  let t = 0;
  (function animate() {
    requestAnimationFrame(animate);
    t += 0.004;
    globeGroup.rotation.y = t;
    globeGroup.rotation.x = Math.sin(t * 0.35) * 0.12;
    renderer.render(scene, camera);
  })();
})();

// ─── FLOATING DECO SHAPES ────────────────────────────────────
const DECO_COLORS = ["#b3d8ff","#ffe14d","#ffd6f5","#b3efcc","#ffcba8","#e4d4ff"];
for (let i = 0; i < 16; i++) {
  const el = document.createElement("div");
  el.className = "deco";
  const size = 5 + Math.random() * 12;
  const dur = 10 + Math.random() * 18;
  const delay = -Math.random() * 25;
  el.style.cssText = `width:${size}px;height:${size}px;background:${DECO_COLORS[i % DECO_COLORS.length]};left:${Math.random() * 100}vw;bottom:-${size}px;animation-duration:${dur}s;animation-delay:${delay}s;opacity:${0.3 + Math.random() * 0.4};`;
  document.body.appendChild(el);
}

// ─── CONFETTI ────────────────────────────────────────────────
const CONF_COLORS = ["#4f8cff","#ff5fa0","#3ecf7a","#ffe14d","#ff8c42","#a78bfa","#ff4d6d"];
function spawnConfetti() {
  for (let i = 0; i < 50; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    const size = 6 + Math.random() * 9;
    const dur = 1.6 + Math.random() * 2.2;
    const delay = Math.random() * 0.9;
    el.style.cssText = `width:${size}px;height:${size}px;border-radius:${Math.random()>0.5?'50%':'3px'};background:${CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)]};left:${5+Math.random()*90}vw;top:-12px;animation-duration:${dur}s;animation-delay:${delay}s;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay + 0.6) * 1000);
  }
}

// ─── ELECTRON / BROWSER PATH RESOLVER ───────────────────────
// Works in Electron (file://) and regular browsers alike.
function assetPath(rel) {
  if (typeof window !== "undefined" && window.location.protocol === "file:") {
    // Electron: build absolute file:// path relative to this HTML file's directory
    const base = window.location.pathname.replace(/\/[^/]*$/, "");
    return "file://" + base + "/" + rel;
  }
  return rel; // normal browser — relative path works fine
}

let currentWorldIndex = -1;
const DOT_COLORS = ["#3ecf7a","#4f8cff","#a78bfa"];

const video          = document.getElementById("video360");
const sphere         = document.getElementById("sphere");
const welcome        = document.getElementById("welcomeMenu");
const hud            = document.getElementById("hud");
const toolbar        = document.getElementById("toolbar");
const hotspotPanel   = document.getElementById("hotspotPanel");
const infoCard       = document.getElementById("infoCard");
const loader         = document.getElementById("loader");
const fsBtn          = document.getElementById("fsBtn");
const worldName      = document.getElementById("worldName");
const worldSwitchers = document.getElementById("worldSwitchers");
const toast          = document.getElementById("toast");

// Build pills
WORLDS.forEach((w, i) => {
  const pill = document.createElement("button");
  pill.className = "world-pill";
  pill.id = `pill-${i}`;
  pill.textContent = w.pill;
  pill.onclick = () => loadWorld(i);
  worldSwitchers.appendChild(pill);
});

function loadWorld(index) {
  const world = WORLDS[index];
  currentWorldIndex = index;
  loader.classList.add("visible");
  closeCard();

  // Step 1: fully detach current video
  video.pause();
  sphere.setAttribute("src", "");
  video.removeAttribute("src");
  video.load();

  // Step 2: assign new source
  video.src = world.src;

  function onCanPlay() {
    // Re-bind A-Frame texture — set directly to avoid Electron asset system issues
    sphere.setAttribute("src", "#video360");
    // Force A-Frame texture refresh
    const mesh = sphere.getObject3D("mesh");
    if (mesh && mesh.material && mesh.material.map) {
      mesh.material.map.needsUpdate = true;
    }
    video.play().catch(() => {});
    loader.classList.remove("visible");
    afterLoad(world);
    spawnConfetti();
  }
  function onError(e) {
    loader.classList.remove("visible");
    showToast("⚠️ Cannot load: " + world.src.split("/").pop());
    afterLoad(world);
  }

  video.addEventListener("canplay", onCanPlay, { once: true });
  video.addEventListener("error",   onError,   { once: true });
  video.load();
  setTimeout(() => loader.classList.remove("visible"), 6000);

  welcome.classList.add("hidden");
  hud.classList.add("active");
  toolbar.classList.add("active");
  hotspotPanel.classList.add("active");
  fsBtn.classList.add("active");
}

function afterLoad(world) {
  worldName.textContent = world.name;
  WORLDS.forEach((_, i) => document.getElementById(`pill-${i}`).classList.toggle("active", i === currentWorldIndex));
  buildHotspots(world);
}

function buildHotspots(world) {
  hotspotPanel.innerHTML = "";
  world.hotspots.forEach((hs, i) => {
    const btn = document.createElement("button");
    btn.className = "hs-btn";
    btn.innerHTML = `<span class="hs-dot" style="background:${DOT_COLORS[i % DOT_COLORS.length]}"></span>${hs.emoji} ${hs.label}`;
    btn.onclick = () => openCard(hs, btn);
    hotspotPanel.appendChild(btn);
  });
}

function openCard(hs, btn) {
  const isSame = infoCard.classList.contains("visible") && document.getElementById("cardTitle").textContent === hs.label;
  if (isSame) { closeCard(); return; }
  document.getElementById("cardEmoji").textContent = hs.emoji;
  document.getElementById("cardTag").textContent   = hs.tag;
  document.getElementById("cardTitle").textContent = hs.label;
  document.getElementById("cardDesc").textContent  = hs.desc;
  infoCard.classList.add("visible");
  document.querySelectorAll(".hs-btn").forEach(b => b.classList.remove("active-hs"));
  btn.classList.add("active-hs");
}

function closeCard() {
  infoCard.classList.remove("visible");
  document.querySelectorAll(".hs-btn").forEach(b => b.classList.remove("active-hs"));
}

function goBack() {
  video.pause();
  sphere.setAttribute("src", "");
  video.removeAttribute("src");
  video.load();
  hud.classList.remove("active"); toolbar.classList.remove("active");
  hotspotPanel.classList.remove("active"); fsBtn.classList.remove("active");
  welcome.classList.remove("hidden"); closeCard();
  currentWorldIndex = -1;
}

function resetView() {
  const cam = document.getElementById("mainCamera");
  cam.setAttribute("rotation", "0 0 0");
  const lc = cam.components["look-controls"];
  if (lc) { lc.pitchObject.rotation.x = 0; lc.yawObject.rotation.y = 0; }
  showToast("🔄 View reset!");
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => showToast("Fullscreen unavailable"));
    fsBtn.textContent = "✕";
  } else { document.exitFullscreen(); fsBtn.textContent = "⛶"; }
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) fsBtn.textContent = "⛶"; });

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (infoCard.classList.contains("visible")) closeCard(); else if (currentWorldIndex >= 0) goBack(); }
  if (e.key === "f" || e.key === "F") toggleFullscreen();
  if (e.key === "r" || e.key === "R") resetView();
  if (["1","2","3","4"].includes(e.key) && currentWorldIndex >= 0) loadWorld(+e.key - 1);
});
document.addEventListener("click", () => { if (video.paused && video.src) video.play().catch(() => {}); }, { once: true });
</script>
