<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Tour 360°</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Chewy&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:   #4f8cff;
    --green:  #3ecf7a;
    --orange: #ff8c42;
    --pink:   #ff5fa0;
    --purple: #a78bfa;
    --yellow: #ffe14d;
    --text:   #1a2340;
    --muted:  #8898b0;
    --border: rgba(80,120,255,0.14);
    --panel-w: 150px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #0a0d1a;
    color: var(--text);
    overflow: hidden;
    height: 100dvh;
    width: 100dvw;
  }

  /* ── MAIN AREA (full screen — panel floats over it) ── */
  .main-area {
    position: fixed;
    inset: 0;
  }

  /* ── 360 PLAYER CANVAS ── */
  #playerCanvas {
    position: absolute;
    inset: 0;
    display: none;
    cursor: grab;
    touch-action: none;
    background: #0a0a18;
  }
  #playerCanvas:active { cursor: grabbing; }

  /* ── BACKGROUND GLOBE CANVAS ── */
  #globeCanvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* ── WELCOME OVERLAY (inside main-area) ── */
  #welcomeCenter {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity 0.5s, visibility 0.5s;
  }
  #welcomeCenter.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .wc-globe {
    font-size: 72px;
    animation: spinBob 3s ease-in-out infinite;
    filter: drop-shadow(0 10px 30px rgba(80,180,255,0.35));
  }
  @keyframes spinBob {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-14px) rotate(5deg); }
  }
  .wc-tag {
    font-family: 'Chewy', cursive;
    font-size: 13px;
    letter-spacing: 0.22em;
    color: rgba(180,210,255,0.75);
  }
  .wc-title {
    font-family: 'Chewy', cursive;
    font-size: clamp(2rem, 4.5vw, 3.2rem);
    color: #fff;
    text-align: center;
    line-height: 1.15;
  }
  .wc-title .hi {
    background: linear-gradient(110deg, var(--blue), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .wc-hint {
    font-size: 13px;
    font-weight: 700;
    color: rgba(180,210,255,0.55);
    margin-top: 6px;
  }
  .wc-hint span {
    display: inline-block;
    animation: arrowBounce 1.4s ease-in-out infinite;
  }
  @keyframes arrowBounce {
    0%,100% { transform: translateX(0); }
    50%      { transform: translateX(8px); }
  }

  /* ── HUD (top of main area) ── */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(180deg, rgba(10,13,26,0.82) 0%, transparent 100%);
    pointer-events: none;
  }
  #hud.active { display: flex; }
  .hud-brand { display: flex; align-items: center; gap: 9px; }
  .hud-globe { font-size: 26px; animation: spinBob 3s ease-in-out infinite; }
  .hud-title { font-family: 'Chewy', cursive; font-size: 20px; color: var(--blue); }
  .hud-badge {
    padding: 6px 16px;
    background: rgba(255,255,255,0.12);
    border-radius: 50px;
    font-size: 13px; font-weight: 800;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
  }

  /* ── DRAG HINT ── */
  #dragHint {
    position: absolute;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 50px;
    padding: 10px 24px;
    font-size: 13px; font-weight: 800;
    color: #fff;
    display: none;
    pointer-events: none;
    transition: opacity 0.4s;
  }

  /* ── LOADER ── */
  #loader {
    position: absolute; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(10,13,26,0.80);
    backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  #loader.visible { opacity: 1; pointer-events: all; }
  .loader-globe { font-size: 54px; animation: spinGlobe 1s linear infinite; }
  @keyframes spinGlobe { to { transform: rotate(360deg); } }
  .loader-text { font-family: 'Chewy', cursive; font-size: 20px; color: var(--blue); }

  /* ── HOTSPOT PANEL (left side) ── */
  #hotspotPanel {
    position: absolute; top: 50%; left: 18px;
    transform: translateY(-50%);
    z-index: 20; display: none;
    flex-direction: column; gap: 9px;
  }
  #hotspotPanel.active { display: flex; }
  .hs-btn {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 15px;
    background: rgba(255,255,255,0.10);
    border: 1.5px solid rgba(255,255,255,0.14);
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 12px; font-weight: 800;
    color: rgba(255,255,255,0.75);
    transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    min-width: 165px;
    backdrop-filter: blur(12px);
  }
  .hs-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; animation: dotBop 2s ease-in-out infinite; }
  @keyframes dotBop { 0%,100%{transform:scale(1)}50%{transform:scale(1.5)} }
  .hs-btn:hover { transform: translateX(5px); background: rgba(255,255,255,0.18); color: #fff; }
  .hs-btn.active-hs { border-color: var(--blue); background: rgba(79,140,255,0.18); color: #fff; }

  /* ── INFO CARD ── */
  #infoCard {
    position: absolute; top: 50%; left: 200px;
    transform: translateY(-50%) translateX(-10px);
    width: 250px; z-index: 25;
    background: rgba(255,255,255,0.95);
    border: 2px solid var(--border);
    border-radius: 24px; padding: 26px 22px;
    backdrop-filter: blur(20px);
    box-shadow: 0 12px 48px rgba(0,0,0,0.22);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  #infoCard.visible { opacity: 1; pointer-events: all; transform: translateY(-50%) translateX(0); }
  .card-emoji { font-size: 36px; display: block; margin-bottom: 8px; }
  .card-tag { display:inline-block;padding:3px 12px;border-radius:50px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;background:#eef4ff;color:var(--blue); }
  .card-title { font-family:'Chewy',cursive;font-size:21px;margin-bottom:8px;color:var(--text); }
  .card-desc { font-size:12px;color:var(--muted);line-height:1.75;font-weight:600; }
  .card-close { position:absolute;top:12px;right:12px;background:#f0f4ff;border:none;width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:900;transition:background .2s,transform .2s; }
  .card-close:hover { background:#ffe0ea;color:var(--pink);transform:scale(1.15) rotate(12deg); }

  /* ── TOAST ── */
  #toast {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(255,255,255,0.96); border: 2px solid var(--border);
    color: var(--text); padding: 9px 22px;
    border-radius: 50px; font-size: 13px; font-weight: 800;
    z-index: 40; opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── CONFETTI ── */
  .confetti-piece { position:fixed;pointer-events:none;z-index:5;animation:confettiFall linear forwards; }
  @keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0) scale(1);opacity:1} 100%{transform:translateY(110vh) rotate(720deg) scale(.5);opacity:0} }

  /* ══════════════════════════════════════════════════
     RIGHT FLOATING TOOLBAR  —  floating pill
  ══════════════════════════════════════════════════ */
  #rightPanel {
    position: fixed;
    right: 140px;
    top: 50%;
    transform: translateY(-50%);
    width: 130px;
    max-height: 85vh;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 10px;
    gap: 8px;
    background: rgba(255,255,255,0.93);
    backdrop-filter: blur(22px);
    border-radius: 24px;
    border: 1.5px solid rgba(80,120,255,0.13);
    box-shadow: 0 8px 40px rgba(80,120,255,0.18), 0 2px 12px rgba(0,0,0,0.12);
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* Panel header */
  .rp-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    margin-bottom: 6px;
    padding-bottom: 12px;
    border-bottom: 1.5px solid rgba(80,120,255,0.12);
    width: 100%;
  }
  .rp-globe { font-size: 30px; animation: spinBob 3s ease-in-out infinite; }
  .rp-brand { font-family:'Chewy',cursive; font-size: 14px; color: var(--blue); text-align: center; line-height: 1.2; }
  .rp-sub   { font-size: 9px; font-weight: 800; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }

  /* World buttons */
  .rp-world-btn {
    width: 100%;
    padding: 10px 8px;
    background: #fff;
    border: 2px solid transparent;
    border-radius: 16px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s, border-color 0.2s, background 0.2s;
    box-shadow: 0 2px 10px rgba(80,120,255,0.07);
    user-select: none;
  }
  .rp-world-btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 8px 24px rgba(80,120,255,0.16); }
  .rp-world-btn:active { transform: scale(0.96); }

  .rp-world-btn:nth-child(1 of .rp-world-btn) { border-color: #d4f5e4; }
  .rp-world-btn:nth-child(1 of .rp-world-btn):hover { border-color: var(--green); }

  .rp-world-btn[data-idx="0"] { border-color: #d4f5e4; }  .rp-world-btn[data-idx="0"]:hover { border-color: var(--green); }
  .rp-world-btn[data-idx="1"] { border-color: #cce0ff; }  .rp-world-btn[data-idx="1"]:hover { border-color: var(--blue); }
  .rp-world-btn[data-idx="2"] { border-color: #ffd6f5; }  .rp-world-btn[data-idx="2"]:hover { border-color: var(--pink); }
  .rp-world-btn[data-idx="3"] { border-color: #ffe2cc; }  .rp-world-btn[data-idx="3"]:hover { border-color: var(--orange); }
  .rp-world-btn[data-idx="4"] { border-color: #e6deff; }  .rp-world-btn[data-idx="4"]:hover { border-color: var(--purple); }

  .rp-world-btn.active[data-idx="0"] { background:#edfff5; border-color:var(--green); }
  .rp-world-btn.active[data-idx="1"] { background:#e8f2ff; border-color:var(--blue); }
  .rp-world-btn.active[data-idx="2"] { background:#fff0fa; border-color:var(--pink); }
  .rp-world-btn.active[data-idx="3"] { background:#fff5ec; border-color:var(--orange); }
  .rp-world-btn.active[data-idx="4"] { background:#f3eeff; border-color:var(--purple); }

  .rp-icon  { font-size: 26px; display: block; margin-bottom: 4px; }
  .rp-num   { font-size: 9px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
  .rp-name  { font-size: 12px; font-weight: 900; color: var(--text); }

  /* Divider */
  .rp-divider { width: 100%; height: 1.5px; background: rgba(80,120,255,0.10); margin: 4px 0; flex-shrink: 0; }

  /* Back button */
  #rpBack {
    width: 100%;
    padding: 10px 8px;
    background: #fff0f4;
    border: 2px solid #ffc0d0;
    border-radius: 16px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 12px; font-weight: 900;
    color: var(--pink);
    text-align: center;
    transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 2px 10px rgba(255,95,160,0.08);
    display: none;
  }
  #rpBack.visible { display: block; }
  #rpBack:hover { transform: translateY(-3px) scale(1.04); background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: 0 8px 24px rgba(255,95,160,0.28); }
  #rpBack:active { transform: scale(0.96); }

  /* Fullscreen button */
  #rpFs {
    width: 100%;
    padding: 8px;
    background: #fff;
    border: 2px solid rgba(80,120,255,0.14);
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    text-align: center;
    transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 2px 8px rgba(80,120,255,0.06);
    margin-top: auto;
  }
  #rpFs:hover { border-color: var(--blue); transform: scale(1.08); }
</style>
</head>
<body>

<!-- ── MAIN AREA (left of the 150px panel) ── -->
<div class="main-area">
  <canvas id="globeCanvas"></canvas>
  <canvas id="playerCanvas"></canvas>

  <!-- Welcome screen -->
  <div id="welcomeCenter">
    <span class="wc-globe">🌍</span>
    <p class="wc-tag">✨ VIRTUAL WORLD TOUR ✨</p>
    <h1 class="wc-title">Explore the <span class="hi">World</span><br>in 360°</h1>
    <p class="wc-hint">Select a world from the panel <span>→</span></p>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-brand">
      <span class="hud-globe">🌍</span>
      <span class="hud-title">World Tour</span>
    </div>
    <div class="hud-badge" id="worldName">—</div>
  </div>

  <!-- Drag hint -->
  <div id="dragHint">👆 Drag to look around</div>

  <!-- Loader -->
  <div id="loader">
    <span class="loader-globe">🌍</span>
    <div class="loader-text">Teleporting you there…</div>
  </div>

  <!-- Hotspots (left side) -->
  <div id="hotspotPanel"></div>

  <!-- Info Card -->
  <div id="infoCard">
    <button class="card-close" onclick="closeCard()">✕</button>
    <span class="card-emoji" id="cardEmoji"></span>
    <div class="card-tag" id="cardTag"></div>
    <div class="card-title" id="cardTitle"></div>
    <div class="card-desc" id="cardDesc"></div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>
</div>

<!-- ══ RIGHT FLOATING TOOLBAR (150 px) ══ -->
<div id="rightPanel">
  <div class="rp-header">
    <span class="rp-globe">🌍</span>
    <span class="rp-brand">World<br>Tour</span>
    <span class="rp-sub">360°</span>
  </div>

  <!-- World buttons — built by JS -->
  <div id="rpWorlds" style="width:100%;display:flex;flex-direction:column;gap:8px;"></div>

  <div class="rp-divider"></div>

  <!-- Back button -->
  <button id="rpBack" onclick="goBack()">🏠 Back</button>

  <!-- Fullscreen -->
  <button id="rpFs" onclick="toggleFullscreen()">⛶</button>
</div>

<script>
// ─── BACKGROUND GLOBE ─────────────────────────────────────────
(function () {
  const canvas = document.getElementById("globeCanvas");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.z = 4.2;
  const R = 1.6, grp = new THREE.Group();
  scene.add(grp);
  function resize() {
    const W = window.innerWidth, H = window.innerHeight;
    renderer.setSize(W, H);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();
  for (let i = 0; i <= 14; i++) {
    const lat = (i / 14) * Math.PI - Math.PI / 2, r = Math.cos(lat) * R, y = Math.sin(lat) * R, pts = [];
    for (let j = 0; j <= 72; j++) { const a=(j/72)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r)); }
    grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0x4f8cff,transparent:true,opacity:0.13})));
  }
  for (let i = 0; i < 18; i++) {
    const a=(i/18)*Math.PI*2, pts=[];
    for (let j=0;j<=72;j++){const lat=(j/72)*Math.PI-Math.PI/2,r=Math.cos(lat)*R,y=Math.sin(lat)*R;pts.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));}
    grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x4f8cff,transparent:true,opacity:0.10})));
  }
  const dp=[]; for(let i=0;i<80;i++){const phi=Math.random()*Math.PI*2,th=Math.random()*Math.PI,r=R+.02;dp.push(r*Math.sin(th)*Math.cos(phi),r*Math.cos(th),r*Math.sin(th)*Math.sin(phi));}
  const dg=new THREE.BufferGeometry(); dg.setAttribute("position",new THREE.Float32BufferAttribute(dp,3));
  grp.add(new THREE.Points(dg,new THREE.PointsMaterial({color:0x4f8cff,size:0.045,transparent:true,opacity:0.65})));
  grp.add(new THREE.Mesh(new THREE.SphereGeometry(R+.05,32,32),new THREE.MeshBasicMaterial({color:0x4f8cff,transparent:true,opacity:.035,side:THREE.BackSide})));
  let t=0; (function animate(){requestAnimationFrame(animate);t+=.004;grp.rotation.y=t;grp.rotation.x=Math.sin(t*.35)*.12;renderer.render(scene,camera);})();
})();

// ─── CONFETTI ─────────────────────────────────────────────────
const CONF_COLORS=["#4f8cff","#ff5fa0","#3ecf7a","#ffe14d","#ff8c42","#a78bfa"];
function spawnConfetti(){
  for(let i=0;i<50;i++){
    const el=document.createElement("div"); el.className="confetti-piece";
    const size=6+Math.random()*9,dur=1.6+Math.random()*2.2,delay=Math.random()*.9;
    el.style.cssText=`width:${size}px;height:${size}px;border-radius:${Math.random()>.5?'50%':'3px'};background:${CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)]};left:${5+Math.random()*75}vw;top:-12px;animation-duration:${dur}s;animation-delay:${delay}s;`;
    document.body.appendChild(el); setTimeout(()=>el.remove(),(dur+delay+.6)*1000);
  }
}

// ─── WORLD DATA ───────────────────────────────────────────────
const WORLDS = [
  { id:0, name:"🌍 World 1", src:"https://wb3pjp18ht.ufs.sh/f/QuW97IHpGAx13dY9mT47OD2QA4fvazpGbmVYEZL5cHrjSBIT", icon:"🌍",
    hotspots:[{label:"Look Around",tag:"Explore",emoji:"🔭",desc:"Drag or swipe to explore World 1 in full 360°."},{label:"Atmosphere",tag:"Ambience",emoji:"✨",desc:"Take in the sights of this immersive virtual environment."},{label:"Discover",tag:"Wonder",emoji:"🌟",desc:"Look up, down and all around — World 1 is full of detail."}] },
  { id:1, name:"🌐 World 2", src:"https://wb3pjp18ht.ufs.sh/f/QuW97IHpGAx1obIkTPyAdhDLU456M7VgNQHSFwt9eCXfrP3m", icon:"🌐", topBottom:true,
    hotspots:[{label:"Look Around",tag:"Explore",emoji:"🔭",desc:"Drag or swipe to explore World 2 in full 360°."},{label:"Atmosphere",tag:"Ambience",emoji:"✨",desc:"Take in the sights of this immersive virtual environment."},{label:"Discover",tag:"Wonder",emoji:"🌟",desc:"Look up, down and all around — World 2 is full of detail."}] },
  { id:2, name:"🗺️ World 3", src:"https://wb3pjp18ht.ufs.sh/f/QuW97IHpGAx1WUM9kfCmo1lSEFLryieXcfhDNjGxaqdn26w8", icon:"🗺️",
    hotspots:[{label:"Look Around",tag:"Explore",emoji:"🔭",desc:"Drag or swipe to explore World 3 in full 360°."},{label:"Atmosphere",tag:"Ambience",emoji:"✨",desc:"Take in the sights of this immersive virtual environment."},{label:"Discover",tag:"Wonder",emoji:"🌟",desc:"Look up, down and all around — World 3 is full of detail."}] },
  { id:3, name:"🌏 World 4", src:"https://wb3pjp18ht.ufs.sh/f/QuW97IHpGAx18xqI6TdNjxeBM0hCtlY1ifRuD6grpF59dazq", icon:"🌏",
    hotspots:[{label:"Look Around",tag:"Explore",emoji:"🔭",desc:"Drag or swipe to explore World 4 in full 360°."},{label:"Atmosphere",tag:"Ambience",emoji:"✨",desc:"Take in the sights of this immersive virtual environment."},{label:"Discover",tag:"Wonder",emoji:"🌟",desc:"Look up, down and all around — World 4 is full of detail."}] },
  { id:4, name:"🌎 World 5", src:"https://wb3pjp18ht.ufs.sh/f/QuW97IHpGAx1UbKV9lLv6dUXGjYzsfq2JeIhMLC14yEKV9i3", icon:"🌎", topBottom:true,
    hotspots:[{label:"Look Around",tag:"Explore",emoji:"🔭",desc:"Drag or swipe to explore World 5 in full 360°."},{label:"Atmosphere",tag:"Ambience",emoji:"✨",desc:"Take in the sights of this immersive virtual environment."},{label:"Discover",tag:"Wonder",emoji:"🌟",desc:"Look up, down and all around — World 5 is full of detail."}] },
];

// ─── BUILD RIGHT PANEL WORLD BUTTONS ─────────────────────────
const rpWorlds = document.getElementById("rpWorlds");
WORLDS.forEach((w, i) => {
  const btn = document.createElement("button");
  btn.className = "rp-world-btn";
  btn.dataset.idx = i;
  btn.innerHTML = `<span class="rp-icon">${w.icon}</span><div class="rp-num">World 0${i+1}</div><div class="rp-name">World ${i+1}</div>`;
  btn.onclick = () => loadWorld(i);
  rpWorlds.appendChild(btn);
});

// ─── THREE.JS 360 PLAYER ──────────────────────────────────────
const playerCanvas = document.getElementById("playerCanvas");
const pRenderer = new THREE.WebGLRenderer({ canvas: playerCanvas, antialias: true });
pRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const pScene = new THREE.Scene();
const pCamera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);

const sGeo = new THREE.SphereGeometry(500, 64, 40);
sGeo.scale(-1, 1, 1);
const sMat = new THREE.MeshBasicMaterial({ color: 0x0a0a18 });
const sMesh = new THREE.Mesh(sGeo, sMat);
pScene.add(sMesh);

const pVideo = document.createElement("video");
pVideo.crossOrigin = "anonymous";
pVideo.loop = true;
pVideo.playsInline = true;
pVideo.setAttribute("webkit-playsinline", "");

let pTexture = null;
let pLon = 0, pLat = 0, pLonV = 0, pLatV = 0;
let pDown = false, pLastX = 0, pLastY = 0;

function pResize() {
  const W = window.innerWidth, H = window.innerHeight;
  pRenderer.setSize(W, H);
  pCamera.aspect = W / H;
  pCamera.updateProjectionMatrix();
}
window.addEventListener("resize", pResize); pResize();

playerCanvas.addEventListener("pointerdown", e => {
  pDown = true; pLastX = e.clientX; pLastY = e.clientY;
  pLonV = 0; pLatV = 0;
  playerCanvas.setPointerCapture(e.pointerId);
});
playerCanvas.addEventListener("pointermove", e => {
  if (!pDown) return;
  const dx = e.clientX - pLastX, dy = e.clientY - pLastY;
  pLon -= dx * 0.20; pLat += dy * 0.20;
  pLonV = -dx * 0.20; pLatV = dy * 0.20;
  pLastX = e.clientX; pLastY = e.clientY;
});
playerCanvas.addEventListener("pointerup",     () => { pDown = false; });
playerCanvas.addEventListener("pointercancel", () => { pDown = false; });
playerCanvas.addEventListener("click", () => { if (pVideo.paused && pVideo.src) pVideo.play().catch(()=>{}); }, { passive:true });

(function pAnimate() {
  requestAnimationFrame(pAnimate);
  if (!pDown) { pLon += pLonV; pLat += pLatV; pLonV *= 0.90; pLatV *= 0.90; }
  pLat = Math.max(-85, Math.min(85, pLat));
  const phi = THREE.MathUtils.degToRad(90 - pLat);
  const theta = THREE.MathUtils.degToRad(pLon);
  pCamera.lookAt(Math.sin(phi)*Math.cos(theta), Math.cos(phi), Math.sin(phi)*Math.sin(theta));
  if (pTexture) pTexture.needsUpdate = true;
  pRenderer.render(pScene, pCamera);
})();

// ─── UI REFS ──────────────────────────────────────────────────
let currentWorldIndex = -1;
const DOT_COLORS = ["#3ecf7a","#4f8cff","#a78bfa"];
const welcome      = document.getElementById("welcomeCenter");
const hud          = document.getElementById("hud");
const hotspotPanel = document.getElementById("hotspotPanel");
const infoCard     = document.getElementById("infoCard");
const loader       = document.getElementById("loader");
const worldName    = document.getElementById("worldName");
const dragHint     = document.getElementById("dragHint");
const rpBack       = document.getElementById("rpBack");
const toast        = document.getElementById("toast");

// ─── LOAD WORLD ───────────────────────────────────────────────
function loadWorld(index) {
  const world = WORLDS[index];
  currentWorldIndex = index;
  loader.classList.add("visible");
  closeCard();

  pVideo.pause();
  pVideo.src = "";
  pVideo.load();
  if (pTexture) { pTexture.dispose(); pTexture = null; }
  sMat.map = null; sMat.color.set(0x0a0a18); sMat.needsUpdate = true;

  pVideo.src = world.src;
  pVideo.load();

  let loaded = false;
  function onCanPlay() {
    if (loaded) return; loaded = true;
    pTexture = new THREE.VideoTexture(pVideo);
    pTexture.minFilter = THREE.LinearFilter;
    pTexture.magFilter = THREE.LinearFilter;
    // Top-bottom stereo fix: sample only the top half of the frame
    if (world.topBottom) {
      pTexture.wrapS = THREE.ClampToEdgeWrapping;
      pTexture.wrapT = THREE.ClampToEdgeWrapping;
      pTexture.offset.set(0, 0.5);   // start at middle of frame
      pTexture.repeat.set(1, 0.5);   // use only top half
    } else {
      pTexture.offset.set(0, 0);
      pTexture.repeat.set(1, 1);
    }
    sMat.map = pTexture; sMat.color.set(0xffffff); sMat.needsUpdate = true;
    pVideo.play().catch(() => showToast("▶ Tap screen to play"));
    loader.classList.remove("visible");
    afterLoad(world); spawnConfetti(); showDragHint();
  }
  function onError() {
    if (loaded) return; loaded = true;
    loader.classList.remove("visible");
    showToast("⚠️ Could not load video"); afterLoad(world);
  }
  pVideo.addEventListener("canplay", onCanPlay, { once:true });
  pVideo.addEventListener("error",   onError,   { once:true });
  setTimeout(() => { if (!loaded) onError(); }, 10000);

  playerCanvas.style.display = "block";
  welcome.classList.add("hidden");
  hud.classList.add("active");
  hotspotPanel.classList.add("active");
  rpBack.classList.add("visible");

  pLon = 180; pLat = 0; pLonV = 0; pLatV = 0;
}

function afterLoad(world) {
  worldName.textContent = world.name;
  document.querySelectorAll(".rp-world-btn").forEach((b, i) =>
    b.classList.toggle("active", i === currentWorldIndex));
  buildHotspots(world);
}

// ─── HOTSPOTS ─────────────────────────────────────────────────
function buildHotspots(world) {
  hotspotPanel.innerHTML = "";
  world.hotspots.forEach((hs, i) => {
    const btn = document.createElement("button");
    btn.className = "hs-btn";
    btn.innerHTML = `<span class="hs-dot" style="background:${DOT_COLORS[i%DOT_COLORS.length]}"></span>${hs.emoji} ${hs.label}`;
    btn.onclick = () => openCard(hs, btn);
    hotspotPanel.appendChild(btn);
  });
}
function openCard(hs, btn) {
  const isSame = infoCard.classList.contains("visible") && document.getElementById("cardTitle").textContent === hs.label;
  if (isSame) { closeCard(); return; }
  document.getElementById("cardEmoji").textContent = hs.emoji;
  document.getElementById("cardTag").textContent   = hs.tag;
  document.getElementById("cardTitle").textContent = hs.label;
  document.getElementById("cardDesc").textContent  = hs.desc;
  infoCard.classList.add("visible");
  document.querySelectorAll(".hs-btn").forEach(b => b.classList.remove("active-hs"));
  btn.classList.add("active-hs");
}
function closeCard() {
  infoCard.classList.remove("visible");
  document.querySelectorAll(".hs-btn").forEach(b => b.classList.remove("active-hs"));
}

// ─── BACK / RESET ─────────────────────────────────────────────
function goBack() {
  pVideo.pause(); pVideo.src = ""; pVideo.load();
  if (pTexture) { pTexture.dispose(); pTexture = null; }
  sMat.map = null; sMat.color.set(0x0a0a18); sMat.needsUpdate = true;
  playerCanvas.style.display = "none";
  hud.classList.remove("active");
  hotspotPanel.classList.remove("active");
  rpBack.classList.remove("visible");
  dragHint.style.display = "none";
  welcome.classList.remove("hidden");
  document.querySelectorAll(".rp-world-btn").forEach(b => b.classList.remove("active"));
  closeCard(); currentWorldIndex = -1;
}

// ─── DRAG HINT ────────────────────────────────────────────────
function showDragHint() {
  dragHint.style.display = "block"; dragHint.style.opacity = "1";
  setTimeout(() => { dragHint.style.opacity = "0"; }, 2200);
  setTimeout(() => { dragHint.style.display = "none"; }, 2700);
}

// ─── FULLSCREEN ───────────────────────────────────────────────
const rpFs = document.getElementById("rpFs");
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => showToast("Fullscreen unavailable"));
    rpFs.textContent = "✕";
  } else { document.exitFullscreen(); rpFs.textContent = "⛶"; }
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) rpFs.textContent = "⛶"; });

// ─── TOAST ────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  toast.textContent = msg; toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
}

// ─── KEYBOARD ─────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (infoCard.classList.contains("visible")) closeCard(); else if (currentWorldIndex >= 0) goBack(); }
  if (e.key === "f" || e.key === "F") toggleFullscreen();
  if (e.key === "r" || e.key === "R") { pLon=180;pLat=0;pLonV=0;pLatV=0; showToast("🔄 View reset!"); }
  if (["1","2","3","4","5"].includes(e.key)) loadWorld(+e.key - 1);
});
</script>
