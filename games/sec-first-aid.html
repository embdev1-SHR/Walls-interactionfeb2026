<!DOCTYPE html>
<!--
================================================================================
  First Aid Box - Pangappara Blueroom, Secondary
================================================================================
  Animated rather than a card board, as asked, and DRAWN rather than
  photographed: all six first-aid photographs were rejected at asset review
  and no replacement exists in the libraries, so the items are SVG here and
  the activity is not held up waiting for a reshoot.

  A small accident happens, and the learner treats it IN ORDER - clean it,
  apply antiseptic, then cover it. Order is the content: a plaster over a
  dirty cut is the wrong answer even though a plaster is involved.

  Three panels. Each learner works independently and gets their own card in
  their own panel; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>First Aid Box</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fff7f7,#ffeaea 70%,#f9dada);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #efc9c9;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:flex;align-items:center;justify-content:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.25;pointer-events:none}
  .tile.sel{border-color:#f0872f;box-shadow:0 0 0 4px rgba(240,135,47,.3);transform:translateY(-4px)}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .wide{width:clamp(58px,12vh,120px);height:clamp(44px,9vh,92px)}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#b03a3a;text-align:center;flex-shrink:0}
  .hurt{font-size:clamp(34px,7vh,78px);line-height:1;flex-shrink:0}
  .hurt.healed{animation:heal .7s ease-out}
  @keyframes heal{0%{transform:scale(1)}40%{transform:scale(1.2) rotate(-6deg)}100%{transform:none}}
  .story{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(11px,2.1vh,23px);color:#8f2f2f;text-align:center;flex-shrink:0}
  .aid{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .aid svg{width:100%;height:100%}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function svg(b){return '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">'+b+'</svg>';}
var ITEMS={
 water:{ml:'\u0d35\u0d46\u0d33\u0d4d\u0d33\u0d02',en:'Water',
   art:svg('<path d="M24 6 C14 20 10 26 10 32 a14 14 0 0 0 28 0 c0-6-4-12-14-26z" fill="#63b8e8"/><path d="M19 30 a6 6 0 0 0 6 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>')},
 anti:{ml:'\u0d06\u0d28\u0d4d\u0d31\u0d3f\u0d38\u0d46\u0d2a\u0d4d\u0d31\u0d4d\u0d31\u0d3f\u0d15\u0d4d',en:'Antiseptic',
   art:svg('<rect x="17" y="6" width="14" height="7" rx="2" fill="#8a8f9c"/><path d="M15 13 h18 v25 a5 5 0 0 1-5 5 h-8 a5 5 0 0 1-5-5z" fill="#c8543f"/><rect x="20" y="22" width="8" height="12" rx="2" fill="#fff" opacity=".85"/>')},
 cotton:{ml:'\u0d2a\u0d1e\u0d4d\u0d1e\u0d3f',en:'Cotton',
   art:svg('<circle cx="18" cy="24" r="10" fill="#fdfdfd" stroke="#ddd" stroke-width="2"/><circle cx="29" cy="20" r="9" fill="#fdfdfd" stroke="#ddd" stroke-width="2"/><circle cx="27" cy="30" r="8" fill="#fdfdfd" stroke="#ddd" stroke-width="2"/>')},
 plaster:{ml:'\u0d2c\u0d3e\u0d7b\u0d21\u0d47\u0d1c\u0d4d',en:'Plaster',
   art:svg('<rect x="6" y="19" width="36" height="12" rx="6" fill="#e8b98a" transform="rotate(-20 24 25)"/><circle cx="24" cy="24" r="4.5" fill="#cf9c68"/>')},
 scissors:{ml:'\u0d15\u0d24\u0d4d\u0d30\u0d3f\u0d15',en:'Scissors',
   art:svg('<path d="M12 8 L32 32 M36 8 L16 32" stroke="#8a8f9c" stroke-width="4" stroke-linecap="round"/><circle cx="14" cy="38" r="5" fill="none" stroke="#8a8f9c" stroke-width="4"/><circle cx="34" cy="38" r="5" fill="none" stroke="#8a8f9c" stroke-width="4"/>')}
};
var CASES=[
 {em:'\ud83e\ude79',story:{ml:'\u0d2e\u0d41\u0d1f\u0d3f\u0d2f\u0d3f\u0d7d \u0d2e\u0d41\u0d31\u0d3f\u0d35\u0d4d',en:'A cut on the knee'},order:['water','anti','plaster']},
 {em:'\ud83e\udde4',story:{ml:'\u0d15\u0d48\u0d2f\u0d3f\u0d7d \u0d2a\u0d4a\u0d1f\u0d3f',en:'Dirt on the hand'},order:['water','cotton','plaster']}
];

TRIUP.start({
  title:{en:'First Aid',ml:'\u0d2b\u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d4d \u0d0e\u0d2f\u0d4d\u0d21\u0d4d'},
  hint:{en:'Treat it in order',ml:'\u0d15\u0d4d\u0d30\u0d2e\u0d24\u0d4d\u0d24\u0d3f\u0d7d \u0d1a\u0d3f\u0d15\u0d3f\u0d24\u0d4d\u0d38\u0d3f\u0d15\u0d4d\u0d15\u0d42'},
  build:function(p, body, api){
    var st=api.state(p); st.done=0;
    var hurt=document.createElement('div'); hurt.className='hurt';
    var story=document.createElement('div'); story.className='story';
    var grid=document.createElement('div'); grid.className='row';
    body.appendChild(hurt); body.appendChild(story); body.appendChild(grid);
    api.pill(p,'treated','0');

    function round(){
      st.case=CASES[Math.floor(Math.random()*CASES.length)];
      st.at=0;
      hurt.textContent=st.case.em; hurt.classList.remove('healed');
      story.textContent=st.case.story.ml;
      grid.innerHTML='';
      sh(Object.keys(ITEMS)).forEach(function(k){
        var t=document.createElement('div'); t.className='tile aid';
        t.innerHTML=ITEMS[k].art+'<div class="cap">'+ITEMS[k].ml+'</div>';
        WALL.bindTouch(t,function(){ use(k,t); });
        grid.appendChild(t);
      });
      if(p===0&&WALL.voiceOn()) WALL.say(st.case.story.ml);
    }
    function use(k,t){
      if(k===st.case.order[st.at]){
        t.classList.add('ok'); t.classList.add('gone');
        st.at++; WALL.tone(440+st.at*60,.16,'sine',.12);
        if(st.at===st.case.order.length){
          hurt.textContent='\ud83d\ude0a'; hurt.classList.add('healed');
          st.done++; api.pill(p,'treated',String(st.done));
          api.popup(p,{title:{en:'All better!',ml:'\u0d38\u0d41\u0d16\u0d2e\u0d3e\u0d2f\u0d3f!'},
            close:{en:'Next',ml:'\u0d05\u0d1f\u0d41\u0d24\u0d4d\u0d24\u0d24\u0d4d'},onClose:round});
        }
      } else { t.classList.add('no'); setTimeout(function(){t.classList.remove('no');},460); WALL.sfx.nudge(); }
    }
    round();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
