<!DOCTYPE html>
<!--
================================================================================
  First Aid Box - Pangappara Blueroom, Secondary
================================================================================
  REBUILT on review: "what I meant is introducing the items in a first aid
  box. When the child touches the first aid box the items come in extra large
  clear images which are understandable for the students."

  So: a big first-aid box. Every touch opens it and brings out the next item,
  as large as the panel allows, with its name shown and spoken. When every
  item is out, Owly cheers and the box can be packed again. Nothing to get
  wrong — this is meeting the items, not a test.

  Three panels, each with its own box; only panel 1 speaks.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>First Aid Box</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fff7f7,#ffeaea 70%,#f9dada);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #efc9c9;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:flex;align-items:center;justify-content:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.25;pointer-events:none}
  .tile.sel{border-color:#f0872f;box-shadow:0 0 0 4px rgba(240,135,47,.3);transform:translateY(-4px)}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .wide{width:clamp(58px,12vh,120px);height:clamp(44px,9vh,92px)}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#b03a3a;text-align:center;flex-shrink:0}
  .hurt{font-size:clamp(34px,7vh,78px);line-height:1;flex-shrink:0}
  .hurt.healed{animation:heal .7s ease-out}
  @keyframes heal{0%{transform:scale(1)}40%{transform:scale(1.2) rotate(-6deg)}100%{transform:none}}
  .story{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(11px,2.1vh,23px);color:#8f2f2f;text-align:center;flex-shrink:0}
  .aid{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .aid svg{width:100%;height:100%}
  /* ── box + the item it brings out, as big as the panel allows ── */
  .aid-item{flex:1 1 auto;min-height:0;width:100%;display:grid;place-items:center;cursor:pointer}
  .aid-item svg{width:min(46vh,80%);height:auto}
  .aid-item .em{font-size:min(36vh,40vw);line-height:1}
  .aid-item.pop{animation:aidPop .5s cubic-bezier(.34,1.5,.64,1)}
  @keyframes aidPop{from{transform:translateY(40%) scale(.3);opacity:0}to{transform:none;opacity:1}}
  .aid-name{flex:0 0 auto;text-align:center;min-height:1.2em}
  .aid-name .m{display:block;font-family:'Noto Sans Malayalam','Baloo 2',sans-serif;font-weight:900;
    font-size:clamp(24px,5vh,54px);color:#a8322b}
  .aid-name .a{display:block;font-weight:800;font-size:clamp(14px,2.4vh,26px);color:#6b7080}
  .aid-box{flex:0 0 auto;width:min(22vh,46%);cursor:pointer;filter:drop-shadow(0 8px 10px rgba(80,20,20,.25))}
  .aid-box svg{width:100%;height:auto;display:block}
  .aid-box.open{animation:boxOpen .45s ease-out}
  @keyframes boxOpen{30%{transform:scale(1.12) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}}
  @media (prefers-reduced-motion:reduce){.aid-item.pop,.aid-box.open{animation:none}}
</style>
</head>
<body>
<script src="../js/i18n-data.js"></script>
<script src="../js/wall-settings.js"></script>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function svg(b){return '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">'+b+'</svg>';}
/* Emoji where Windows draws a clear picture of the thing; drawn SVG for the
   three it has none for (antiseptic bottle, cotton, bandage roll). */
function big(e){ return '<div class="em">'+e+'</div>'; }
var ITEMS=[
 {en:'Plaster',     ml:'പ്ലാസ്റ്റർ',     art:big('🩹')},
 {en:'Bandage',     ml:'ബാൻഡേജ്',      art:svg('<rect x="9" y="12" width="22" height="24" rx="11" fill="#f4f4f0" stroke="#cfcac0" stroke-width="2"/><circle cx="20" cy="24" r="5" fill="#e2ddd2"/><path d="M30 16 h10 v16 h-10" fill="#f4f4f0" stroke="#cfcac0" stroke-width="2"/>')},
 {en:'Cotton',      ml:'പഞ്ഞി',         art:svg('<circle cx="18" cy="24" r="10" fill="#fdfdfd" stroke="#ddd" stroke-width="2"/><circle cx="29" cy="20" r="9" fill="#fdfdfd" stroke="#ddd" stroke-width="2"/><circle cx="27" cy="30" r="8" fill="#fdfdfd" stroke="#ddd" stroke-width="2"/>')},
 {en:'Antiseptic',  ml:'ആന്റിസെപ്റ്റിക്', art:svg('<rect x="17" y="6" width="14" height="7" rx="2" fill="#8a8f9c"/><path d="M15 13 h18 v25 a5 5 0 0 1-5 5 h-8 a5 5 0 0 1-5-5z" fill="#c8543f"/><rect x="20" y="22" width="8" height="12" rx="2" fill="#fff" opacity=".85"/>')},
 {en:'Scissors',    ml:'കത്രിക',        art:big('✂️')},
 {en:'Thermometer', ml:'തെർമോമീറ്റർ',  art:big('🌡️')},
 {en:'Gloves',      ml:'കയ്യുറ',         art:big('🧤')},
 {en:'Tablets',     ml:'ഗുളിക',         art:big('💊')}
];
var BOX=svg('<rect x="5" y="14" width="38" height="28" rx="5" fill="#e63946"/><rect x="17" y="8" width="14" height="8" rx="3" fill="none" stroke="#b81d2b" stroke-width="3"/>'+
            '<rect x="20" y="20" width="8" height="18" rx="1.5" fill="#fff"/><rect x="15" y="25" width="18" height="8" rx="1.5" fill="#fff"/>');

TRIUP.start({
  title:{en:'First Aid Box',ml:'ഫസ്റ്റ് എയ്ഡ് ബോക്സ്'},
  hint:{en:'Touch the box!',ml:'പെട്ടി തൊടൂ!'},
  build:function(p, body, api){
    var st=api.state(p); st.at=0;
    var item=document.createElement('div'); item.className='aid-item';
    var name=document.createElement('div'); name.className='aid-name';
    var box=document.createElement('div'); box.className='aid-box'; box.innerHTML=BOX;
    body.appendChild(item); body.appendChild(name); body.appendChild(box);
    api.pill(p,'seen','0 / '+ITEMS.length);

    function show(){
      var it=ITEMS[st.at];
      item.innerHTML=it.art;
      item.classList.remove('pop'); void item.offsetWidth; item.classList.add('pop');
      var b=WALL.tBoth(it);
      name.innerHTML='<span class="m">'+b.main+'</span>'+(b.alt?'<span class="a">'+b.alt+'</span>':'');
      if(p===0&&WALL.voiceOn()) WALL.say(it);
      st.at++;
      api.pill(p,'seen',st.at+' / '+ITEMS.length);
      if(st.at===ITEMS.length){
        setTimeout(function(){
          if(window.GUIDE&&p===0) GUIDE.cheer({en:'You know the first aid box!',ml:'ഫസ്റ്റ് എയ്ഡ് ബോക്സ് അറിയാം!'});
          api.win(p,{title:{en:'You know the first aid box!',ml:'ഫസ്റ്റ് എയ്ഡ് ബോക്സ് അറിയാം!'},onAgain:reset});
        },1800);
      }
    }
    function reset(){ st.at=0; item.innerHTML=''; name.innerHTML=''; api.pill(p,'seen','0 / '+ITEMS.length); }
    WALL.bindTouch(box,function(){
      if(st.at>=ITEMS.length) return;
      box.classList.remove('open'); void box.offsetWidth; box.classList.add('open');
      show();
    });
    WALL.bindTouch(item,function(){ if(st.at && WALL.voiceOn()) WALL.say(ITEMS[st.at-1]); });
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
