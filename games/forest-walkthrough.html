<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #050d05; font-family: 'Rajdhani', sans-serif; }
#renderCanvas { display: block; width: 100vw; height: 100vh; cursor: default; }
#renderCanvas.hovering { cursor: pointer; }

/* ── Loading ── */
#loading {
  position: fixed; inset: 0; z-index: 200;
  background: radial-gradient(ellipse at center, #0c1e0c 0%, #040a04 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  transition: opacity 1.2s;
}
#loading h2 {
  font-family: 'Cinzel', serif; font-size: 24px; letter-spacing: 9px;
  color: rgba(155, 220, 135, 0.92); text-transform: uppercase;
}
#loading p { font-size: 12px; letter-spacing: 4px; color: rgba(100, 170, 80, 0.5); text-transform: uppercase; }
#loadBar { width: 240px; height: 2px; background: rgba(255,255,255,0.07); border-radius: 1px; }
#loadFill { height: 100%; width: 0%; background: rgba(110, 220, 90, 0.75); border-radius: 1px; transition: width 0.35s ease; }

/* ── HUD ── */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

/* ── Back button ── */
#backBtn {
  position: fixed; top: 24px; left: 24px; z-index: 100;
  background: rgba(0, 12, 0, 0.68); border: 1px solid rgba(90, 200, 90, 0.28);
  color: rgba(170, 245, 150, 0.92); padding: 10px 24px; border-radius: 24px;
  cursor: pointer; font-family: 'Rajdhani', sans-serif;
  font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
  backdrop-filter: blur(10px); transition: border-color 0.2s, background 0.2s;
  pointer-events: all;
}
#backBtn:hover { background: rgba(0, 22, 0, 0.88); border-color: rgba(90, 210, 90, 0.55); }

/* ── Hotspot label ── */
.hs-label {
  position: absolute; transform: translate(-50%, -100%);
  pointer-events: none; white-space: nowrap;
  transition: opacity 0.35s;
}
.hs-label-inner {
  display: inline-block;
  background: rgba(0, 14, 4, 0.82);
  border: 1px solid rgba(75, 200, 95, 0.42);
  color: rgba(175, 255, 155, 0.95);
  font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
  padding: 6px 16px 5px; border-radius: 20px;
  backdrop-filter: blur(8px);
  box-shadow: 0 0 18px rgba(55, 195, 75, 0.32), 0 0 42px rgba(35, 155, 55, 0.14);
}

/* ── Walk message ── */
#walkMsg {
  position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
  font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 7px; text-transform: uppercase;
  color: rgba(155, 240, 130, 0.72); opacity: 0; transition: opacity 0.6s;
  pointer-events: none; z-index: 20;
}
#walkMsg.show { opacity: 1; }

/* ── Location tag ── */
#locationTag {
  position: fixed; top: 24px; right: 24px; z-index: 20;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(100, 190, 80, 0.45); pointer-events: none;
  font-family: 'Rajdhani', sans-serif; transition: color 0.5s;
}
</style>
</head>
<body>

<div id="loading">
  <h2>Entering the Forest</h2>
  <p>Loading trees&hellip;</p>
  <div id="loadBar"><div id="loadFill"></div></div>
</div>

<canvas id="renderCanvas"></canvas>
<div id="hud"></div>
<button id="backBtn" onclick="history.back()">&#8592; Back</button>
<div id="walkMsg">Walking to destination</div>
<div id="locationTag">Forest Walk</div>

<script type="importmap">
{
  "imports": {
    "three": "../node_modules/three/build/three.module.js",
    "three/addons/": "../node_modules/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── Renderer ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('renderCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
if (renderer.outputColorSpace !== undefined) renderer.outputColorSpace = THREE.SRGBColorSpace;

// ── Scene ───────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x86aa84);
scene.fog = new THREE.FogExp2(0x2e5c2e, 0.021);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 1.65, 2);
camera.lookAt(0, 1.65, -5);

// ── Lighting ─────────────────────────────────────────────────────────────────
const hemi = new THREE.HemisphereLight(0x88ccdd, 0x2d5e18, 0.80);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe49a, 1.9);
sun.position.set(18, 50, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 130;
sun.shadow.camera.left = sun.shadow.camera.bottom = -60;
sun.shadow.camera.right = sun.shadow.camera.top = 60;
sun.shadow.bias = -0.0004;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x4a9038, 0.38);
fill.position.set(-16, 8, -18);
scene.add(fill);

// ── Ground ───────────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(200, 200, 52, 52);
const gp = groundGeo.attributes.position;
for (let i = 0; i < gp.count; i++) {
  const x = gp.getX(i), z = gp.getZ(i);
  gp.setY(i,
    Math.sin(x * 0.19) * Math.cos(z * 0.23) * 0.38
    + Math.sin(x * 0.42 + z * 0.28) * 0.18
    + (Math.random() - 0.5) * 0.07
  );
}
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo,
  new THREE.MeshLambertMaterial({ color: 0x2e601a }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ── Hotspot definitions ──────────────────────────────────────────────────────
const HOTSPOTS = [
  {
    id: 'entrance', label: 'Forest Entrance',
    pos: new THREE.Vector3(0, 0, -7),
    look: new THREE.Vector3(0, 1.65, -20)
  },
  {
    id: 'ancient', label: 'Ancient Tree',
    pos: new THREE.Vector3(-10, 0, -17),
    look: new THREE.Vector3(-13, 1.65, -30)
  },
  {
    id: 'clearing', label: 'Sunlit Clearing',
    pos: new THREE.Vector3(10, 0, -19),
    look: new THREE.Vector3(13, 1.65, -33)
  },
  {
    id: 'mango', label: 'Mango Grove',
    pos: new THREE.Vector3(-4, 0, -31),
    look: new THREE.Vector3(-6, 1.65, -46)
  },
  {
    id: 'stream', label: 'Hidden Stream',
    pos: new THREE.Vector3(8, 0, -40),
    look: new THREE.Vector3(10, 1.65, -54)
  },
  {
    id: 'heart', label: 'Forest Heart',
    pos: new THREE.Vector3(0, 0, -50),
    look: new THREE.Vector3(0, 1.65, -65)
  },
];

// ── Build hotspot objects ────────────────────────────────────────────────────
const hotspotMeshes = [];
const hotspotAnims = []; // { ring, orb, pt }

HOTSPOTS.forEach((h, i) => {
  const grp = new THREE.Group();

  // Outer pulse ring
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.88, 1.18, 40),
    new THREE.MeshBasicMaterial({
      color: 0x44ee88, side: THREE.DoubleSide,
      transparent: true, opacity: 0.80, depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.userData.hsIdx = i;
  grp.add(ring);

  // Inner fill disc
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(0.88, 40),
    new THREE.MeshBasicMaterial({
      color: 0x22cc66, side: THREE.DoubleSide,
      transparent: true, opacity: 0.20, depthWrite: false
    })
  );
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = -0.01;
  grp.add(disc);

  // Vertical beam (thin cylinder connecting disc to orb)
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.016, 0.016, 1.55, 6),
    new THREE.MeshBasicMaterial({
      color: 0x88ffbb, transparent: true, opacity: 0.30, depthWrite: false
    })
  );
  beam.position.set(0, 0.78, 0);
  grp.add(beam);

  // Floating orb
  const orb = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 18, 14),
    new THREE.MeshBasicMaterial({ color: 0x99ffcc, transparent: true, opacity: 0.92 })
  );
  orb.position.set(0, 1.58, 0);
  orb.userData.hsIdx = i;
  grp.add(orb);

  // Soft point light at hotspot
  const pt = new THREE.PointLight(0x55ff88, 1.1, 11);
  pt.position.set(0, 0.6, 0);
  grp.add(pt);

  grp.position.set(h.pos.x, 0.05, h.pos.z);
  scene.add(grp);

  hotspotMeshes.push(ring, orb);
  hotspotAnims.push({ ring, orb, pt });
});

// ── DOM labels ────────────────────────────────────────────────────────────────
const hud = document.getElementById('hud');
const labelEls = {};
HOTSPOTS.forEach(h => {
  const el = document.createElement('div');
  el.className = 'hs-label';
  el.innerHTML = `<div class="hs-label-inner">${h.label}</div>`;
  el.style.opacity = '0';
  hud.appendChild(el);
  labelEls[h.id] = el;
});

// ── Sunbeam shafts ───────────────────────────────────────────────────────────
[[6, 6, -12, 0.22], [-7, 5, -21, -0.17], [4, 7, -33, 0.14], [-3, 6, -46, -0.20]].forEach(([x, y, z, rz]) => {
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 2.8, 15, 8, 1, true),
    new THREE.MeshBasicMaterial({
      color: 0xffee88, transparent: true, opacity: 0.038,
      side: THREE.DoubleSide, depthWrite: false
    })
  );
  shaft.position.set(x, y, z);
  shaft.rotation.z = rz;
  scene.add(shaft);
});

// ── Floating pollen ──────────────────────────────────────────────────────────
const POLLEN = 700;
const pPos = new Float32Array(POLLEN * 3);
const pDrift = new Float32Array(POLLEN);
for (let i = 0; i < POLLEN; i++) {
  pPos[i * 3]     = (Math.random() - 0.5) * 90;
  pPos[i * 3 + 1] = Math.random() * 8;
  pPos[i * 3 + 2] = -(Math.random() * 58 + 2);
  pDrift[i] = 0.003 + Math.random() * 0.006;
}
const pollenGeo = new THREE.BufferGeometry();
pollenGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pollen = new THREE.Points(pollenGeo,
  new THREE.PointsMaterial({ color: 0xddffcc, size: 0.052, transparent: true, opacity: 0.52, sizeAttenuation: true })
);
scene.add(pollen);

// ── Tree loading ─────────────────────────────────────────────────────────────
const loader = new GLTFLoader();
const treeFiles = [
  '../3dmodels/trees/tree_for_games.glb',
  '../3dmodels/trees/mango_tree.glb',
  '../3dmodels/trees/whnp3v2jflkw-_tree.glb',
];
const templates = new Array(treeFiles.length).fill(null);
let loadedCount = 0;
const loadFill = document.getElementById('loadFill');
const loadingEl = document.getElementById('loading');

function normalizeTree(model) {
  model.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const targetH = 5.5 + Math.random() * 4.5;
  const sf = targetH / Math.max(size.x, size.y, size.z, 0.1);
  model.scale.setScalar(sf);
  box.setFromObject(model);
  model.position.y = -box.min.y;
  return model;
}

function makeFallbackTree() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.32, 3.2, 8),
    new THREE.MeshLambertMaterial({ color: 0x4a2e0e })
  );
  trunk.position.y = 1.6; trunk.castShadow = true;
  g.add(trunk);
  const crown = new THREE.Mesh(
    new THREE.SphereGeometry(2.4, 10, 8),
    new THREE.MeshLambertMaterial({ color: 0x2a7818 })
  );
  crown.position.y = 4.4; crown.castShadow = true;
  g.add(crown);
  return g;
}

function onLoaded(model, idx) {
  templates[idx] = model;
  loadedCount++;
  loadFill.style.width = `${(loadedCount / treeFiles.length) * 100}%`;
  if (loadedCount === treeFiles.length) {
    buildForest();
    setTimeout(() => {
      loadingEl.style.opacity = '0';
      setTimeout(() => loadingEl.remove(), 1200);
    }, 400);
  }
}

treeFiles.forEach((url, idx) => {
  loader.load(
    url,
    gltf => onLoaded(normalizeTree(gltf.scene), idx),
    undefined,
    err => { console.warn('Tree load fail:', url, err); onLoaded(makeFallbackTree(), idx); }
  );
});

// ── Build forest ──────────────────────────────────────────────────────────────
function buildForest() {
  const valid = templates.filter(Boolean);
  if (!valid.length) return;

  const spots = [];

  // Dense flanking rows — forest walls on both sides
  for (let i = 0; i < 60; i++) {
    const side = Math.random() < 0.5 ? -1 : 1;
    spots.push({ x: side * (3.8 + Math.random() * 24), z: -(Math.random() * 58 + 2), s: 0.60 + Math.random() * 0.80 });
  }

  // Background spread for depth
  for (let i = 0; i < 45; i++) {
    const a = (Math.random() - 0.5) * Math.PI;
    const r = 20 + Math.random() * 32;
    spots.push({ x: Math.cos(a) * r, z: -(Math.random() * 58 + 6), s: 0.45 + Math.random() * 0.55 });
  }

  // Clusters near hotspot landmarks
  HOTSPOTS.forEach(h => {
    for (let j = 0; j < 7; j++) {
      const a = Math.random() * Math.PI * 2;
      const r = 2.8 + Math.random() * 5.5;
      spots.push({ x: h.pos.x + Math.cos(a) * r, z: h.pos.z + Math.sin(a) * r, s: 0.72 + Math.random() * 0.65 });
    }
  });

  spots.forEach(p => {
    // Keep a loose walking corridor clear near centre and near hotspot markers
    const tooCloseToHotspot = HOTSPOTS.some(h =>
      Math.hypot(p.x - h.pos.x, p.z - h.pos.z) < 2.0
    );
    if (tooCloseToHotspot) return;
    if (Math.abs(p.x) < 2.2 && p.z > -5) return; // clear near camera start

    const src = valid[Math.floor(Math.random() * valid.length)];
    const tree = src.clone();
    tree.scale.multiplyScalar(p.s);
    tree.position.set(p.x, 0, p.z);
    tree.rotation.y = Math.random() * Math.PI * 2;
    scene.add(tree);
  });
}

// ── Walk system ───────────────────────────────────────────────────────────────
const walk = {
  active: false, t: 0, duration: 0, bob: 0,
  startPos: new THREE.Vector3(), endPos: new THREE.Vector3(),
  startLook: new THREE.Vector3(), endLook: new THREE.Vector3(),
};
const walkMsg = document.getElementById('walkMsg');
const locationTag = document.getElementById('locationTag');
const WALK_SPEED = 1.05; // units/sec — deliberately slow and contemplative

function easeInOutSine(t) {
  return -(Math.cos(Math.PI * t) - 1) / 2;
}

function startWalk(hotspot) {
  if (walk.active) return;
  const target = new THREE.Vector3(hotspot.pos.x, 1.65, hotspot.pos.z);
  const dist = camera.position.distanceTo(target);
  if (dist < 0.6) return;

  walk.startPos.copy(camera.position);
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  walk.startLook.copy(camera.position).addScaledVector(fwd, 5);
  walk.endPos.copy(target);
  walk.endLook.copy(hotspot.look);
  walk.duration = dist / WALK_SPEED;
  walk.t = 0; walk.bob = 0; walk.active = true;
  walkMsg.classList.add('show');
  locationTag.textContent = hotspot.label;
  locationTag.style.color = 'rgba(140, 220, 110, 0.80)';
}

// ── Raycasting ────────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mPos = new THREE.Vector2();

canvas.addEventListener('click', e => {
  if (walk.active) return;
  mPos.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(mPos, camera);
  const hits = raycaster.intersectObjects(hotspotMeshes, false);
  if (hits.length && hits[0].object.userData.hsIdx !== undefined) {
    startWalk(HOTSPOTS[hits[0].object.userData.hsIdx]);
  }
});

canvas.addEventListener('mousemove', e => {
  mPos.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(mPos, camera);
  const hits = raycaster.intersectObjects(hotspotMeshes, false);
  canvas.classList.toggle('hovering', hits.length > 0);
});

// ── Label projection ──────────────────────────────────────────────────────────
const projV = new THREE.Vector3();
function updateLabels() {
  const W = window.innerWidth, H = window.innerHeight;
  HOTSPOTS.forEach(h => {
    projV.set(h.pos.x, 2.5, h.pos.z);
    projV.project(camera);
    const el = labelEls[h.id];
    const screenX = (projV.x * 0.5 + 0.5) * W;
    const screenY = (-projV.y * 0.5 + 0.5) * H;
    const inFront = projV.z < 1.0;
    const onScreen = screenX > 20 && screenX < W - 20 && screenY > 30 && screenY < H - 30;
    if (inFront && onScreen) {
      const dist = camera.position.distanceTo(new THREE.Vector3(h.pos.x, 1.65, h.pos.z));
      const alpha = Math.max(0, Math.min(1, 1 - (dist - 1) / 28));
      el.style.left = screenX + 'px';
      el.style.top = (screenY - 14) + 'px';
      el.style.opacity = alpha.toFixed(2);
    } else {
      el.style.opacity = '0';
    }
  });
}

// ── Audio ─────────────────────────────────────────────────────────────────────
const forestAudio = new Audio('../assets/Audio/forest.mp3');
forestAudio.loop = true; forestAudio.volume = 0.42;
document.addEventListener('click', () => forestAudio.play().catch(() => {}), { once: true });

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ── Render loop ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let t = 0; // global time

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  t += dt;

  // Animate hotspot rings and orbs
  hotspotAnims.forEach(({ ring, orb, pt }, i) => {
    const phase = t * 2.1 + i * 1.25;
    const s = 1 + Math.sin(phase) * 0.075;
    ring.scale.set(s, s, 1);
    ring.material.opacity = 0.50 + Math.sin(phase) * 0.28;
    orb.position.y = 1.58 + Math.sin(t * 1.45 + i * 0.9) * 0.19;
    orb.material.opacity = 0.68 + Math.sin(t * 2.6 + i) * 0.22;
    pt.intensity = 0.90 + Math.sin(t * 1.8 + i * 0.7) * 0.20;
  });

  // Animate pollen drift
  const pa = pollen.geometry.attributes.position;
  for (let i = 0; i < POLLEN; i++) {
    pa.setY(i, pa.getY(i) + pDrift[i]);
    pa.setX(i, pa.getX(i) + Math.sin(t * 0.28 + i * 0.1) * 0.0025);
    if (pa.getY(i) > 9) pa.setY(i, 0.1);
  }
  pa.needsUpdate = true;

  // Camera walk
  if (walk.active) {
    walk.t += dt / walk.duration;
    walk.bob += dt * 5.0;
    if (walk.t >= 1) {
      walk.t = 1; walk.active = false;
      walkMsg.classList.remove('show');
      locationTag.style.color = 'rgba(100, 190, 80, 0.45)';
    }
    const et = easeInOutSine(Math.min(walk.t, 1));
    camera.position.lerpVectors(walk.startPos, walk.endPos, et);
    // Gentle head bob while walking
    if (walk.active) camera.position.y += Math.sin(walk.bob) * 0.028;
    // Interpolate look target
    const lookTarget = new THREE.Vector3().lerpVectors(walk.startLook, walk.endLook, et);
    camera.lookAt(lookTarget);
  }

  updateLabels();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
