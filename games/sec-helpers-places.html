<!DOCTYPE html>
<!--
================================================================================
  Helpers and Public Places - Pangappara Blueroom, Secondary
================================================================================
  The popup-then-match shape asked for. Stage one meets each helper with a
  card of their own; stage two asks where that helper is found.

  Meeting first and testing after matters: a child cannot be asked to match
  a person they have not been introduced to, and the September version
  tested without ever teaching.

  Three panels. Each learner works independently and gets their own card in
  their own panel; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Helpers and Public Places</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fffaf4,#fdf0e2 70%,#f8e6d2);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #e8d2bb;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:flex;align-items:center;justify-content:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.25;pointer-events:none}
  .tile.sel{border-color:#f0872f;box-shadow:0 0 0 4px rgba(240,135,47,.3);transform:translateY(-4px)}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .wide{width:clamp(58px,12vh,120px);height:clamp(44px,9vh,92px)}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#a8552b;text-align:center;flex-shrink:0}

</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var H='../assets/new/images/helpers/', P='../assets/new/images/places/';
var HELPERS=[
 {k:'doctor',en:'Doctor',ml:'\u0d21\u0d4b\u0d15\u0d4d\u0d1f\u0d7c',img:H+'doctor.jpg',place:'hospital',
  fact:{en:'Treats people who are unwell',ml:'\u0d30\u0d4b\u0d17\u0d3f\u0d15\u0d33\u0d46 \u0d1a\u0d3f\u0d15\u0d3f\u0d24\u0d4d\u0d38\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d41'}},
 {k:'teacher',en:'Teacher',ml:'\u0d05\u0d27\u0d4d\u0d2f\u0d3e\u0d2a\u0d3f\u0d15',img:H+'teacher.jpg',place:'park',
  fact:{en:'Teaches in school',ml:'\u0d38\u0d4d\u0d15\u0d42\u0d33\u0d3f\u0d7d \u0d2a\u0d20\u0d3f\u0d2a\u0d4d\u0d2a\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d41'}},
 {k:'police',en:'Police',ml:'\u0d2a\u0d4b\u0d32\u0d40\u0d38\u0d4d',img:H+'police.jpg',place:'bus-stand',
  fact:{en:'Keeps us safe',ml:'\u0d28\u0d2e\u0d4d\u0d2e\u0d46 \u0d38\u0d41\u0d30\u0d15\u0d4d\u0d37\u0d3f\u0d24\u0d30\u0d3e\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d41'}},
 {k:'postman',en:'Postman',ml:'\u0d2a\u0d4b\u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d4d\u0d2e\u0d3e\u0d7b',img:H+'postman.jpg',place:'railway-station',
  fact:{en:'Brings the letters',ml:'\u0d15\u0d24\u0d4d\u0d24\u0d41\u0d15\u0d7e \u0d0e\u0d24\u0d4d\u0d24\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d41'}},
 {k:'farmer',en:'Farmer',ml:'\u0d15\u0d7c\u0d37\u0d15\u0d7b',img:H+'farmer.jpg',place:'beach',
  fact:{en:'Grows our food',ml:'\u0d2d\u0d15\u0d4d\u0d37\u0d23\u0d02 \u0d35\u0d3f\u0d33\u0d2f\u0d3f\u0d15\u0d4d\u0d15\u0d41\u0d28\u0d4d\u0d28\u0d41'}}
];
var PLACES={hospital:{en:'Hospital',ml:'\u0d06\u0d36\u0d41\u0d2a\u0d24\u0d4d\u0d30\u0d3f',img:P+'hospital.jpg'},
 park:{en:'Park',ml:'\u0d2a\u0d3e\u0d7c\u0d15\u0d4d\u0d15\u0d4d',img:P+'park.jpg'},
 'bus-stand':{en:'Bus stand',ml:'\u0d2c\u0d38\u0d4d \u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d3e\u0d7b\u0d21\u0d4d',img:P+'bus-stand.jpg'},
 'railway-station':{en:'Railway station',ml:'\u0d31\u0d46\u0d2f\u0d3f\u0d7d\u0d35\u0d47 \u0d38\u0d4d\u0d31\u0d4d\u0d31\u0d47\u0d37\u0d7b',img:P+'railway-station.jpg'},
 beach:{en:'Beach',ml:'\u0d15\u0d1f\u0d7d\u0d24\u0d4d\u0d24\u0d40\u0d30\u0d02',img:P+'beach.jpg'}};

TRIUP.start({
  title:{en:'Helpers and Places',ml:'\u0d38\u0d39\u0d3e\u0d2f\u0d3f\u0d15\u0d33\u0d41\u0d02 \u0d38\u0d4d\u0d25\u0d32\u0d19\u0d4d\u0d19\u0d33\u0d41\u0d02'},
  hint:{en:'Tap each helper',ml:'\u0d13\u0d30\u0d4b \u0d38\u0d39\u0d3e\u0d2f\u0d3f\u0d2f\u0d46\u0d2f\u0d41\u0d02 \u0d24\u0d4a\u0d1f\u0d42'},
  build:function(p, body, api){
    var st=api.state(p); st.met={}; st.done=0;
    var lead=document.createElement('div'); lead.className='leadml';
    var grid=document.createElement('div'); grid.className='row';
    body.appendChild(lead); body.appendChild(grid);

    function meet(){
      st.met={}; lead.textContent='\u0d28\u0d2e\u0d4d\u0d2e\u0d41\u0d1f\u0d46 \u0d38\u0d39\u0d3e\u0d2f\u0d3f\u0d15\u0d7e';
      api.pill(p,'met','0 / '+HELPERS.length);
      grid.innerHTML='';
      HELPERS.forEach(function(h){
        var t=document.createElement('div'); t.className='tile sq';
        t.innerHTML='<img src="'+h.img+'" alt=""><div class="cap">'+h.ml+'</div>';
        WALL.bindTouch(t,function(){
          if(st.met[h.k])return; st.met[h.k]=1; t.classList.add('ok');
          api.pill(p,'met',Object.keys(st.met).length+' / '+HELPERS.length);
          api.popup(p,{title:{en:h.en,ml:h.ml},body:h.fact,close:{en:'Next',ml:'\u0d05\u0d1f\u0d41\u0d24\u0d4d\u0d24\u0d24\u0d4d'},
            onClose:function(){ if(Object.keys(st.met).length===HELPERS.length) match(); }});
        });
        grid.appendChild(t);
      });
    }

    function match(){
      st.done=0; st.queue=sh(HELPERS.slice());
      api.pill(p,'matched','0 / '+HELPERS.length);
      nextMatch();
    }
    function nextMatch(){
      if(!st.queue.length) return api.win(p,{title:{en:'All matched!',ml:'\u0d0e\u0d32\u0d4d\u0d32\u0d3e\u0d02 \u0d1a\u0d47\u0d7c\u0d24\u0d4d\u0d24\u0d41!'},onAgain:meet});
      var h=st.queue.shift();
      lead.textContent=h.ml+' \u0d0e\u0d35\u0d3f\u0d1f\u0d46?';
      var keys=sh(Object.keys(PLACES).filter(function(k){return k!==h.place;})).slice(0,2);
      grid.innerHTML='';
      sh([h.place].concat(keys)).forEach(function(k){
        var pl=PLACES[k];
        var t=document.createElement('div'); t.className='tile sq';
        t.innerHTML='<img src="'+pl.img+'" alt=""><div class="cap">'+pl.ml+'</div>';
        WALL.bindTouch(t,function(){
          if(k===h.place){ t.classList.add('ok'); st.done++;
            api.pill(p,'matched',st.done+' / '+HELPERS.length);
            WALL.tone(440+st.done*60,.16,'sine',.12);
            setTimeout(nextMatch,700);
          } else { t.classList.add('no'); setTimeout(function(){t.classList.remove('no');},460); WALL.sfx.nudge(); }
        });
        grid.appendChild(t);
      });
      if(p===0&&WALL.voiceOn()) WALL.say(h.ml);
    }
    meet();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
