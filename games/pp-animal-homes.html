<!DOCTYPE html>
<!--
================================================================================
  Animals and Their Homes - Pangappara Blueroom
================================================================================
  ASSOCIATION. An animal appears; four homes are offered and the child picks
  where it sleeps. Not recognition - the child already knows a dog - but the
  pairing of a creature with a place, which is a fact about the world rather
  than about the picture.

  stable.jpg was rejected at asset review, so horse leaves the pool.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Animals and Their Homes</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    user-select:none;touch-action:none}

</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/animal-data.js"></script>
<script src="../js/guide.js"></script>
<script src="../js/play-kit.js"></script>
<script>
var REJECTED = ['horse'];
var SET = ANIMALS.HOME_SET.filter(function (k) {
  return REJECTED.indexOf(k) === -1 && ANIMALS.homes[k] && ANIMALS.all[k];
});
var ROUNDS = 6, n = 0, locked = false;
var pk = PLAYKIT.page({ accent:'#8a5a2b', backdrop:'meadow', onAgain:function(){ n = 0; deal(); } });

function deal(){
  locked = false; pk.note(null); pk.hideFinish(); pk.board.innerHTML = '';
  if (n >= ROUNDS) return pk.finish({ en:'Everyone is home!', ml:'\u0d0e\u0d32\u0d4d\u0d32\u0d3e\u0d35\u0d30\u0d41\u0d02 \u0d35\u0d40\u0d1f\u0d4d\u0d1f\u0d3f\u0d32\u0d46\u0d24\u0d4d\u0d24\u0d3f!' });
  var id = PLAYKIT.shuffle(SET)[0];
  var animal = ANIMALS.all[id];
  var wrong = PLAYKIT.shuffle(SET.filter(function(k){return k!==id;})).slice(0,3);
  pk.ask({ en:'Where does the ' + animal.en + ' sleep?', ml:animal.ml + ' \u0d0e\u0d35\u0d3f\u0d1f\u0d46 \u0d09\u0d31\u0d19\u0d4d\u0d19\u0d41\u0d28\u0d4d\u0d28\u0d41?' });
  pk.tally((n+1) + ' / ' + ROUNDS);
  PLAYKIT.shuffle([id].concat(wrong)).forEach(function(k){
    pk.board.appendChild(pk.card(ANIMALS.homes[k], function(el){
      if (locked) return;
      if (k === id) {
        locked = true; pk.right(el); pk.climb(n+1);
        pk.note({ en:animal.en + ' lives in the ' + ANIMALS.homes[id].en, ml:animal.ml + ' - ' + ANIMALS.homes[id].ml });
        pk.cheer(); n++; setTimeout(deal, 1900);
      } else pk.wrong(el);
    }));
  });
  pk.fit();
  pk.say({ en:'Where does the ' + animal.en + ' sleep?', ml:animal.ml + ' \u0d0e\u0d35\u0d3f\u0d1f\u0d46 \u0d09\u0d31\u0d19\u0d4d\u0d19\u0d41\u0d28\u0d4d\u0d28\u0d41?' });
}
deal();
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
