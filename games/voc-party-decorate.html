<!DOCTYPE html>
<!--
================================================================================
  Decorate for the Party - Pangappara Blueroom, Vocational
================================================================================
  Rebuilt on all four notes: more items, everything placeable kept in the
  lower two thirds (nothing near the top, which was unreachable), the child's
  name typed in on screen, and a finish worth arriving at.

  The name is the reason it feels like a party rather than a decorating
  exercise. A banner reading a real child's name is the difference between
  a craft task and an occasion, and it is why the keyboard is here at all.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Decorate for the Party</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fff6fb,#feeaf4 70%,#fadbeb);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#c2407a;text-align:center;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #f0c7dc;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:grid;place-items:center;padding:6px;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.22;pointer-events:none}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .scene{position:relative;flex:1;min-height:0;width:100%;border-radius:16px;
    background:linear-gradient(180deg,#fdf4fa,#f7e6f0);overflow:hidden;border:3px solid #f0c7dc}
  .banner{position:absolute;left:4%;right:4%;top:6%;height:20%;display:flex;
    align-items:center;justify-content:center;font-family:'Noto Sans Malayalam',sans-serif;
    font-weight:900;font-size:clamp(11px,2.4vh,26px);color:#fff;text-align:center;
    background:linear-gradient(90deg,#f26d9c,#c2407a);border-radius:10px;
    box-shadow:0 4px 10px rgba(160,40,90,.25);opacity:0;transition:opacity .4s}
  .banner.on{opacity:1;animation:sway 2.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
  /* everything placeable sits in the lower two thirds, per the reach rule */
  .drop{position:absolute;left:0;right:0;top:30%;bottom:0}
  .put{position:absolute;font-size:clamp(18px,3.6vh,42px);line-height:1;
    animation:land .4s cubic-bezier(.3,1.5,.5,1)}
  @keyframes land{from{transform:scale(.3) translateY(-24px);opacity:0}to{transform:none;opacity:1}}
  .party .put{animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/name-entry.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('sky');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var ITEMS=[
 {em:'\ud83c\udf88',ml:'\u0d2c\u0d32\u0d42\u0d7a'},{em:'\ud83c\udf89',ml:'\u0d2a\u0d1f\u0d15\u0d4d\u0d15\u0d02'},
 {em:'\ud83c\udf8a',ml:'\u0d15\u0d4b\u0d7a\u0d2b\u0d31\u0d4d\u0d31\u0d3f'},{em:'\ud83c\udf81',ml:'\u0d38\u0d2e\u0d4d\u0d2e\u0d3e\u0d28\u0d02'},
 {em:'\ud83c\udf82',ml:'\u0d15\u0d47\u0d15\u0d4d\u0d15\u0d4d'},{em:'\ud83c\udf6c',ml:'\u0d2e\u0d3f\u0d1f\u0d4d\u0d1f\u0d3e\u0d2f\u0d3f'},
 {em:'\ud83c\udf6d',ml:'\u0d2e\u0d3f\u0d1f\u0d4d\u0d1f\u0d3e\u0d2f\u0d3f'},{em:'\ud83e\udd64',ml:'\u0d1c\u0d4d\u0d2f\u0d42\u0d38\u0d4d'},
 {em:'\ud83c\udf88',ml:'\u0d2c\u0d32\u0d42\u0d7a'},{em:'\u2b50',ml:'\u0d28\u0d15\u0d4d\u0d37\u0d24\u0d4d\u0d30\u0d02'},
 {em:'\ud83c\udf8f',ml:'\u0d24\u0d4b\u0d30\u0d23\u0d02'},{em:'\ud83e\uddf8',ml:'\u0d15\u0d33\u0d3f\u0d2a\u0d4d\u0d2a\u0d3e\u0d1f\u0d4d\u0d1f\u0d02'}
];
var NEED=8;

TRIUP.start({
  title:{en:'Decorate for the Party',ml:'\u0d2a\u0d3e\u0d7c\u0d1f\u0d4d\u0d1f\u0d3f \u0d05\u0d32\u0d19\u0d4d\u0d15\u0d30\u0d3f\u0d15\u0d4d\u0d15\u0d42'},
  hint:{en:'Tap an item, then tap where it goes',ml:'\u0d38\u0d3e\u0d27\u0d28\u0d02 \u0d24\u0d4a\u0d1f\u0d4d\u0d1f\u0d4d \u0d38\u0d4d\u0d25\u0d32\u0d02 \u0d24\u0d4a\u0d1f\u0d42'},
  onReady:function(){ NAME_ENTRY.addToToolbar('\u270f\ufe0f Names', function(){ location.reload(); }); },
  build:function(p, body, api){
    var st=api.state(p); st.put=0; st.held=null;
    var scene=document.createElement('div'); scene.className='scene';
    var banner=document.createElement('div'); banner.className='banner';
    var drop=document.createElement('div'); drop.className='drop';
    scene.appendChild(banner); scene.appendChild(drop);
    var tray=document.createElement('div'); tray.className='row';
    body.appendChild(scene); body.appendChild(tray);
    api.pill(p,'placed','0 / '+NEED);

    /* The banner name is a variable per panel, not a fixed string: staff pick
       whose party it is from the class list, or type a new one on the spot.
       A banner with a real child's name is the whole reason this feels like
       an occasion rather than a decorating exercise. */
    var pick=document.createElement('button');
    pick.style.cssText='border:0;border-radius:12px;background:#c2407a;color:#fff;'+
      'font-family:inherit;font-weight:800;cursor:pointer;padding:5px 16px;flex-shrink:0;'+
      'font-size:clamp(9px,1.5vh,15px)';
    body.insertBefore(pick, body.firstChild);

    function setName(n){
      st.who = n || 'HAPPY BIRTHDAY';
      banner.textContent = st.who + ' \ud83c\udf88';
      pick.textContent = '\u270f\ufe0f ' + st.who;
    }
    function cycle(){
      var list = WALL.names();
      if (!list.length) return NAME_ENTRY.open({ onSave:function(l){ setName(l[0]); } });
      st.idx = ((st.idx == null ? p : st.idx) + 1) % (list.length + 1);
      /* one past the end opens the keyboard, so a name that is not on the
         list is always one more tap away */
      if (st.idx === list.length) NAME_ENTRY.open({ onSave:function(l){ st.idx=0; setName(l[0]); } });
      else setName(list[st.idx]);
    }
    WALL.bindTouch(pick, cycle);
    var names0 = WALL.names();
    st.idx = names0.length ? (p % names0.length) : null;
    setName(names0.length ? names0[st.idx] : null);

    WALL.bindTouch(drop,function(e){
      if(!st.held) return;
      var r=drop.getBoundingClientRect();
      var x=((e.clientX||r.left+r.width/2)-r.left)/r.width*100;
      var y=((e.clientY||r.top+r.height/2)-r.top)/r.height*100;
      var s=document.createElement('div'); s.className='put';
      s.textContent=st.held.dataset.em;
      s.style.cssText='left:'+Math.max(3,Math.min(93,x))+'%;top:'+Math.max(3,Math.min(88,y))+'%';
      drop.appendChild(s);
      st.held.classList.remove('ok'); st.held=null;
      st.put++; api.pill(p,'placed',st.put+' / '+NEED);
      WALL.tone(440+st.put*50,.15,'sine',.11);
      if(st.put===NEED) finish();
    });

    ITEMS.forEach(function(it){
      var t=document.createElement('div'); t.className='tile sq';
      t.dataset.em=it.em;
      t.innerHTML='<div class="em">'+it.em+'</div><div class="cap">'+it.ml+'</div>';
      WALL.bindTouch(t,function(){
        if(st.held) st.held.classList.remove('ok');
        st.held=(st.held===t)?null:t;
        if(st.held){ st.held.classList.add('ok'); WALL.sfx.tap(); }
      });
      tray.appendChild(t);
    });

    function finish(){
      banner.classList.add('on');
      drop.classList.add('party');
      WALL.celebrate();
      api.popup(p,{title:{en:'What a party!',ml:'\u0d0e\u0d28\u0d4d\u0d24\u0d4a\u0d30\u0d41 \u0d2a\u0d3e\u0d7c\u0d1f\u0d4d\u0d1f\u0d3f!'},
        body:{en:banner.textContent,ml:banner.textContent},
        close:{en:'Again',ml:'\u0d35\u0d40\u0d23\u0d4d\u0d1f\u0d41\u0d02'},
        onClose:function(){ drop.innerHTML=''; drop.classList.remove('party');
          banner.classList.remove('on'); st.put=0; api.pill(p,'placed','0 / '+NEED); }});
    }
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
