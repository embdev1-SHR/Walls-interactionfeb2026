<!DOCTYPE html>
<!--
================================================================================
  MOSQUITO CLAP - Pangappara Blueroom, Pre-primary
================================================================================
  Rebuilt on the Fruit Ninja mechanic, as asked.

  The old version put mosquitoes on screen and waited to be tapped. Fruit
  Ninja works because the target is MOVING and the gesture is a SWIPE: the
  hand has to arrive somewhere the mosquito is going to be, not somewhere it
  already is. That is a whole-arm movement at a wall, and it is the reason
  the original is the best thing in this repo for gross motor work.

  Taken from games/fruit-ninja.html:
    - targets are launched on an arc with gravity, not placed
    - a swipe leaves a visible trail and kills anything the trail crosses
    - a wrong target (here the butterfly) costs a life, never points
    - speed and spawn rate are on the toolbar so staff can set the pace

  BUTTERFLIES ARE THE BOMB. A child must look before swinging, which is what
  turns flailing into aiming. Hitting one costs a life and says why.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mosquito Clap</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    user-select:none;touch-action:none}

  /* information band only - nothing here is swiped */
  #hud{position:absolute;top:0;left:0;right:0;height:16%;z-index:6;
    display:flex;align-items:center;justify-content:center;gap:4vw;
    pointer-events:none;padding:0 3vw}
  .stat{text-align:center}
  .stat .n{font-weight:800;font-size:clamp(17px,3.4vw,38px);color:#27401f;
    font-variant-numeric:tabular-nums;line-height:1}
  .stat .k{font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(9px,1.5vw,16px);color:#5d7a52}

  #field{position:absolute;top:16%;left:0;right:0;bottom:0;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%}

  .bug{position:absolute;will-change:transform;font-size:var(--bug,54px);
    line-height:1;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
  .splat{position:absolute;pointer-events:none;font-size:var(--bug,54px);
    line-height:1;animation:splat .5s ease-out forwards}
  @keyframes splat{0%{transform:scale(1);opacity:1}100%{transform:scale(1.9);opacity:0}}

  #go{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.2vh;text-align:center;padding:6vw;
    background:rgba(255,255,255,.93);backdrop-filter:blur(5px)}
  #go.hide{display:none}
  #go h1{font-weight:800;font-size:clamp(22px,4.6vw,46px);color:#2f7d4f}
  #go .ml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(13px,2.6vw,25px);color:#4a6a52}
  #go button{border:0;border-radius:18px;background:#2f7d4f;color:#fff;font-weight:800;
    font-family:inherit;font-size:clamp(15px,2.8vw,26px);padding:14px 44px;cursor:pointer}
</style>
</head>
<body>

<div id="hud">
  <div class="stat"><div class="n" id="score">0</div><div class="k">അടിച്ചത്</div></div>
  <div class="stat"><div class="n" id="time">60</div><div class="k">സമയം</div></div>
  <div class="stat"><div class="n" id="lives">❤️❤️❤️</div><div class="k">ജീവൻ</div></div>
</div>
<div id="field"><canvas id="trail"></canvas></div>

<div id="go">
  <h1>Clap the mosquitoes!</h1>
  <div class="ml">കൊതുകുകളെ അടിക്കൂ!<br>ചിത്രശലഭത്തെ അടിക്കരുത്</div>
  <button id="start">തുടങ്ങാം</button>
</div>

<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/guide.js"></script>

<script>
WALL_BACKDROP.set('meadow');
WALL.init();

var field  = document.getElementById('field');
var canvas = document.getElementById('trail');
var ctx    = canvas.getContext('2d');

var bugs = [], trail = [], running = false;
var score = 0, lives = 3, timeLeft = 60, speed = 1, spawnEvery = 900, lastSpawn = 0;

WALL.toolbar({
  lang: true, voice: true, size: true, height: true,
  reset: start, heightTarget: '#field'
});

/* Speed and spawn rate on the toolbar, as fruit-ninja has them: the same
   activity has to suit a child who can barely track a target and one who
   is bored by it. */
(function addPace() {
  var body = document.querySelector('#wallToolbar .wall-tb-body');
  if (!body) return;
  var cap = document.createElement('div');
  cap.className = 'wall-tb-cap';
  cap.textContent = 'SPEED';
  var row = document.createElement('div');
  row.className = 'wall-tb-row';
  [['➖', -1], ['➕', 1]].forEach(function (o) {
    var b = document.createElement('button');
    b.className = 'wall-tb';
    b.textContent = o[0];
    WALL.bindTouch(b, function () {
      speed = Math.max(0.5, Math.min(2.2, speed + o[1] * 0.25));
      spawnEvery = Math.max(380, 1100 - speed * 350);
    });
    row.appendChild(b);
  });
  body.appendChild(cap); body.appendChild(row);
})();

function size() {
  canvas.width = field.clientWidth;
  canvas.height = field.clientHeight;
}
addEventListener('resize', size); size();

function spawn() {
  /* Launched from below on an arc, the way fruit-ninja throws fruit: a
     target that rises, hangs, and falls is trackable by eye in a way a
     straight line across the screen is not. */
  var isBug = Math.random() > 0.22;
  var el = document.createElement('div');
  el.className = 'bug';
  el.textContent = isBug ? '🦟' : '🦋';
  field.appendChild(el);
  var w = field.clientWidth, h = field.clientHeight;
  bugs.push({
    el: el, good: isBug,
    x: 40 + Math.random() * (w - 80),
    y: h + 60,
    vx: (Math.random() - 0.5) * 2.4 * speed,
    vy: -(7.5 + Math.random() * 2.6) * speed,
    rot: (Math.random() - 0.5) * 6
  });
}

function step() {
  if (!running) return;
  var h = field.clientHeight, w = field.clientWidth;
  var now = performance.now();
  if (now - lastSpawn > spawnEvery) { spawn(); lastSpawn = now; }

  for (var i = bugs.length - 1; i >= 0; i--) {
    var b = bugs[i];
    b.vy += 0.16 * speed;
    b.x += b.vx; b.y += b.vy;
    b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px) rotate(' + (b.y * b.rot * 0.02) + 'deg)';
    if (b.y > h + 120 || b.x < -120 || b.x > w + 120) { b.el.remove(); bugs.splice(i, 1); }
  }

  /* the swipe trail, drawn and faded each frame */
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (trail.length > 1) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(trail[0].x, trail[0].y);
    for (var t = 1; t < trail.length; t++) ctx.lineTo(trail[t].x, trail[t].y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(120,200,255,.75)';
    ctx.lineWidth = 6; ctx.stroke();
  }
  while (trail.length && now - trail[0].t > 190) trail.shift();

  requestAnimationFrame(step);
}

function splatAt(x, y, ch) {
  var s = document.createElement('div');
  s.className = 'splat';
  s.textContent = ch;
  s.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  field.appendChild(s);
  setTimeout(function () { s.remove(); }, 520);
}

/* A swipe kills what its LINE crosses, not what it lands on - so a fast
   stroke through three mosquitoes takes all three. */
function cut(x, y) {
  for (var i = bugs.length - 1; i >= 0; i--) {
    var b = bugs[i];
    if (Math.abs(b.x - x) < 46 && Math.abs(b.y - y) < 46) {
      b.el.remove(); bugs.splice(i, 1);
      if (b.good) {
        score++;
        document.getElementById('score').textContent = score;
        WALL.tone(520 + (score % 8) * 60, 0.1, 'sine', 0.13);
        WALL.noise(0.04, 0.05, 30);
        splatAt(b.x, b.y, '💥');
      } else {
        /* the butterfly is the bomb: it costs a life and says why */
        lives--;
        document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives)) || '—';
        WALL.sfx.nudge();
        splatAt(b.x, b.y, '💔');
        if (window.GUIDE) GUIDE.say({ en: 'Not the butterfly!', ml: 'ചിത്രശലഭത്തെ അടിക്കരുത്!' });
        if (lives <= 0) stop();
      }
    }
  }
}

field.addEventListener('pointerdown', function (e) { trail.length = 0; track(e); });
field.addEventListener('pointermove', function (e) { if (e.buttons || e.pointerType === 'touch') track(e); });
function track(e) {
  var r = field.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  trail.push({ x: x, y: y, t: performance.now() });
  cut(x, y);
}

var timer = null;
function start() {
  bugs.forEach(function (b) { b.el.remove(); });
  bugs = []; trail = [];
  score = 0; lives = 3; timeLeft = 60; running = true; lastSpawn = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('lives').textContent = '❤️❤️❤️';
  document.getElementById('time').textContent = '60';
  document.getElementById('go').classList.add('hide');
  size();
  clearInterval(timer);
  timer = setInterval(function () {
    timeLeft--;
    document.getElementById('time').textContent = timeLeft;
    if (timeLeft <= 0) stop();
  }, 1000);
  requestAnimationFrame(step);
}

function stop() {
  running = false;
  clearInterval(timer);
  bugs.forEach(function (b) { b.el.remove(); });
  bugs = [];
  var go = document.getElementById('go');
  go.querySelector('h1').textContent = 'You clapped ' + score + '!';
  go.querySelector('.ml').innerHTML = score + ' കൊതുകുകളെ അടിച്ചു!';
  go.querySelector('button').textContent = 'വീണ്ടും';
  go.classList.remove('hide');
  WALL.celebrate();
}

WALL.bindTouch(document.getElementById('start'), start);
if (window.GUIDE) { GUIDE.mount(); GUIDE.say({ en: 'Clap the mosquitoes!', ml: 'കൊതുകുകളെ അടിക്കൂ!' }); }
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
