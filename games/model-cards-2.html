<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Animal Parts</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;user-select:none}

body{background:url('../assets/bg forest.jpg') center/cover no-repeat fixed}
body::before{content:'';position:fixed;inset:0;background:rgba(0,18,5,.55);pointer-events:none;z-index:0}

#forest-deco{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}

#cards-area{
  position:fixed;inset:0;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:100vh;
  z-index:5;
}

.model-card{
  position:relative;display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
  border-right:2px solid rgba(52,211,153,.18);
  background:rgba(2,20,8,.62);backdrop-filter:blur(2px);
}
.model-card:last-child{border-right:none}
.model-card:not(:last-child)::after{
  content:'';position:absolute;right:-1px;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent 0%,rgba(74,222,128,.35) 20%,rgba(34,197,94,.5) 50%,rgba(74,222,128,.35) 80%,transparent 100%);
  pointer-events:none;z-index:2;
}

.card-strip{
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:10px 16px;
  background:linear-gradient(135deg,rgba(5,40,15,.92),rgba(3,28,10,.95));
  border-bottom:1px solid rgba(52,211,153,.2);z-index:5;
}
.cs-emoji{font-size:clamp(18px,2.2vw,28px)}
.cs-name{font-size:clamp(14px,1.8vw,24px);font-weight:900;color:#d1fae5}
.cs-count{
  margin-left:auto;font-size:clamp(9px,.9vw,12px);font-weight:700;
  color:rgba(167,243,208,.5);background:rgba(52,211,153,.1);
  padding:3px 10px;border-radius:50px;border:1px solid rgba(52,211,153,.2);
}

.mv-wrap{flex:1;position:relative;min-height:0}
model-viewer{position:absolute;top:0;left:0;width:100%;height:100%;background:transparent;--poster-color:transparent}

.card-ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ph-icon{font-size:clamp(50px,7vw,80px);filter:grayscale(1);opacity:.22}
.ph-txt{font-size:clamp(13px,1.5vw,20px);font-weight:800;color:rgba(167,243,208,.2);text-align:center}

.Hotspot{
  background:rgba(240,253,244,.93);border-radius:50px;border:none;
  box-shadow:0 3px 14px rgba(0,0,0,.55);cursor:pointer;
  font-size:clamp(11px,1.1vw,14px);font-weight:900;padding:7px 15px;
  font-family:'Nunito',sans-serif;color:#14532d;white-space:nowrap;touch-action:none;
  transition:transform .15s,box-shadow .15s,background .2s;
}
.Hotspot:hover{transform:scale(1.1);box-shadow:0 6px 22px rgba(0,0,0,.6)}
.Hotspot.hs-active{
  background:linear-gradient(135deg,#4ade80,#16a34a);color:#052e16;
  box-shadow:0 0 24px rgba(74,222,128,.8),0 4px 14px rgba(0,0,0,.5);
  animation:hsPulse 1.8s ease-in-out infinite;
}
@keyframes hsPulse{
  0%,100%{box-shadow:0 0 20px rgba(74,222,128,.7)}
  50%{box-shadow:0 0 44px rgba(74,222,128,1),0 0 16px rgba(74,222,128,.5)}
}
.Hotspot:not([data-visible]){
  background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.5);
  box-shadow:none;width:22px;height:22px;padding:0;pointer-events:none;border-radius:50%;
}
.Hotspot:not([data-visible]) .HotspotAnnotation{display:none}
.HotspotAnnotation{pointer-events:none}

.mvpb{display:block;width:40%;height:3px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:4px;overflow:hidden;background:rgba(255,255,255,.15)}
.mvpb.hide{visibility:hidden}
.mvpb-inner{background:#4ade80;width:0%;height:100%;transition:width .3s}

.card-overlay{
  position:absolute;left:10px;right:10px;bottom:10px;
  max-height:calc(100% - 80px);
  background:rgba(1,12,4,.96);
  backdrop-filter:blur(24px);
  border:1.5px solid rgba(52,211,153,.22);
  border-radius:18px;
  padding:14px 16px 20px;
  opacity:0;
  transform:translateY(18px) scale(.98);
  transition:opacity .3s ease,transform .32s cubic-bezier(.3,0,.1,1);
  overflow-y:auto;touch-action:pan-y;pointer-events:none;
  display:flex;flex-direction:column;gap:10px;z-index:20;
  box-shadow:0 -4px 40px rgba(0,0,0,.65),0 0 0 1px rgba(52,211,153,.08);
  scrollbar-width:thin;scrollbar-color:rgba(52,211,153,.25) transparent;
}
.card-overlay.show{opacity:1;transform:translateY(0) scale(1);pointer-events:all}
.ov-handle{display:none}
.ov-close{
  position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(52,211,153,.2);background:rgba(52,211,153,.12);
  color:rgba(167,243,208,.7);font-size:15px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;touch-action:none;
  transition:background .2s,transform .14s;
}
.ov-close:active{transform:scale(.86)}
.ov-animal{font-size:clamp(10px,1.1vw,14px);font-weight:800;color:rgba(167,243,208,.45);padding-right:42px}
.ov-part{
  font-size:clamp(20px,2.5vw,32px);font-weight:900;color:#4ade80;
  display:flex;align-items:center;gap:9px;
  text-shadow:0 0 28px rgba(74,222,128,.4);
}
.ov-div{height:1px;border:none;background:linear-gradient(90deg,rgba(74,222,128,.35),transparent);flex-shrink:0}
.ov-block{background:rgba(52,211,153,.06);border-radius:12px;padding:12px 14px;border-left:3px solid #60a5fa}
.ov-lbl{font-size:clamp(8px,.8vw,10px);font-weight:900;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:6px;color:#60a5fa}
.ov-txt{font-size:clamp(12px,1.2vw,16px);font-weight:700;color:rgba(209,250,229,.88);line-height:1.65}

/* ══ Page title — top centre ══ */
#page-title{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:900;
  background:rgba(1,15,5,.78);backdrop-filter:blur(16px);
  border:1px solid rgba(52,211,153,.22);border-radius:50px;
  padding:9px 24px;
  font-size:clamp(13px,1.6vw,20px);font-weight:900;
  color:#d1fae5;letter-spacing:.5px;
  box-shadow:0 4px 22px rgba(0,0,0,.45),0 0 0 1px rgba(52,211,153,.06);
  white-space:nowrap;pointer-events:none;
}

#side-ctrl{
  position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:900;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:rgba(1,15,5,.75);backdrop-filter:blur(16px);
  border:1px solid rgba(52,211,153,.2);border-radius:50px;padding:12px 8px;
  box-shadow:0 8px 30px rgba(0,0,0,.55);
}
#btn-back-f{
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,#16a34a,#14532d);color:#d1fae5;
  font-size:22px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(22,163,74,.45);touch-action:none;transition:transform .14s;
}
#btn-back-f:active{transform:scale(.88)}
.sc-sep{width:24px;height:1px;background:rgba(52,211,153,.2)}
.lang-f{
  width:40px;height:28px;border-radius:50px;border:1.5px solid rgba(52,211,153,.2);
  cursor:pointer;font-size:12px;font-weight:900;font-family:inherit;
  background:rgba(52,211,153,.07);color:rgba(167,243,208,.45);touch-action:none;transition:all .2s;
}
.lang-f.active{
  background:linear-gradient(135deg,#16a34a,#166534);
  border-color:transparent;color:#d1fae5;box-shadow:0 2px 10px rgba(22,163,74,.5);
}
</style>
</head>

/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
let lang = 'en';
const cardState = {};

/* ══════════════════════════════════════════════════════
   BUILD
══════════════════════════════════════════════════════ */
const area = document.getElementById('cards-area');

function buildCards() {
  area.innerHTML = '';
  ANIMALS.forEach(a => { cardState[a.id] = null; area.appendChild(makeCard(a)); });
}

function makeCard(a) {
  const card = document.createElement('div');
  card.className = 'model-card';
  card.dataset.id = a.id;

  const strip = document.createElement('div');
  strip.className = 'card-strip';
  strip.innerHTML = `
    <span class="cs-emoji">${a.emoji}</span>
    <span class="cs-name" data-ctitle="${a.id}">${a.name[lang]}</span>
    ${a.hotspots.length ? `<span class="cs-count">${a.hotspots.length} hotspots</span>` : ''}
  `;
  card.appendChild(strip);

  if (!a.glb) {
    const ph = document.createElement('div');
    ph.className = 'card-ph';
    ph.innerHTML = `<div class="ph-icon">${a.emoji}</div><div class="ph-txt">Coming Soon</div>`;
    card.appendChild(ph);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'mv-wrap';

    const mv = document.createElement('model-viewer');
    mv.setAttribute('src', a.glb);
    mv.setAttribute('camera-controls', '');
    mv.setAttribute('tone-mapping', 'neutral');
    mv.setAttribute('shadow-intensity', '1');
    mv.setAttribute('auto-rotate', '');
    mv.setAttribute('auto-rotate-delay', '4000');
    mv.setAttribute('rotation-per-second', '20deg');

    const pb = document.createElement('div');
    pb.className = 'mvpb'; pb.setAttribute('slot','progress-bar');
    const pbI = document.createElement('div'); pbI.className = 'mvpb-inner';
    pb.appendChild(pbI);
    mv.addEventListener('progress', e => {
      pbI.style.width = (e.detail.totalProgress * 100) + '%';
      if (e.detail.totalProgress >= 1) pb.classList.add('hide');
    });
    mv.appendChild(pb);

    a.hotspots.forEach(hs => {
      const btn = document.createElement('button');
      btn.className = 'Hotspot';
      btn.setAttribute('slot', hs.slot);
      if (hs.surface) {
        btn.setAttribute('data-surface', hs.surface);
      } else {
        btn.setAttribute('data-position', hs.position);
        btn.setAttribute('data-normal',   hs.normal);
      }
      btn.setAttribute('data-visibility-attribute', 'visible');

      const ann = document.createElement('div');
      ann.className = 'HotspotAnnotation';
      ann.textContent = hs.label[lang];
      ann.dataset.hlabel = `${a.id}:${hs.slot}`;
      btn.appendChild(ann);

      btn.addEventListener('pointerdown', e => {
        e.stopPropagation();
        openOverlay(a, hs, btn);
      });
      mv.appendChild(btn);
    });

    wrap.appendChild(mv);
    card.appendChild(wrap);
  }

  card.appendChild(makeOverlay(a));
  return card;
}

function makeOverlay(a) {
  const ov = document.createElement('div');
  ov.className = 'card-overlay';
  ov.id = `ov-${a.id}`;
  ov.innerHTML = `
    <div class="ov-handle"></div>
    <button class="ov-close" id="ovc-${a.id}">✕</button>
    <div class="ov-animal" id="ova-${a.id}"></div>
    <div class="ov-part"   id="ovp-${a.id}"></div>
    <hr  class="ov-div">
    <div class="ov-block"  id="ovblock-${a.id}">
      <div class="ov-lbl"  id="ovlbl-${a.id}">English</div>
      <div class="ov-txt"  id="ovtxt-${a.id}"></div>
    </div>
  `;
  ov.querySelector(`#ovc-${a.id}`).addEventListener('pointerdown', e => {
    e.stopPropagation(); closeOverlay(a.id);
  });
  ov.addEventListener('pointerdown', e => e.stopPropagation());
  return ov;
}

function openOverlay(a, hs, btn) {
  const prev = cardState[a.id];
  if (prev?.btn) prev.btn.classList.remove('hs-active');
  cardState[a.id] = { hs, btn };
  btn.classList.add('hs-active');
  populateOverlay(a.id, a, hs);
  document.getElementById(`ov-${a.id}`).classList.add('show');
}

function populateOverlay(id, a, hs) {
  const isML = lang === 'ml';
  document.getElementById(`ova-${id}`).innerHTML  = `${a.emoji} ${a.name[lang]}`;
  document.getElementById(`ovp-${id}`).innerHTML  = `${hs.icon} ${hs.label[lang]}`;
  document.getElementById(`ovlbl-${id}`).textContent = isML ? 'Malayalam · മലയാളം' : 'English';
  document.getElementById(`ovtxt-${id}`).textContent = hs.desc[lang];
  const block = document.getElementById(`ovblock-${id}`);
  const lbl   = document.getElementById(`ovlbl-${id}`);
  block.style.borderLeftColor = isML ? '#34d399' : '#60a5fa';
  lbl.style.color             = isML ? '#34d399' : '#60a5fa';
}

function closeOverlay(id) {
  document.getElementById(`ov-${id}`).classList.remove('show');
  const st = cardState[id];
  if (st?.btn) st.btn.classList.remove('hs-active');
  cardState[id] = null;
}

function setLang(l) {
  lang = l;
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('btn-ml').classList.toggle('active', l==='ml');

  document.querySelectorAll('[data-hlabel]').forEach(el => {
    const [aid, slot] = el.dataset.hlabel.split(':');
    const hs = ANIMALS.find(a=>a.id===aid)?.hotspots.find(h=>h.slot===slot);
    if (hs) el.textContent = hs.label[l];
  });
  document.querySelectorAll('[data-ctitle]').forEach(el => {
    const a = ANIMALS.find(x=>x.id===el.dataset.ctitle);
    if (a) el.textContent = a.name[l];
  });
  ANIMALS.forEach(a => {
    const st = cardState[a.id];
    if (st) populateOverlay(a.id, a, st.hs);
  });
}

function pd(id, fn) {
  document.getElementById(id).addEventListener('pointerdown', e => { e.stopPropagation(); fn(); });
}
pd('btn-back-f', () => location.href='../index.html');
pd('btn-en',     () => setLang('en'));
pd('btn-ml',     () => setLang('ml'));
document.addEventListener('keydown', e => { if(e.key==='Escape') location.href='../index.html'; });

buildCards();
</script>
