<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Skills</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
body{-webkit-user-select:none;user-select:none;touch-action:none;background:#111;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
* { -webkit-backface-visibility:hidden; }

#roomCanvas{
  position:absolute;inset:0;width:100%;height:100%;z-index:0;
  /* Electron-safe contrast/saturation boost directly on canvas element */
  filter:contrast(1.12) saturate(1.15) brightness(1.02);
}

.game-layer{position:absolute;inset:0;z-index:10}

.target-zone{
  position:absolute;
  border:2px dashed rgba(255,255,255,.35);
  border-radius:12px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  pointer-events:none;
  transition:all .25s ease;
}
.target-zone.active{
  border-color:rgba(140,220,140,.9);
  background:rgba(140,220,140,.1);
  box-shadow:0 0 24px rgba(140,220,140,.25), inset 0 0 20px rgba(140,220,140,.05);
  cursor:pointer;
}
.target-zone.filled{
  border-color:rgba(140,220,140,.4);
  background:rgba(140,220,140,.04);
  border-style:solid;
}
.target-label{
  font-size:clamp(9px,1.2vw,12px);font-weight:600;
  color:rgba(255,255,255,.6);text-align:center;
  pointer-events:none;margin-top:3px;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
  letter-spacing:.3px;
}
.target-ghost{font-size:clamp(22px,2.8vw,34px);opacity:.18;pointer-events:none;filter:grayscale(0.3)}
.target-zone.filled .target-label,.target-zone.filled .target-ghost{display:none}

.drag-item{
  position:absolute;cursor:pointer;z-index:100;
  font-size:clamp(44px,5.5vw,68px);line-height:1;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.85))
         drop-shadow(0 8px 16px rgba(0,0,0,0.65))
         drop-shadow(0 1px 2px rgba(0,0,0,0.95));
  transition:transform .18s ease,filter .18s ease;
  user-select:none;
}
.drag-item:hover{
  transform:scale(1.08);
  filter:drop-shadow(0 10px 20px rgba(0,0,0,0.85))
         drop-shadow(0 3px 6px rgba(0,0,0,0.9))
         brightness(1.08);
}
/* Selected state — pulsing ring + lifted look */
.drag-item.selected{
  z-index:500;cursor:pointer;
  transform:scale(1.18) translateY(-6px);
  filter:drop-shadow(0 22px 30px rgba(0,0,0,0.85))
         drop-shadow(0 6px 12px rgba(0,0,0,0.9))
         drop-shadow(0 2px 4px rgba(0,0,0,1))
         brightness(1.12);
  animation:selectedPulse 1s ease-in-out infinite;
  transition:none;
}
.drag-item.placed{
  cursor:default;z-index:50;
  animation:snapIn .4s cubic-bezier(.34,1.56,.64,1);
}
.drag-item.wrong{animation:reject .42s ease}

@keyframes selectedPulse{
  0%,100%{filter:drop-shadow(0 22px 30px rgba(0,0,0,0.85)) drop-shadow(0 6px 12px rgba(0,0,0,0.9)) brightness(1.12);}
  50%{filter:drop-shadow(0 22px 40px rgba(255,220,80,0.6)) drop-shadow(0 6px 16px rgba(255,200,0,0.5)) brightness(1.22);}
}

@keyframes snapIn{
  0%{transform:scale(.4) translateY(10px);opacity:.4}
  70%{transform:scale(1.08) translateY(-2px)}
  100%{transform:scale(1) translateY(0);opacity:1}
}
@keyframes reject{
  0%,100%{transform:translateX(0)}
  18%{transform:translateX(-14px) rotate(-3deg)}
  36%{transform:translateX(12px) rotate(3deg)}
  54%{transform:translateX(-8px) rotate(-1.5deg)}
  72%{transform:translateX(5px) rotate(.8deg)}
}

.hud{
  position:absolute;top:14px;left:14px;right:14px;
  display:flex;justify-content:space-between;align-items:flex-start;
  z-index:600;pointer-events:none;
}
.hud>*{pointer-events:auto}
.hud-box{
  background:rgba(12,10,8,.72);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:9px 16px;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.hud-label{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.hud-val{font-size:clamp(22px,3.2vw,32px);font-weight:800;color:white;line-height:1.1}

.room-title{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-size:clamp(14px,2.2vw,20px);font-weight:700;
  color:rgba(255,255,255,.92);
  text-shadow:0 1px 8px rgba(0,0,0,.9);
  z-index:600;pointer-events:none;
  padding:7px 20px;
  background:rgba(10,8,6,.68);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);border-radius:14px;
  letter-spacing:.4px;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}

.btn-back{
  position:absolute;bottom:16px;left:16px;
  padding:10px 22px;font-size:13px;font-weight:600;
  background:rgba(10,8,6,.7);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.85);border-radius:28px;cursor:pointer;z-index:600;
  transition:all .25s;
}
.btn-back:hover{background:rgba(20,16,12,.85);color:white;transform:scale(1.04)}

.toolbar{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px;
  z-index:600;pointer-events:auto;
}
.toolbar-btn{
  padding:10px 16px;font-size:13px;font-weight:600;
  background:rgba(10,8,6,.7);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.82);border-radius:28px;cursor:pointer;
  transition:all .25s;min-width:110px;text-align:center;
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}
.toolbar-btn:hover{background:rgba(20,16,12,.85);color:white;transform:scale(1.05)}
.toolbar-btn:active{transform:scale(.96)}

.progress-wrap{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  width:clamp(160px,28vw,300px);z-index:600;text-align:center;
}
.progress-bar{
  width:100%;height:6px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  border-radius:6px;overflow:hidden;
}
.progress-fill{height:100%;border-radius:6px;transition:width .35s cubic-bezier(.4,0,.2,1);width:0}
.progress-text{font-size:11px;font-weight:500;color:rgba(255,255,255,.45);margin-top:5px;text-shadow:0 1px 4px rgba(0,0,0,.8)}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.86);
  display:none;justify-content:center;align-items:center;z-index:5000;
  backdrop-filter:blur(8px);
}
.overlay.show{display:flex}
.overlay-box{
  text-align:center;padding:clamp(28px,4vw,48px);
  border-radius:24px;max-width:460px;width:90%;
  animation:boxPop .4s cubic-bezier(.34,1.56,.64,1);
  border-width:2px;border-style:solid;
}
@keyframes boxPop{
  0%{transform:scale(.45) rotate(-3deg);opacity:0}
  70%{transform:scale(1.04) rotate(.5deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.overlay-title{font-size:clamp(26px,5vw,40px);font-weight:800;margin-bottom:10px}
.overlay-msg{font-size:clamp(14px,2.2vw,18px);margin-bottom:24px;line-height:1.6;color:#444}
.overlay-btn{
  padding:13px 32px;font-size:17px;font-weight:700;
  border:none;border-radius:50px;
  cursor:pointer;transition:all .25s;margin:5px;
  box-shadow:0 4px 16px rgba(0,0,0,.18);
}
.overlay-btn:hover{transform:scale(1.06)}
.overlay-btn.primary{background:#43a047;color:white}
.overlay-btn.secondary{background:rgba(0,0,0,.06);color:#333;border:1.5px solid rgba(0,0,0,.12)}

.sparkle{
  position:absolute;pointer-events:none;z-index:400;
  font-size:18px;
  animation:sparkleOut .65s ease-out forwards;
}
@keyframes sparkleOut{
  0%{transform:translate(0,0) scale(1.2);opacity:1}
  100%{transform:translate(var(--sx),var(--sy)) scale(0);opacity:0}
}
</style>
</head>
<body>
<canvas id="roomCanvas"></canvas>
<div class="game-layer" id="gameLayer">
  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">Sorted</div>
      <div class="hud-val" id="scoreVal">0/5</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Time</div>
      <div class="hud-val" id="timerVal">0:00</div>
    </div>
  </div>
  <div class="room-title" id="roomTitle">Room</div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 5 items placed</div>
  </div>
  <button class="btn-back" id="backBtn">← Menu</button>
  <div class="toolbar">
    <button class="toolbar-btn" id="reshuffleBtn">🔀 Reshuffle</button>
    <button class="toolbar-btn" id="backToolbarBtn">← Back</button>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="overlay-box" id="overlayBox">
    <div class="overlay-title" id="overlayTitle"></div>
    <div class="overlay-msg" id="overlayMsg"></div>
    <div>
      <button class="overlay-btn primary" id="playAgainBtn">Play Again</button>
      <button class="overlay-btn secondary" id="menuBtn">Menu</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────
//  UTILITIES
// ─────────────────────────────────────────────────────────
var params = new URLSearchParams(window.location.search);
var roomType = params.get('room') || 'bedroom';
var cvs = document.getElementById('roomCanvas');
var ctx = cvs.getContext('2d', {willReadFrequently: false, alpha: false});
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';
var gameLayer = document.getElementById('gameLayer');
var W, H;

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

// ─────────────────────────────────────────────────────────
//  PHOTOREALISTIC DRAWING UTILITIES
// ─────────────────────────────────────────────────────────

/* Clamp helper */
function cl(v,mn,mx){return Math.max(mn,Math.min(mx,v));}

/* Draw rect with rounded corners */
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

/* Soft ambient occlusion gradient overlay */
function drawAO(ctx,x,y,w,h,strength){
  strength=strength||0.28; // boosted for Electron
  var g=ctx.createRadialGradient(x+w/2,y+h,0,x+w/2,y+h,Math.max(w,h)*1.2);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.7,'rgba(0,0,0,'+(strength*0.5)+')');
  g.addColorStop(1,'rgba(0,0,0,'+strength+')');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
}

/* Canvas-native shadow helper — baked shadows not CSS, works in Electron */
function setShadow(ctx,blur,ox,oy,color){
  ctx.shadowBlur=blur;ctx.shadowOffsetX=ox;ctx.shadowOffsetY=oy;ctx.shadowColor=color||'rgba(0,0,0,0.7)';
}
function clearShadow(ctx){ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;ctx.shadowColor='transparent';}

/* Draw a soft elliptical floor shadow under a furniture piece */
function drawFloorShadow(ctx,cx,by,w,depth,opacity){
  opacity=opacity||0.45;
  ctx.save();
  var g=ctx.createRadialGradient(cx,by,0,cx,by,w*0.5);
  g.addColorStop(0,'rgba(0,0,0,'+opacity+')');
  g.addColorStop(0.5,'rgba(0,0,0,'+(opacity*0.5)+')');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(cx,by,w*0.5,depth,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* Directional light highlight — boosted for Electron */
function drawHighlight(ctx,x,y,w,h,dir){
  dir=dir||'top';
  var g;
  if(dir==='top'){g=ctx.createLinearGradient(x,y,x,y+h*0.6);}
  else if(dir==='left'){g=ctx.createLinearGradient(x,y,x+w*0.5,y);}
  else{g=ctx.createLinearGradient(x+w,y,x+w*0.5,y);}
  g.addColorStop(0,'rgba(255,255,255,0.18)'); // was 0.07
  g.addColorStop(0.3,'rgba(255,255,255,0.08)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
}

/* Wood grain texture — boosted contrast for Electron */
function drawWoodGrain(ctx,x,y,w,h,angle,col1,col2,grainCount){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  grainCount=grainCount||18;
  ctx.translate(x+w/2,y+h/2);ctx.rotate(angle||0);
  for(var i=0;i<grainCount;i++){
    var t=i/grainCount;
    var gx=-w*0.8+t*w*1.6;
    var g=ctx.createLinearGradient(gx,0,gx+w/grainCount,0);
    g.addColorStop(0,'rgba(0,0,0,0)');
    // Stronger grain contrast
    var grainAlpha=i%3===0?0.12:0.06;
    g.addColorStop(0.5,col2||('rgba(0,0,0,'+grainAlpha+')'));
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(gx,-h,w/grainCount,h*2);
  }
  // Extra highlight streak
  if(w>20){
    var hlG=ctx.createLinearGradient(-w*0.2,-h,w*0.05,-h);
    hlG.addColorStop(0,'rgba(255,255,255,0)');hlG.addColorStop(0.5,'rgba(255,255,255,0.07)');hlG.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hlG;ctx.fillRect(-w,-(h),w*2,h*2);
  }
  ctx.restore();
}

/* Realistic window with sky & light bleed */
function drawRealisticWindow(ctx,x,y,w,h,timeOfDay){
  timeOfDay=timeOfDay||'day';
  // Sky gradient
  var skyG=ctx.createLinearGradient(x,y,x,y+h);
  if(timeOfDay==='day'){
    skyG.addColorStop(0,'#4a9fe8');skyG.addColorStop(0.5,'#7ec8f0');skyG.addColorStop(0.85,'#c5e8ff');skyG.addColorStop(1,'#e8f4dc');
  }else{
    skyG.addColorStop(0,'#0a0e2e');skyG.addColorStop(0.5,'#1a2a5e');skyG.addColorStop(1,'#2d4a8a');
  }
  ctx.fillStyle=skyG;ctx.fillRect(x,y,w,h);
  
  if(timeOfDay==='day'){
    // Clouds
    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.82)';
    [[-0.1,0.18,0.28,0.09],[0.35,0.24,0.22,0.07],[0.58,0.12,0.18,0.06]].forEach(function(c){
      ctx.beginPath();ctx.ellipse(x+c[0]*w+w,y+c[1]*h,c[2]*w,c[3]*h,0,0,Math.PI*2);ctx.fill();
    });
    // Ground/foliage at bottom
    var treeG=ctx.createLinearGradient(x,y+h*0.72,x,y+h);
    treeG.addColorStop(0,'#5a9e3a');treeG.addColorStop(1,'#3a6e20');
    ctx.fillStyle=treeG;ctx.fillRect(x,y+h*0.75,w,h*0.25);
    ctx.fillStyle='rgba(40,80,20,0.5)';
    ctx.beginPath();ctx.arc(x+w*0.2,y+h*0.75,w*0.18,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+w*0.75,y+h*0.76,w*0.14,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  
  // Window frame — thick, realistic PVC/wood
  var frameW=Math.max(6,w*0.05);
  ctx.fillStyle='#f0ece6';
  ctx.fillRect(x-frameW,y-frameW,w+frameW*2,frameW); // top
  ctx.fillRect(x-frameW,y+h,w+frameW*2,frameW); // bottom
  ctx.fillRect(x-frameW,y-frameW,frameW,h+frameW*2); // left
  ctx.fillRect(x+w,y-frameW,frameW,h+frameW*2); // right
  // Glazing bars
  ctx.strokeStyle='rgba(240,236,230,0.9)';ctx.lineWidth=Math.max(3,frameW*0.6);
  ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke();
  // Glass reflection
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w*0.45,y);ctx.lineTo(x,y+h*0.45);ctx.closePath();ctx.fill();
  // Frame shadow
  ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=2;
  ctx.strokeRect(x-frameW,y-frameW,w+frameW*2,h+frameW*2);
  
  // Light bleed on floor/wall
  var bleedG=ctx.createRadialGradient(x+w/2,y+h+frameW,0,x+w/2,y+h+frameW,w*1.5);
  bleedG.addColorStop(0,'rgba(220,240,255,0.15)');bleedG.addColorStop(1,'rgba(220,240,255,0)');
  ctx.fillStyle=bleedG;ctx.fillRect(x-w,y+h,w*3,h*3);
}

/* Realistic wall plaster texture */
function drawPlasterWall(ctx,x,y,w,h,col){
  var g=ctx.createLinearGradient(x,y,x+w*0.3,y+h);
  g.addColorStop(0,lighten(col,12));g.addColorStop(0.4,col);g.addColorStop(1,darken(col,8));
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  // Texture noise — denser for Electron
  for(var i=0;i<120;i++){
    var nx=x+Math.random()*w,ny=y+Math.random()*h;
    var a=Math.random()*0.04+0.005;
    ctx.fillStyle='rgba(0,0,0,'+a+')';
    ctx.fillRect(nx,ny,Math.random()*3+1,Math.random()*3+1);
  }
  // Subtle horizontal bands (plaster lines)
  for(var b=0;b<5;b++){
    var by=y+Math.random()*h;
    ctx.strokeStyle='rgba(0,0,0,0.04)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,by);ctx.lineTo(x+w,by);ctx.stroke();
  }
}

/* Colour helpers */
function hexToRgb(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return[r,g,b];
}
function rgbToHex(r,g,b){
  return'#'+[r,g,b].map(function(v){return cl(Math.round(v),0,255).toString(16).padStart(2,'0');}).join('');
}
function lighten(hex,amt){var c=hexToRgb(hex);return rgbToHex(c[0]+amt,c[1]+amt,c[2]+amt);}
function darken(hex,amt){var c=hexToRgb(hex);return rgbToHex(c[0]-amt,c[1]-amt,c[2]-amt);}

/* Realistic floor with perspective tiles/planks */
function drawFloorPerspective(ctx,r,W,H,type,col1,col2){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0,H);ctx.lineTo(r.bwL,r.bwB);ctx.lineTo(r.bwR,r.bwB);ctx.lineTo(W,H);ctx.closePath();
  ctx.clip();
  
  // Base floor colour
  var baseG=ctx.createLinearGradient(W/2,r.bwB,W/2,H);
  baseG.addColorStop(0,darken(col1,20));baseG.addColorStop(0.5,col1);baseG.addColorStop(1,lighten(col1,8));
  ctx.fillStyle=baseG;ctx.fillRect(0,r.bwB,W,H-r.bwB);
  
  if(type==='wood'){
    // Perspective planks with grain
    var numPlanks=12;
    for(var p=0;p<=numPlanks;p++){
      var t=p/numPlanks;
      var lx=r.bwL+(t*(r.bwR-r.bwL));
      var bx=t*W;
      var alt=p%2===0;
      if(p<numPlanks){
        // Plank fill
        var plkG=ctx.createLinearGradient(lx,r.bwB,bx,H);
        plkG.addColorStop(0,alt?col1:col2);plkG.addColorStop(1,alt?darken(col1,6):darken(col2,6));
        ctx.fillStyle=plkG;
        var nx=r.bwL+((p+1)/numPlanks*(r.bwR-r.bwL));
        var nbx=(p+1)/numPlanks*W;
        ctx.beginPath();ctx.moveTo(lx,r.bwB);ctx.lineTo(nx,r.bwB);ctx.lineTo(nbx,H);ctx.lineTo(bx,H);ctx.closePath();ctx.fill();
        // Wood grain on plank
        drawWoodGrain(ctx,Math.min(lx,bx),r.bwB,Math.abs(bx-lx)+Math.abs(nbx-nx),H-r.bwB,0,'rgba(0,0,0,0.04)','rgba(0,0,0,0.02)');
      }
      // Grout line
      ctx.strokeStyle='rgba(0,0,0,0.14)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(lx,r.bwB);ctx.lineTo(bx,H);ctx.stroke();
    }
    // Horizontal grout lines (perspective)

/* Setup perspective room shell — aspect-ratio aware */
function perspRoom(ctx,W,H,wallColor,ceilColor,trim,lightDir){
  // Aspect ratio correction: on wide screens the vanishing point geometry
  // must shrink the back wall horizontally AND keep good vertical proportions.
  // Target is a "normal" 16:9 feel. For wider ratios we shrink the back wall
  // inward more so nothing looks stretched.
  var aspect = W / H;                         // e.g. 1.78 for 16:9, 3.5 for triple screen
  var normAspect = Math.min(aspect, 2.4);     // clamp — beyond 2.4 we treat as "very wide"

  // Back wall horizontal extent: shrinks as screen gets wider
  // At 16:9 (1.78): ~72% of width centered  →  bwL=14%, bwR=86%
  // At 21:9 (2.33): ~56% centered            →  bwL=22%, bwR=78%
  // At 32:9 (3.56): ~42% centered            →  bwL=29%, bwR=71%
  var backWallFrac = Math.max(0.38, 0.72 - (aspect - 1.78) * 0.12);
  var bwL = W * (0.5 - backWallFrac * 0.5);
  var bwR = W * (0.5 + backWallFrac * 0.5);

  // Vertical: ceiling line drops and floor line rises as aspect increases,
  // keeping the back wall square-ish rather than a letterbox strip.
  // At 16:9: bwT=9%, bwB=56.5%  (backWall height = 47.5% of H)
  // Wider: allow more vertical room height
  var ceilFrac = Math.max(0.04, 0.09 - (aspect - 1.78) * 0.02);
  var floorFrac = Math.min(0.72, 0.565 + (aspect - 1.78) * 0.06);
  var bwT = H * ceilFrac;
  var bwB = H * floorFrac;
  
  // Ceiling
  var ceilG=ctx.createLinearGradient(W/2,0,W/2,bwT);
  ceilG.addColorStop(0,darken(ceilColor,5));ceilG.addColorStop(1,ceilColor);
  ctx.fillStyle=ceilG;ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(bwL,bwT);ctx.lineTo(bwR,bwT);ctx.lineTo(W,0);ctx.closePath();ctx.fill();
  
  // Back wall — plaster texture
  drawPlasterWall(ctx,bwL,bwT,bwR-bwL,bwB-bwT,wallColor);
  
  // Left wall — heavily darkened for Electron depth visibility
  var lwG=ctx.createLinearGradient(0,H/2,bwL,H/2);
  lwG.addColorStop(0,darken(wallColor,38));lwG.addColorStop(0.6,darken(wallColor,18));lwG.addColorStop(1,lighten(wallColor,2));
  ctx.fillStyle=lwG;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(bwL,bwT);ctx.lineTo(bwL,bwB);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  // Left wall deep AO corner
  var lwAO=ctx.createLinearGradient(0,H/2,bwL*0.55,H/2);
  lwAO.addColorStop(0,'rgba(0,0,0,0.48)');lwAO.addColorStop(0.5,'rgba(0,0,0,0.22)');lwAO.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lwAO;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(bwL,bwT);ctx.lineTo(bwL,bwB);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  
  // Right wall — darkened
  var rwG=ctx.createLinearGradient(W,H/2,bwR,H/2);
  rwG.addColorStop(0,darken(wallColor,44));rwG.addColorStop(0.6,darken(wallColor,22));rwG.addColorStop(1,wallColor);
  ctx.fillStyle=rwG;ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(bwR,bwT);ctx.lineTo(bwR,bwB);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  var rwAO=ctx.createLinearGradient(W,H/2,bwR+bwL*0.5,H/2);
  rwAO.addColorStop(0,'rgba(0,0,0,0.44)');rwAO.addColorStop(0.5,'rgba(0,0,0,0.18)');rwAO.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rwAO;ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(bwR,bwT);ctx.lineTo(bwR,bwB);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  
  // Ceiling — strong gradient from window side
  var ceilShade=ctx.createLinearGradient(bwL,bwT,bwR,bwT);
  ceilShade.addColorStop(0,'rgba(255,255,220,0.08)');ceilShade.addColorStop(0.5,'rgba(255,255,220,0.04)');ceilShade.addColorStop(1,'rgba(0,0,0,0.06)');
  ctx.fillStyle=ceilShade;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(bwL,bwT);ctx.lineTo(bwR,bwT);ctx.lineTo(W,0);ctx.closePath();ctx.fill();
  
  // Cornice — bright to define ceiling/wall break clearly
  ctx.strokeStyle=lighten(trim,22);ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(bwL,bwT);ctx.lineTo(bwR,bwT);ctx.lineTo(W,0);ctx.stroke();
  ctx.strokeStyle=lighten(trim,28);ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(bwL,bwT);ctx.lineTo(bwR,bwT);ctx.stroke();
  
  // Skirting board — thick and visible
  var sbH=Math.max(12,H*0.018);
  ctx.fillStyle=lighten(trim,14);ctx.fillRect(bwL,bwB-sbH,bwR-bwL,sbH);
  // Skirting highlight top edge
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(bwL,bwB-sbH,bwR-bwL,3);
  // Skirting shadow below
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(bwL,bwB-3,bwR-bwL,3);
  
  // Side baseboards
  var lb1X=0,lb1Y=H-sbH*4;
  ctx.fillStyle=darken(trim,5);
  ctx.beginPath();ctx.moveTo(lb1X,lb1Y);ctx.lineTo(bwL,bwB-sbH);ctx.lineTo(bwL,bwB);ctx.lineTo(lb1X,H);ctx.closePath();ctx.fill();
  ctx.fillStyle=darken(trim,5);
  ctx.beginPath();ctx.moveTo(W,lb1Y);ctx.lineTo(bwR,bwB-sbH);ctx.lineTo(bwR,bwB);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  
  // Bold room corner lines — critical for depth perception
  ctx.strokeStyle='rgba(0,0,0,0.45)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(bwL,bwT);ctx.lineTo(bwL,bwB);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bwR,bwT);ctx.lineTo(bwR,bwB);ctx.stroke();
  // Inner corner shadow bands
  var lcAO=ctx.createLinearGradient(bwL,bwT,bwL+40,bwT);
  lcAO.addColorStop(0,'rgba(0,0,0,0.28)');lcAO.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lcAO;ctx.fillRect(bwL,bwT,40,bwB-bwT);
  var rcAO=ctx.createLinearGradient(bwR,bwT,bwR-40,bwT);
  rcAO.addColorStop(0,'rgba(0,0,0,0.22)');rcAO.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rcAO;ctx.fillRect(bwR-40,bwT,40,bwB-bwT);
  
  // Floor/wall join — deep AO strip
  var fwAO=ctx.createLinearGradient(0,bwB-40,0,bwB+10);
  fwAO.addColorStop(0,'rgba(0,0,0,0)');fwAO.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=fwAO;ctx.fillRect(bwL,bwB-40,bwR-bwL,50);
  
  // Ceiling corners
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(bwL,bwT);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(bwR,bwT);ctx.stroke();
  
  // Overall vignette — darkens all four edges, forces eye to centre
  var vig=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,Math.max(W,H)*0.75);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(0.7,'rgba(0,0,0,0.08)');vig.addColorStop(1,'rgba(0,0,0,0.42)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  
  return {bwL,bwR,bwT,bwB,rw:bwR-bwL,rh:bwB-bwT};
}

  ctx.fillStyle=fG;rrect(ctx,fX,fY,fW,fH,4);ctx.fill();
  // Handle

  ctx.fillRect(fX+fW*0.78,fY+fH*0.44,fW*0.08,fH*0.4);
  // Hinge line
  ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(fX,fY+fH*0.36);ctx.lineTo(fX+fW,fY+fH*0.36);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=2;rrect(ctx,fX,fY,fW,fH,4);ctx.stroke();
  drawHighlight(ctx,fX,fY,fW*0.5,fH*0.15,'left');
  
  // ── Sink ──

  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(sinkX+6,sinkY+2,4,ctH-4);
  // Tap

  ctx.fillStyle='#c8c4c0';rrect(ctx,sinkX+rw*0.04,ctY-22,rw*0.05,5,2);ctx.fill();
  
  // Backsplash tiles
  var bsY=ucY+ucH+2,bsH=ctY-ucY-ucH-2;
  if(bsH>0){
    ctx.fillStyle='#f5f3f0';ctx.fillRect(r.bwL+4,bsY,rw*0.72,bsH);
    ctx.strokeStyle='rgba(200,196,192,0.6)';ctx.lineWidth=0.5;

    for(var ty2=bsY;ty2<bsY+bsH;ty2+=ts2){ctx.beginPath();ctx.moveTo(r.bwL+4,ty2);ctx.lineTo(r.bwL+4+rw*0.72,ty2);ctx.stroke();}
    for(var tx2=r.bwL+4;tx2<r.bwL+4+rw*0.72;tx2+=ts2){ctx.beginPath();ctx.moveTo(tx2,bsY);ctx.lineTo(tx2,bsY+bsH);ctx.stroke();}
  }
}

function drawLiving(ctx,W,H,cfg){
  var r=perspRoom(ctx,W,H,'#ded8d0','#f0ebe5','#5a4e44');
  var rw=r.rw,rh=r.rh;
  
  drawFloorPerspective(ctx,r,W,H,'wood','#8a6840','#7a5c34');

  ctx.fillStyle=arG;rrect(ctx,sfX+sfW-18,sfY+sfH*0.2,18,sfH*0.58,3);ctx.fill();
  // Throw pillow
  var tpX=sfX+sfW*0.1,tpY=sfY+sfH*0.22;
  var tpG=ctx.createLinearGradient(tpX,tpY,tpX,tpY+sfH*0.26);
  tpG.addColorStop(0,'#e8c878');tpG.addColorStop(1,'#c8a858');
  ctx.fillStyle=tpG;rrect(ctx,tpX,tpY,sfW*0.14,sfH*0.26,4);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;rrect(ctx,tpX,tpY,sfW*0.14,sfH*0.26,4);ctx.stroke();
  drawAO(ctx,sfX,sfY,sfW,sfH,0.12);
  
  // ── Coffee table ──
  drawFloorShadow(ctx,r.bwL+rw*0.305,r.bwB-1,rw*0.28,11,0.42);
  var ctbX=r.bwL+rw*0.18,ctbY=r.bwB-rh*0.16,ctbW=rw*0.25,ctbH=10;
  var ctbG=ctx.createLinearGradient(ctbX,ctbY,ctbX+ctbW,ctbY+ctbH);

    ctx.fillStyle='#3a2a1a';ctx.fillRect(lg[0],lg[1],8,H*0.08);
  });
  // Table shadow

  // ── Bookshelf ──

  // Shelves
  var numShelves=5;
  for(var sh=0;sh<=numShelves;sh++){

        var bc=bookColors[(sh*3+bkk)%bookColors.length];
        var bG=ctx.createLinearGradient(bx,shY2+6,bx+bw2,shY2+6);
        bG.addColorStop(0,darken(bc,15));bG.addColorStop(0.3,bc);bG.addColorStop(1,darken(bc,10));

  }
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=2;rrect(ctx,bkX,bkY,bkW,bkH,2);ctx.stroke();
  
  // ── Rug ──
  var rugCx=r.bwL+rw*0.3,rugCy=r.bwB+(H-r.bwB)*0.3;
  ctx.save();ctx.beginPath();ctx.ellipse(rugCx,rugCy,rw*0.26,(H-r.bwB)*0.35,0,0,Math.PI*2);ctx.clip();

  ctx.beginPath();ctx.ellipse(rugCx,rugCy,rw*0.18,(H-r.bwB)*0.24,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
  
  // Window light GI
  var giG=ctx.createRadialGradient(wX+wW/2,wY+wH,0,wX+wW/2,wY+wH,W*0.9);
  giG.addColorStop(0,'rgba(200,220,255,0.1)');giG.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=giG;ctx.fillRect(0,0,W,H);
}

function drawLaundry(ctx,W,H,cfg){

    ctx.fillStyle=p[1];rrect(ctx,p[0],sY-rh*0.1,rw*0.032,rh*0.1,2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(p[0]+2,sY-rh*0.1,3,rh*0.1);
  });
  
  // Closet/wardrobe right
  var wcX=r.bwR-rw*0.24,wcY=r.bwT+rh*0.04,wcW=rw*0.20,wcH=rh*0.92;
  var wcG=ctx.createLinearGradient(wcX,wcY,wcX+wcW,wcY);

  ctx.fillStyle=wcG;rrect(ctx,wcX,wcY,wcW,wcH,2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(wcX+wcW/2,wcY);ctx.lineTo(wcX+wcW/2,wcY+wcH);ctx.stroke();

  ctx.fillRect(wcX+wcW/2+2,wcY+wcH*0.38,8,3);

  ctx.strokeStyle='rgba(0,0,0,0.14)';ctx.lineWidth=2;rrect(ctx,wcX,wcY,wcW,wcH,2);ctx.stroke();
  
  // Hamper
  var hpX=r.bwL*0.2,hpY=H*0.55,hpW=W*0.1,hpH=H*0.32;

  ctx.fillStyle='#d0c0a0';ctx.fillRect(hpX+hpW*0.3,hpY-4,hpW*0.4,5);

function drawRecycling(ctx,W,H,cfg){
  var r=perspRoom(ctx,W,H,'#e0ebe0','#f0f5f0','#4a5e4a');
  var rw=r.rw,rh=r.rh;
  
  drawFloorPerspective(ctx,r,W,H,'tile','#a8b4a8','#98a498');
  drawRealisticWindow(ctx,r.bwL+rw*0.08,r.bwT+rh*0.09,rw*0.18,rh*0.32,'day');
  drawRealisticWindow(ctx,r.bwR-rw*0.28,r.bwT+rh*0.09,rw*0.18,rh*0.32,'day');
  
  // Recycling bins — photorealistic
  var binData=[
    {x:0.05,color:'#1565c0',label:'Paper',icon:'📄'},
    {x:0.23,color:'#e53935',label:'Plastic',icon:'♻️'},
    {x:0.41,color:'#43a047',label:'Glass',icon:'🫙'},
    {x:0.59,color:'#fdd835',label:'Metal',icon:'🥫'},
    {x:0.77,color:'#6d4c41',label:'Compost',icon:'🌱'}
  ];
  binData.forEach(function(b){
    var bx=r.bwL+b.x*rw,by=r.bwB-rh*0.52,bw=rw*0.16,bh=rh*0.48;
    // Shadow
    var bSG=ctx.createRadialGradient(bx+bw/2,by+bh+4,0,bx+bw/2,by+bh+4,bw*0.8);
    bSG.addColorStop(0,'rgba(0,0,0,0.22)');bSG.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bSG;ctx.fillEllipse?ctx.fillEllipse(bx,by+bh,bw,16):null;
    ctx.beginPath();ctx.ellipse(bx+bw/2,by+bh+4,bw*0.5,8,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fill();
    // Bin body
    ctx.beginPath();ctx.moveTo(bx+6,by);ctx.lineTo(bx+bw-6,by);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx,by+bh);ctx.closePath();
    var bg=ctx.createLinearGradient(bx,by,bx+bw,by);
    bg.addColorStop(0,darken(b.color,20));bg.addColorStop(0.3,b.color);bg.addColorStop(0.7,lighten(b.color,8));bg.addColorStop(1,darken(b.color,15));
    ctx.fillStyle=bg;ctx.fill();
    // Lid
    ctx.beginPath();ctx.moveTo(bx+2,by-8);ctx.lineTo(bx+bw-2,by-8);ctx.lineTo(bx+bw-4,by);ctx.lineTo(bx+4,by);ctx.closePath();
    var lidG=ctx.createLinearGradient(bx,by-8,bx,by);
    lidG.addColorStop(0,lighten(b.color,12));lidG.addColorStop(1,b.color);
    ctx.fillStyle=lidG;ctx.fill();
    // Handle
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(bx+bw/2,by-6,bw*0.12,Math.PI,0);ctx.stroke();
    // Highlight
    ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.moveTo(bx+8,by);ctx.lineTo(bx+bw*0.35,by);ctx.lineTo(bx+bw*0.3,by+bh);ctx.lineTo(bx+4,by+bh);ctx.closePath();ctx.fill();
    // Label
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold '+Math.round(bw*0.14)+'px Arial';ctx.textAlign='center';
    ctx.fillText(b.label,bx+bw/2,by+bh*0.6);
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(bx+6,by);ctx.lineTo(bx+bw-6,by);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx,by+bh);ctx.closePath();ctx.stroke();
  });
  
  // Poster on back wall
  var pX=r.bwL+rw*0.36,pY=r.bwT+rh*0.1,pW=rw*0.22,pH=rh*0.25;
  ctx.fillStyle='#1a2a1a';ctx.fillRect(pX-4,pY-4,pW+8,pH+8);
  var pG=ctx.createLinearGradient(pX,pY,pX,pY+pH);
  pG.addColorStop(0,'#1a5e20');pG.addColorStop(1,'#388e3c');
  ctx.fillStyle=pG;ctx.fillRect(pX,pY,pW,pH);
  ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='bold '+Math.round(pW*0.14)+'px Arial';ctx.textAlign='center';
  ctx.fillText('RECYCLE',pX+pW/2,pY+pH*0.45);
  ctx.font=Math.round(pW*0.09)+'px Arial';ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('Save the Planet',pX+pW/2,pY+pH*0.68);
}

function drawDining(ctx,W,H,cfg){
  var r=perspRoom(ctx,W,H,'#eae3d8','#f5f0e8','#7a6652');

  drawFloorPerspective(ctx,r,W,H,'wood','#a07848','#906838');
  drawRealisticWindow(ctx,r.bwL+rw*0.08,r.bwT+rh*0.08,rw*0.20,rh*0.40,'day');
  
  // ── Dining table ──
  drawFloorShadow(ctx,r.bwL+rw*0.47,r.bwB,rw*0.62,20,0.50);
  var dtX=r.bwL+rw*0.18,dtY=r.bwB-rh*0.42,dtW=rw*0.58,dtH=12;
  // Table shadow
  ctx.beginPath();ctx.ellipse(dtX+dtW/2,dtY+dtH+H*0.08,dtW*0.42,H*0.04,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fill();

  dtG.addColorStop(0,'#7a5830');dtG.addColorStop(0.3,'#9a7040');dtG.addColorStop(0.7,'#8a6038');dtG.addColorStop(1,'#6a4828');
  ctx.fillStyle=dtG;rrect(ctx,dtX,dtY,dtW,dtH,3);ctx.fill();
  drawWoodGrain(ctx,dtX,dtY,dtW,dtH,0,'rgba(0,0,0,0.04)','rgba(255,255,255,0.03)',20);
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(dtX+8,dtY+1,dtW-16,2);
  // Legs
  [[dtX+20,dtY+dtH],[dtX+dtW-28,dtY+dtH]].forEach(function(lg){
    var lgG=ctx.createLinearGradient(lg[0],lg[1],lg[0]+8,lg[1]);
    lgG.addColorStop(0,'#4a3020');lgG.addColorStop(1,'#6a4830');

    // Foot
    ctx.fillStyle='#3a2010';ctx.fillRect(lg[0]-4,lg[1]+rh*0.35,16,6);
  });
  
  // Chairs
  [0.22,0.42,0.62].forEach(function(cx){
    var chX=r.bwL+cx*rw-rw*0.06,chY=r.bwB-rh*0.5,chW=rw*0.12,chH=rh*0.42;

    var cbG=ctx.createLinearGradient(chX,chY,chX+chW,chY+chH*0.45);
    cbG.addColorStop(0,'#6a5840');cbG.addColorStop(1,'#5a4830');
    ctx.fillStyle=cbG;rrect(ctx,chX+chW*0.1,chY-chH*0.42,chW*0.8,chH*0.42,4);ctx.fill();
    // Seat
    var csG=ctx.createLinearGradient(chX,chY,chX,chY+chH*0.18);
    csG.addColorStop(0,'#e8dcc8');csG.addColorStop(1,'#d0c4b0');
    ctx.fillStyle=csG;rrect(ctx,chX,chY,chW,chH*0.14,3);ctx.fill();
    // Legs
    [[chX+chW*0.1,chY+chH*0.14],[chX+chW*0.8,chY+chH*0.14]].forEach(function(lg){
      ctx.fillStyle='#4a3820';ctx.fillRect(lg[0],lg[1],5,chH*0.35);
    });
  });
  
  // ── Sideboard ──
  var sbX=r.bwR-rw*0.20,sbY=r.bwB-rh*0.42,sbW=rw*0.16,sbH=rh*0.36;
  var sbG=ctx.createLinearGradient(sbX,sbY,sbX+sbW,sbY);
  sbG.addColorStop(0,'#4a3020');sbG.addColorStop(0.5,'#6a4830');sbG.addColorStop(1,'#4a3020');
  ctx.fillStyle=sbG;rrect(ctx,sbX,sbY,sbW,sbH,3);ctx.fill();
  drawWoodGrain(ctx,sbX,sbY,sbW,sbH,0,'rgba(0,0,0,0.04)','rgba(255,255,255,0.02)');
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
  ctx.strokeRect(sbX+4,sbY+4,sbW/2-8,sbH-8);ctx.strokeRect(sbX+sbW/2+4,sbY+4,sbW/2-8,sbH-8);
  ctx.fillStyle='#c8a860';ctx.fillRect(sbX+sbW/2-6,sbY+sbH*0.45,4,sbH*0.1);ctx.fillRect(sbX+sbW/2+2,sbY+sbH*0.45,4,sbH*0.1);
  // Object on sideboard — vase
  var vX=sbX+sbW*0.35,vY=sbY-rh*0.12;
  var vG=ctx.createLinearGradient(vX,vY,vX+sbW*0.18,vY);
  vG.addColorStop(0,'#8a9080');vG.addColorStop(0.5,'#b0b8a8');vG.addColorStop(1,'#8a9080');
  ctx.fillStyle=vG;
  ctx.beginPath();ctx.moveTo(vX+sbW*0.04,vY);ctx.bezierCurveTo(vX,vY+rh*0.04,vX,vY+rh*0.08,vX+sbW*0.04,vY+rh*0.12);
  ctx.lineTo(vX+sbW*0.14,vY+rh*0.12);ctx.bezierCurveTo(vX+sbW*0.18,vY+rh*0.08,vX+sbW*0.18,vY+rh*0.04,vX+sbW*0.14,vY);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#608870';ctx.beginPath();
  ctx.arc(vX+sbW*0.09,vY-8,8,0,Math.PI*2);ctx.fill();
  
  // Wall art above sideboard
  var waX=r.bwR-rw*0.22,waY=r.bwT+rh*0.1,waW=rw*0.18,waH=rh*0.28;
  ctx.fillStyle='#2a1a0a';ctx.fillRect(waX-5,waY-5,waW+10,waH+10);
  var waG=ctx.createLinearGradient(waX,waY,waX+waW,waY+waH);
  waG.addColorStop(0,'#f0e8d8');waG.addColorStop(1,'#e0d0c0');
  ctx.fillStyle=waG;ctx.fillRect(waX,waY,waW,waH);
  ctx.fillStyle='rgba(80,50,20,0.2)';ctx.beginPath();ctx.arc(waX+waW*0.4,waY+waH*0.5,waW*0.25,0,Math.PI*2);ctx.fill();
  
  // Pendant light
  var plX=r.bwL+rw*0.35,plY=0,plW=rw*0.24;

  ctx.beginPath();ctx.moveTo(plX+plW/2,plY);ctx.lineTo(plX+plW/2,r.bwT*0.5);ctx.stroke();

  ctx.moveTo(plX,r.bwT*0.9);ctx.lineTo(plX+plW,r.bwT*0.9);ctx.lineTo(plX+plW*0.85,r.bwT*0.5);ctx.lineTo(plX+plW*0.15,r.bwT*0.5);ctx.closePath();ctx.fill();
  var glowG2=ctx.createRadialGradient(plX+plW/2,r.bwT,0,plX+plW/2,r.bwT,plW*1.5);
  glowG2.addColorStop(0,'rgba(255,240,180,0.2)');glowG2.addColorStop(1,'rgba(255,240,180,0)');
  ctx.fillStyle=glowG2;ctx.fillRect(plX-plW,0,plW*3,H*0.5);
  
  // Rug
  var rugCx=dtX+dtW/2,rugCy=r.bwB+(H-r.bwB)*0.32;
  ctx.save();ctx.beginPath();ctx.ellipse(rugCx,rugCy,dtW*0.52,Math.max(28,(H-r.bwB)*0.32),0,0,Math.PI*2);ctx.clip();
  var rugG3=ctx.createRadialGradient(rugCx,rugCy,0,rugCx,rugCy,dtW*0.52);
  rugG3.addColorStop(0,'#c8a070');rugG3.addColorStop(0.5,'#b09060');rugG3.addColorStop(1,'#8a6840');
  ctx.fillStyle=rugG3;ctx.fillRect(rugCx-dtW*0.6,rugCy-H*0.2,dtW*1.2,H*0.4);
  ctx.strokeStyle='rgba(200,160,80,0.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(rugCx,rugCy,dtW*0.35,Math.max(18,(H-r.bwB)*0.22),0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function drawItemShadows(){
  // Draw canvas-baked shadows beneath all unplaced emoji items
  // This runs after room draw, before DOM elements paint
  if(!itemEls||!itemEls.length)return;
  itemEls.forEach(function(el){
    var left=parseFloat(el.style.left)||0;
    var top=parseFloat(el.style.top)||0;
    var sz=parseFloat(getComputedStyle(el).fontSize)||56;
    var cx=left+sz*0.5,cy=top+sz*0.85;
    ctx.save();
    var g=ctx.createRadialGradient(cx,cy,0,cx,cy,sz*0.52);
    g.addColorStop(0,'rgba(0,0,0,0.55)');
    g.addColorStop(0.5,'rgba(0,0,0,0.28)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.ellipse(cx,cy,sz*0.52,sz*0.18,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

function getFloorFrac(){
  var aspect=W/H;
  return Math.min(0.72,0.565+(aspect-1.78)*0.06);
}
function randomFloorPos(){
  var ff=getFloorFrac();
  var yMin=ff+0.04,yMax=Math.min(0.92,ff+0.30);
  return{x:0.08+Math.random()*0.84,y:yMin+Math.random()*(yMax-yMin)};
}

function reshuffleItems(){
  if(gameOver)return;
  deselectItem();
  clearHighlights();
  var used=[];
  itemEls.forEach(function(el){
    if(el.dataset.placed==='true')return;
    var pos,tries=0;
    do{pos=randomFloorPos();tries++;}while(tries<100&&used.some(function(p){return Math.hypot(p.x-pos.x,p.y-pos.y)<0.12;}));
    used.push(pos);
    var rot=(Math.random()-0.5)*28;
    var px=pos.x*W-36,py=pos.y*H-36;
    el.style.left=px+'px';el.style.top=py+'px';el.style.transform='rotate('+rot+'deg)';
    el.dataset.homeX=px;el.dataset.homeY=py;el.dataset.homeRot=rot;
  });
}

// Remap a target Y fraction (designed for 16:9) to actual screen coords.
// The original positions were authored assuming bwT=0.09H and bwB=0.565H.
// On different aspect ratios bwT and bwB shift, so we linearly remap.
function remapTargetY(origY){
  var aspect=W/H;
  var origBwT=0.09,origBwB=0.565;
  var newBwT=Math.max(0.04,0.09-(aspect-1.78)*0.02);
  var newBwB=Math.min(0.72,0.565+(aspect-1.78)*0.06);
  // remap: origY goes from 0..1 in original space; map room band linearly
  // items inside room (origY between origBwT and 1) remap to new room
  if(origY<=origBwT) return newBwT*(origY/origBwT);
  return newBwT+(origY-origBwT)*((newBwB-newBwT)/(origBwB-origBwT));
}

// Remap target X: on very wide screens back-wall content is narrower.
// Original content was authored for bwL=0.14W. We scale X around 0.5.
function remapTargetX(origX){
  var aspect=W/H;
  var origBackFrac=0.72; // original back wall fraction of W
  var newBackFrac=Math.max(0.38,0.72-(aspect-1.78)*0.12);
  // Scale X distance from centre
  var dx=origX-0.5;
  return 0.5+dx*(newBackFrac/origBackFrac);
}

function initGame(){
  document.getElementById('roomTitle').textContent=config.name;
  document.getElementById('scoreVal').textContent='0/'+totalItems;
  document.getElementById('progressFill').style.background=config.progressColor;
  var ob=document.getElementById('overlayBox');
  ob.style.background=config.overlayBg;ob.style.borderColor=config.overlayBorder;
  document.getElementById('overlayTitle').style.color=config.overlayTitleColor;
  
  var used=[];
  selectedItems.forEach(function(it,i){
    var tz=document.createElement('div');
    tz.className='target-zone';
    // Remap authored positions to actual room geometry on this screen
    var tx=remapTargetX(it.targetX)*W;
    var ty=remapTargetY(it.targetY)*H;
    tz.style.left=(tx-it.targetW/2)+'px';tz.style.top=(ty-it.targetH/2)+'px';
    tz.style.width=it.targetW+'px';tz.style.height=it.targetH+'px';
    tz.innerHTML='<span class="target-ghost">'+it.emoji+'</span><span class="target-label">'+it.targetLabel+'</span>';
    gameLayer.appendChild(tz);targetEls.push(tz);
    
    var el=document.createElement('div');
    el.className='drag-item';el.textContent=it.emoji;el.dataset.index=i;el.dataset.placed='false';
    var pos,tries=0;
    do{pos=randomFloorPos();tries++;}while(tries<100&&used.some(function(p){return Math.hypot(p.x-pos.x,p.y-pos.y)<0.12;}));
    used.push(pos);
    var rot=(Math.random()-0.5)*28;
    var px=pos.x*W-36,py=pos.y*H-36;
    el.style.left=px+'px';el.style.top=py+'px';el.style.transform='rotate('+rot+'deg)';
    el.dataset.homeX=px;el.dataset.homeY=py;el.dataset.homeRot=rot;
    gameLayer.appendChild(el);itemEls.push(el);
  });
  startTimer();
}

function startTimer(){
  timerInterval=setInterval(function(){
    if(gameOver)return;elapsed++;
    var m=Math.floor(elapsed/60),s=elapsed%60;
    document.getElementById('timerVal').textContent=m+':'+(s<10?'0':'')+s;
  },1000);
}

function updateProgress(){
  var pct=(placedCount/totalItems)*100;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=placedCount+' / '+totalItems+' items placed';
  document.getElementById('scoreVal').textContent=placedCount+'/'+totalItems;
}

function checkDrop(el,dropX,dropY){
  var idx=parseInt(el.dataset.index),it=selectedItems[idx],tz=targetEls[idx];
  var tr=tz.getBoundingClientRect();
  var cx=tr.left+tr.width/2,cy=tr.top+tr.height/2;
  var dist=Math.hypot(dropX-cx,dropY-cy);
  if(dist<Math.max(tr.width,tr.height)*0.75){
    el.dataset.placed='true';el.classList.remove('dragging');el.classList.add('placed');
    el.style.left=(remapTargetX(it.targetX)*W-el.offsetWidth/2)+'px';el.style.top=(remapTargetY(it.targetY)*H-el.offsetHeight/2)+'px';
    el.style.transform='rotate(0deg)';tz.classList.add('filled');
    placedCount++;updateProgress();spawnSparkles(dropX,dropY);playSound(true);
    if(placedCount>=totalItems)endGame();
  }else{
    // Update home position to where it was dropped — stays put instead of snapping back
    var newLeft=dropX-el.offsetWidth/2;
    var newTop=dropY-el.offsetHeight/2;
    el.dataset.homeX=newLeft;el.dataset.homeY=newTop;el.dataset.homeRot=0;
    el.classList.add('wrong');playSound(false);
    setTimeout(function(){
      el.classList.remove('wrong','dragging');
      el.style.left=newLeft+'px';el.style.top=newTop+'px';
      el.style.transform='rotate(0deg)';
    },420);
  }
}

function spawnSparkles(x,y){
  var sparks=['\u2728','\u2B50','\u26A1','\u2764\uFE0F','\u2705'];
  for(var i=0;i<10;i++){
    var s=document.createElement('div');s.className='sparkle';s.textContent=sparks[i%sparks.length];
    s.style.left=x+'px';s.style.top=y+'px';
    var angle=(i/10)*Math.PI*2,d=50+Math.random()*70;
    s.style.setProperty('--sx',(Math.cos(angle)*d)+'px');s.style.setProperty('--sy',(Math.sin(angle)*d)+'px');
    gameLayer.appendChild(s);s.addEventListener('animationend',function(){this.remove();});
  }
}

function playSound(success){
  try{
    var ac=new(window.AudioContext||window.webkitAudioContext)();
    if(success){
      [523.25,659.25,783.99].forEach(function(f,i){
        var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
        o.frequency.value=f;o.type='sine';var t=ac.currentTime+i*0.07;
        g.gain.setValueAtTime(0.16,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
        o.start(t);o.stop(t+0.3);
      });
    }else{
      var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
      o.frequency.value=200;o.type='sawtooth';
      g.gain.setValueAtTime(0.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.28);
      o.start();o.stop(ac.currentTime+0.28);
    }
  }catch(_){}
}

function endGame(){
  gameOver=true;clearInterval(timerInterval);
  setTimeout(function(){
    var m=Math.floor(elapsed/60),s=elapsed%60;
    document.getElementById('overlayTitle').textContent='\u2728 Room Sorted! \u2728';
    document.getElementById('overlayMsg').innerHTML='Time: '+m+':'+(s<10?'0':'')+s+'<br>All '+totalItems+' items in their place!';
    document.getElementById('winOverlay').classList.add('show');
  },500);
}

function highlightTargets(){
  // Highlight all unfilled target zones (called when item is selected)
  targetEls.forEach(function(tz){
    if(!tz.classList.contains('filled')) tz.classList.add('active');
  });
}
function clearHighlights(){targetEls.forEach(function(tz){tz.classList.remove('active');});}

function getItemAt(x,y){
  for(var i=itemEls.length-1;i>=0;i--){
    var el=itemEls[i];if(el.dataset.placed==='true')continue;
    var r=el.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return el;
  }return null;
}

var activeDrags=new Map(),mouseDrag=null;
var selectedEl=null; // currently selected item

function selectItem(el){
  if(selectedEl&&selectedEl!==el) deselectItem();
  selectedEl=el;
  el.classList.add('selected');
  // Highlight all unfilled targets to guide the player
  targetEls.forEach(function(tz){
    if(!tz.classList.contains('filled')) tz.classList.add('active');
  });
}

function deselectItem(){
  if(!selectedEl)return;
  selectedEl.classList.remove('selected');
  selectedEl=null;
  clearHighlights();
}

function getTargetAt(x,y){
  // Returns the closest unfilled target zone if click lands inside or near it
  var best=null,bestDist=Infinity;
  targetEls.forEach(function(tz,i){
    if(tz.classList.contains('filled'))return;
    var tr=tz.getBoundingClientRect();
    var cx=tr.left+tr.width/2,cy=tr.top+tr.height/2;
    var dist=Math.hypot(x-cx,y-cy);
    var threshold=Math.max(tr.width,tr.height)*0.75;
    if(dist<threshold&&dist<bestDist){best=i;bestDist=dist;}
  });
  return best; // returns index or null
}

// Unified click/tap handler
function handleTap(x,y){
  if(gameOver)return;

  // If something is selected, try to place it
  if(selectedEl){
    var targetIdx=getTargetAt(x,y);
    var elIdx=parseInt(selectedEl.dataset.index);

    if(targetIdx!==null&&targetIdx===elIdx){
      // ✅ Correct target — place it
      var it=selectedItems[elIdx];
      var tz=targetEls[elIdx];
      selectedEl.classList.remove('selected');
      selectedEl.classList.add('placed');
      selectedEl.style.left=(remapTargetX(it.targetX)*W-selectedEl.offsetWidth/2)+'px';
      selectedEl.style.top=(remapTargetY(it.targetY)*H-selectedEl.offsetHeight/2)+'px';
      selectedEl.style.transform='scale(1)';
      selectedEl.dataset.placed='true';
      tz.classList.add('filled');
      placedCount++;updateProgress();
      spawnSparkles(remapTargetX(it.targetX)*W,remapTargetY(it.targetY)*H);
      playSound(true);
      selectedEl=null;clearHighlights();
      if(placedCount>=totalItems)endGame();
      return;
    }

    if(targetIdx!==null&&targetIdx!==elIdx){
      // ❌ Wrong target — shake and keep selected
      selectedEl.classList.add('wrong');playSound(false);
      setTimeout(function(){if(selectedEl)selectedEl.classList.remove('wrong');},420);
      return;
    }

    // Clicked an item — switch selection or deselect
    var clickedEl=getItemAt(x,y);
    if(clickedEl&&clickedEl!==selectedEl&&clickedEl.dataset.placed!=='true'){
      selectItem(clickedEl);return;
    }

    // Clicked empty space — deselect
    deselectItem();
    return;
  }

  // Nothing selected — try to select an item
  var el=getItemAt(x,y);
  if(el&&el.dataset.placed!=='true') selectItem(el);
}

// Mouse
gameLayer.addEventListener('click',function(e){
  handleTap(e.clientX,e.clientY);
});

// Touch — use touchend so there's no 300ms delay
gameLayer.addEventListener('touchend',function(e){
  e.preventDefault();
  var t=e.changedTouches[0];
  handleTap(t.clientX,t.clientY);
},{passive:false});

// Suppress context menu and default touch behaviors
gameLayer.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});
gameLayer.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

function navTo(url){location.href=url;}
function navReload(){location.reload();}

document.getElementById('backBtn').addEventListener('click',function(e){if(!(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents))navTo('../index.html');});
document.getElementById('backBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();navTo('../index.html');});
document.getElementById('playAgainBtn').addEventListener('click',function(e){if(!(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents))navReload();});
document.getElementById('playAgainBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();navReload();});
document.getElementById('menuBtn').addEventListener('click',function(e){if(!(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents))navTo('../index.html');});
document.getElementById('menuBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();navTo('../index.html');});
document.getElementById('reshuffleBtn').addEventListener('click',function(e){if(!(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents))reshuffleItems();});
document.getElementById('reshuffleBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();reshuffleItems();});
document.getElementById('backToolbarBtn').addEventListener('click',function(e){if(!(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents))navTo('../index.html');});
document.getElementById('backToolbarBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();navTo('../index.html');});

resize();
initGame();
</script>
