<!DOCTYPE html>
<!--
================================================================================
  Kerala Instruments - Pangappara Blueroom, Vocational
================================================================================
  Rebuilt towards music-maker, as asked: the instruments are PLAYABLE rather
  than a card board, and each pad is struck instead of answered.

  HONEST LIMIT: these are still synthesised, because no recordings of a
  chenda, maddalam or chengila exist in the repo. The synthesis is much
  closer than the plain tones it replaced - each instrument has its own
  pitch, decay and noise character, and the membrane drums layer noise over
  a falling pitch the way a struck skin actually behaves - but it is not a
  recording and should be replaced by one. That is an asset task, not a code
  task; drop mp3s into assets/new/audio/instruments and point SOUND at them.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kerala Instruments</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fdf8f0,#f7ecd9 70%,#efe0c6);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#8a5a2b;text-align:center;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #ddc9a4;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:grid;place-items:center;padding:6px;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.22;pointer-events:none}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .pad{border-radius:16px;border:4px solid #ddc9a4;background:#fff;cursor:pointer;
    display:grid;place-items:center;gap:2px;padding:6px;
    width:clamp(58px,12vh,124px);height:clamp(58px,12vh,124px);
    box-shadow:0 5px 13px rgba(120,80,30,.16);transition:transform .1s,box-shadow .1s}
  .pad:active{transform:translateY(3px);box-shadow:0 2px 6px rgba(120,80,30,.16)}
  .pad.hit{animation:hit .34s ease-out}
  @keyframes hit{0%{transform:scale(1)}35%{transform:scale(1.12);box-shadow:0 0 0 8px rgba(200,140,60,.25)}100%{transform:none}}
  .pad .em{font-size:clamp(22px,4.6vh,52px);line-height:1}
  .pad img{width:clamp(28px,6vh,68px);height:clamp(28px,6vh,68px);
    object-fit:contain;display:block;pointer-events:none}
  .pad .nm{font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.4vh,15px);color:#5b4326;text-align:center;line-height:1.25}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/instrument-icons.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var INSTR=[
 {k:'chenda',   em:'\ud83e\udd41', ml:'\u0d1a\u0d46\u0d23\u0d4d\u0d1f', kind:'drum',  f:120, dur:.5,  noise:.55},
 {k:'maddalam', em:'\ud83e\udd41', ml:'\u0d2e\u0d26\u0d4d\u0d26\u0d33\u0d02', kind:'drum',  f:86,  dur:.62, noise:.4},
 {k:'chengila', em:'\ud83d\udd14', ml:'\u0d1a\u0d46\u0d19\u0d4d\u0d19\u0d3f\u0d32', kind:'metal', f:880, dur:1.5, noise:.12},
 {k:'ilathalam',em:'\ud83e\udd3f', ml:'\u0d07\u0d32\u0d24\u0d4d\u0d24\u0d3e\u0d33\u0d02', kind:'metal', f:1320,dur:1.1, noise:.3},
 {k:'kaimani',  em:'\ud83d\udd14', ml:'\u0d15\u0d48\u0d2e\u0d23\u0d3f', kind:'metal', f:1760,dur:.8,  noise:.1},
 {k:'udukku',   em:'\ud83e\udd41', ml:'\u0d09\u0d1f\u0d41\u0d15\u0d4d\u0d15\u0d4d', kind:'drum',  f:180, dur:.4,  noise:.45}
];

/* Reported as "just static noise": the noise burst was carrying most of the
   level and drowning the pitched part, so every pad sounded like the same
   hiss. Noise is now a short transient only - the attack of a stick on a
   skin - at a fraction of the volume, and the PITCH carries the instrument.
   A chenda and a chengila are told apart by pitch and decay, not by hiss. */
function strike(i){
  if(i.kind==='drum'){
    /* a struck skin: strong low fundamental, a fifth above it, and the
       briefest click of contact */
    WALL.tone(i.f,        i.dur,      'sine',     0.34);
    WALL.tone(i.f*1.5,    i.dur*0.55, 'sine',     0.12, 0.005);
    WALL.tone(i.f*0.5,    i.dur*0.9,  'triangle', 0.10, 0);
    WALL.noise(0.035, 0.045, 30);
  } else {
    /* struck metal: a long ring with inharmonic partials above it */
    WALL.tone(i.f,        i.dur,      'triangle', 0.22);
    WALL.tone(i.f*2.76,   i.dur*0.75, 'sine',     0.09, 0.004);
    WALL.tone(i.f*5.40,   i.dur*0.45, 'sine',     0.05, 0.008);
    WALL.noise(0.02, 0.03, 40);
  }
}

TRIUP.start({
  title:{en:'Kerala Instruments',ml:'\u0d35\u0d3e\u0d26\u0d4d\u0d2f\u0d4b\u0d2a\u0d15\u0d30\u0d23\u0d19\u0d4d\u0d19\u0d7e'},
  hint:{en:'Tap to play',ml:'\u0d15\u0d4a\u0d1f\u0d4d\u0d1f\u0d3e\u0d7b \u0d24\u0d4a\u0d1f\u0d42'},
  build:function(p, body, api){
    var st=api.state(p); st.hits=0;
    var lead=document.createElement('div'); lead.className='leadml';
    lead.textContent='\u0d15\u0d4a\u0d1f\u0d4d\u0d1f\u0d3e\u0d7b \u0d24\u0d4a\u0d1f\u0d42';
    var grid=document.createElement('div'); grid.className='row';
    body.appendChild(lead); body.appendChild(grid);
    api.pill(p,'played','0');

    INSTR.forEach(function(i){
      var pad=document.createElement('div'); pad.className='pad';
      /* drawn, not emoji: the emoji set has one drum glyph for three
         different instruments, so three pads looked the same */
      pad.innerHTML = (INSTRUMENT_ICONS.has(i.k)
        ? '<img src="'+INSTRUMENT_ICONS.uri(i.k)+'" alt="">'
        : '<div class="em">'+i.em+'</div>') +
        '<div class="nm">'+i.ml+'</div>';
      WALL.bindTouch(pad,function(){
        strike(i);
        pad.classList.remove('hit'); void pad.offsetWidth; pad.classList.add('hit');
        st.hits++; api.pill(p,'played',String(st.hits));
        /* only panel 1 names it, or three panels speak over each other */
        if(p===0&&WALL.voiceOn()) WALL.say(i.ml);
      });
      grid.appendChild(pad);
    });
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
