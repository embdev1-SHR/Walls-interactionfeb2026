<!DOCTYPE html>
<!--
================================================================================
  Flower Bouquet - Pangappara Blueroom, Secondary
================================================================================
  Emoji and vector, as asked - no photographs. Three panels.

  ORDER FILLING: a bouquet is requested by kind and count ("two roses, three
  jasmine") and the learner assembles exactly that. Both properties have to
  be held at once, which is a step past matching one attribute, and it is
  the same skill a florist's counter actually needs.

  Three panels. Each learner works independently and gets their own card in
  their own panel; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flower Bouquet</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fdf7ff,#f6ebfb 70%,#eddff5);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #ddc8ea;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:flex;align-items:center;justify-content:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.25;pointer-events:none}
  .tile.sel{border-color:#f0872f;box-shadow:0 0 0 4px rgba(240,135,47,.3);transform:translateY(-4px)}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .wide{width:clamp(58px,12vh,120px);height:clamp(44px,9vh,92px)}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#7a3f8f;text-align:center;flex-shrink:0}
  .vase{font-size:clamp(30px,6vh,64px);line-height:1;flex-shrink:0}
  .held{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:clamp(28px,5vh,52px);
    align-items:center;flex-shrink:0}
  .held span{font-size:clamp(20px,3.6vh,42px);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  .order{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.2vh,24px);color:#7a3f8f;text-align:center;flex-shrink:0}
  /* ── the bouquet, as big as the panel allows ── */
  .bq{position:relative;flex:1 1 auto;min-height:0;width:min(100%,62vh);aspect-ratio:1/1.05;max-height:100%}
  .bq .stems{position:absolute;inset:0;width:100%;height:100%}
  .bq .wrap{position:absolute;left:12%;right:12%;bottom:0;width:76%;height:42%}
  .bq .heads{position:absolute;inset:0}
  .bq .head{position:absolute;width:24%;aspect-ratio:1;transform:translate(-50%,0);
    display:grid;place-items:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
  .bq .head span{font-size:min(9vh,16vw);line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
  .bq .head img{width:66%!important;height:66%!important}   /* same size as an emoji head */
  .bq .head img,.fl .pic img,.ghost img{width:100%;height:100%;object-fit:cover;border-radius:50%;
    border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .tray{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1vw,14px)}
  .fl{width:clamp(70px,11vh,130px);display:flex;flex-direction:column;align-items:center;gap:2px;
    background:#fff;border-radius:16px;padding:6px 4px;box-shadow:0 4px 10px rgba(40,50,70,.15);
    cursor:grab;touch-action:none;user-select:none}
  .fl .pic{width:80%;aspect-ratio:1;display:grid;place-items:center}
  .fl .pic span{font-size:clamp(40px,7vh,84px);line-height:1}
  .fl .nm{font-family:'Noto Sans Malayalam','Baloo 2',sans-serif;font-weight:800;font-size:clamp(10px,1.6vh,16px);color:#26313b;text-align:center}
  .ghost{position:fixed;z-index:200;width:clamp(70px,12vh,140px);aspect-ratio:1;transform:translate(-50%,-50%);
    pointer-events:none;display:grid;place-items:center}
  .ghost span{font-size:clamp(50px,9vh,100px);line-height:1}
  @keyframes pop{from{transform:translate(-50%,0) scale(.2)}to{transform:translate(-50%,0) scale(1)}}
</style>
</head>
<body>
<script src="../js/i18n-data.js"></script>
<script src="../js/wall-settings.js"></script>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* REBUILT on review: "clear big images needed. What I meant is to drag each
   flower to make a big bouquet." A tray of flowers below; drag one (or tap
   it) into the bouquet and it joins the bunch on a stem. Nine flowers make a
   full bouquet. Any flower in any order — making it is the activity. */
var IMG='../assets/new/images/flowers/';
var FLOWERS=[
 {en:'Rose',      ml:'റോസാപ്പൂവ്',  em:'🌹'},
 {en:'Sunflower', ml:'സൂര്യകാന്തി', em:'🌻'},
 {en:'Hibiscus',  ml:'ചെമ്പരത്തി',  em:'🌺'},
 {en:'Tulip',     ml:'ടുലിപ്',       em:'🌷'},
 {en:'Jasmine',   ml:'മുല്ലപ്പൂവ്',  img:IMG+'mulla.jpg'},
 {en:'Marigold',  ml:'ജമന്തി',      img:IMG+'jamanti.jpg'}
];
var FULL=9;
/* where each new flower head sits, as % of the bouquet box (a fan) */
var SLOTS=[[50,30],[30,38],[70,38],[40,16],[60,16],[18,24],[82,24],[50,4],[30,4]];
function head(f){ return f.img ? '<img src="'+f.img+'" alt="">' : '<span>'+f.em+'</span>'; }
var WRAP='<svg class="wrap" viewBox="0 0 100 70" preserveAspectRatio="xMidYMax meet">'+
  '<path d="M8 4 L50 68 L92 4 Q50 18 8 4Z" fill="#f7b2c9" stroke="#e07fa2" stroke-width="1.5"/>'+
  '<path d="M20 8 L50 68 L80 8" fill="none" stroke="#e98fb0" stroke-width="1"/>'+
  '<path d="M38 40 q12 -6 24 0 l-4 6 q-8 -4 -16 0z" fill="#d6336c"/></svg>';

TRIUP.start({
  title:{en:'Flower Bouquet',ml:'പൂച്ചെണ്ട്'},
  hint:{en:'Drag the flowers into the bouquet',ml:'പൂക്കൾ പൂച്ചെണ്ടിലേക്ക് വലിച്ചിടൂ'},
  build:function(p, body, api){
    var st=api.state(p); st.n=0;
    var bq=document.createElement('div'); bq.className='bq';
    bq.innerHTML='<svg class="stems" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div class="heads"></div>'+WRAP;
    var tray=document.createElement('div'); tray.className='tray';
    body.appendChild(bq); body.appendChild(tray);
    var heads=bq.querySelector('.heads'), stems=bq.querySelector('.stems');
    api.pill(p,'flowers','0 / '+FULL);

    function reset(){ st.n=0; heads.innerHTML=''; stems.innerHTML=''; api.pill(p,'flowers','0 / '+FULL); }
    function add(f){
      if(st.n>=FULL) return;
      var s=SLOTS[st.n];
      var h=document.createElement('div'); h.className='head';
      h.style.left=s[0]+'%'; h.style.top=s[1]+'%'; h.innerHTML=head(f);
      heads.appendChild(h);
      var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',s[0]); ln.setAttribute('y1',s[1]+14); ln.setAttribute('x2',50); ln.setAttribute('y2',78);
      ln.setAttribute('stroke','#3f9a3a'); ln.setAttribute('stroke-width','2.2'); ln.setAttribute('stroke-linecap','round');
      stems.appendChild(ln);
      st.n++; api.pill(p,'flowers',st.n+' / '+FULL);
      WALL.tone(440+st.n*50,.14,'sine',.12);
      if(p===0&&WALL.voiceOn()) WALL.say(f);
      if(st.n===FULL) setTimeout(function(){
        api.win(p,{title:{en:'A lovely bouquet!',ml:'മനോഹരമായ പൂച്ചെണ്ട്!'},onAgain:reset});
      },700);
    }

    /* drag a copy of the flower; drop it anywhere over the bouquet. A plain
       tap adds it too — some children cannot hold a drag. */
    FLOWERS.forEach(function(f){
      var t=document.createElement('div'); t.className='fl';
      t.innerHTML='<div class="pic">'+head(f)+'</div><div class="nm">'+WALL.t(f)+'</div>';
      t.addEventListener('pointerdown',function(e){
        e.preventDefault();
        var x0=e.clientX, y0=e.clientY, moved=false;
        var g=document.createElement('div'); g.className='ghost'; g.innerHTML=head(f);
        document.body.appendChild(g);
        function at(x,y){ g.style.left=x+'px'; g.style.top=y+'px'; }
        at(x0,y0);
        try{ t.setPointerCapture(e.pointerId); }catch(_){}
        function mv(ev){ if(ev.pointerId!==e.pointerId) return; if(Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)>12) moved=true; at(ev.clientX,ev.clientY); }
        function up(ev){
          if(ev.pointerId!==e.pointerId) return;
          t.removeEventListener('pointermove',mv); t.removeEventListener('pointerup',up); t.removeEventListener('pointercancel',up);
          var r=bq.getBoundingClientRect();
          var inside=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
          g.remove();
          if(!moved||inside) add(f);
        }
        t.addEventListener('pointermove',mv); t.addEventListener('pointerup',up); t.addEventListener('pointercancel',up);
      });
      tray.appendChild(t);
    });
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
