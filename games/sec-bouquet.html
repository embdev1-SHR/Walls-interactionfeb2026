<!DOCTYPE html>
<!--
================================================================================
  Flower Bouquet - Pangappara Blueroom, Secondary
================================================================================
  Emoji and vector, as asked - no photographs. Three panels.

  ORDER FILLING: a bouquet is requested by kind and count ("two roses, three
  jasmine") and the learner assembles exactly that. Both properties have to
  be held at once, which is a step past matching one attribute, and it is
  the same skill a florist's counter actually needs.

  Three panels. Each learner works independently and gets their own card in
  their own panel; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flower Bouquet</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#fdf7ff,#f6ebfb 70%,#eddff5);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #ddc8ea;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:flex;align-items:center;justify-content:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.25;pointer-events:none}
  .tile.sel{border-color:#f0872f;box-shadow:0 0 0 4px rgba(240,135,47,.3);transform:translateY(-4px)}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .wide{width:clamp(58px,12vh,120px);height:clamp(44px,9vh,92px)}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#7a3f8f;text-align:center;flex-shrink:0}
  .vase{font-size:clamp(30px,6vh,64px);line-height:1;flex-shrink:0}
  .held{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:clamp(28px,5vh,52px);
    align-items:center;flex-shrink:0}
  .held span{font-size:clamp(20px,3.6vh,42px);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  .order{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.2vh,24px);color:#7a3f8f;text-align:center;flex-shrink:0}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var FLOWERS=[
 {k:'rose',em:'\ud83c\udf39',ml:'\u0d31\u0d4b\u0d38\u0d2a\u0d4d\u0d2a\u0d42\u0d35\u0d4d'},
 {k:'mulla',em:'\ud83e\udd0d',ml:'\u0d2e\u0d41\u0d32\u0d4d\u0d32\u0d2a\u0d4d\u0d2a\u0d42\u0d35\u0d4d'},
 {k:'sun',em:'\ud83c\udf3b',ml:'\u0d38\u0d42\u0d30\u0d4d\u0d2f\u0d15\u0d3e\u0d28\u0d4d\u0d24\u0d3f'},
 {k:'hibi',em:'\ud83c\udf3a',ml:'\u0d1a\u0d46\u0d2e\u0d4d\u0d2a\u0d30\u0d24\u0d4d\u0d24\u0d3f'},
 {k:'tulip',em:'\ud83c\udf37',ml:'\u0d1f\u0d32\u0d3f\u0d2a\u0d4d'}
];
var ML=['\u0d2a\u0d42\u0d1c\u0d4d\u0d2f\u0d02','\u0d12\u0d28\u0d4d\u0d28\u0d4d','\u0d30\u0d23\u0d4d\u0d1f\u0d4d','\u0d2e\u0d42\u0d28\u0d4d\u0d28\u0d4d','\u0d28\u0d3e\u0d32\u0d4d'];

TRIUP.start({
  title:{en:'Flower Bouquet',ml:'\u0d2a\u0d42\u0d1a\u0d4d\u0d1a\u0d46\u0d23\u0d4d\u0d1f\u0d4d'},
  hint:{en:'Make the bouquet asked for',ml:'\u0d2a\u0d31\u0d2f\u0d41\u0d28\u0d4d\u0d28 \u0d2a\u0d42\u0d1a\u0d4d\u0d1a\u0d46\u0d23\u0d4d\u0d1f\u0d4d \u0d09\u0d23\u0d4d\u0d1f\u0d3e\u0d15\u0d4d\u0d15\u0d42'},
  build:function(p, body, api){
    var st=api.state(p); st.made=0;
    var order=document.createElement('div'); order.className='order';
    var vase=document.createElement('div'); vase.className='vase'; vase.textContent='\ud83c\udffa';
    var held=document.createElement('div'); held.className='held';
    var grid=document.createElement('div'); grid.className='row';
    body.appendChild(order); body.appendChild(vase); body.appendChild(held); body.appendChild(grid);
    api.pill(p,'made','0');

    function round(){
      var want=sh(FLOWERS).slice(0,2);
      st.need={}; st.got={};
      want.forEach(function(f){ st.need[f.k]=1+Math.floor(Math.random()*2); st.got[f.k]=0; });
      order.textContent=want.map(function(f){ return ML[st.need[f.k]]+' '+f.ml; }).join(', ');
      held.innerHTML='';
      grid.innerHTML='';
      FLOWERS.forEach(function(f){
        var t=document.createElement('div'); t.className='tile sq';
        t.innerHTML='<div class="em">'+f.em+'</div><div class="cap">'+f.ml+'</div>';
        WALL.bindTouch(t,function(){ pick(f,t); });
        grid.appendChild(t);
      });
      if(p===0&&WALL.voiceOn()) WALL.say(order.textContent);
    }
    function pick(f,t){
      if(st.need[f.k]===undefined || st.got[f.k]>=st.need[f.k]){
        t.classList.add('no'); setTimeout(function(){t.classList.remove('no');},460);
        WALL.sfx.nudge(); return;
      }
      st.got[f.k]++;
      var s=document.createElement('span'); s.textContent=f.em; held.appendChild(s);
      WALL.tone(440+held.children.length*60,.16,'sine',.12);
      var done=Object.keys(st.need).every(function(k){ return st.got[k]===st.need[k]; });
      if(done){
        st.made++; api.pill(p,'made',String(st.made));
        api.popup(p,{title:{en:'A lovely bouquet!',ml:'\u0d2e\u0d28\u0d4b\u0d39\u0d30\u0d2e\u0d3e\u0d2f \u0d2a\u0d42\u0d1a\u0d4d\u0d1a\u0d46\u0d23\u0d4d\u0d1f\u0d4d!'},
          close:{en:'Next order',ml:'\u0d05\u0d1f\u0d41\u0d24\u0d4d\u0d24\u0d24\u0d4d'},onClose:round});
      }
    }
    round();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
