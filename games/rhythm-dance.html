<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhythm Dance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            overflow: hidden;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .placeholder-text {
            font-size: 2rem;
            margin-bottom: 3rem;
            opacity: 0.9;
            color: #fff;
        }

        .back-button {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid white;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .back-button:hover {
            background: white;
            color: #fcb69f;
            transform: scale(1.1);
        }

        .icon {
            font-size: 8rem;
            margin-bottom: 2rem;
            animation: dance 1s ease-in-out infinite;
        }

        @keyframes dance {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
    </style>
<style>
/* Teacher height control, retrofitted. Size is handled by browser zoom in the
   boot script below - see there for why a CSS scale cannot work here. */
body > *:not(#wallToolbar):not(script):not(style):not(link) {
  transform: translateY(var(--wall-lift, 0px));
}
</style>
</head>
<body>
<audio id="rhythm-dance-music" preload="auto" loop>
    <source src="../assets/Audio/jyproject-endless-shore-part2-399386.mp3" type="audio/mpeg">
</audio>
    <div class="container">
        <div class="icon">💃</div>
        <h1>Rhythm Dance</h1>
        <p class="placeholder-text">Coming Soon!</p>
        <p class="placeholder-text" style="font-size: 1.5rem;">Dance and move to the beat with motion tracking</p>
        <button class="back-button" onclick="window.location.href='../index.html'">Back to Menu</button>
    </div>
    <script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script>
    (function(){
      var m = document.getElementById('rhythm-dance-music');
      if(!m) return;
      window.addEventListener('load', function(){ setTimeout(function(){ try{ m.volume=0.5; m.play().catch(function(){}); }catch(e){} },500); });
      document.addEventListener('click', function(e){ var b = e.target.closest('.btn-back, .back-button, #backBtn, .goMenuBtn, #goMenuBtn'); if(b){ try{ m.pause(); m.currentTime=0; }catch(e){} } });
    })();
    </script>
    <script src="../js/audio-manager.js"></script>
    <script>
/* Retrofitted teacher controls. Last in the body so the activity has already
   built its DOM before the toolbar mounts. */
(function () {
  if (typeof WALL === 'undefined') return;
  WALL.init();

  /* Size, on a layout that predates --wall-scale.
     Newer activities scale by writing calc(Npx * var(--wall-scale,1)) on every
     dimension. These pages instead pin content to the viewport, so any CSS
     scale on a container is cancelled out by its own percentage children.
     Browser zoom changes the viewport itself, which is why it works where that
     does not. It scales the toolbar along with the activity.

     Electron persists zoom per origin, and every activity is file://, so a size
     chosen here would silently follow the child into the next activity and into
     the menu. Reset on the way in and on the way out. */
  var wf = null;
  try { wf = require('electron').webFrame; } catch (e) {}
  if (wf) {
    wf.setZoomFactor(1);
    window.addEventListener('pagehide', function () {
      try { wf.setZoomFactor(1); } catch (e) {}
    });
    WALL.onSize(function (s) {
      try { wf.setZoomFactor(s); } catch (e) {}
    });
  }

  WALL.toolbar({ lang: true, voice: true, size: !!wf, height: true, home: true });
})();
</script>
</body>
</html>
