<!DOCTYPE html>
<!--
================================================================================
  Coins and Notes - Pangappara Blueroom, Secondary
================================================================================
  Drawn, not photographed. All six currency photographs were rejected at
  asset review, and js/currency-svg.js already draws the coins and notes - so
  the activity is built on the drawings rather than waiting for a reshoot.

  TASK, not quiz, as asked: an amount is named and the learner pays it with
  real denominations. Paying 15 rupees is the skill; recognising a note is
  only the first half of it.

  Three panels. Each learner works independently and gets their own card in
  their own panel; only panel 1 speaks, so three voices never overlap.
================================================================================
-->
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coins and Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Baloo 2','Noto Sans Malayalam',system-ui,sans-serif;
    background:linear-gradient(165deg,#f6fff8,#e8f7ec 70%,#dcefe2);user-select:none;touch-action:none}
  .row{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0}
  .tile{border-radius:14px;background:#fff;border:3px solid #c3e0cc;cursor:pointer;
    overflow:hidden;position:relative;box-shadow:0 4px 11px rgba(40,50,70,.13);
    display:flex;align-items:center;justify-content:center;
    transition:transform .14s,border-color .14s,opacity .25s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .em{font-size:clamp(20px,4vh,46px);line-height:1}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 3px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97),rgba(255,255,255,.75) 70%,transparent);
    font-family:'Noto Sans Malayalam',sans-serif;font-weight:700;
    font-size:clamp(8px,1.3vh,13px);color:#26313b;line-height:1.3}
  .tile.ok{border-color:#3fae7c;box-shadow:0 0 0 4px rgba(63,174,124,.3)}
  .tile.no{animation:wob .44s ease-in-out;border-color:#e0a83c}
  .tile.gone{opacity:.25;pointer-events:none}
  .tile.sel{border-color:#f0872f;box-shadow:0 0 0 4px rgba(240,135,47,.3);transform:translateY(-4px)}
  @keyframes wob{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
                 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .sq{width:clamp(44px,9vh,92px);height:clamp(44px,9vh,92px)}
  .wide{width:clamp(58px,12vh,120px);height:clamp(44px,9vh,92px)}
  .lead{font-weight:800;font-size:clamp(11px,1.9vh,20px);color:#2b3440;text-align:center;flex-shrink:0}
  .leadml{font-family:'Noto Sans Malayalam',sans-serif;font-weight:900;
    font-size:clamp(12px,2.1vh,23px);color:#2f7d4f;text-align:center;flex-shrink:0}
  .money{display:flex;align-items:center;justify-content:center}
  .money svg{width:100%;height:100%}
  .target{font-weight:900;font-size:clamp(20px,4.2vh,44px);color:#1d6b2f;
    background:#eaf6ec;border:3px solid #b9dcc2;border-radius:12px;padding:2px 18px;flex-shrink:0}
</style>
</head>
<body>
<script src="../js/tts-engine.js"></script>
<script src="../js/voice-manifest.js"></script>
<script src="../js/voice-clips.js"></script>
<script src="../js/wall-common.js"></script>
<script src="../js/wall-backdrop.js"></script>
<script src="../js/currency-svg.js"></script>
<script src="../js/three-up.js"></script>
<script>
WALL_BACKDROP.set('meadow');
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var COINS=[1,2,5,10], NOTES=[10,20,50,100];
var ML={1:'\u0d12\u0d30\u0d41 \u0d30\u0d42\u0d2a',2:'\u0d30\u0d23\u0d4d\u0d1f\u0d4d \u0d30\u0d42\u0d2a',5:'\u0d05\u0d1e\u0d4d\u0d1a\u0d4d \u0d30\u0d42\u0d2a',10:'\u0d2a\u0d24\u0d4d\u0d24\u0d4d \u0d30\u0d42\u0d2a',20:'\u0d07\u0d30\u0d41\u0d2a\u0d24\u0d4d \u0d30\u0d42\u0d2a',50:'\u0d05\u0d2e\u0d4d\u0d2a\u0d24\u0d4d \u0d30\u0d42\u0d2a',100:'\u0d28\u0d42\u0d31\u0d4d \u0d30\u0d42\u0d2a'};

TRIUP.start({
  title:{en:'Coins and Notes',ml:'\u0d28\u0d3e\u0d23\u0d2f\u0d19\u0d4d\u0d19\u0d33\u0d41\u0d02 \u0d28\u0d4b\u0d1f\u0d4d\u0d1f\u0d41\u0d15\u0d33\u0d41\u0d02'},
  hint:{en:'Pay the exact amount',ml:'\u0d15\u0d43\u0d24\u0d4d\u0d2f\u0d2e\u0d3e\u0d2f\u0d3f \u0d28\u0d7d\u0d15\u0d42'},
  build:function(p, body, api){
    var st=api.state(p); st.done=0;
    var lead=document.createElement('div'); lead.className='lead';
    var tgt=document.createElement('div'); tgt.className='target';
    var paid=document.createElement('div'); paid.className='leadml';
    var grid=document.createElement('div'); grid.className='row';
    body.appendChild(lead); body.appendChild(tgt); body.appendChild(paid); body.appendChild(grid);
    lead.textContent='Pay this amount';
    api.pill(p,'paid','0');

    function round(){
      st.want=[5,10,15,20,25,30][Math.floor(Math.random()*6)];
      st.sum=0;
      tgt.textContent='\u20b9 '+st.want;
      paid.textContent='\u20b9 0';
      grid.innerHTML='';
      COINS.forEach(function(v){ grid.appendChild(piece(v,true)); });
      NOTES.forEach(function(v){ grid.appendChild(piece(v,false)); });
      if(p===0&&WALL.voiceOn()) WALL.say(st.want+' \u0d30\u0d42\u0d2a \u0d28\u0d7d\u0d15\u0d42');
    }
    function piece(v,isCoin){
      var t=document.createElement('div');
      t.className='tile money '+(isCoin?'sq':'wide');
      t.innerHTML=isCoin?coinSVG(v,80):noteSVG(v,110,64);
      WALL.bindTouch(t,function(){ pay(v,t); });
      return t;
    }
    function pay(v,t){
      if(st.sum+v>st.want){
        /* overpaying is the mistake worth catching: nothing is lost, but the
           amount is clearly wrong and the child can see why */
        t.classList.add('no'); setTimeout(function(){t.classList.remove('no');},460);
        WALL.sfx.nudge(); return;
      }
      st.sum+=v; paid.textContent='\u20b9 '+st.sum;
      WALL.tone(440+st.sum*6,.14,'sine',.11);
      if(st.sum===st.want){
        st.done++; api.pill(p,'paid',String(st.done));
        api.popup(p,{title:{en:'Exactly right!',ml:'\u0d15\u0d43\u0d24\u0d4d\u0d2f\u0d2e\u0d3e\u0d2f\u0d3f!'},
          body:{en:'You paid '+st.want+' rupees',ml:st.want+' \u0d30\u0d42\u0d2a \u0d28\u0d7d\u0d15\u0d3f'},
          close:{en:'Next',ml:'\u0d05\u0d1f\u0d41\u0d24\u0d4d\u0d24\u0d24\u0d4d'},onClose:round});
      }
    }
    round();
  }
});
</script>
<script src="../js/audio-manager.js"></script>
</body>
</html>
