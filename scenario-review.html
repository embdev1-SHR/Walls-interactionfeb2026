<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scenario Review</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#272c36; --fg:#e8eaf0; --dim:#9aa3b2;
    --ok:#3ecf8e; --no:#ef5f6b; --warn:#f0b429; --accent:#6c8cff; --todo:#5a6273;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 'Segoe UI',system-ui,sans-serif;padding-bottom:78px}
  header{position:sticky;top:0;z-index:30;background:rgba(15,17,21,.97);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 20px}
  h1{font-size:18px;font-weight:700}
  .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  select,input[type=search],button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
  input[type=search]{cursor:text;min-width:200px}
  button:hover{border-color:var(--accent)}
  .tally{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--dim);flex-wrap:wrap}
  .tally b{color:var(--fg)}
  main{padding:20px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
    margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column}
  .card.ok{border-color:var(--ok)} .card.redo{border-color:var(--no)}
  .card.stale{border-color:var(--warn)}
  /* 16:9, the wall's aspect */
  .prev{position:relative;width:100%;padding-top:56.25%;background:#0b0d12;overflow:hidden}
  .prev>*{position:absolute;inset:0}
  .prev iframe{width:1920px;height:1080px;border:0;transform-origin:0 0;background:#fff}
  .prevBtn{display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column;
    color:var(--dim);font-size:13px;cursor:pointer}
  .prevBtn span{background:var(--accent);color:#0b0d12;border-radius:8px;padding:7px 16px;font-weight:800}
  .hd{padding:10px 12px 8px}
  .t{font-weight:700;font-size:14px}
  .ml{color:var(--dim);font-size:12.5px;margin-top:1px}
  .facts{color:var(--dim);font-size:11.5px;margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .pill{border-radius:20px;padding:1px 9px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .s-todo{background:#232833;color:#98a1b2} .s-done{background:#14361f;color:var(--ok)}
  .s-legacy{background:#1d2430;color:#7f93c9} .s-remove{background:#3a1519;color:var(--no)}
  .warnbar{background:#3a2f12;color:var(--warn);font-size:11.5px;font-weight:700;padding:5px 12px;
    border-top:1px solid #6b5316}
  .note{color:var(--dim);font-size:12px;padding:0 12px 8px}
  textarea{width:calc(100% - 24px);margin:0 12px 10px;background:#11141a;color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:12.5px;
    resize:vertical;min-height:52px}
  .acts{display:flex;border-top:1px solid var(--line);margin-top:auto}
  .acts button{flex:1;border:0;border-radius:0;background:transparent;padding:10px;font-size:12.5px;font-weight:700}
  .acts button+button{border-left:1px solid var(--line)}
  .acts .y:hover,.acts .y.on{background:var(--ok);color:#06251a}
  .acts .n:hover,.acts .n.on{background:var(--no);color:#2a0409}
  .acts .o:hover{background:var(--accent);color:#0b0d12}
  footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.97);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding:11px 20px;display:flex;gap:10px;align-items:center;z-index:30}
  .msg{color:var(--dim);font-size:12.5px}
  button.primary{background:var(--accent);color:#0b0d12;border-color:var(--accent);font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<header>
  <h1>Scenario Review</h1>
  <div class="sub" id="sub"></div>
  <div class="bar">
    <select id="fMod"><option value="">All modules</option></select>
    <select id="fState">
      <option value="">All</option>
      <option value="awaiting" selected>Waiting on you</option>
      <option value="ok">Approved</option>
      <option value="redo">Redo asked</option>
      <option value="stale">Changed since review</option>
      <option value="todo">Not rebuilt yet</option>
      <option value="remove">To be deleted</option>
    </select>
    <input type="search" id="fText" placeholder="filter by name…">
    <button id="loadAll">Load all previews</button>
    <div class="tally" id="tally"></div>
  </div>
</header>

<main><div id="out"></div></main>

<footer>
  <button id="copyPrompt" class="primary">Copy changes as a prompt</button>
  <button id="save">Save to repo</button>
  <button id="clearResolved">Clear done notes</button>
  <span class="msg" id="msg">Type what needs changing on any card, then copy it all as one prompt and paste it to Claude.</span>
</footer>

const KEY = 'scenarioReview';
let review = {};
DATA.items.forEach(i => { if (i.verdict) review[i.id] = i.verdict; });
try {
  const local = JSON.parse(localStorage.getItem(KEY) || '{}');
  Object.keys(local).forEach(k => { if (!review[k]) review[k] = local[k]; });
} catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(review)); } catch (e) {} };

document.getElementById('sub').textContent =
  DATA.items.length + ' activities · generated ' + new Date(DATA.generated).toLocaleString();

const mods = [...new Set(DATA.items.map(i => i.module))].sort();
fMod.innerHTML = '<option value="">All modules</option>' + mods.map(m => '<option>' + m + '</option>').join('');

function isStale(i) {
  const v = review[i.id];
  if (!v || !v.at) return false;
  return i.mtime > Math.floor(new Date(v.at).getTime() / 1000) + 2;
}

function visible() {
  const m = fMod.value, s = fState.value, q = fText.value.trim().toLowerCase();
  return DATA.items.filter(i => {
    if (m && i.module !== m) return false;
    const v = review[i.id];
    if (s === 'awaiting') { if (i.state !== 'done' || (v && !isStale(i))) return false; }
    if (s === 'ok'     && !(v && v.v === 'ok')) return false;
    if (s === 'redo'   && !(v && v.v === 'redo')) return false;
    if (s === 'stale'  && !isStale(i)) return false;
    if (s === 'todo'   && i.state !== 'todo') return false;
    if (s === 'remove' && i.state !== 'remove') return false;
    if (q && !(i.id.includes(q) || i.title.toLowerCase().includes(q))) return false;
    return true;
  });
}

function card(i) {
  const v = review[i.id] || null;
  const stale = isStale(i);
  const cls = stale ? 'stale' : v ? (v.v === 'ok' ? 'ok' : 'redo') : '';
  return '<div class="card ' + cls + '" data-id="' + i.id + '">' +
    '<div class="prev" data-src="games/' + i.id + '.html?v=' + i.mtime + '">' +
      '<div class="prevBtn"><span>▶ Load preview</span>' + i.id + '</div>' +
    '</div>' +
    (stale ? '<div class="warnbar">⚠ changed since you reviewed it — look again</div>' : '') +
    '<div class="hd">' +
      '<div class="t">' + i.title + '</div>' +
      (i.ml ? '<div class="ml">' + i.ml + '</div>' : '') +
      '<div class="facts">' +
        '<span class="pill s-' + i.state + '">' + i.state + '</span>' +
        '<span>' + i.module + '</span><span>' + i.lines + ' lines</span>' +
      '</div>' +
    '</div>' +
    (i.note ? '<div class="note">' + i.note + '</div>' : '') +
    '<textarea placeholder="What needs changing? (sent back to me verbatim)">' + ((v && v.note) || '') + '</textarea>' +
    '<div class="acts">' +
      '<button class="o" data-open="games/' + i.id + '.html?v=' + i.mtime + '">Open full</button>' +
      '<button class="y ' + (v && v.v === 'ok' ? 'on' : '') + '" data-v="ok">Approve</button>' +
      '<button class="n ' + (v && v.v === 'redo' ? 'on' : '') + '" data-v="redo">Redo</button>' +
    '</div></div>';
}

function render() {
  const list = visible();
  const byMod = {};
  list.forEach(i => { (byMod[i.module] = byMod[i.module] || []).push(i); });
  out.innerHTML = Object.keys(byMod).sort().map(m =>
    '<h2>' + m + ' — ' + byMod[m].length + '</h2><div class="grid">' +
    byMod[m].map(card).join('') + '</div>').join('')
    || '<p class="msg" style="margin-top:20px">Nothing matches that filter.</p>';
  tally();
}

function tally() {
  const ok = Object.values(review).filter(v => v.v === 'ok').length;
  const redo = Object.values(review).filter(v => v.v === 'redo').length;
  const done = DATA.items.filter(i => i.state === 'done').length;
  const stale = DATA.items.filter(isStale).length;
  document.getElementById('tally').innerHTML =
    '<span><b>' + done + '</b> built</span><span><b>' + ok + '</b> approved</span>' +
    '<span><b>' + redo + '</b> redo</span><span><b>' + stale + '</b> changed</span>';
}

/* Scale a 1920x1080 page into whatever width the card got. */
/* The ?v= on the src is the activity's last-modified time. Without it the
   browser served whatever it had cached, so a rebuilt activity still showed
   its old self and came back reviewed against a version that no longer
   existed. Three rounds of one bug report were caused by exactly that. */
function mountPreview(host) {
  const f = document.createElement('iframe');
  f.src = host.dataset.src;
  f.loading = 'lazy';
  host.innerHTML = '';
  host.appendChild(f);
  const fit = () => { f.style.transform = 'scale(' + (host.clientWidth / 1920) + ')'; };
  fit();
  new ResizeObserver(fit).observe(host);
}

out.addEventListener('click', (e) => {
  const open = e.target.closest('[data-open]');
  if (open) { window.open(open.dataset.open, '_blank'); return; }

  const prev = e.target.closest('.prev');
  if (prev && prev.querySelector('.prevBtn')) { mountPreview(prev); return; }

  const vb = e.target.closest('[data-v]');
  if (vb) {
    const card = vb.closest('.card');
    const id = card.dataset.id;
    const note = card.querySelector('textarea').value.trim();
    if (review[id] && review[id].v === vb.dataset.v && !note) delete review[id];
    else review[id] = { v: vb.dataset.v, note: note, at: new Date().toISOString() };
    persist();
    /* Update this card in place. A full re-render rebuilt every textarea and
       threw away whatever was being typed in another card. */
    const v = review[id];
    card.classList.remove('ok', 'redo');
    if (v && v.v) card.classList.add(v.v === 'ok' ? 'ok' : 'redo');
    card.querySelectorAll('[data-v]').forEach((b) => {
      b.classList.toggle('on', !!v && v.v === b.dataset.v);
    });
    tally();
  }
});

/* A note is the point of this page, so it is kept whether or not a verdict
   has been given. Requiring Approve/Redo first silently discarded what you
   typed. A note on its own counts as 'changes asked for'. */
out.addEventListener('input', (e) => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const id = e.target.closest('.card').dataset.id;
  const note = e.target.value;
  if (!review[id]) review[id] = { v: null, note: '', at: new Date().toISOString() };
  review[id].note = note;
  review[id].at = new Date().toISOString();
  if (!note && !review[id].v) delete review[id];
  persist();
  tally();
});

['fMod','fState','fText'].forEach(id => document.getElementById(id).addEventListener('input', render));
document.getElementById('loadAll').onclick = () =>
  document.querySelectorAll('.prev .prevBtn').forEach(b => mountPreview(b.parentElement));

const flash = (m) => { msg.textContent = m; setTimeout(() => {
  msg.textContent = 'Approve or send back with a note — the note is my brief for round two.'; }, 2600); };

document.getElementById('save').onclick = async () => {
  try {
    const r = await fetch('/save', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(review) });
    flash(r.ok ? 'Saved to scenario-review.json.' : 'Save failed — copy the notes instead.');
  } catch (e) { flash('Not on the review server — use Copy redo notes.'); }
};
/* The page's real output. Every card carrying a note or a verdict becomes one
   block of text that can be pasted straight into Claude as the next
   instruction, so nothing is lost between seeing a problem and reporting it. */
var NL = String.fromCharCode(10);

function buildPrompt() {
  var byId = new Map(DATA.items.map(function (i) { return [i.id, i]; }));
  /* Drop notes whose activity no longer exists. A removed activity cannot be
     flagged "changed since you wrote this", so its note survived every filter
     and was re-sent as new work every round - eight deleted boards kept
     reappearing that way. */
  var rows = Object.entries(review).filter(function (e) {
    if (!byId.has(e[0])) return false;
    return (e[1].note && e[1].note.trim()) || e[1].v;
  });
  if (!rows.length) return '';

  /* A note written BEFORE the activity was last rebuilt has almost certainly
     been acted on already. Sending it again as a fresh instruction is how the
     same three notes came back three rounds running. They go in their own
     section asking for a recheck instead. */
  function staleRow(e) {
    var it = byId.get(e[0]);
    return !!(it && e[1].at && it.mtime > Math.floor(new Date(e[1].at).getTime() / 1000) + 2);
  }
  var resolved   = rows.filter(function (e) { return staleRow(e) && e[1].v !== 'ok'; });
  var changes    = rows.filter(function (e) { return e[1].v !== 'ok' && !staleRow(e); });
  var okWithNote = rows.filter(function (e) { return e[1].v === 'ok' && (e[1].note || '').trim(); });
  var okPlain    = rows.filter(function (e) { return e[1].v === 'ok' && !(e[1].note || '').trim(); });

  var L = ['Here is my review of the activities. Apply these changes.'];

  if (changes.length) {
    L.push('', 'CHANGES ASKED FOR');
    changes.forEach(function (e) {
      var it = byId.get(e[0]);
      L.push('', e[0] + (it ? '  (' + it.title + ')' : ''));
      L.push('  ' + ((e[1].note || '').trim() || 'needs rework - no note given'));
    });
  }
  if (okWithNote.length) {
    L.push('', 'APPROVED, WITH A COMMENT');
    okWithNote.forEach(function (e) { L.push('', e[0], '  ' + e[1].note.trim()); });
  }
  if (okPlain.length) {
    L.push('', 'APPROVED AS IS', '  ' + okPlain.map(function (e) { return e[0]; }).join(', '));
  }
  if (resolved.length) {
    L.push('', 'ALREADY REBUILT SINCE I WROTE THESE - not new work, recheck only');
    resolved.forEach(function (e) {
      L.push('  ' + e[0] + ': ' + ((e[1].note || '').trim() || '(no note)'));
    });
  }
  return L.join(NL);
}

/* Retires every note whose activity has been rebuilt since it was written,
   so the list stops growing and the prompt stays about what is still wrong. */
document.getElementById('clearResolved').onclick = function () {
  var ids = new Map(DATA.items.map(function (i) { return [i.id, i]; }));
  var gone = 0;
  Object.keys(review).forEach(function (id) {
    var it = ids.get(id), v = review[id];
    if (!it) { delete review[id]; gone++; return; }      /* activity deleted */
    if (v.at && it.mtime > Math.floor(new Date(v.at).getTime() / 1000) + 2) {
      delete review[id]; gone++;
    }
  });
  persist(); render();
  flash(gone ? gone + ' resolved note(s) cleared.' : 'Nothing to clear.');
};

document.getElementById('copyPrompt').onclick = function () {
  var txt = buildPrompt();
  if (!txt) return flash('Nothing to send yet - type a note on a card first.');
  navigator.clipboard.writeText(txt)
    .then(function () { flash('Copied. Paste it straight into Claude.'); })
    .catch(function () {
      /* Clipboard is refused in some app views. Show the text so it can be
         selected by hand rather than leaving the button doing nothing. */
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.cssText = 'position:fixed;inset:6%;z-index:99;background:var(--panel);' +
        'color:var(--fg);border:2px solid var(--accent);border-radius:10px;padding:14px;font:13px/1.5 inherit';
      document.body.appendChild(ta);
      ta.select();
      flash('Copy blocked - select the text and copy it by hand.');
      ta.addEventListener('blur', function () { ta.remove(); });
    });
};

render();
</script>
